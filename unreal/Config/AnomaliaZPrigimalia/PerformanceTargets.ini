# ANOMALIA — objectifs de rendu UE5 par plateforme
# Fichier de référence, pas un profil certifié par Sony ou Microsoft.
# Les noms de profils consoles et leurs overrides définitifs seront validés
# après obtention des SDK, des kits de développement et des benchmarks.
[Target]
DisplayWidth=3840
DisplayHeight=2160
FrameRate=60
DynamicResolution=true
Upscaler=TSR
Nanite=true
Lumen=true

[PC_High]
RenderScaleMin=66
RenderScaleMax=100
ViewDistanceQuality=3
ShadowQuality=3
EffectsQuality=3
TextureQuality=3
FoliageQuality=3

[PS5_Target]
RenderScaleMin=50
RenderScaleMax=85
ViewDistanceQuality=2
ShadowQuality=2
EffectsQuality=2
TextureQuality=3
FoliageQuality=2

[XboxSeriesX_Target]
RenderScaleMin=50
RenderScaleMax=85
ViewDistanceQuality=2
ShadowQuality=2
EffectsQuality=2
TextureQuality=3
FoliageQuality=2

# Profil qualité alternatif en cas de charge trop élevée.
[Performance_Fallback]
RenderScaleMin=50
RenderScaleMax=70
ViewDistanceQuality=1
ShadowQuality=1
EffectsQuality=2
TextureQuality=2
FoliageQuality=1
