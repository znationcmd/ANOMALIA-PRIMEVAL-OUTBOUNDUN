[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/ANOMALIA_Playable_v1
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/AnomaliaZPrigimalia.AnomaliaZPrigimaliaGameMode

; Bound spring integration when rendering is slower than the physics cadence.
[/Script/Engine.PhysicsSettings]
; Keep vehicle integration independent of expensive viewport readbacks/render frames.
bTickPhysicsAsync=True
AsyncFixedTimeStepSize=0.008333333
bSubstepping=True
MaxSubstepDeltaTime=0.008333333
MaxSubsteps=8
MaxPhysicsDeltaTime=0.066666667

; Use native spring forces for the calibrated road vehicle. Constraint-based
; support held the reference chassis at full droop and under-reported tire load.
; This selects a Chaos solver path; suspension and tire forces remain enabled.
[ConsoleVariables]
p.Vehicle.DisableConstraintSuspension=1

[/Script/Engine.RendererSettings]
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicRes.MinScreenPercentage=50
r.DynamicRes.MaxScreenPercentage=100
r.DynamicRes.FrameTimeBudget=16.6667
r.DefaultFeature.MotionBlur=False

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="/Script/ANOMALIA",NewGameName="/Script/AnomaliaZPrigimalia")

