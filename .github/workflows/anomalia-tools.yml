name: ANOMALIA Tools - Tests et Installateur Windows

on:
  push:
    branches:
      - feature/anomalia-tools-standalone-20261023
    paths:
      - 'apps/anomalia-tools/**'
      - '.github/workflows/anomalia-tools.yml'
  pull_request:
    paths:
      - 'apps/anomalia-tools/**'
      - '.github/workflows/anomalia-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests securite, terrain, economie et archives
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/anomalia-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer dependencies
        run: npm install --no-audit --no-fund
      - name: Tests unitaires
        run: npm test
      - name: Compiler interface
        run: npm run build
      - name: Installer Chromium pour vérifier le vrai rendu
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Démarrer ANOMALIA Tools pour vérifier les boutons
        shell: bash
        run: |
          npm run build
          npx vite preview --host 127.0.0.1 --port 4175 > /tmp/anomalia-tools-preview.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/anomalia-tools-preview.log
          exit 1
      - name: Vérifier 1366x768, les menus et le défilement
        run: |
          mkdir -p screenshots
          node scripts/smoke-ui.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: ANOMALIA-Tools-026-Captures-Reelles
          path: apps/anomalia-tools/screenshots/*.png
          if-no-files-found: error

  windows:
    name: Installer Windows ANOMALIA Tools
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/anomalia-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer dependencies
        run: npm install --no-audit --no-fund
      - name: Executer les tests
        run: npm test
      - name: Construire le programme Windows
        run: npm run package:win
      - uses: actions/upload-artifact@v4
        with:
          name: ANOMALIA-Tools-Installateur-Windows
          path: apps/anomalia-tools/release/*.exe
          if-no-files-found: error
