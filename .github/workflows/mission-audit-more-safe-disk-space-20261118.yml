name: ANOMALIA - audit additional safe disk recovery without mutation
on:
  push:
    branches: [mission/finalisation-20261104]
    paths:
      - '.github/workflows/mission-audit-more-safe-disk-space-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: disk-audit-${{ github.run_id }}
          sparse-checkout: scripts/ue5/audit_safe_recovery_20261118.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Audit exact recoverable cache sizes and third OneDrive batch offline status
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('disk-audit-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "RECOVERY_AUDIT_OUT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:RECOVERY_AUDIT_OUT=$dir
          $python='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE ('disk-audit-'+$env:GITHUB_RUN_ID+'\scripts\ue5\audit_safe_recovery_20261118.py')
          if (!(Test-Path -LiteralPath $script) -or !(Test-Path -LiteralPath $python)) { throw 'Audit dependencies unavailable' }
          & $python -B $script
          if ($LASTEXITCODE -ne 0) { throw 'Audit failed; no files changed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onedrive-sync-and-disk-cache-audit
          path: ${{ runner.temp }}/disk-audit-${{ github.run_id }}/recovery-audit.json
          if-no-files-found: warn
