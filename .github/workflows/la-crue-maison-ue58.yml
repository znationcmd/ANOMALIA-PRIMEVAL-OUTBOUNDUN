name: Import LA CRUE house in Unreal
on:
  push:
    branches: [ops/la-crue-maison-ue58]
    paths: [.github/workflows/la-crue-maison-ue58.yml]
  workflow_dispatch:
permissions: {}
concurrency:
  group: la-crue-house-ue58
  cancel-in-progress: false
jobs:
  import_house:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 30
    steps:
      - name: Protect running sessions and import the house mesh
        shell: powershell -NoProfile -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ine 'ANOMALIA-PC') { throw 'Expected ANOMALIA-PC' }
          $project = 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject'
          $editor = 'C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          if (!(Test-Path -LiteralPath $project -PathType Leaf) -or !(Test-Path -LiteralPath $editor -PathType Leaf)) {
            throw 'Expected ANOMALIA Unreal 5.8 project and editor'
          }
          $work = Join-Path $env:RUNNER_TEMP ('la-crue-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $work | Out-Null
          $env:LA_CRUE_IMPORT_DIR = $work
          $packed = [Convert]::FromBase64String('')
          $memory = [IO.MemoryStream]::new($packed)
          $stream = [IO.Compression.GZipStream]::new($memory,[IO.Compression.CompressionMode]::Decompress)
          $output = [IO.File]::Create((Join-Path $work 'SM_LaCrue_Maison_Zodiac.glb'))
          try { $stream.CopyTo($output) } finally { $output.Dispose(); $stream.Dispose(); $memory.Dispose() }
          $script = @'
          import os
          from pathlib import Path
          import unreal

          work = Path(os.environ["LA_CRUE_IMPORT_DIR"])
          destination = "/Game/LaCrue/Architecture/MaisonZodiac"
          name = "SM_LaCrue_Maison_Zodiac"
          asset_path = destination + "/" + name
          flag = unreal.CollisionTraceFlag.CTF_USE_COMPLEX_AS_SIMPLE
          lib = unreal.EditorAssetLibrary
          mesh = lib.load_asset(asset_path) if lib.does_asset_exist(asset_path) else None
          if mesh is None:
              if lib.does_directory_exist(destination) and lib.list_assets(destination, recursive=True):
                  raise RuntimeError("Existing destination assets preserved")
              task = unreal.AssetImportTask()
              for key, value in {
                  "filename": str(work / (name + ".glb")),
                  "destination_path": destination,
                  "automated": True,
                  "replace_existing": False,
                  "save": False,
              }.items():
                  task.set_editor_property(key, value)
              unreal.AssetToolsHelpers.get_asset_tools().import_asset_tasks([task])
              meshes = [unreal.load_asset(path) for path in task.get_editor_property("imported_object_paths")]
              meshes = [obj for obj in meshes if isinstance(obj, unreal.StaticMesh)]
              if len(meshes) != 1 or meshes[0].get_name() != name:
                  raise RuntimeError("Expected a single Static Mesh named " + name)
              mesh = meshes[0]
              body = mesh.get_editor_property("body_setup")
              body.set_editor_property("collision_trace_flag", flag)
              if not lib.save_directory(destination, only_if_is_dirty=False, recursive=True):
                  raise RuntimeError("Failed to save the imported mesh and materials")
          body = mesh.get_editor_property("body_setup")
          if body.get_editor_property("collision_trace_flag") != flag:
              raise RuntimeError("Expected complex collision on the saved Static Mesh")
          (work / "import-ok.txt").write_text(mesh.get_path_name(), encoding="utf-8")
          '@
          $scriptFile = Join-Path $work 'import_house.py'
          [IO.File]::WriteAllText($scriptFile,$script,[Text.UTF8Encoding]::new($false))
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Output "Available physical KiB: $($os.FreePhysicalMemory); available virtual KiB: $($os.FreeVirtualMemory)"
          if ($os.FreePhysicalMemory * 1KB -lt 4GB -or $os.FreeVirtualMemory * 1KB -lt 8GB) {
            throw 'Insufficient measured memory'
          }
          if (@(Get-Process UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count) {
            throw 'Existing Unreal session preserved'
          }
          & $editor $project '-run=pythonscript' "-script=$scriptFile" '-unattended' '-nopause' '-nosound' '-NullRHI' '-stdout' '-FullStdOutLogOutput'
          $marker = Join-Path $work 'import-ok.txt'
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $marker)) { throw 'No completed UE import receipt' }
          Write-Output ('LA_CRUE_MESH_IMPORTED ' + (Get-Content -LiteralPath $marker -Raw))
