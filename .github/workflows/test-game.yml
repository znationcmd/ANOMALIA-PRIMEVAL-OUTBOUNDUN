name: ANOMALIA PRIMEVAL OUTBOUNDUN — tests et compilation
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "index.html", "package.json", "scripts/**", "vite.config.js", ".github/workflows/test-game.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Compile the 3D browser game
        run: npm run build
      - name: Install Chromium for visual gameplay checks
        run: npx playwright install --with-deps chromium
      - name: Launch actual WebGL game and exercise menus movement and saves
        run: npm run test:browser
      - name: Keep gameplay screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANOMALIA-Gameplay-Screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Verify entrypoint and 3D chunks
        run: |
          test -s dist/index.html
          test -f src/main.js
          grep -q 'makeTerrain' src/main.js
          grep -q 'interaction()' src/main.js
      - name: Create self-contained playable HTML for Windows Mac and Linux
        run: |
          npm run package:offline
          test -s release/ANOMALIA_PRIMEVAL_OUTBOUNDUN.html
          grep -q 'ANOMALIA' release/ANOMALIA_PRIMEVAL_OUTBOUNDUN.html
          test -s release/LIRE_AVANT_DE_JOUER.txt
      - name: Download playable pre-alpha ZIP from GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ANOMALIA-PRIMEVAL-OUTBOUNDUN-Jouer-PC
          path: |
            release/ANOMALIA_PRIMEVAL_OUTBOUNDUN.html
            release/LIRE_AVANT_DE_JOUER.txt
          retention-days: 90
