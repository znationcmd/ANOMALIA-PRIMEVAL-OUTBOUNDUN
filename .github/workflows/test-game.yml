name: ANOMALIA PRIMEVAL OUTBOUNDUN — tests et compilation
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "index.html", "package.json", ".github/workflows/test-game.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Compile the 3D browser game
        run: npm run build
      - name: Verify entrypoint and 3D chunks
        run: |
          test -s dist/index.html
          test -f src/main.js
          grep -q 'makeTerrain' src/main.js
          grep -q 'interaction()' src/main.js
