name: ANOMALIA - reclaim 12 GiB verified VaultCache duplicate assets safely
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-reclaim-verified-vaultcache-assets-20261118.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-verified-vaultcache-safe-reclaim
  cancel-in-progress: false
jobs:
  reclaim:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: vault-verified-cleanup-${{ github.run_id }}
          sparse-checkout: scripts/ue5/reclaim_exact_vaultcache_duplicates_20261118.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Recover up to 12 GiB of SHA256 identical independent VaultCache duplicates and keep original game assets
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ('vault-verified-reclaim-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "VAULT_RECLAIM_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:VAULT_RECLAIM_OUT=$out
          $py='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE ('vault-verified-cleanup-'+$env:GITHUB_RUN_ID+'\scripts\ue5\reclaim_exact_vaultcache_duplicates_20261118.py')
          if(!(Test-Path -LiteralPath $script -PathType Leaf) -or !(Test-Path -LiteralPath $py -PathType Leaf)){throw 'Required verified cleanup tool missing'}
          & $py -B $script
          if($LASTEXITCODE -ne 0){throw 'Verified VaultCache cleanup stopped'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vaultcache-sha256-verified-reclaim-receipt
          path: ${{ runner.temp }}/vault-verified-reclaim-${{ github.run_id }}/vault-cache-verified-reclaim-summary.json
          if-no-files-found: warn
