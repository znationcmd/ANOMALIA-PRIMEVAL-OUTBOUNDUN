name: ANOMALIA’Z PRIGIMALIA — Installateur Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'build/**'
      - 'scripts/prepare-windows-icon.py'
      - 'src/**'
      - 'public/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/windows-installer.yml'
permissions:
  contents: write
jobs:
  windows-installer:
    name: Construire et verifier installateur Windows x64
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: "false"
    steps:
      - name: Recuperer le code du jeu
        uses: actions/checkout@v4
      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer le moteur et les dependances Windows
        run: npm install --no-audit --no-fund
      - name: Verifier les mecanismes et les commandes
        run: npm test
      - name: Compiler le vrai jeu 3D
        run: npm run build
      - name: Preparer le logo ANOMALIA pour Windows
        run: |
          python -m pip install Pillow
          python scripts/prepare-windows-icon.py
      - name: Creer le setup Windows EXE avec NSIS
        run: npm run package:windows
      - name: Verifier que le setup Windows est genere
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path "release/windows" -Filter "ANOMALIAZ-PRIGIMALIA-Setup-*-x64.exe" -File -ErrorAction Stop)
          if ($installers.Count -eq 0) { throw "Installateur Windows absent" }
          foreach ($installer in $installers) {
            if ($installer.Length -lt 10000000) { throw "Installateur suspect: fichier trop petit" }
            Write-Host "INSTALLATEUR WINDOWS:" $installer.Name
            Write-Host "TAILLE:" $installer.Length
          }
      - name: Publier le telechargement de l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: ANOMALIAZ-PRIGIMALIA-Installateur-Windows
          path: release/windows/ANOMALIAZ-PRIGIMALIA-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publier une mise à jour Windows officielle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always
