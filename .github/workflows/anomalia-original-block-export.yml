name: Export original City Sample block and inspect car mesh normals
on:
  push:
    branches: [feature/real-skarvik-bmw-dog-gameplay-capture-20261111]
    paths: [.github/workflows/anomalia-original-block-export.yml, scripts/ue5/scene-repair/export_original_block.py]
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4
        with: {clean: false, persist-credentials: false}
      - name: Inspect real source scene without changing installed game or source assets
        run: |
          $ErrorActionPreference='Stop'
          # Only terminate the exact read-only extraction process started by our timed-out job.
          $owned=@(Get-CimInstance Win32_Process|Where-Object{$_.ProcessId -eq 14608 -and $_.Name -eq 'UnrealEditor-Cmd.exe' -and $_.CommandLine.Contains('43270446874') -and $_.CommandLine.Contains('export_original_block.py')})
          foreach($process in $owned){
            $native=Get-Process -Id $process.ProcessId -ErrorAction SilentlyContinue
            if($native){
              try{$native.Kill();$native.WaitForExit(15000)|Out-Null}catch{Write-Warning $_}
              $native.Refresh()
              [pscustomobject]@{OwnedExtractionPid=$process.ProcessId;HasExited=$native.HasExited}|ConvertTo-Json
              if(-not $native.HasExited){throw 'Owned extraction has not stopped'}
            }
          }
          $recovered='D:\ANOMALIAZ\01_Projet_Principal\unreal\Content\Effect\Vehicle\Niagara\VehicleDamageSystem_Runtime.uasset'
          $heldPrevious='D:\ANOMALIAZ\01_Projet_Principal\unreal\Saved\SceneRepair\43270446874\HeldIncompatibleTrafficEffect\VehicleDamageSystem_Runtime.uasset'
          $expected='6958C967A29C644C51B8C30D76308AB9A80C87FA716BEC7ED7ABB1766E96D6BF'
          if(-not(Test-Path -LiteralPath $recovered)){
            if((Get-FileHash -LiteralPath $heldPrevious).Hash -ne $expected){throw 'Held effect identity mismatch'}
            Copy-Item -LiteralPath $heldPrevious -Destination $recovered
          }
          if((Get-FileHash -LiteralPath $recovered).Hash -ne $expected){throw 'Traffic source effect has unexpected changes'}
          # An unrelated project editor must not block or be stopped by this source task.
          $active=@(Get-CimInstance Win32_Process|Where-Object{
            $_.Name -in @('UnrealEditor.exe','UnrealEditor-Cmd.exe','UnrealBuildTool.exe') -and
            $_.CommandLine -like '*D:\ANOMALIAZ\01_Projet_Principal\unreal*'
          }|Where-Object{
            $native=Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue
            $native -and -not $native.HasExited
          })
          if($active.Count){$active|Select-Object Name,ProcessId,CommandLine|ConvertTo-Json;throw 'Principal source editor or build is active'}
          $root='D:\ANOMALIAZ\01_Projet_Principal\unreal'
          $out=[IO.Path]::Combine($env:RUNNER_TEMP,('ANOMALIA-source-'+$env:GITHUB_RUN_ID))
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $env:SCENE_REPAIR_OUT=$out
          ('SCENE_REPAIR_OUT='+$out)|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Get-CimInstance Win32_Process|Where-Object{$_.Name -like 'AnomaliaPrimeval*'}|Select-Object Name,ExecutablePath,CommandLine|ConvertTo-Json|Set-Content (Join-Path $out 'running-game.json')
          Get-PSDrive C,D|Select-Object Name,Free,Used|ConvertTo-Json|Set-Content (Join-Path $out 'storage.json')
          Copy-Item -LiteralPath 'D:\ANOMALIAZ\Jeu\installation.json' -Destination (Join-Path $out 'installed-game.json')
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts\ue5\scene-repair\export_original_block.py'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $effect=Join-Path $root 'Content\Effect\Vehicle\Niagara\VehicleDamageSystem_Runtime.uasset'
          $sourceMap=Join-Path $root 'Content\Map\Big_City_LVL.umap'
          $mapHash=(Get-FileHash -LiteralPath $sourceMap).Hash
          $held=Join-Path $out 'HeldIncompatibleTrafficEffect'
          New-Item -ItemType Directory -Path $held -Force|Out-Null
          $moved=@()
          foreach($file in @(Get-ChildItem -LiteralPath (Split-Path $effect -Parent) -Filter 'VehicleDamageSystem_Runtime.*' -File)){
            $destination=Join-Path $held $file.Name
            $moved+=@{source=$file.FullName;held=$destination;hash=(Get-FileHash -LiteralPath $file.FullName).Hash}
            Move-Item -LiteralPath $file.FullName -Destination $destination
          }
          $moved|ConvertTo-Json|Set-Content (Join-Path $out 'held-effect-receipt.json')
          if(Test-Path -LiteralPath (Join-Path $root 'Saved\CitySourceCache\original-city-block-repair-v1.json')){throw 'A complete source block already exists; preserve it'}
          try {
          $p=Start-Process -FilePath $editor -ArgumentList @((Join-Path $root 'AnomaliaPrimeval.uproject'),'/Engine/Maps/Entry',('-ExecutePythonScript="'+$script+'"'),'-NullRHI','-unattended','-nopause','-nosound',('-abslog="'+(Join-Path $out 'audit.log')+'"')) -PassThru
          $handle=$p.Handle
          $started=Get-Date
          while(-not $p.WaitForExit(3000)){
            if(-not(Test-Path -LiteralPath (Join-Path $root 'AnomaliaPrimeval.uproject')) -or ((Get-Date)-$started).TotalMinutes -gt 14){
              & taskkill.exe /PID $p.Id /T /F|Out-Null
              $p.WaitForExit(15000)|Out-Null
              throw 'Source inspection stopped: disk unavailable or extraction time budget reached'
            }
          }
          } finally {
            foreach($file in $moved){
              if(Test-Path -LiteralPath $file.source){throw 'Unexpected replacement of held traffic effect'}
              Move-Item -LiteralPath $file.held -Destination $file.source
              if((Get-FileHash -LiteralPath $file.source).Hash -ne $file.hash){throw 'Traffic effect hash mismatch'}
            }
            if((Get-FileHash -LiteralPath $sourceMap).Hash -ne $mapHash){throw 'Protected original city map changed'}
          }
          $report=Get-Content (Join-Path $out 'original-city-block.json') -Raw|ConvertFrom-Json
          $report|Select-Object state,error,instances,groundFloorInstances,meshCategories,roadMeshes|ConvertTo-Json -Depth 8
          if($report.state -ne 'ORIGINAL_CITY_BLOCK_EXPORTED_WITH_AUTHORED_TRANSFORMS'){throw 'Source scene audit failed'}
      - uses: actions/upload-artifact@v4
        if: ${{ always() && env.SCENE_REPAIR_OUT != '' }}
        with:
          name: ORIGINAL-CITY-BLOCK-AND-CAR-MESH-SETTINGS
          path: ${{ env.SCENE_REPAIR_OUT }}/*
          if-no-files-found: warn
