name: SKARVIK - nettoyage sûr du cache Unreal puis contrôle disque
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-safe-derived-cache-clean-20261110.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  clean-regenerable-derived-caches:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Nettoyer exclusivement les DerivedDataCache regenerables hors des cartes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $marker=Join-Path $root '.skarvik-ci-stage-marker'
          $reportPath=Join-Path $env:GITHUB_WORKSPACE 'SKARVIK_SAFE_CACHE_CLEAN_20261110.json'
          $report=[ordered]@{
            state='FAILED_PRECHECK'
            dateUTC=[DateTime]::UtcNow.ToString('o')
            sourceNativeUnrealLevelModified=$false
            externalActorsTouched=$false
            originalDAnomaliaTouched=$false
            savedAutosavesOrBackupsTouched=$false
            allModelsAndContentPreserved=$true
            cacheOnly=$true
            pathsPurged=@()
            freeCBeforeGiB=[math]::Round(([IO.DriveInfo]::new('C')).AvailableFreeSpace/1GB,3)
            freeCAfterGiB=$null
            recoveredGiB=$null
            remainingTo12GiB=$null
          }
          try {
            if(!(Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw).Trim() -ne '41188816555'){
              throw 'Protected UE5 stage marker missing or wrong'
            }
            $processes=@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,UnrealEditor-Win64-DebugGame,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue)
            if($processes.Count -gt 0){throw 'Unreal/game process is running; refuse to clean any cache'}
            $mustExist=@(
              'D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap',
              (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_FINAL_v1.umap'),
              (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_ISLANDS_v1.umap'),
              (Join-Path $root 'Content\Map\Big_City_LVL.umap'))
            foreach($file in $mustExist){if(!(Test-Path -LiteralPath $file)){throw ('Protected UE5 level missing: '+$file)}}
            $safePaths=@(
              'C:\Users\utilisateur\AppData\Local\UnrealEngine\Common\DerivedDataCache',
              (Join-Path $root 'DerivedDataCache')
            )
            $expectedRoots=@(
              [IO.Path]::GetFullPath('C:\Users\utilisateur\AppData\Local\UnrealEngine\Common\DerivedDataCache').TrimEnd('\'),
              [IO.Path]::GetFullPath((Join-Path $root 'DerivedDataCache')).TrimEnd('\')
            )
            foreach($index in 0..($safePaths.Count-1)){
              $folder=[IO.Path]::GetFullPath($safePaths[$index]).TrimEnd('\')
              if($folder -cne $expectedRoots[$index] -or !$folder.StartsWith('C:\')){
                throw ('Cache path refused: '+$folder)
              }
              if(!(Test-Path -LiteralPath $folder)){
                $report.pathsPurged+=@{path=$folder;exists=$false;removedBytes=0}
                continue
              }
              $meta=Get-Item -LiteralPath $folder -Force
              if(!$meta.PSIsContainer -or ($meta.Attributes -band [IO.FileAttributes]::ReparsePoint)){
                throw ('Unsafe cache root: '+$folder)
              }
              $children=@(Get-ChildItem -LiteralPath $folder -Force)
              foreach($child in $children){
                if($child.Attributes -band [IO.FileAttributes]::ReparsePoint){
                  throw ('Reparse point inside cache; refusing deletion: '+$child.FullName)
                }
              }
              $bytes=[int64]0;$count=0
              foreach($file in (Get-ChildItem -LiteralPath $folder -File -Force -Recurse -ErrorAction Stop)){
                $bytes+=[int64]$file.Length;$count++
              }
              Write-Host ('CACHE_WILL_PURGE_ONLY='+$folder+' fileCount='+$count+' GiB='+[math]::Round($bytes/1GB,3))
              # Only contents of known DerivedDataCache roots; never Saved, Intermediate,
              # Content, project .umap files, or original D: project.
              foreach($child in $children){Remove-Item -LiteralPath $child.FullName -Recurse -Force -ErrorAction Stop}
              $afterCount=@(Get-ChildItem -LiteralPath $folder -Force).Count
              if($afterCount -ne 0){throw ('Cache directory still nonempty: '+$folder)}
              $report.pathsPurged+=@{path=$folder;exists=$true;removedBytes=$bytes;removedFiles=$count}
            }
            $report.freeCAfterGiB=[math]::Round(([IO.DriveInfo]::new('C')).AvailableFreeSpace/1GB,3)
            $report.recoveredGiB=[math]::Round($report.freeCAfterGiB-$report.freeCBeforeGiB,3)
            $report.remainingTo12GiB=[math]::Round([math]::Max(0,12-$report.freeCAfterGiB),3)
            $report.state='SAFE_REGENERABLE_DDC_CLEAN_COMPLETED_NO_SOURCE_CHANGE'
            Write-Host ('SKARVIK_C_FREE_GIB_BEFORE='+$report.freeCBeforeGiB)
            Write-Host ('SKARVIK_C_FREE_GIB_AFTER='+$report.freeCAfterGiB)
            Write-Host ('SKARVIK_C_SPACE_GAINED_GIB='+$report.recoveredGiB)
            Write-Host ('SKARVIK_C_12GIB_THRESHOLD_MET='+($report.freeCAfterGiB -ge 12))
            Write-Host 'SKARVIK_PROTECTED_D_AND_NATIVE_ASSETS_UNTOUCHED=true'
          } catch{
            $report.error=$_.Exception.Message
            Write-Host ('CACHE_CLEAN_STOPPED='+$report.error)
            throw
          } finally{
            $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $reportPath -Encoding UTF8
          }
      - name: Publier le rapport de nettoyage sans sauvegardes natives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SKARVIK-SAFE-DDC-CLEAN-REPORT-20261110
          path: SKARVIK_SAFE_CACHE_CLEAN_20261110.json
          retention-days: 30
          if-no-files-found: warn
