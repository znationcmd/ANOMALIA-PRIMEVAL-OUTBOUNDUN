name: ANOMALIA - trois applications et mises a jour en un installateur
on:
  push:
    branches:
      - feature/anomalia-suite-3-apps-updater-bootstrap-20261023
    paths:
      - installer/windows/**
      - .github/workflows/anomalia-suite-installer.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installer:
    name: Compiler l installateur unique des trois applications
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # CMD Studio is deliberately NOT publicly published in Releases.
      # This is the latest verified Windows build of the personal Studio.
      - name: Recuperer le CMD Studio prive depuis GitHub Actions
        uses: actions/download-artifact@v4
        with:
          run-id: 39981069253
          name: CMD-Studio-Installateur-Windows
          repository: znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN
          github-token: ${{ github.token }}
          path: installers/studio
      - name: Verifier la version de CMD Studio
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $studio=@(Get-ChildItem "installers/studio" -File -Filter "*.exe")
          if($studio.Count -ne 1){throw "Un seul installateur CMD Studio attendu"}
          if($studio[0].Name -ne "CMD Studio Setup 0.2.1.exe"){throw "Version CMD Studio incorrecte : $($studio[0].Name)"}
          if($studio[0].Length -lt 20000000){throw "CMD Studio incomplet"}
          New-Item -ItemType Directory -Force "installers/studio" | Out-Null
          Copy-Item -LiteralPath $studio[0].FullName -Destination "installers/studio/CMD-Studio-Setup.exe"
      - name: Recuperer les deux vraies mises a jour publiées et verifier SHA512
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference="Stop"
          $apps=@(
            @{name="editor";tag="anomalia-editor-latest";version="0.5.1";expected="ANOMALIA-Editor-Setup-0.5.1.exe"},
            @{name="tools";tag="anomalia-tools-latest";version="0.2.2";expected="ANOMALIA-Tools-Setup-0.2.2.exe"}
          )
          foreach($app in $apps){
            $dest="installers/"+$app.name
            New-Item -ItemType Directory -Force $dest | Out-Null
            gh release download $app.tag --repo $env:REPOSITORY --pattern "latest.yml" --dir $dest
            if($LASTEXITCODE -ne 0){throw "Manifest officiel absent pour "+$app.name}
            $manifest=Get-Content (Join-Path $dest "latest.yml") -Raw
            $ver=[regex]::Match($manifest,'(?m)^version:\s*[''"]?(\d+\.\d+\.\d+)').Groups[1].Value
            if($ver -ne $app.version){throw "Version inattendue : "+$app.name+" "+$ver}
            $filename=[regex]::Match($manifest,'(?m)^path:\s*(.+\.exe)\s*$').Groups[1].Value.Trim()
            if($filename -ne $app.expected){throw "Nom du setup incorrect dans latest.yml : "+$filename}
            $digest=[regex]::Match($manifest,'(?m)^\s*sha512:\s*([A-Za-z0-9+/=]{80,})\s*$').Groups[1].Value
            if(!$digest){throw "SHA512 non declare pour "+$app.name}
            gh release download $app.tag --repo $env:REPOSITORY --pattern $filename --dir $dest
            if($LASTEXITCODE -ne 0){throw "Setup introuvable sur la Release : "+$filename}
            $file=Join-Path $dest $filename
            if(!(Test-Path -LiteralPath $file)){throw "Fichier setup absent"}
            if((Get-Item -LiteralPath $file).Length -lt 20000000){throw "Fichier setup incomplet"}
            $actual=[Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData([System.IO.File]::ReadAllBytes((Resolve-Path $file).Path)))
            if($actual -cne $digest){throw "Erreur de securite : SHA512 different pour "+$filename}
            Copy-Item -LiteralPath $file -Destination (Join-Path $dest ("ANOMALIA-"+(Get-Culture).TextInfo.ToTitleCase($app.name)+"-Setup.exe"))
            Write-Host ("VERIFIE "+$app.name+" "+$ver+" SHA512 "+$filename)
          }
      - name: Normaliser les trois installateurs
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $renames=@(
            @{source="installers/editor/ANOMALIA-Editor-Setup-0.5.1.exe";destination="installers/editor/ANOMALIA-Editor-Setup.exe"},
            @{source="installers/tools/ANOMALIA-Tools-Setup-0.2.2.exe";destination="installers/tools/ANOMALIA-Tools-Setup.exe"}
          )
          foreach($item in $renames){
            if(!(Test-Path $item.destination)){Copy-Item $item.source $item.destination}
          }
          foreach($p in @("installers/studio/CMD-Studio-Setup.exe","installers/editor/ANOMALIA-Editor-Setup.exe","installers/tools/ANOMALIA-Tools-Setup.exe")){
            if(!(Test-Path $p)){throw "Missing "+$p}
            if((Get-Item $p).Length -lt 20000000){throw "Setup incomplete "+$p}
          }
      - name: Compiler un seul programme Windows avec NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference="Stop"
          $nsis="${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if(!(Test-Path $nsis)){choco install nsis -y --no-progress}
          if(!(Test-Path $nsis)){throw "NSIS absent"}
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $root=(Get-Location).Path
          & $nsis /V3 "/DREPO_ROOT=$root" "installer\windows\suite.nsi"
          if($LASTEXITCODE -ne 0){throw "Echec de compilation NSIS"}
          $bundle="release/Installer-ANOMALIA-Trois-Applications-AutoMAJ.exe"
          if(!(Test-Path $bundle)){throw "Installateur unique non genere"}
          $size=(Get-Item $bundle).Length
          if($size -lt 220000000){throw "Installateur suspect : taille insuffisante "+$size}
          Write-Host ("Installateur 3-en-1 termine : "+$size+" octets")
      - uses: actions/upload-artifact@v4
        with:
          name: ANOMALIA-Installeur-Unique-3-Logiciels-AutoMAJ
          path: release/Installer-ANOMALIA-Trois-Applications-AutoMAJ.exe
          if-no-files-found: error
          compression-level: 0
