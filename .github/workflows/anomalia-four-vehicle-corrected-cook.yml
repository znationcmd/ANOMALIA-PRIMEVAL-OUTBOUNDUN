name: ANOMALIA - smoke test the staged Audio Modulation vehicle build
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-four-vehicle-corrected-cook.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  staged-package-smoke-test:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Launch the already cooked package without rebuilding it
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected runner'}
          $busy=@(Get-Process UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue|Where-Object{-not $_.HasExited})
          if($busy.Count){throw 'Existing Unreal/game session preserved'}
          $root='D:\ANOMALIA\unreal';$project=Join-Path $root 'AnomaliaPrimeval.uproject'
          $projectJson=Get-Content -LiteralPath $project -Raw|ConvertFrom-Json
          if(@($projectJson.Plugins|Where-Object{$_.Name -eq 'AudioModulation' -and $_.Enabled}).Count -eq 0){throw 'Audio Modulation is not enabled in the Windows game project'}
          $stage='C:\ANOMALIA_VehicleRuntime\AudioModulation-Vehicles-45978139312'
          if(!(Test-Path -LiteralPath $stage)){throw "Cooked package missing: $stage"}
          $exe=Get-ChildItem -LiteralPath $stage -Filter 'AnomaliaPrimeval.exe' -File -Recurse|Select-Object -First 1
          $ucas=Get-ChildItem -LiteralPath $stage -Filter '*.ucas' -File -Recurse|Where-Object Length -gt 1MB|Select-Object -First 1
          if(!$exe -or !$ucas){throw 'Cooked executable or IoStore container missing'}
          $stageBytes=(Get-ChildItem -LiteralPath $stage -Recurse -File -Force|Measure-Object Length -Sum).Sum
          Write-Output ('ANOMALIA_VEHICLE_STAGE='+$stage)
          Write-Output ('ANOMALIA_STAGE_SIZE_GB='+[math]::Round($stageBytes/1GB,2))
          Write-Output ('ANOMALIA_STAGE_UCAS_GB='+[math]::Round($ucas.Length/1GB,2))
          $review=Join-Path $root ('Saved\VehicleReview\launch-smoke-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $review -Force|Out-Null
          $log=Join-Path $review 'ANOMALIA_vehicle_launch.log';$err=Join-Path $review 'ANOMALIA_vehicle_launch.err'
          $proc=$null
          try {
            $proc=Start-Process -FilePath $exe.FullName -ArgumentList @('-windowed','-ResX=1280','-ResY=720','-log','-stdout','-FullStdOutLogOutput') -WorkingDirectory $exe.DirectoryName -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
            Start-Sleep -Seconds 25;$proc.Refresh()
            if($proc.HasExited){Write-Output ('ANOMALIA_LAUNCH_EXIT_CODE='+$proc.ExitCode);if(Test-Path $log){Get-Content $log -Tail 100};if(Test-Path $err){Get-Content $err -Tail 60};throw 'Staged package exited during launch smoke test'}
            $launchText=Get-Content -LiteralPath $log -Raw
            if($launchText -match 'class \(SoundControlBus\) does not exist|class \(SoundModulationPatch\) does not exist'){throw 'Audio Modulation class warnings remain in the packaged game log'}
            Write-Output ('ANOMALIA_GAME_RUNNING_PID='+$proc.Id)
            Write-Output 'ANOMALIA_CORRECTED_PACKAGE_LAUNCH=alive_after_25_seconds'
          } finally {
            if($proc){$proc.Refresh();if(!$proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anomalia-audiomodulation-launch-smoke
          path: D:\ANOMALIA\unreal\Saved\VehicleReview\launch-smoke-*\*
          if-no-files-found: warn
