name: PRIGIMALIA - Character slots and logout real Windows review
# Review revision: corrected UE5 MoviePlayer Slate includes, official-transfer gate and native C4458 fixes.
on:
  push:
    branches: [rebrand/full-anomaliaz-prigimalia-20261029]
    paths: [.github/workflows/prigimalia-character-slots-and-logout-review.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  native-menu-flow:
    if: github.repository == 'znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN' && github.ref == 'refs/heads/rebrand/full-anomaliaz-prigimalia-20261029'
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/full-anomaliaz-prigimalia-20261029
          clean: false
          persist-credentials: false
      - name: Validate safe character slots, logout and native menu source contracts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $python=Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          if(-not(Test-Path -LiteralPath $python)){throw 'UE Python missing'}
          & $python tests/test_native_character_slots_and_logout.py
          if($LASTEXITCODE -ne 0){throw 'Character slots/logout check failed'}
          & $python tests/test_ue5_player_lifecycle_source.py
          if($LASTEXITCODE -ne 0){throw 'Lifecycle regression failed'}
          & $python tests/test_ue5_native_start_pause_server_flow.py
          if($LASTEXITCODE -ne 0){throw 'Start/Pause flow test failed'}
          & $python tests/test_ue5_native_workshop_menu.py
          if($LASTEXITCODE -ne 0){throw 'Existing WorkForge regression'}
      - name: Preserve staged source then copy only approved UE5 menu files
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ANOMALIAZ-PRIGIMALIA\unreal'
          $original='D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject'
          $project=Join-Path $root 'AnomaliaZPrigimalia.uproject'
          $marker=Join-Path $root 'Saved\BrandMigration\verified-source-backup.marker'
          foreach($p in @($root,'D:\ANOMALIA','D:\ANOMALIAZ-PRIGIMALIA')){
            if(-not(Test-Path -LiteralPath $p -PathType Container)){throw ('Missing source root '+$p)}
            if((Get-Item -LiteralPath $p).Attributes -band [IO.FileAttributes]::ReparsePoint){throw ('Symlink or junction root '+$p)}
          }
          if(-not(Test-Path -LiteralPath $project) -or -not(Test-Path -LiteralPath $original) -or -not(Test-Path -LiteralPath $marker)){throw 'Source or backup verification missing'}
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaZPrigimalia,AnomaliaPrimeval,UnrealBuildTool,robocopy -ErrorAction SilentlyContinue).Count -gt 0){throw 'Native editor/game/build active, refuse concurrent write'}
          $backup=Join-Path $root ('Saved\BrandMigration\CharacterSlotsReview\run-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $backup){throw 'Already staged run; refuse overwrite'}
          New-Item -ItemType Directory -Path $backup -Force|Out-Null
          $names=@('AnomaliaZPrigimaliaSessionWidget.cpp','AnomaliaZPrigimaliaSessionWidget.h','AnomaliaZPrigimaliaPlayableProbe.cpp','AnomaliaZPrigimaliaGameMode.cpp','AnomaliaZPrigimaliaGameMode.h','AnomaliaZPrigimalia.cpp','AnomaliaZPrigimalia.Build.cs')
          foreach($name in $names){
            $src=Join-Path $env:GITHUB_WORKSPACE ('unreal\Source\AnomaliaZPrigimalia\'+$name)
            $dst=Join-Path $root ('Source\AnomaliaZPrigimalia\'+$name)
            if(-not(Test-Path -LiteralPath $src -PathType Leaf) -or -not(Test-Path -LiteralPath $dst -PathType Leaf)){throw ('Missing native UE source '+$name)}
            if((Get-Item -LiteralPath $dst).Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Linked UE source refused'}
            Copy-Item -LiteralPath $dst -Destination (Join-Path $backup $name)
            if((Get-FileHash -LiteralPath $dst).Hash -ne (Get-FileHash -LiteralPath (Join-Path $backup $name)).Hash){throw ('Source backup hash failure '+$name)}
          }
          foreach($name in $names){
            $src=Join-Path $env:GITHUB_WORKSPACE ('unreal\Source\AnomaliaZPrigimalia\'+$name)
            $dst=Join-Path $root ('Source\AnomaliaZPrigimalia\'+$name)
            Copy-Item -LiteralPath $src -Destination $dst -Force
            if((Get-FileHash -LiteralPath $src).Hash -ne (Get-FileHash -LiteralPath $dst).Hash){throw ('New source checksum failed '+$name)}
          }
          (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash|Set-Content (Join-Path $env:RUNNER_TEMP 'menu-flow-original.sha')
          Write-Host 'PRIGIMALIA_CHARACTERS_SOURCES_STAGED=true'
      - name: Compile real Unreal Engine 5.8 Editor and Win64 game
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $project='D:\ANOMALIAZ-PRIGIMALIA\unreal\AnomaliaZPrigimalia.uproject'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          foreach($target in @('AnomaliaZPrigimaliaEditor','AnomaliaZPrigimalia')){
            & $build $target 'Win64' 'Development' "-Project=$project" '-WaitMutex' '-NoHotReloadFromIDE' '-MaxParallelActions=2'
            if($LASTEXITCODE -ne 0){throw ('C++ compile failed for '+$target)}
          }
          Write-Host 'PRIGIMALIA_CHARACTERS_LOGOUT_CPLUSPLUS_BUILT=true'
      - name: Package separate Windows menu review without touching existing builds
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $project='D:\ANOMALIAZ-PRIGIMALIA\unreal\AnomaliaZPrigimalia.uproject'
          $archive=Join-Path 'D:\ANOMALIAZ-PRIGIMALIA\PackagedWindows' ('CharacterSlotsReview-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $archive){throw 'Review archive collision'}
          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          & $uat 'BuildCookRun' "-project=$project" '-noP4' '-platform=Win64' '-clientconfig=Development' '-cook' '-stage' '-pak' '-package' '-archive' "-archivedirectory=$archive" '-unattended' '-utf8output'
          if($LASTEXITCODE -ne 0){throw 'Native Windows packaging failed'}
          $exe=Join-Path $archive 'Windows\AnomaliaZPrigimalia.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Menu Flow Windows EXE missing'}
          $exe|Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'menu-flow-exe.txt')
          Write-Host ('PRIGIMALIA_CHARACTERS_REVIEW_EXE='+$exe)
      - name: Test real packaged Windows game Play-to-browser-to-Solo flow
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'menu-flow-exe.txt') -Raw).Trim()
          $out=Join-Path 'D:\ANOMALIAZ-PRIGIMALIA\unreal\Saved\BrandMigration' ('CharacterSlotsSmoke-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $probe=Join-Path $out 'native-gameplay.json'
          $log=Join-Path $out 'native-gameplay.log'
          $args=@('/Game/Maps/ANOMALIA_Playable_v1?AnomaliaZPrigimaliaServerId=playable-smoke-character-slots','-windowed','-ResX=1280','-ResY=720','-d3d11','-sm5','-unattended','-nosound','-nopause',("-AnomaliaZPrigimaliaPlayableProbe=$probe"),("-abslog=$log"))
          $proc=Start-Process -FilePath $exe -ArgumentList $args -PassThru
          try{
            if(-not $proc.WaitForExit(180000)){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue;throw 'Packaged game timed out'}
          }finally{if(-not $proc.HasExited){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}}
          if(-not(Test-Path -LiteralPath $probe -PathType Leaf)){throw 'Real game did not produce runtime report'}
          $r=Get-Content -LiteralPath $probe -Raw | ConvertFrom-Json
          if($r.state -ne 'PACKAGED_GAME_SMOKE_PASSED'){throw ('Gameplay smoke failed: '+$r.error)}
          if(@($r.checks) -notcontains 'main_menu_server_browser_tabs_and_search'){throw 'Server tabs were not exercised in actual Windows client'}
          if(@($r.checks) -notcontains 'main_menu_character_slots_and_live_3d_survivor_preview'){throw 'Survivor menu and slots not verified in packaged game'}
          if(@($r.checks) -notcontains 'pause_online_players_real_widget_without_workforge'){throw 'Pause online players isolation not verified in packaged game'}
          Write-Host 'PRIGIMALIA_CHARACTER_SLOTS_AND_PAUSE_PROBE_PASSED=true'
      - name: Confirm original and previous Windows playable game preserved
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $hash=(Get-Content (Join-Path $env:RUNNER_TEMP 'menu-flow-original.sha') -Raw).Trim()
          if((Get-FileHash -LiteralPath 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject' -Algorithm SHA256).Hash -ne $hash){throw 'Original D project changed'}
          if(-not(Test-Path -LiteralPath 'D:\ANOMALIAZ-PRIGIMALIA\PackagedWindows\NativeValidated\Windows\AnomaliaZPrigimalia.exe')){throw 'Previous working game missing'}
          Write-Host 'PRIGIMALIA_ORIGINAL_AND_PREVIOUS_GAME_PRESERVED=true'
      - name: Upload actionable runtime diagnostics and source backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRIGIMALIA-Characters-LiveMenu-Native-Probe
          if-no-files-found: warn
          path: |
            D:/ANOMALIAZ-PRIGIMALIA/unreal/Saved/BrandMigration/CharacterSlotsSmoke-*/*.json
            D:/ANOMALIAZ-PRIGIMALIA/unreal/Saved/BrandMigration/CharacterSlotsSmoke-*/*.log
            D:/ANOMALIAZ-PRIGIMALIA/unreal/Saved/BrandMigration/CharacterSlotsSmoke-*/*.png
