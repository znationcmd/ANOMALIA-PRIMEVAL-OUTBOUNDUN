name: ANOMALIA - integrate three requested draft landscapes into actual project
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-three-requested-maps.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-three-requested-map-integration
  cancel-in-progress: false
jobs:
  terrain_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -I. tests/native/three_requested_worlds.cpp -o /tmp/three-worlds && /tmp/three-worlds
      - run: python -m py_compile scripts/ue5/install-three-map-sources.py unreal/Scripts/create_three_requested_native_maps.py
  integrate_actual_project:
    needs: terrain_checks
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: three-requested-maps
          sparse-checkout: |
            scripts/ue5
            unreal/Scripts/create_three_requested_native_maps.py
            unreal/Source/AnomaliaZPrigimalia
            public/config/anomalia-map-catalog.json
          persist-credentials: false
      - name: Preserve existing maps and install narrowly matched sources with backups
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Existing Unreal session preserved'}
          if((Get-PSDrive C).Free -lt 16GB -or (Get-PSDrive D).Free -lt 12GB){throw 'Insufficient disk reserve for native build and landscapes'}
          $out='D:\ANOMALIA\unreal\Saved\ThreeRequestedMaps\'+$env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "THREE_MAP_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:THREE_MAP_OUT=$out
          Get-ChildItem 'D:\ANOMALIA\unreal\Content' -Filter *.umap -Recurse | ForEach-Object { @{path=$_.FullName;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash} } | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $out 'original-maps.json')
          $py='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $py -B "$env:GITHUB_WORKSPACE\three-requested-maps\scripts\ue5\install-three-map-sources.py"
          if($LASTEXITCODE -ne 0){throw 'Local source differs; guarded merge refused without overwriting local work'}
      - name: Compile actual installed Unreal module
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $module=(Get-Content (Join-Path $env:THREE_MAP_OUT 'source-install.json') -Raw | ConvertFrom-Json).module
          & 'C:\Program Files\Epic Games\UE_5.8\Engine\Build\BatchFiles\Build.bat' ($module+'Editor') Win64 Development 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject' -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=2 *> (Join-Path $env:THREE_MAP_OUT 'build.log')
          if($LASTEXITCODE -ne 0){throw 'Native compile failed; maps not generated'}
          'compiled' | Set-Content (Join-Path $env:THREE_MAP_OUT 'compiled.marker')
      - name: Create the three separate real landscape drafts without overwrites
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($id in @('YUDINAVIA','MOSCOVIE','CORSIVIA')) {
            if((Get-PSDrive D).Free -lt 10GB){throw 'Landscape disk reserve reached'}
            $env:PRIGIMALIA_THREE_MAP=$id
            $env:PRIGIMALIA_THREE_REPORT=Join-Path $env:THREE_MAP_OUT ($id+'.json')
            $script="$env:GITHUB_WORKSPACE\three-requested-maps\unreal\Scripts\create_three_requested_native_maps.py"
            & 'C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe' 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject' "-ExecutePythonScript=$script" -unattended -nopause -nosound -NullRHI "-abslog=$env:THREE_MAP_OUT\$id-engine.log"
            if($LASTEXITCODE -ne 0){throw "Unreal generation failed: $id"}
            $r=Get-Content $env:PRIGIMALIA_THREE_REPORT -Raw | ConvertFrom-Json
            if(!$r.actualLandscapeSaved){throw "Landscape not saved: $id $($r.error)"}
          }
      - name: Verify original map packages and retain recovery evidence
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if(!$env:THREE_MAP_OUT){exit 0}
          $backup=Join-Path $env:THREE_MAP_OUT 'source-backups.json'
          if((Test-Path $backup) -and !(Test-Path (Join-Path $env:THREE_MAP_OUT 'compiled.marker'))) {
            foreach($row in (Get-Content $backup -Raw | ConvertFrom-Json)) {
              if($row.backup){Copy-Item -LiteralPath $row.backup -Destination $row.path -Force}
            }
          }
          $before=Join-Path $env:THREE_MAP_OUT 'original-maps.json'
          if(Test-Path $before){
            foreach($row in (Get-Content $before -Raw | ConvertFrom-Json)) {
              if((Get-FileHash -LiteralPath $row.path -Algorithm SHA256).Hash -ne $row.sha256){throw 'An original map package changed unexpectedly'}
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-requested-native-map-evidence
          if-no-files-found: warn
          path: |
            ${{ env.THREE_MAP_OUT }}/*.json
            ${{ env.THREE_MAP_OUT }}/*.log
