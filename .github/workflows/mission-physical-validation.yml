name: ANOMALIA mission - physical disk gate and independent native validation
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-physical-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 90
    steps:
      - name: Inspect physical free space and preserve exact compiled Editor in fresh C drive validation directory
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ('physical-validation-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out | Out-Null
          "MISSION_PHYSICAL_REPORT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $disks=@(Get-CimInstance Win32_LogicalDisk | Select-Object DeviceID,DriveType,FreeSpace,Size)
          $os=Get-CimInstance Win32_OperatingSystem
          $state=[ordered]@{disks=$disks;freePhysicalMemoryKiB=$os.FreePhysicalMemory;freeVirtualMemoryKiB=$os.FreeVirtualMemory;previousValidationRedirectedTo='D:\ANOMALIAZ\03_Validation\m41798670858';installedProjectModified=$false}
          $state | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $out 'capacity.json') -Encoding UTF8
          $c=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          if($c.DriveType -ne 3 -or $c.FreeSpace -lt 12GB -or $os.FreePhysicalMemory*1KB -lt 4GB -or $os.FreeVirtualMemory*1KB -lt 8GB){throw 'Physical C drive or memory lacks required validation reserve; preserve all content'}
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Another Unreal process is active'}
          $source='C:\ANOMALIA-Validation\m41798670858'
          $destination=Join-Path 'C:\' ('ANOMALIA_MISSION_'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $destination){throw 'Fresh physical destination already exists'}
          $receipt=Join-Path $source 'unreal\Saved\MissionResume\41800675310\source-patch-receipt.json'
          $build=Join-Path $source 'unreal\Source\AnomaliaZPrigimalia\AnomaliaZPrigimalia.Build.cs'
          if((& git hash-object -- $build).Trim() -ne '220cf239429c9d4489d6154edf13cb51a99a0a6f'){throw 'Compiled source correction differs'}
          $dll=Join-Path $source 'unreal\Binaries\Win64\UnrealEditor-AnomaliaZPrigimalia.dll'
          $dllHash=(Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash
          New-Item -ItemType Directory -Path (Join-Path $destination 'unreal') | Out-Null
          foreach($dir in @('Source','Config','Build','Binaries','Content')){
            Copy-Item -LiteralPath (Join-Path $source ('unreal\'+$dir)) -Destination (Join-Path $destination 'unreal') -Recurse
          }
          Copy-Item -LiteralPath (Join-Path $source 'unreal\AnomaliaZPrigimalia.uproject') -Destination (Join-Path $destination 'unreal')
          $copiedDll=Join-Path $destination 'unreal\Binaries\Win64\UnrealEditor-AnomaliaZPrigimalia.dll'
          if((Get-FileHash -LiteralPath $copiedDll -Algorithm SHA256).Hash -ne $dllHash){throw 'Compiled Editor binary copy differs'}
          Copy-Item -LiteralPath $receipt -Destination $out
          [ordered]@{baseCommit='0360ec9cd8106097de8c8ba80c53f85349269d88';dependencyPatchCommit='f0f5144c137e1da1f8dc0a5568dd8de9c29db093';source=$source;destination=$destination;editorDLLSHA256=$dllHash;copiedOriginalUnchanged=$true;copiedIntermediateOrSaved=$false} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $out 'binary-copy-receipt.json') -Encoding UTF8
          "MISSION_PHYSICAL_ROOT=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run renamed actual native automation independently of Game build
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $editor='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $env:MISSION_PHYSICAL_ROOT 'unreal\AnomaliaZPrigimalia.uproject'
          $out=Join-Path $env:MISSION_PHYSICAL_REPORT 'native'
          New-Item -ItemType Directory -Path $out | Out-Null
          $ErrorActionPreference='Continue'
          & $editor $project -unattended -nopause -nosound -NullRHI '-ExecCmds=Automation RunTests AnomaliaZPrigimalia.Native.; Quit' "-ReportExportPath=$out" "-abslog=$out\editor.log" *> (Join-Path $out 'process.log')
          $exitCode=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          $data=Get-Content -LiteralPath (Join-Path $out 'index.json') -Raw | ConvertFrom-Json
          $tests=@($data.tests)
          $required=@('VehicleCatalog','ProfileIsolation','TransportDynamics','POIResourceExclusivity','ReactiveWorldPersistenceAndPower','DoorLeafAuthorityAndCollision','CrewEntryAndSafeExitGeometry','ChaosRoadConfiguration','LootCatalog','LootTransactions','LootJournalRecovery','RPBankTransactions','ItemConsumption','ItemEffects','StorageGrids','InventoryLayoutMigration','VehicleKeyPartsCargoAndRecovery','DogOwnershipAndNonLethalDamage','TacticalMovement.SpeedLoadFatigueAndCrouch')
          $missing=@($required | Where-Object {$name='AnomaliaZPrigimalia.Native.'+$_; @($tests | Where-Object {$_.fullTestPath -eq $name -and $_.state -eq 'Success'}).Count -ne 1})
          [ordered]@{exitCode=$exitCode;testCount=$tests.Count;failed=@($tests | Where-Object {$_.state -ne 'Success'}).Count;missingRequired=$missing;PIE=$false;worldPlayable=$false} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $out 'summary.json') -Encoding UTF8
          if($exitCode -ne 0 -or $tests.Count -eq 0 -or $missing.Count -gt 0 -or @($tests | Where-Object {$_.state -ne 'Success'}).Count -gt 0){throw 'Actual native automation not fully accepted'}
      - name: Compile actual Game target independently
        if: always() && env.MISSION_PHYSICAL_ROOT != ''
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $build='C:\Program Files\Epic Games\UE_5.8\Engine\Build\BatchFiles\Build.bat'
          $project=Join-Path $env:MISSION_PHYSICAL_ROOT 'unreal\AnomaliaZPrigimalia.uproject'
          $out=Join-Path $env:MISSION_PHYSICAL_REPORT 'game-build.log'
          $ErrorActionPreference='Continue'
          & $build AnomaliaZPrigimalia Win64 Development "-Project=$project" -WaitMutex -NoHotReloadFromIDE *> $out
          $exitCode=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          [ordered]@{target='AnomaliaZPrigimalia';exitCode=$exitCode;project=$project;packagedOrPlayed=$false} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:MISSION_PHYSICAL_REPORT 'game-build.json') -Encoding UTF8
          if($exitCode -ne 0){throw 'Actual Game target build failed'}
      - uses: actions/upload-artifact@v4
        if: always() && env.MISSION_PHYSICAL_REPORT != ''
        with:
          name: mission-physical-native-validation
          path: ${{ env.MISSION_PHYSICAL_REPORT }}/
          if-no-files-found: error
