name: PRIGIMALIA - Repair staged UE5 project JSON encoding and generate files
on:
  push:
    branches: [rebrand/full-anomaliaz-prigimalia-20261029]
    paths: ['.github/workflows/prigimalia-fix-unreal-project-encoding.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false

jobs:
  repair-project-encoding:
    if: github.repository == 'znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN' && github.ref == 'refs/heads/rebrand/full-anomaliaz-prigimalia-20261029'
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/full-anomaliaz-prigimalia-20261029
          clean: false
          persist-credentials: false
      - name: Repair only verified UTF-16 staged .uproject and test native UE project-file generation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $env:GITHUB_WORKSPACE 'scripts\repair-prigimalia-uproject-utf8.ps1'
          if(-not(Test-Path -LiteralPath $script -PathType Leaf)){throw 'Project JSON fix script absent from checkout'}
          & $script
          if($LASTEXITCODE -and $LASTEXITCODE -ne 0){throw 'Project JSON fix reported failure'}
      - name: Preserve original-byte backup receipt and repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRIGIMALIA-UE5-Project-UTF8-Fix
          if-no-files-found: warn
          path: |
            D:/ANOMALIAZ-PRIGIMALIA/unreal/Saved/BrandMigration/project-encoding-repair-report.json
