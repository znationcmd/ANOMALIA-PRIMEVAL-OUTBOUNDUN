name: ANOMALIA - compare installed SKARVIK under DX12 SM6
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-skarvik-sm6-render-smoke.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  installed-sm6-smoke:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Test the installed final map in DX12 SM6 without changing the shortcut
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected Windows PC runner'}
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'An Unreal/game process is already active; preserving it'}
          $desktop=[Environment]::GetFolderPath('Desktop')
          $link=Join-Path $desktop 'ANOMALIA''Z PRIGIMALIA - VRAI JEU SKARVIK.lnk'
          if(!(Test-Path -LiteralPath $link)){throw 'Installed SKARVIK shortcut is missing'}
          $shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut($link)
          $exe=[string]$shortcut.TargetPath
          $map='/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1'
          if(!(Test-Path -LiteralPath $exe)){throw 'Installed game executable is missing'}
          $pakDir=Join-Path (Split-Path $exe -Parent) 'AnomaliaPrimeval\Content\Paks'
          $containers=@(Get-ChildItem -LiteralPath $pakDir -File|Where-Object{$_.Extension -in '.pak','.utoc','.ucas'})
          if(!$containers.Count){throw 'No cooked game containers found'}
          $out=Join-Path $env:GITHUB_WORKSPACE ('installed-sm6-render-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $stdout=Join-Path $out 'stdout.log';$stderr=Join-Path $out 'stderr.log'
          $args=@($map,'-d3d12','-sm6','-windowed','-ResX=1280','-ResY=720','-log','-stdout','-FullStdOutLogOutput')
          $proc=$null;$alive=$false;$exitCode=$null
          try{
            $proc=Start-Process -FilePath $exe -ArgumentList $args -WorkingDirectory (Split-Path $exe -Parent) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            for($i=0;$i -lt 50;$i++){Start-Sleep 1;$proc.Refresh();if($proc.HasExited){$exitCode=$proc.ExitCode;break}}
            $proc.Refresh();$alive=!$proc.HasExited
            if(!$alive -and $null -eq $exitCode){$exitCode=$proc.ExitCode}
            $logs=@()
            foreach($f in @($stdout,$stderr)){
              if(Test-Path $f){$logs+=@(Get-Content -LiteralPath $f -ErrorAction SilentlyContinue|ForEach-Object{$_.ToString()})}
            }
            $saved=Join-Path (Split-Path $exe -Parent) 'AnomaliaPrimeval\Saved\Logs'
            if(Test-Path $saved){$latest=Get-ChildItem -LiteralPath $saved -Filter '*.log' -File|Sort-Object LastWriteTime -Descending|Select-Object -First 1;if($latest){$logs+=@(Get-Content -LiteralPath $latest.FullName -Tail 5000 -ErrorAction SilentlyContinue|ForEach-Object{$_.ToString()})}}
            $hits=@($logs|Where-Object{$_ -match '(?i)PRIGIMALIA_SKARVIK_FINAL_v1|LogRHI:|D3D12|LogMaterial: Error|Failed to compile Material|uncooked shader map|Fatal error'})
            $hits|Select-Object -Last 50|ForEach-Object{Write-Host ('SM6_LOG '+$_.ToString())}
            $mapObserved=[bool]($logs|Where-Object{$_ -match '(?i)(LoadMap|Browse|Bringing World).*(PRIGIMALIA_SKARVIK_FINAL_v1)'|Select-Object -First 1)
            $materialErrors=@($logs|Where-Object{$_ -match 'LogMaterial: Error|Failed to compile Material|uncooked shader map'}).Count
          }finally{
            if($proc){$proc.Refresh();if(!$proc.HasExited){$null=$proc.CloseMainWindow();if(!$proc.WaitForExit(8000)){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue}}}
          }
          $report=[ordered]@{renderer='D3D12';shaderModel='SM6';processStayedOpen50Seconds=$alive;exitCode=$exitCode;mapLoadObserved=$mapObserved;materialShaderErrors=$materialErrors;cookedContainers=@($containers).Count}
          $report|ConvertTo-Json -Depth 3|Set-Content -LiteralPath (Join-Path $out 'result.json') -Encoding utf8
          Write-Host ('INSTALLED_SM6_SMOKE='+($report|ConvertTo-Json -Depth 3 -Compress))
          if(!$alive){throw 'The installed game did not stay open for the SM6 smoke test'}
          if(!$mapObserved){throw 'The final SKARVIK map load was not confirmed in runtime logs'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-skarvik-sm6-render-smoke
          path: installed-sm6-render-${{ github.run_id }}\result.json
          if-no-files-found: warn
