name: ANOMALIA mission - discover standalone Fab projects and tracks
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-standalone-project-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  wait-for-current-import:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const until=Date.now()+320*60*1000;
            while(Date.now()<until) {
              const r=await github.rest.actions.getWorkflowRun({...context.repo,run_id:41851208057});
              if(r.data.status==='completed') return;
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            throw new Error('Current import still active; read-only discovery not started');
  discover:
    needs: wait-for-current-import
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    concurrency:
      group: anomalia-ue5-native-host
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c48dd694637afdea67fcb8471dacbcb4d8c42803
          path: standalone-discovery-${{ github.run_id }}
          sparse-checkout: scripts/ue5/discover-standalone-unreal-projects.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Find project-only Fab packs on attached disks without changing content
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ('standalone-projects-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out | Out-Null
          "PROJECT_DISCOVERY_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PROJECT_DISCOVERY_OUT=$out
          $script=Join-Path $env:GITHUB_WORKSPACE ('standalone-discovery-'+$env:GITHUB_RUN_ID+'\scripts\ue5\discover-standalone-unreal-projects.py')
          & 'C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe' -B $script
          if($LASTEXITCODE -ne 0){throw 'Standalone project discovery failed'}
      - uses: actions/upload-artifact@v4
        if: always() && env.PROJECT_DISCOVERY_OUT != ''
        with:
          name: standalone-unreal-projects-and-track-candidates
          path: ${{ env.PROJECT_DISCOVERY_OUT }}/
          if-no-files-found: error
