name: Inspect original native E39 rig configuration
on:
  push:
    branches: [feature/real-skarvik-bmw-dog-gameplay-capture-20261111]
    paths: [.github/workflows/anomalia-authentic-diagnose.yml]
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 10
    steps:
      - name: Read existing original vehicle validation and setup declarations
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $root='D:\ANOMALIAZ\01_Projet_Principal\unreal'
          $cpp=Join-Path $root 'Source\AnomaliaPrimeval\Vehicles\AnomaliaChaosRoadVehicle.cpp'
          $h=Join-Path $root 'Source\AnomaliaPrimeval\Vehicles\AnomaliaChaosRoadVehicle.h'
          Select-String -LiteralPath $cpp -Pattern 'bool AAnomaliaChaosRoadVehicle::HasValidRoadRig' -Context 0,95
          Select-String -LiteralPath $h -Pattern 'UFUNCTION|RoadMesh|RoadAnimation|RoadBodyMesh|Rebuild|Refresh|Rig' -Context 0,3
          $out=Join-Path $root 'Saved\AuthenticInstall\43223489505\genuine-e39-recipe.json'
          Get-Content -LiteralPath $out
