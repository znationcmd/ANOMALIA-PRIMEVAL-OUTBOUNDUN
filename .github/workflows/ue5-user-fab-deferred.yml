name: ANOMALIA’Z PRIGIMALIA — resume deferred local Fab models after disk cleanup
on:
  push:
    branches: ['ue5/character-audit-20261027']
    paths: ['.github/workflows/ue5-user-fab-deferred.yml']
permissions:
  contents: read
jobs:
  import:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 55
    concurrency:
      group: anomalia-ue5-native-host
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve source files then import into a fresh isolated Unreal namespace
        shell: node {0}
        run: |
          const fs=require('fs'),path=require('path'),os=require('os'),crypto=require('crypto'),cp=require('child_process');
          const temp=path.join(os.homedir(),'AppData','Local','Temp','FabLibrary');
          const persistent='C:\\ProgramData\\Epic\\EpicGamesLauncher\\VaultCache\\FabLibrary';
          const out=path.join(process.env.RUNNER_TEMP,'anomalia-fab-import-'+process.env.GITHUB_RUN_ID);fs.mkdirSync(out);
          fs.appendFileSync(process.env.GITHUB_ENV,'ANOMALIA_FAB_IMPORT_OUTPUT='+out+'\n');
          const root='C:\\ANOMALIA\\FabImports\\UserSelection_'+process.env.GITHUB_RUN_ID;fs.mkdirSync(root,{recursive:true});
          const sources=[];
          if(fs.existsSync(temp))for(const e of fs.readdirSync(temp,{withFileTypes:true}))if(e.isDirectory()&&/^[0-9a-f-]{36}$/i.test(e.name))sources.push({id:e.name,dir:path.join(temp,e.name)});
          if(fs.existsSync(persistent))for(const e of fs.readdirSync(persistent,{withFileTypes:true}))if(e.isDirectory())sources.push({id:e.name.slice(-8),dir:path.join(persistent,e.name)});
          const chosen=[];
          for(const s of sources){const full=s.id.length===36?s.id:sources.find(t=>t.id.startsWith(s.id))?.id||s.id;
          const existing=chosen.find(x=>x.id===full);if(existing){if(s.dir.startsWith(persistent))existing.dir=s.dir;}else chosen.push({id:full,dir:s.dir});}
          function files(dir,arr=[]){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isSymbolicLink())throw Error('Symlink not copied: '+p);if(e.isDirectory())files(p,arr);else arr.push(p);}return arr;}
          const previous=JSON.parse(fs.readFileSync('C:\\ANOMALIA\\FabImports\\UserSelection_40561644379\\stage-manifest.json','utf8'));
          const deferredIds=previous.deferredSources.map(s=>s.id);
          const selected=chosen.filter(s=>deferredIds.some(id=>s.id===id||s.id.startsWith(id)||id.startsWith(s.id)));
          const blocked=chosen.filter(s=>!selected.includes(s)).map(s=>({id:s.id,reason:'Not repeated: already handled by first batch or not in prior deferred list'}));
          let bytes=0;
          for(const s of selected){s.files=files(s.dir).filter(p=>!/[.](zip|7z|rar)$/i.test(p));for(const p of s.files)bytes+=fs.statSync(p).size;}
          const stat=fs.statfsSync(path.parse(root).root);const free=stat.bavail*stat.bsize;
          if(bytes>20*1024**3||free<bytes+10*1024**3)throw Error('Insufficient staging budget: '+bytes+' bytes; free '+free);
          const report={time:new Date().toISOString(),sourceBytes:bytes,deferredSources:blocked,sourcePacks:[],imports:[],originalSourcesModified:false,publicAssetUpload:false};
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          for(const s of selected){
           const dest=path.join(root,'Sources',s.id);fs.mkdirSync(dest,{recursive:true});
           const pack={id:s.id,original:s.dir,staged:dest,files:[]};report.sourcePacks.push(pack);
           for(const p of s.files){const rel=path.relative(s.dir,p),d=path.join(dest,rel),before=fs.statSync(p);const b=fs.readFileSync(p);fs.mkdirSync(path.dirname(d),{recursive:true});fs.writeFileSync(d,b,{flag:'wx'});const digest=hash(b),after=fs.statSync(p);
           if(before.size!==after.size||before.mtimeMs!==after.mtimeMs||hash(fs.readFileSync(d))!==digest)throw Error('Source changed or copy mismatch '+p);
           pack.files.push({relative:rel,bytes:b.length,sha256:digest});
           }
           let candidates=pack.files.filter(f=>/\.(fbx|glb|gltf)$/i.test(f.relative));
           // One authored model per variant, not every DCC duplicate or standalone animation FBX.
           candidates=candidates.filter(f=>!/[\\/]Animations[\\/]|_Motion\.|[\\/]FbxC4D|[\\/]FbxMaya|[\\/]FbxBlender|[\\/]FbxUnity/i.test(f.relative));
           if(s.id.startsWith('04dd168f'))candidates=candidates.filter(f=>/Monkey_B3\.Fbx$/i.test(f.relative)&&/FbxUE5|Fbx3DSmax/i.test(f.relative)).slice(0,1);
           for(const f of candidates)report.imports.push({id:s.id,relative:f.relative,staged:path.join(dest,f.relative),sha256:f.sha256});
           console.log('STAGED '+s.id+' '+pack.files.length+' files; '+candidates.length+' models');
          }
          const manifest=path.join(root,'stage-manifest.json');fs.writeFileSync(manifest,JSON.stringify(report,null,2),{flag:'wx'});fs.copyFileSync(manifest,path.join(out,'stage-manifest.json'));
          const script=path.join(out,'import.py'),log=path.join(out,'unreal-import.log'),result=path.join(out,'import-report.json');
          fs.writeFileSync(script,"\"\"\"Import only hash-verified local Fab sources into a fresh validation namespace.\"\"\"\nimport gc, hashlib, json, os, traceback\nfrom pathlib import Path\nimport unreal\nmanifest=Path(os.environ[\"ANOMALIA_FAB_STAGE_MANIFEST\"])\ndata=json.loads(manifest.read_text(encoding=\"utf-8\"))\nout=Path(os.environ[\"ANOMALIA_FAB_IMPORT_REPORT\"])\nbase=\"/Game/Anomalia/ImportedFab/Batch_\"+os.environ[\"GITHUB_RUN_ID\"]\nreport={\"state\":\"IN_PROGRESS\",\"namespace\":base,\"project\":unreal.Paths.get_project_file_path(),\"sources\":[],\"errors\":[],\"gameplay\":\"not_implemented_or_tested\",\"multiplayer\":\"not_run\",\"oldAssetsReplaced\":False}\ndef checkpoint():\n    out.write_text(json.dumps(report,indent=2)+\"\\n\",encoding=\"utf-8\")\nif unreal.EditorAssetLibrary.does_directory_exist(base):\n    raise RuntimeError(\"Refusing existing namespace \"+base)\nunreal.SystemLibrary.execute_console_command(None,\"Interchange.FeatureFlags.Import.FBX 0\")\nfor index,row in enumerate(data[\"imports\"]):\n    entry={\"id\":row[\"id\"],\"source\":row[\"relative\"],\"sha256\":row[\"sha256\"],\"assets\":[]}\n    report[\"sources\"].append(entry)\n    try:\n        src=Path(row[\"staged\"])\n        if hashlib.sha256(src.read_bytes()).hexdigest()!=row[\"sha256\"]:\n            raise RuntimeError(\"Staged source checksum changed\")\n        dest=base+\"/\"+row[\"id\"].replace(\"-\",\"_\")+\"/Source_\"+str(index)\n        task=unreal.AssetImportTask()\n        for key,value in {\"filename\":str(src),\"destination_path\":dest,\"automated\":True,\"replace_existing\":False,\"replace_existing_settings\":False,\"save\":True,\"async_\":False}.items():\n            if key!=\"async_\":\n                task.set_editor_property(key,value)\n        if src.suffix.lower()==\".fbx\":\n            opts=unreal.FbxImportUI()\n            opts.set_editor_property(\"automated_import_should_detect_type\",True)\n            opts.set_editor_property(\"import_materials\",True)\n            opts.set_editor_property(\"import_textures\",True)\n            opts.set_editor_property(\"import_animations\",True)\n            opts.set_editor_property(\"import_mesh\",True)\n            opts.static_mesh_import_data.set_editor_property(\"combine_meshes\",False)\n            task.set_editor_property(\"options\",opts)\n            task.set_editor_property(\"factory\",unreal.FbxFactory())\n        unreal.AssetToolsHelpers.get_asset_tools().import_asset_tasks([task])\n        objects=list(task.get_objects())\n        if not objects:\n            paths=list(task.get_editor_property(\"imported_object_paths\"))\n            objects=[unreal.load_asset(p) for p in paths]\n        meshes=0\n        for obj in objects:\n            if not obj:\n                raise RuntimeError(\"Imported object could not be loaded\")\n            p=obj.get_path_name()\n            if not p.startswith(base+\"/\"):\n                raise RuntimeError(\"Importer returned object outside isolated namespace: \"+p)\n            entry[\"assets\"].append({\"path\":p,\"class\":obj.get_class().get_name()})\n        # Include dependent materials/textures which task results may omit.\n        for p in unreal.EditorAssetLibrary.list_assets(dest,recursive=True,include_folder=False):\n            obj=unreal.load_asset(p)\n            if not obj:\n                entry.setdefault(\"unloadable\",[]).append(p)\n                continue\n            record=next((r for r in entry[\"assets\"] if r[\"path\"]==obj.get_path_name()),None)\n            if record is None:\n                record={\"path\":obj.get_path_name(),\"class\":obj.get_class().get_name()}\n                entry[\"assets\"].append(record)\n            if isinstance(obj,(unreal.StaticMesh,unreal.SkeletalMesh)):\n                meshes+=1\n                if isinstance(obj,unreal.SkeletalMesh):\n                    sk=obj.get_editor_property(\"skeleton\")\n                    record[\"skeleton\"]=sk.get_path_name() if sk else None\n                    materials=obj.get_editor_property(\"materials\")\n                else:\n                    materials=obj.get_editor_property(\"static_materials\")\n                record[\"materialSlots\"]=len(materials)\n                record[\"emptyMaterialSlots\"]=sum(1 for m in materials if not m.material_interface)\n            if isinstance(obj,unreal.Blueprint):\n                record[\"compiled\"]=bool(unreal.BlueprintEditorLibrary.compile_blueprint(obj))\n        if meshes<1:\n            raise RuntimeError(\"No mesh imported from model source\")\n        if entry.get(\"unloadable\"):\n            raise RuntimeError(\"Some imported dependencies did not load\")\n        if not unreal.EditorAssetLibrary.save_directory(dest,only_if_is_dirty=False,recursive=True):\n            raise RuntimeError(\"Failed to save imported directory\")\n        entry[\"status\"]=\"IMPORTED_SAVED_LOADED_NOT_GAMEPLAY_ACCEPTED\"\n        entry[\"meshCount\"]=meshes\n    except Exception as exc:\n        entry[\"status\"]=\"FAILED\"\n        entry[\"error\"]=str(exc)\n        report[\"errors\"].append({\"source\":row[\"relative\"],\"error\":str(exc)})\n        unreal.log_error(traceback.format_exc())\n    checkpoint()\n    gc.collect()\nreport[\"state\"]=\"IMPORT_FINISHED_WITH_ERRORS\" if report[\"errors\"] else \"IMPORT_FINISHED\"\ncheckpoint()\n",{flag:'wx'});
          const engine=process.env.UE_ROOT||'C:\\Program Files\\Epic Games\\UE_5.8';
          const project='C:\\ANOMALIA-Validation\\c40543166274\\unreal\\AnomaliaPrimeval.uproject';
          if(!fs.existsSync(project))throw Error('Validated isolated project missing; refusing fallback to installed project');
          const r=cp.spawnSync(path.join(engine,'Engine','Binaries','Win64','UnrealEditor-Cmd.exe'),[project,'-run=pythonscript','-script='+script,'-unattended','-nop4','-nosplash','-nosound','-NullRHI','-abslog='+log],{encoding:'utf8',timeout:2700000,maxBuffer:4*1024*1024,env:{...process.env,ANOMALIA_FAB_STAGE_MANIFEST:manifest,ANOMALIA_FAB_IMPORT_REPORT:result}});
          console.log('IMPORT_EDITOR_EXIT '+r.status+' '+String(r.error||''));
          if(fs.existsSync(result)){const j=JSON.parse(fs.readFileSync(result,'utf8'));console.log(JSON.stringify({state:j.state,namespace:j.namespace,sources:j.sources.map(s=>({id:s.id,source:s.source,status:s.status,meshes:s.meshCount,error:s.error})),errors:j.errors},null,2));fs.copyFileSync(result,path.join(root,'import-report.json'));}
          if(r.status!==0||!fs.existsSync(result))process.exit(1);
          if(JSON.parse(fs.readFileSync(result,'utf8')).errors.length)process.exit(1);
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-fab-import-receipts-and-logs
          path: ${{ env.ANOMALIA_FAB_IMPORT_OUTPUT }}
          if-no-files-found: warn
