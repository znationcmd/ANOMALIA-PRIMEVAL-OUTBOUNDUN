name: ANOMALIA - diagnose material shader errors on installed SKARVIK
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-skarvik-material-diagnostic.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  material-diagnostic:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Capture complete renderer and material details from the installed game
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected Windows PC runner'}
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'An Unreal/game process is already active'}
          $exe='D:\ANOMALIAZ\Jeu\Versions\SKARVIK-43226147989\Windows\AnomaliaPrimeval.exe'
          $map='/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1'
          if(!(Test-Path -LiteralPath $exe)){throw 'Installed SKARVIK executable is missing'}
          $out=Join-Path $env:RUNNER_TEMP ('sk-material-diagnostic-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $log=Join-Path $out 'material-diagnostic.log'
          $stdout=Join-Path $out 'stdout.log';$stderr=Join-Path $out 'stderr.log'
          $args=@($map,'-d3d11','-sm5','-windowed','-ResX=1280','-ResY=720','-log','-stdout','-FullStdOutLogOutput','-LogCmds="LogMaterial Verbose"',"-abslog=$log")
          $p=$null;$alive=$false
          try{
            $p=Start-Process -FilePath $exe -ArgumentList $args -WorkingDirectory (Split-Path $exe -Parent) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            for($i=0;$i -lt 60;$i++){Start-Sleep -Seconds 1;$p.Refresh();if($p.HasExited){break}}
            $p.Refresh();$alive=!$p.HasExited
            $lines=@()
            foreach($f in @($log,$stdout,$stderr)){
              if(Test-Path -LiteralPath $f){
                $item=Get-Item -LiteralPath $f
                if($item.Length -gt 250MB){throw 'Diagnostic log exceeded the 250 MiB safety cap'}
                $stream=[IO.File]::Open($f,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::ReadWrite)
                try{$reader=New-Object IO.StreamReader($stream);try{$raw=$reader.ReadToEnd()}finally{$reader.Dispose()}}finally{$stream.Dispose()}
                $lines+=@($raw -split [Environment]::NewLine)
              }
            }
            $errors=@($lines|Where-Object{$_ -match 'LogMaterial: Error|uncooked shader map|invalid ShaderMap'})
            $contexts=@()
            for($i=0;$i -lt $lines.Count;$i++){
              if($lines[$i] -match 'LogMaterial: Error|uncooked shader map|invalid ShaderMap'){
                $start=[math]::Max(0,$i-4);$end=[math]::Min($lines.Count-1,$i+5)
                for($j=$start;$j -le $end;$j++){$contexts+=,$lines[$j]}
              }
            }
            $mapLine=$lines|Where-Object{$_ -match 'LogWorld: Bringing World .*PRIGIMALIA_SKARVIK_FINAL_v1.*up for play'}|Select-Object -First 1
            Write-Output ('MATERIAL_ERROR_COUNT='+$errors.Count)
            Write-Output ('FINAL_MAP_WORLD_STARTED='+[bool]$mapLine)
            Write-Output ('GAME_ALIVE_AFTER_DIAGNOSTIC='+$alive)
            $contexts|Select-Object -Unique|ForEach-Object{Write-Output ('MATERIAL_CONTEXT='+$_.ToString())}
            $lines|Where-Object{$_ -match 'LogD3D11RHI:|LogRHI:|Feature Level|ShaderPlatform' }|Select-Object -First 20|ForEach-Object{Write-Output ('RENDERER='+$_.ToString())}
            if(!$mapLine){throw 'The diagnostic did not confirm that the final map reached play'}
          }finally{
            if($p){$p.Refresh();if(!$p.HasExited){$null=$p.CloseMainWindow();if(!$p.WaitForExit(5000)){Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue};Write-Output 'DIAGNOSTIC_CLOSED_ONLY_ITS_OWN_GAME_PROCESS=true'}}
          }
          if(!$alive){throw 'Installed game exited before material diagnostics completed'}
