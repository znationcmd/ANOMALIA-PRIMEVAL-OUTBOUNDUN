name: ANOMALIA equipment attachments Editor compile and native tests
on:
  push:
    branches: ['ue5/character-audit-20261027']
    paths: ['.github/workflows/ue5-inventory-hybrid-compile.yml']
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  compile:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Budget shared-header rebuild and preserve all five native sources
        shell: node {0}
        run: |
          const fs=require('fs'),path=require('path'),cp=require('child_process'),crypto=require('crypto'),os=require('os');
          const stage='C:\\ANOMALIA-Validation\\c40543166274',project=path.join(stage,'unreal/AnomaliaPrimeval.uproject'),engine=process.env.UE_ROOT||'C:\\Program Files\\Epic Games\\UE_5.8';
          const dir=path.join(stage,'unreal/Saved/CharacterValidation','inventory-ui-compile-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT);fs.mkdirSync(dir,{recursive:true});fs.appendFileSync(process.env.GITHUB_ENV,'CARGO_FIX_OUTPUT='+dir+'\n');
          function guard(){
          const st=fs.statfsSync('C:\\'),bin=path.join(stage,'unreal/Binaries/Win64');
          let largestPdb=0;if(fs.existsSync(bin))for(const n of fs.readdirSync(bin))if(/Anomalia.*\.pdb$/i.test(n))largestPdb=Math.max(largestPdb,fs.statSync(path.join(bin,n)).size);
          let widgetObjectBytes=0;const objRoot=path.join(stage,'unreal/Intermediate/Build/Win64');
          function scanObjects(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())scanObjects(p);else if(/AnomaliaInventoryWidget.*\\.obj$/i.test(e.name))widgetObjectBytes=Math.max(widgetObjectBytes,fs.statSync(p).size);}}
          scanObjects(objRoot);
          const buildBudget=Math.max(2*1024**3,largestPdb*2+widgetObjectBytes*2+256*1024**2),reserve=6*1024**3;
          if(largestPdb===0)throw Error('Cached Editor PDB required for measured incremental-only budget');
          const resources={freeDiskBytes:st.bavail*st.bsize,freePhysicalBytes:os.freemem(),largestExistingPdbBytes:largestPdb,largestWidgetObjectBytes:widgetObjectBytes,targetScope:"Editor only; Game deferred",temporaryBuildBudgetBytes:buildBudget,retainedReserveBytes:reserve};
          fs.writeFileSync(path.join(dir,'compile-resource-preflight.json'),JSON.stringify(resources,null,2));
          if(resources.freeDiskBytes<reserve+buildBudget||resources.freePhysicalBytes<4*1024**3)throw Error('Incremental compile headroom insufficient: '+JSON.stringify(resources));
          }
          guard();
          const query=cp.spawnSync('powershell.exe',['-NoProfile','-NonInteractive','-Command',"Get-CimInstance Win32_Process -Filter \"Name='UnrealEditor.exe'\" | Select-Object ProcessId,CommandLine | ConvertTo-Json -Compress"],{encoding:'utf8',timeout:20000});
          if(query.status!==0)throw Error('Could not verify user Editor processes; no files changed');
          const processes=query.stdout.trim()?JSON.parse(query.stdout):[];
          const rows=Array.isArray(processes)?processes:[processes];
          const active=rows.filter(p=>!p.CommandLine||/AnomaliaPrimeval/i.test(p.CommandLine));
          if(active.length){fs.writeFileSync(path.join(dir,'active-editor-blocker.json'),JSON.stringify({state:'BLOCKED_BEFORE_SOURCE_OR_INPUT_WRITE',reason:'User Unreal session holds ANOMALIA native module; close test/editor before rebuild',processIds:active.map(p=>p.ProcessId)},null,2));throw Error('Close ANOMALIA test/editor before rebuild; user sessions left running. PIDs '+active.map(p=>p.ProcessId).join(','));}
          const blob=s=>crypto.createHash('sha1').update(Buffer.from('blob '+Buffer.byteLength(s)+'\0')).update(s).digest('hex');
          const changes=[{"path": "unreal/Source/AnomaliaPrimeval/AnomaliaInventoryComponent.h", "content": "#pragma once\n\n#include \"CoreMinimal.h\"\n#include \"Components/ActorComponent.h\"\n#include \"AnomaliaEconomySubsystem.h\"\n#include \"AnomaliaInventoryComponent.generated.h\"\n\nDECLARE_DYNAMIC_MULTICAST_DELEGATE(FAnomaliaInventoryUpdated);\nstruct FAnomaliaItemUseRule;\nclass FJsonObject;\nclass UAnomaliaSharedStorageSubsystem;\nclass AAnomaliaLootPickup;\nclass UStaticMeshComponent;\n\n/** Server-owned compatibility table. Attachments are single physical stacks, never extra cargo cells. */\nstruct FAnomaliaAttachmentRule\n{\n    FName Id;\n    FName Parent;\n    FString Label;\n    TArray<FName> Items;\n};\n\n/** Fixed native recipes: clients request only Id, never ingredients or output. */\nstruct FAnomaliaHandcraftRecipe\n{\n    FName Id;\n    FString Label;\n    FName Output;\n    int32 OutputCount=1;\n    TMap<FName,int32> Materials;\n};\n\nUSTRUCT(BlueprintType)\nstruct FAnomaliaInventoryStack\n{\n    GENERATED_BODY()\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    int32 StackId = 0;\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    FName ItemId;\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    int32 Count = 0;\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    FName ContainerId = TEXT(\"pockets\");\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    int32 X = 0;\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    int32 Y = 0;\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    bool bRotated = false;\n    /** Per physical stack; wear changes require a single item to avoid mixed-condition piles. */\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Condition\")\n    float Condition = 100.f;\n};\n\nUSTRUCT(BlueprintType)\nstruct FAnomaliaInventoryCompartment\n{\n    GENERATED_BODY()\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    FName Id;\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    int32 Width = 0;\n\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    int32 Height = 0;\n\n    /** Migration overflow: existing items may be removed, never added through normal placement. */\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    bool bRecoveryOnly = false;\n    /** Current modular slot condition; cargo remains accessible even at zero. */\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Condition\")\n    float Condition = 100.f;\n};\n\n/** Server-authoritative inventory data model. A UMG screen and item-world actors remain separate tasks. */\nUCLASS(ClassGroup=(ANOMALIA), BlueprintType, Blueprintable, meta=(BlueprintSpawnableComponent))\nclass ANOMALIAPRIMEVAL_API UAnomaliaInventoryComponent : public UActorComponent\n{\n    GENERATED_BODY()\n\npublic:\n    UAnomaliaInventoryComponent();\n    /** Current persistence/replication bound. Cell capacity and number of stacks are distinct. */\n    static constexpr int32 MaxStacks = 512;\n\n    UPROPERTY(ReplicatedUsing=OnRep_Stacks, VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    TArray<FAnomaliaInventoryStack> Stacks;\n\n    UPROPERTY(ReplicatedUsing=OnRep_Compartments, VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\")\n    TArray<FAnomaliaInventoryCompartment> Compartments;\n\n    UPROPERTY(EditAnywhere, Replicated, BlueprintReadOnly, Category=\"ANOMALIA|Inventory\", meta=(ClampMin=\"0.1\", ClampMax=\"500\"))\n    float WeightCapacityKg = 14.f;\n\n    UPROPERTY(BlueprintAssignable, Category=\"ANOMALIA|Inventory\")\n    FAnomaliaInventoryUpdated OnInve