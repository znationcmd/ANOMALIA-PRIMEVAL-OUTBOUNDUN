name: PRIGIMALIA - Compile rotating four real loading screenshots
on:
  push:
    branches: [rebrand/full-anomaliaz-prigimalia-20261029]
    paths: [.github/workflows/prigimalia-loading-four-images-native.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  four-art-loading:
    if: github.repository == 'znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN' && github.ref == 'refs/heads/rebrand/full-anomaliaz-prigimalia-20261029'
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebrand/full-anomaliaz-prigimalia-20261029
          clean: false
          persist-credentials: false
      - name: Check true four-JPEG loading rotation and menu regression contracts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $py=Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          if(-not(Test-Path -LiteralPath $py -PathType Leaf)){throw 'Unreal embedded Python missing'}
          & $py tests/test_loading_art_rotation.py
          if($LASTEXITCODE -ne 0){throw 'Loading-image cycle test failed'}
          & $py tests/test_ue5_native_start_pause_server_flow.py
          if($LASTEXITCODE -ne 0){throw 'Existing menu flow contract failed'}
          & $py tests/test_ue5_native_workshop_menu.py
          if($LASTEXITCODE -ne 0){throw 'WorkForge regression test failed'}
      - name: Back up and update only 4 controlled Unreal source files on isolated D clone
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ANOMALIAZ-PRIGIMALIA\unreal'
          $original='D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject'
          $staged=Join-Path $root 'AnomaliaZPrigimalia.uproject'
          $marker=Join-Path $root 'Saved\BrandMigration\verified-source-backup.marker'
          if(-not(Test-Path -LiteralPath $original) -or -not(Test-Path -LiteralPath $staged) -or -not(Test-Path -LiteralPath $marker)){throw 'Original, stage, or backup marker missing'}
          foreach($p in @('D:\ANOMALIA','D:\ANOMALIAZ-PRIGIMALIA',$root)){
            if((Get-Item -LiteralPath $p).Attributes -band [IO.FileAttributes]::ReparsePoint){throw ('Unsafe linked root '+$p)}
          }
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia,UnrealBuildTool,robocopy -ErrorAction SilentlyContinue).Count -gt 0){throw 'Editor, game or copy running; no overlapping file changes'}
          $backup=Join-Path $root ('Saved\BrandMigration\LoadingFourImages\run-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $backup){throw 'Existing run backup; refuse overwrite'}
          New-Item -ItemType Directory -Path $backup -Force|Out-Null
          $files=@(
            'Source\AnomaliaZPrigimalia\AnomaliaZPrigimalia.cpp',
            'Source\AnomaliaZPrigimalia\AnomaliaZPrigimalia.Build.cs',
            'Source\AnomaliaZPrigimalia\AnomaliaZPrigimaliaSessionWidget.cpp',
            'Source\AnomaliaZPrigimalia\AnomaliaZPrigimaliaSessionWidget.h'
          )
          foreach($name in $files){
            $src=Join-Path $env:GITHUB_WORKSPACE ('unreal\'+$name)
            $dst=Join-Path $root $name
            if(-not(Test-Path -LiteralPath $src -PathType Leaf) -or -not(Test-Path -LiteralPath $dst -PathType Leaf)){throw ('Native source missing '+$name)}
            if((Get-Item -LiteralPath $dst).Attributes -band [IO.FileAttributes]::ReparsePoint){throw 'Linked native source refused'}
            $backupFile=Join-Path $backup ([IO.Path]::GetFileName($name))
            Copy-Item -LiteralPath $dst -Destination $backupFile
            if((Get-FileHash -LiteralPath $dst).Hash -ne (Get-FileHash -LiteralPath $backupFile).Hash){throw ('Source backup mismatch '+$name)}
          }
          foreach($name in $files){
            $src=Join-Path $env:GITHUB_WORKSPACE ('unreal\'+$name)
            $dst=Join-Path $root $name
            Copy-Item -LiteralPath $src -Destination $dst -Force
            if((Get-FileHash -LiteralPath $src).Hash -ne (Get-FileHash -LiteralPath $dst).Hash){throw ('Source write mismatch '+$name)}
          }
          (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'loading-original-sha256.txt')
          Write-Host ('PRIGIMALIA_FOUR_LOADING_IMAGES_SOURCE_BACKUP='+$backup)
      - name: Compile actual Unreal 5.8 game and editor with MoviePlayer rotation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $project='D:\ANOMALIAZ-PRIGIMALIA\unreal\AnomaliaZPrigimalia.uproject'
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          foreach($target in @('AnomaliaZPrigimaliaEditor','AnomaliaZPrigimalia')){
            & $build $target 'Win64' 'Development' "-Project=$project" '-WaitMutex' '-NoHotReloadFromIDE' '-MaxParallelActions=2'
            if($LASTEXITCODE -ne 0){throw ('Native loading module C++ failed: '+$target)}
          }
          Write-Host 'PRIGIMALIA_LOADING_FOUR_IMAGES_NATIVE_BUILD_SUCCESS=true'
      - name: Package independent Windows test game without replacing earlier builds
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $project='D:\ANOMALIAZ-PRIGIMALIA\unreal\AnomaliaZPrigimalia.uproject'
          $archive=Join-Path 'D:\ANOMALIAZ-PRIGIMALIA\PackagedWindows' ('LoadingFourImages-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $archive){throw 'Existing review archive; refuse overwrite'}
          $uat=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          & $uat 'BuildCookRun' "-project=$project" '-noP4' '-platform=Win64' '-clientconfig=Development' '-cook' '-stage' '-pak' '-package' '-archive' "-archivedirectory=$archive" '-unattended' '-utf8output'
          if($LASTEXITCODE -ne 0){throw 'Rotating image Windows packaging failed'}
          $exe=Join-Path $archive 'Windows\AnomaliaZPrigimalia.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'New game EXE missing'}
          Write-Host ('PRIGIMALIA_LOADING_IMAGE_REVIEW_GAME='+$exe)
          $folder=Join-Path $env:LOCALAPPDATA 'AnomaliaZPrigimalia\LoadingScreens'
          $names=@('loading-01.jpg','loading-02.jpg','loading-03.jpg','loading-04.jpg')
          $present=@($names|Where-Object{Test-Path -LiteralPath (Join-Path $folder $_) -PathType Leaf}).Count
          Write-Host ('PRIGIMALIA_USER_ARTWORK_INSTALLED='+$present+'/4')
          if($present -ne 4){Write-Warning 'Original user JPGs not installed yet: user needs to extract the supplied ZIP and run installer on Windows.'}
      - name: Verify original D project and previous verified Windows game
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $before=(Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'loading-original-sha256.txt') -Raw).Trim()
          if((Get-FileHash -LiteralPath 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject' -Algorithm SHA256).Hash -ne $before){throw 'Original ANOMALIA project changed'}
          if(-not(Test-Path -LiteralPath 'D:\ANOMALIAZ-PRIGIMALIA\PackagedWindows\NativeValidated\Windows\AnomaliaZPrigimalia.exe')){throw 'Previous game build missing'}
          Write-Host 'PRIGIMALIA_ORIGINAL_AND_PREVIOUS_GAME_PRESERVED=true'
      - name: Preserve repairable previous native loading/menu code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRIGIMALIA-Four-Loading-Images-Source-Backup
          if-no-files-found: warn
          path: |
            D:/ANOMALIAZ-PRIGIMALIA/unreal/Saved/BrandMigration/LoadingFourImages/run-*/*.cpp
            D:/ANOMALIAZ-PRIGIMALIA/unreal/Saved/BrandMigration/LoadingFourImages/run-*/*.h
            D:/ANOMALIAZ-PRIGIMALIA/unreal/Saved/BrandMigration/LoadingFourImages/run-*/*.cs
