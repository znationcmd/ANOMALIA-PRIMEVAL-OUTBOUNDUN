name: ANOMALIA Tools - Publication Windows automatique
on:
  push:
    branches:
      - feature/anomalia-tools-premium-updates-20261023
    paths:
      - 'apps/anomalia-tools/**'
      - '.github/workflows/anomalia-tools-release.yml'
permissions:
  contents: write
concurrency:
  group: anomalia-tools-release
  cancel-in-progress: false
jobs:
  release:
    name: Valider et publier ANOMALIA Tools
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/anomalia-tools
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
      TAG: anomalia-tools-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund
      - name: Tester les modules et compiler l'interface
        run: |
          npm test
          npm run build
      - name: Construire la version Windows NSIS
        run: npm run package:win
      - name: Contrôler l'installateur et les métadonnées
        id: verify
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $latest='release/latest.yml'
          if (!(Test-Path $latest)) { throw 'Manifeste latest.yml absent' }
          $manifest=Get-Content $latest -Raw
          if ($manifest -notmatch ('(?m)^version:\s*'+[regex]::Escape($version)+'\s*$')) { throw 'Version du manifeste incorrecte' }
          if ($manifest -notmatch '(?m)^\s*sha512:\s*[A-Za-z0-9+/=]{80,}\s*$') { throw 'Empreinte SHA512 absente' }
          $setups=@(Get-ChildItem release -File -Filter '*.exe')
          if ($setups.Count -ne 1 -or $setups[0].Length -lt 10000000) { throw 'Installateur NSIS non valide' }
          $blockmaps=@(Get-ChildItem release -File -Filter '*.blockmap')
          if (!$blockmaps.Count) { throw 'Blockmap NSIS absent' }
          $entry=[regex]::Match($manifest,'(?m)^path:\s*(.+?\.exe)\s*$')
          if (!$entry.Success -or $entry.Groups[1].Value.Trim() -cne $setups[0].Name) { throw 'Installateur du manifeste incorrect' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Vérifier la progression de version officielle
        id: versiongate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version=[version]'${{ steps.verify.outputs.version }}'
          $prior=Join-Path $env:RUNNER_TEMP 'tools-prior'
          New-Item -ItemType Directory -Force -Path $prior | Out-Null
          gh release download $env:TAG -R $env:GITHUB_REPOSITORY --pattern latest.yml --dir $prior 2>$null
          $publish='true'
          if (Test-Path (Join-Path $prior 'latest.yml')) {
            $txt=Get-Content (Join-Path $prior 'latest.yml') -Raw
            $match=[regex]::Match($txt,'(?m)^version:\s*[''"]?(\d+\.\d+\.\d+)')
            if ($match.Success -and [version]$match.Groups[1].Value -ge $version) { $publish='false' }
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
      - name: Publier les binaires puis le manifeste en dernier
        if: steps.versiongate.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          gh release view $env:TAG -R $env:GITHUB_REPOSITORY | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ANOMALIA Tools ${{ steps.verify.outputs.version }}" --notes 'Version Windows de ANOMALIA Tools. Conservation des projets locaux.' --latest=false
            if ($LASTEXITCODE -ne 0) { throw 'Création de la release impossible' }
          }
          $setup=@(Get-ChildItem release -Filter '*.exe' -File | ForEach-Object FullName)
          $block=@(Get-ChildItem release -Filter '*.blockmap' -File | ForEach-Object FullName)
          & gh release upload $env:TAG @setup @block -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Échec de publication Windows' }
          gh release upload $env:TAG (Resolve-Path 'release/latest.yml').Path -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Échec de publication du manifeste' }
          gh release edit $env:TAG -R $env:GITHUB_REPOSITORY --title "ANOMALIA Tools ${{ steps.verify.outputs.version }}" --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Mise à jour du titre impossible' }
