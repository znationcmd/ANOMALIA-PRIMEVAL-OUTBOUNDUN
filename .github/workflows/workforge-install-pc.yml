name: Install tested WorkForge application on ANOMALIA PC
on:
  push:
    branches: [feature/real-skarvik-bmw-dog-gameplay-capture-20261111]
    paths: [.github/workflows/workforge-install-pc.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  install-pc:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 30
    steps:
      - name: Verify successful installer source run
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers=@{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json'}
          $run=Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN/actions/runs/43164456189'
          if($run.conclusion -ne 'success' -or $run.head_sha -ne 'fbd9eb5135033e498e41cac9b55e2d8260162fda'){throw 'Installer source did not pass installed runtime tests'}
      - uses: actions/download-artifact@v4
        with:
          name: ANOMALIAZ-WORKFORGE-WINDOWS-TEST-BUILD
          run-id: 43164456189
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/workforge-tested-installer
      - name: Install tested application on the user PC
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $setups=@(Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'workforge-tested-installer') -Filter '*.exe')
          if($setups.Count -ne 1){throw 'Expected one tested installer'}
          $destination='D:\ANOMALIAZ\Applications\WorkForge-fbd9eb51'
          if(Test-Path -LiteralPath $destination){throw 'Installation destination already exists'}
          $evidence=Join-Path 'D:\ANOMALIAZ\Applications' ('WorkForgeInstall-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $evidence -Force|Out-Null
          $desktop='C:\Users\utilisateur\Desktop'
          if(Test-Path -LiteralPath $desktop){Get-ChildItem -LiteralPath $desktop -Filter '*PRIGIMALIA*.lnk'|Copy-Item -Destination $evidence}
          $process=Start-Process -FilePath $setups[0].FullName -ArgumentList @('/S',('/D='+$destination)) -PassThru
          if(-not $process.WaitForExit(180000)){throw 'Installer timeout; inspect the installer process before retrying'}
          if($process.ExitCode -ne 0){throw ('Installer failed '+$process.ExitCode)}
          $exe=@(Get-ChildItem -LiteralPath $destination -Filter '*.exe'|Where-Object{$_.Name -notmatch 'Uninstall'})
          if($exe.Count -ne 1){throw 'Installed executable missing or ambiguous'}
          if(-not(Test-Path -LiteralPath (Join-Path $destination 'resources\app.asar'))){throw 'Installed app resources missing'}
          @{state='INSTALLED_FROM_RUNTIME_TESTED_BUILD';sourceRun=43164456189;sourceCommit='fbd9eb5135033e498e41cac9b55e2d8260162fda';exe=$exe[0].FullName;sha256=(Get-FileHash -LiteralPath $exe[0].FullName).Hash}|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $evidence 'installation.json')
          Get-Content -LiteralPath (Join-Path $evidence 'installation.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WORKFORGE-PC-INSTALLATION
          path: D:/ANOMALIAZ/Applications/WorkForgeInstall-*/installation.json
          if-no-files-found: warn
