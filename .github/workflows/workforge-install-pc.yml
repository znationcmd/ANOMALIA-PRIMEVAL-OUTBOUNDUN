name: Install tested WorkForge application on ANOMALIA PC
on:
  push:
    branches: [feature/real-skarvik-bmw-dog-gameplay-capture-20261111]
    paths: [.github/workflows/workforge-install-pc.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  install-pc:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 30
    steps:
      - name: Verify successful standalone source run
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers=@{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json'}
          $run=Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN/actions/runs/43166158144'
          if($run.conclusion -ne 'success' -or $run.head_sha -ne '8e12d51ef78e78d4f340d3228d763d9f027ad985'){throw 'Source did not pass installed runtime tests'}
      - uses: actions/download-artifact@v4
        with:
          name: ANOMALIAZ-WORKFORGE-STANDALONE
          run-id: 43166158144
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/workforge-standalone-8e12d51e
      - name: Install standalone app without administrator privileges
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:RUNNER_TEMP 'workforge-standalone-8e12d51e'
          $destination='D:\ANOMALIAZ\Applications\WorkForge-8e12d51e'
          if(Test-Path -LiteralPath $destination){throw 'Installation destination already exists'}
          $evidence=Join-Path 'D:\ANOMALIAZ\Applications' ('WorkForgeInstall-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $evidence -Force|Out-Null
          New-Item -ItemType Directory -Path $destination|Out-Null
          Get-ChildItem -LiteralPath $source -Force|Copy-Item -Destination $destination -Recurse -Force
          $files=@(Get-ChildItem -LiteralPath $source -Recurse -File)
          foreach($file in $files){
            $relative=$file.FullName.Substring($source.Length).TrimStart('\')
            $installed=Join-Path $destination $relative
            if(-not(Test-Path -LiteralPath $installed) -or (Get-FileHash -LiteralPath $file.FullName).Hash -ne (Get-FileHash -LiteralPath $installed).Hash){throw ('Installed file mismatch '+$relative)}
          }
          $exe=@(Get-ChildItem -LiteralPath $destination -Filter '*.exe'|Where-Object{$_.Name -notmatch 'Uninstall'})
          if($exe.Count -ne 1){throw 'Installed executable missing or ambiguous'}
          if(-not(Test-Path -LiteralPath (Join-Path $destination 'resources\app.asar'))){throw 'Installed app resources missing'}
          $updateConfig=Join-Path $destination 'resources\app-update.yml'
          if(Test-Path -LiteralPath $updateConfig){
            Copy-Item -LiteralPath $updateConfig -Destination (Join-Path $evidence 'app-update-before.yml')
            $config=[IO.File]::ReadAllText($updateConfig)
            if($config -match '(?m)^channel:'){$config=[regex]::Replace($config,'(?m)^channel:.*
          if(-not(Test-Path -LiteralPath $desktop)){$desktop=[Environment]::GetFolderPath('Desktop')}
          if(-not(Test-Path -LiteralPath $desktop)){throw 'User desktop not found'}
          $link=Join-Path $desktop "ANOMALIA'Z PRIGIMALIA - APPLICATION PC.lnk"
          if(Test-Path -LiteralPath $link){Copy-Item -LiteralPath $link -Destination (Join-Path $evidence 'previous-shortcut.lnk')}
          $shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut($link)
          $shortcut.TargetPath=$exe[0].FullName
          $shortcut.WorkingDirectory=$destination
          $shortcut.IconLocation=$exe[0].FullName+',0'
          $shortcut.Description='Application PC ANOMALIA Z PRIGIMALIA - WorkForge au menu principal'
          $shortcut.Save()
          if($shell.CreateShortcut($link).TargetPath -ne $exe[0].FullName){throw 'Shortcut target mismatch'}
          @{state='INSTALLED_FROM_RUNTIME_TESTED_BUILD';sourceRun=43166158144;sourceCommit='8e12d51ef78e78d4f340d3228d763d9f027ad985';exe=$exe[0].FullName;shortcut=$link;verifiedFiles=$files.Count;updateChannel='workforge';sha256=(Get-FileHash -LiteralPath $exe[0].FullName).Hash}|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $evidence 'installation.json')
          Get-Content -LiteralPath (Join-Path $evidence 'installation.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WORKFORGE-PC-INSTALLATION
          path: D:/ANOMALIAZ/Applications/WorkForgeInstall-*/installation.json
          if-no-files-found: warn
,'channel: workforge')}else{$config+=[Environment]::NewLine+'channel: workforge'+[Environment]::NewLine}
            [IO.File]::WriteAllText($updateConfig,$config,[Text.UTF8Encoding]::new($false))
          }
          $desktop='C:\Users\utilisateur\Desktop'
          if(-not(Test-Path -LiteralPath $desktop)){$desktop=[Environment]::GetFolderPath('Desktop')}
          if(-not(Test-Path -LiteralPath $desktop)){throw 'User desktop not found'}
          $link=Join-Path $desktop "ANOMALIA'Z PRIGIMALIA - APPLICATION PC.lnk"
          if(Test-Path -LiteralPath $link){Copy-Item -LiteralPath $link -Destination (Join-Path $evidence 'previous-shortcut.lnk')}
          $shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut($link)
          $shortcut.TargetPath=$exe[0].FullName
          $shortcut.WorkingDirectory=$destination
          $shortcut.IconLocation=$exe[0].FullName+',0'
          $shortcut.Description='Application PC ANOMALIA Z PRIGIMALIA - WorkForge au menu principal'
          $shortcut.Save()
          if($shell.CreateShortcut($link).TargetPath -ne $exe[0].FullName){throw 'Shortcut target mismatch'}
          @{state='INSTALLED_FROM_RUNTIME_TESTED_BUILD';sourceRun=43166158144;sourceCommit='8e12d51ef78e78d4f340d3228d763d9f027ad985';exe=$exe[0].FullName;shortcut=$link;verifiedFiles=$files.Count;sha256=(Get-FileHash -LiteralPath $exe[0].FullName).Hash}|ConvertTo-Json|Set-Content -LiteralPath (Join-Path $evidence 'installation.json')
          Get-Content -LiteralPath (Join-Path $evidence 'installation.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WORKFORGE-PC-INSTALLATION
          path: D:/ANOMALIAZ/Applications/WorkForgeInstall-*/installation.json
          if-no-files-found: warn
