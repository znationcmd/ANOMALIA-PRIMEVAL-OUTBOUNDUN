name: Audit live ANOMALIA startup, map, menu, and building assets
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-menu-building-inventory.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 10
    steps:
      - name: Read startup, menu, and map asset names without opening Unreal
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected runner'}
          if(@(Get-Process UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Existing Unreal/game session preserved; audit skipped'}
          $root='D:\ANOMALIA\unreal'; $content=Join-Path $root 'Content'; $source=Join-Path $root 'Source\AnomaliaPrimeval'
          Write-Output '===== STARTUP CONFIG ====='
          Select-String -Path (Join-Path $root 'Config\DefaultEngine.ini') -Pattern 'GameDefaultMap|EditorStartupMap|GameInstance|GameMode|GameViewport' | ForEach-Object {$_.Line}
          foreach($folder in @('Maps','UI','Cinematics','Anomalia\Branding','City','Building','Anomalia\VisualValidation_v1','Anomalia\ResidentialPhotogrammetryReview_v1')){
            $f=Join-Path $content $folder
            Write-Output ('===== '+$folder+' =====')
            if(Test-Path $f){Get-ChildItem $f -File -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.Extension -in '.umap','.uasset','.mp4','.mov','.wav','.png','.jpg'} | Select-Object -First 160 -ExpandProperty FullName}
            else{Write-Output 'MISSING'}
          }
          Write-Output '===== UI/INTRO SOURCE HOOKS ====='
          Get-ChildItem $source -File -Include *.h,*.cpp | Select-String -Pattern 'MainMenu|Menu|Credits|Cinematic|MoviePlayer|GameInstance|Intro|Startup' -Context 0,1 | ForEach-Object {$_.Path+':'+$_.LineNumber+' '+$_.Line}
          Write-Output '===== PACKAGED EXECUTABLE ====='
          $exe=Join-Path $root 'Binaries\Win64\AnomaliaPrimeval.exe'; Write-Output ($exe+' EXISTS='+(Test-Path $exe))
