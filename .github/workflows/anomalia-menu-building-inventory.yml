name: Audit live ANOMALIA startup, map, menu, and building assets
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-menu-building-inventory.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 10
    steps:
      - name: List City Sample playable levels and title assets
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected runner'}
          if(@(Get-Process UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Existing Unreal/game session preserved; audit skipped'}
          $content='D:\ANOMALIA\unreal\Content'; $source='D:\ANOMALIA\unreal\Source\AnomaliaPrimeval'
          foreach($folder in @('Maps','City','City\Big_City','City\Small_City','Cinematics','UI\Blueprints','Anomalia\Branding')){
            $path=Join-Path $content $folder; Write-Output ('===== '+$folder+' =====')
            if(Test-Path $path){Get-ChildItem $path -Recurse -File -ErrorAction SilentlyContinue | Where-Object {
              $_.Extension -eq '.umap' -or ($folder -in @('Cinematics','UI\Blueprints','Anomalia\Branding') -and $_.Extension -eq '.uasset' -and $_.Name -match 'Menu|Intro|Credit|Title|Sandbox|Main|WBP|Brand')
            } | ForEach-Object {$_.FullName}}
            else{Write-Output 'MISSING'}
          }
          Write-Output '===== MENU SOURCE HOOKS ====='
          Get-ChildItem $source -Recurse -File | Where-Object {$_.Extension -in '.h','.cpp'} | Select-String -Pattern 'MainMenu|MoviePlayer|LevelSequence|SandboxIntro|Credits|CreateWidget' | ForEach-Object {$_.Path+':'+$_.LineNumber+' '+$_.Line}
          Write-Output '===== DEFAULT MAP ====='
          Select-String -Path 'D:\ANOMALIA\unreal\Config\DefaultEngine.ini' -Pattern 'GameDefaultMap|EditorStartupMap|GlobalDefaultGameMode' | ForEach-Object {$_.Line}
