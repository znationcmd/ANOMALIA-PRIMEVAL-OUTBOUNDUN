          let blocked=null,done=false;function abort(reason){if(done||blocked)return;blocked=reason;child.kill();}
          const monitor=setInterval(()=>{const s=fs.statfsSync('C:\\');if(s.bavail*s.bsize<6*1024**3)abort('Disk reserve reached');if(os.freemem()<1024**3)abort('Physical memory reserve reached');},2000);
          const timer=setTimeout(()=>abort('Dog PIE exceeded 240 seconds'),240000);
          const result=await new Promise(resolve=>{child.once('error',e=>resolve({exit:null,error:e.message}));child.once('close',(exit,signal)=>resolve({exit,error:blocked||signal}));});done=true;clearTimeout(timer);clearInterval(monitor);stream.end();
          fs.writeFileSync(path.join(dir,'process-result.json'),JSON.stringify(result,null,2));
          const file=path.join(dir,'result/report.json');if(fs.existsSync(file))console.log(fs.readFileSync(file,'utf8'));console.log('DOG_PIE_PROCESS '+JSON.stringify(result));
          if(result.exit!==0||!fs.existsSync(file)||JSON.parse(fs.readFileSync(file,'utf8')).state!=='NATIVE_DOG_AND_ATTACHMENTS_PIE_PASSED_NOT_MULTIPLAYER_ACCEPTANCE')throw Error('Dog runtime validation failed');
          const report=JSON.parse(fs.readFileSync(file,'utf8'));
          const desktop=path.join(process.env.USERPROFILE,'Desktop'),launcher=path.join(desktop,'ANOMALIA_Test_Dog_'+process.env.GITHUB_RUN_ID+'.cmd');
          const command='@echo off\r\n"'+path.join(engine,'Engine/Binaries/Win64/UnrealEditor.exe')+'" "'+project+'" "'+report.map+'?AnomaliaServerId='+report.scope+'" -game -windowed -ResX=1280 -ResY=720\r\n';
          if(fs.existsSync(launcher))throw Error('Existing launcher preserved');fs.writeFileSync(launcher,command,{flag:'wx'});fs.writeFileSync(path.join(dir,'launcher.json'),JSON.stringify({path:launcher,map:report.map,scope:report.scope,sha256:crypto.createHash('sha256').update(fs.readFileSync(launcher)).digest('hex'),launched:false},null,2));console.log('DOG_TEST_LAUNCHER '+launcher);
          })().catch(e=>{console.error(e.message);process.exit(1);});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dog-real-pie-evidence
          path: ${{ env.DOG_PIE_OUTPUT }}
          if-no-files-found: warn
