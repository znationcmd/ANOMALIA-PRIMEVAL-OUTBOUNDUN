MALIA|Chaos|Panels\") TArray<FAnomaliaRoadPanelDefinition> AdditionalPanelDefinitions;\n    UPROPERTY(VisibleAnywhere,BlueprintReadOnly,Category=\"ANOMALIA|Chaos|Panels\") TArray<TObjectPtr<UAnomaliaVehiclePanelComponent>> AdditionalPanels;\n    /** Optional individually modelled wheels, paired with authored chassis-space hubs. */\n    UPROPERTY(EditAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos\") TArray<TObjectPtr<UStaticMesh>> RoadWheelMeshes;\n    UPROPERTY(EditAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos\") TArray<FVector> RoadWheelHubTargetsCm;\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos\") TObjectPtr<UStaticMeshComponent> RoadGlass;\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos\") TArray<TObjectPtr<UStaticMeshComponent>> RoadWheels;\n    /** Front left, front right, rear left, rear right. Names come from the actual rig. */\n    UPROPERTY(EditAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos\")\n    TArray<FName> WheelBones;\n    UPROPERTY(EditAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos\", meta=(ClampMin=\"10\",ClampMax=\"100\"))\n    float WheelRadiusCm=40.f;\n\n    virtual UPawnMovementComponent* GetMovementComponent() const override;\n    virtual bool ConfigureVehicle(FName NewVehicleId) override;\n    virtual void OnConstruction(const FTransform& Transform) override;\n    virtual void Tick(float DeltaSeconds) override;\n    virtual void SetupPlayerInputComponent(UInputComponent* PlayerInputComponent) override;\n    virtual void GetLifetimeReplicatedProps(TArray<FLifetimeProperty>& OutLifetimeProps) const override;\n    /** Starts stopped. Only the current server-validated driver may change ignition. */\n    UPROPERTY(ReplicatedUsing=OnRep_EngineRunning, VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos|Engine\")\n    bool bEngineRunning=false;\n    bool SetEngineRunningOnServer(AController* Driver, bool bRunning);\n    bool ExecuteRoadActionOnServer(AController* Driver, EAnomaliaRoadAction Action);\n    UPROPERTY(ReplicatedUsing=OnRep_RoadControls, VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos|Controls\") bool bManualGears=false;\n    UPROPERTY(ReplicatedUsing=OnRep_RoadControls, VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos|Controls\") bool bHandbrakeHeld=false;\n    UPROPERTY(ReplicatedUsing=OnRep_RoadControls, VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos|Lights\") bool bHeadlightsOn=false;\n    /** 0 off, 1 left, 2 right, 3 hazards. Server owns this state. */\n    UPROPERTY(ReplicatedUsing=OnRep_RoadControls, VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos|Lights\") uint8 IndicatorMode=0;\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos|Lights\") TArray<TObjectPtr<USpotLightComponent>> Headlights;\n    UPROPERTY(VisibleAnywhere, BlueprintReadOnly, Category=\"ANOMALIA|Chaos|Lights\") TArray<TObjectPtr<UPointLightComponent>> IndicatorLights;\n    UFUNCTION(BlueprintImplementableEvent, Category=\"ANOMALIA|Chaos|Engine\")\n    void OnEngineRunningChanged(bool bRunning);\n    UFUNCTION(BlueprintPure, Category=\"ANOMALIA|Chaos\") bool AreWheelVisualsUpright() const;\n    UFUNCTION(BlueprintPure, Category=\"ANOMALIA|Chaos\")\n    bool HasValidRoadRig() const;\n    UFUNCTION(BlueprintPure, Category=\"ANOMALIA|Chaos\")\n    bool IsChaosDriveReady() const;\n    /** Authored dry chassis mass, independent of the current cargo load. */\n    UFUNCTION(BlueprintPure, Category=\"ANOMALIA|Vehicle|Cargo\")\n    float GetUnladenMassKg() const;\nprotected:\n    virtual void BeginPlay() override;\n    virtual bool UsesPhysicsRoadSimulation() const override { return true; }\n    virtual bool IsEngineProvidingPower() const override { return bEngineRunning; }\n    virtual bool IsDriveReady() const override;\n    virtual bool CanDriverExitNow() const override;\n    virtual FVector GetDriverExitVelocity() const override;\n    virtual float GetExpectedSupportFloorZ() const override;\n    virtual void SimulateRoadDrive(float DeltaSeconds,float Throttle,float Steering,float Brake,\n        bool bPowered,bool bDriverMissing) override;\nprivate:\n    void InputIgnition();\n    UFUNCTION(Server, Reliable) void ServerToggleIgnition();\n    UFUNCTION() void OnRep_EngineRunning();\n    void SetEngineState(bool bRunning);\n    UFUNCTION(Server, Reliable) void ServerRoadAction(EAnomaliaRoadAction Action);\n    UFUNCTION() void OnRep_RoadControls();\n    void SendRoadAction(EAnomaliaRoadAction Action);\n    void InputGearUp(); void InputGearDown(); void InputGearMode();\n    void InputHandbrakeOn(); void InputHandbrakeOff(); void InputHeadlights();\n    void InputIndicatorLeft(); void InputIndicatorRight(); void InputHazardLights();\n    void InputDriverDoor();\n    void UpdateRoadLights();\n    /** Per-instance chassis collision; never modifies a shared source Physics Asset. */\n    UPROPERTY(Transient) TObjectPtr<UPhysicsAsset> RuntimeChassisPhysics;\n    FTransform ReferenceBoneTransform(FName Bone) const;\n    void UpdateWheelVisuals();\n    void ApplyRoadRig();\n    UFUNCTION() void UpdateCargoPhysicalMass();\n    float LastCargoMassKg=-1.f;\n    float UnladenMassKg=-1.f;\n};\n","before":"e659eb665ffc32a2039454369166d799c2790477"},{"path":"unreal/Source/AnomaliaPrimeval/Vehicles/AnomaliaChaosRoadVehicle.cpp","content":"#include \"AnomaliaChaosRoadVehicle.h\"\n#include \"AnomaliaVehicleSurvival.h\"\n#include \"../AnomaliaInventoryComponent.h\"\n#include \"../AnomaliaSurvivor.h\"\n#include \"AnomaliaTransportMovement.h\"\n#include \"AnomaliaVehiclePanelComponent.h\"\n#include \"ChaosWheeledVehicleMovementComponent.h\"\n#include \"VehicleAnimationInstance.h\"\n#include \"Components/SkeletalMeshComponent.h\"\n#include \"Components/SphereComponent.h\"\n#include \"Components/StaticMeshComponent.h\"\n#include \"Engine/SkeletalMesh.h\"\n#include \"Engine/StaticMesh.h\"\n#include \"PhysicsEngine/PhysicsAsset.h\"\n#include \"PhysicsEngine/SkeletalBodySetup.h\"\n#include \"PhysicsEngine/AggregateGeom.h\"\n#include \"Engine/World.h\"\n#include \"CollisionQueryParams.h\"\n#include \"GameFramework/FloatingPawnMovement.h\"\n#include \"Components/InputComponent.h\"\n#include \"GameFramework/Controller.h\"\n#include \"Net/UnrealNetwork.h\"\n#include \"Components/SpotLightComponent.h\"\n#include \"Components/PointLightComponent.h\"\n#include \"GameFramework/GameStateBase.h\"\n\nUAnomaliaRoadFrontWheel::UAnomaliaRoadFrontWheel()\n{\n    WheelRadius=40.f; WheelWidth=23.3f; WheelMass=20.f;\n    bAffectedBySteering=true; bAffectedByEngine=false; bAffectedByBrake=true;\n    bAffectedByHandbrake=false; MaxSteerAngle=35.f;\n    // Use the native suspension ray: the prior sphere sweep reported contact\n    // with almost zero spring load at full droop, masking tire-load coupling.\n    SweepShape=ESweepShape::Raycast;\n    bABSEnabled=true;\n    // UE 5.8.3 converts this property by 100: native stiffness is 45000.\n    // Measured on both actual rigs; setting the property to 45000 was unstable.\n    SpringRate=450.f; SpringPreload=50.f;\n    SuspensionDampingRatio=.6f; SuspensionMaxRaise=12.f; SuspensionMaxDrop=10.f;\n    RollbarScaling=.15f; FrictionForceMultiplier=1.f;\n    WheelLoadRatio=1.f; bTractionControlEnabled=false;\n    MaxBrakeTorque=1800.f; MaxHandBrakeTorque=0.f;\n}\n\nUAnomaliaRoadRearWheel::UAnomaliaRoadRearWheel()\n{\n    bAffectedBySteering=false; MaxSteerAngle=0.f; bAffectedByHandbrake=true;\n    bAffectedByEngine=true; MaxBrakeTorque=1000.f; MaxHandBrakeTorque=2200.f;\n}\n\nAAnomaliaChaosRoadVehicle::AAnomaliaChaosRoadVehicle()\n{\n    SurvivalSystems=CreateDefaultSubobject<UAnomaliaVehicleSurvivalComponent>(TEXT(\"VehicleSurvival\"));\n    CargoInventory=CreateDefaultSubobject<UAnomaliaInventoryComponent>(TEXT(\"VehicleCargo\"));\n    CargoInventory->Compartments.Reset();FAnomaliaInventoryCompartment CargoBox;\n    CargoBox.Id=TEXT(\"cargo\");CargoBox.Width=20;CargoBox.Height=50;CargoInventory->Compartments.Add(CargoBox);\n    CargoInventory->WeightCapacityKg=100.f;\n    Chassis=CreateDefaultSubobject<USkeletalMeshComponent>(TEXT(\"ChaosChassis\"));\n    SetRootComponent(Chassis);\n    DriverDoor=CreateDefaultSubobject<UAnomaliaVehiclePanelComponent>(TEXT(\"DriverDoor\"));DriverDoor->SetupAttachment(Chassis);\n    const TCHAR* PanelNames[]={TEXT(\"RoadPanel1\"),TEXT(\"RoadPanel2\"),TEXT(\"RoadPanel3\"),TEXT(\"RoadPanel4\"),TEXT(\"RoadPanel5\")};\n    for(const TCHAR* Name:PanelNames)\n    {\n        auto* Panel=CreateDefaultSubobject<UAnomaliaVehiclePanelComponent>(FName(Name));\n        Panel->SetupAttachment(Chassis);AdditionalPanels.Add(Panel);\n    }\n    Collision->SetupAttachment(Chassis);\n    Collision->SetCollisionEnabled(ECollisionEnabled::NoCollision);\n    Body->SetVisibility(false); Body->SetHiddenInGame(true);\n    RoadGlass=CreateDefaultSubobject<UStaticMeshComponent>(TEXT(\"RoadGlass\"));RoadGlass->SetupAttachment(Chassis);\n    RoadGlass->SetCollisionEnabled(ECollisionEnabled::NoCollision);\n    const TCHAR* WheelNames[]={TEXT(\"RoadWheelFL\"),TEXT(\"RoadWheelFR\"),TEXT(\"RoadWheelRL\"),TEXT(\"RoadWheelRR\")};\n    for(int32 Index=0;Index<4;++Index)\n    {\n        auto* Wheel=CreateDefaultSubobject<UStaticMeshComponent>(FName(WheelNames[Index]));\n        Wheel->SetupAttachment(Chassis);Wheel->SetCollisionEnabled(ECollisionEnabled::NoCollision);RoadWheels.Add(Wheel);\n    }\n    Chassis->SetCollisionProfileName(TEXT(\"Vehicle\"));\n    for(int32 Index=0;Index<2;++Index)\n    {\n        auto* Light=CreateDefaultSubobject<USpotLightComponent>(Index==0?TEXT(\"HeadlightLeft\"):TEXT(\"HeadlightRight\"));\n        Light->SetupAttachment(Chassis);Light->SetRelativeLocation(FVector(230,Index==0?-72:72,65));\n        Light->SetRelativeRotation(FRotator(-4,0,0));Light->SetIntensity(50000.f);\n        Light->SetAttenuationRadius(6000.f);Light->SetInnerConeAngle(18);Light->SetOuterConeAngle(38);\n        Light->SetVisibility(false);Headlights.Add(Light);\n    }\n    const TCHAR* Signals[]={TEXT(\"FrontLeftSignal\"),TEXT(\"FrontRightSignal\"),TEXT(\"RearLeftSignal\"),TEXT(\"RearRightSignal\")};\n    for(int32 Index=0;Index<4;++Index)\n    {\n        auto* Light=CreateDefaultSubobject<UPointLightComponent>(Signals[Index]);Light->SetupAttachment(Chassis);\n        Light->SetRelativeLocation(FVector(Index<2?233:-233,Index%2==0?-85:85,65));\n        Light->SetLightColor(FLinearColor(1.f,.25f,.015f));Light->SetIntensity(300.f);\n        Light->SetAttenuationRadius(100.f);Light->SetCastShadows(false);Light->SetVisibility(false);IndicatorLights.Add(Light);\n    }\n    Chassis->SetSimulatePhysics(false); // A validated Physics Asset must exist first.\n    Chassis->SetIsReplicated(true);\n    Movement->SetAutoActivate(false); Movement->PrimaryComponentTick.bStartWithTickEnabled=false;\n    Movement->SetUpdatedComponent(nullptr);\n    TransportMovement->SetAutoActivate(false); TransportMovement->PrimaryComponentTick.bStartWithTickEnabled=false;\n    ChaosMovement=CreateDefaultSubobject<UChaosWheeledVehicleMovementComponent>(TEXT(\"ChaosRoadMovement\"));\n    ChaosMovement->SetUpdatedComponent(Chassis);\n    ChaosMovement->SetIsReplicated(true);\n    // Server feeds every input through the existing validated driver flow.\n    // Driverless physics must still receive its parking brake after unpossession.\n    ChaosMovement->SetRequiresControllerForInputs(false);\n    // Animated leaves are queries for characters, never suspension support.\n    // Keep dynamic road surfaces enabled; exclude only the dedicated panel type.\n    ChaosMovement->SetWheelTraceResponseToChannel(ECC_GameTraceChannel1,ECR_Ignore);\n    ChaosMovement->Mass=1500.f;\n    ChaosMovement->bReverseAsBrake=false;\n    ChaosMovement->DragCoefficient=.3f;\n    ChaosMovement->ChassisWidth=182.f; ChaosMovement->ChassisHeight=145.f;\n    ChaosMovement->DownforceCoefficient=0.f; // Road sedan, no artificial aero grip.\n    ChaosMovement->EngineSetup.MaxTorque=320.f;\n    ChaosMovement->EngineSetup.MaxRPM=6500.f;\n    ChaosMovement->EngineSetup.EngineIdleRPM=800.f;\n    auto* Torque=ChaosMovement->EngineSetup.TorqueCurve.GetRichCurve();\n    Torque->AddKey(0.f,.2f); Torque->AddKey(1000.f,.55f); Torque->AddKey(2500.f,.9f);\n    Torque->AddKey(4000.f,1.f); Torque->AddKey(6000.f,.75f); Torque->AddKey(6500.f,.65f);\n    auto& Gears=ChaosMovement->TransmissionSetup;\n    Gears.bUseAutomaticGears=true; Gears.bUseAutoReverse=false;\n    Gears.ForwardGearRatios={3.5f,2.2f,1.5f,1.f,.8f}; Gears.ReverseGearRatios={3.3f};\n    Gears.FinalRatio=3.5f; Gears.ChangeUpRPM=4500.f; Gears.ChangeDownRPM=1800.f;\n    Gears.GearChangeTime=.25f; Gears.TransmissionEfficiency=.94f;\n    ChaosMovement->DifferentialSetup.DifferentialType=EVehicleDifferential::RearWheelDrive;\n    ChaosMovement->SteeringSetup.SteeringType=ESteeringType::Ackermann;\n    auto* SteeringCurve=ChaosMovement->SteeringSetup.SteeringCurve.GetRichCurve();\n    SteeringCurve->Reset(); // Chaos's steering curve speed axis is MPH.\n    SteeringCurve->AddKey(0.f,1.f); SteeringCurve->AddKey(30.f,.7f);\n    SteeringCurve->AddKey(60.f,.4f); SteeringCurve->AddKey(100.f,.25f);\n}\n\nbool AAnomaliaChaosRoadVehicle::HasValidRoadRig() const\n{\n    if(!RoadMesh || !RoadMesh->GetPhysicsAsset() || !RoadBodyMesh || !RoadWheelMesh || !RoadAnimation ||\n       !RoadAnimation->IsChildOf(UVehicleAnimationInstance::StaticClass()) || WheelBones.Num()!=4 ||\n       !FMath::IsFinite(WheelRadiusCm) || WheelRadiusCm<10.f || WheelRadiusCm>100.f) return false;\n    if(AdditionalPanelDefinitions.Num()>AdditionalPanels.Num())return false;\n    TSet<FName> PanelIds;PanelIds.Add(TEXT(\"driver_door\"));\n    for(const auto& Panel:AdditionalPanelDefinitions)\n    {\n        if(!Panel.Mesh || Panel.PanelId.IsNone() || PanelIds.Contains(Panel.PanelId) ||\n           Panel.PivotCm.ContainsNaN() || Panel.PivotCm.GetAbsMax()>1000.f ||\n           Panel.HingeAxis.ContainsNaN() || Panel.HingeAxis.SizeSquared()<SMALL_NUMBER ||\n           !FMath::IsFinite(Panel.OpenAngleDegrees) || FMath::Abs(Panel.OpenAngleDegrees)>170.f)return false;\n        PanelIds.Add(Panel.PanelId);\n    }\n    TSet<FName> Unique;\n    if(RoadWheelMeshes.Num()!=0 || RoadWheelHubTargetsCm.Num()!=0)\n    {\n        if(RoadWheelMeshes.Num()!=4 || RoadWheelHubTargetsCm.Num()!=4)return false;\n        for(int32 Index=0;Index<4;++Index)\n            if(!RoadWheelMeshes[Index] || RoadWheelHubTargetsCm[Index].ContainsNaN() ||\n               RoadWheelHubTargetsCm[Index].GetAbsMax()>1000.f)return false;\n    }\n    for(const FName Bone:WheelBones)\n    {\n        if(Bone.IsNone() || Unique.Contains(Bone) || RoadMesh->GetRefSkeleton().FindBoneIndex(Bone)==INDEX_NONE) return false;\n        Unique.Add(Bone);\n    }\n    return true;\n}\n\nFTransform AAnomaliaChaosRoadVehicle::ReferenceBoneTransform(FName Bone) const\n{\n    const FReferenceSkeleton& Skeleton=RoadMesh->GetRefSkeleton();\n    int32 Index=Skeleton.FindBoneIndex(Bone);\n    FTransform Result=FTransform::Identity;\n    while(Index!=INDEX_NONE)\n    {\n        Result=Result*Skeleton.GetRefBonePose()[Index];\n        Index=Skeleton.GetParentIndex(Index);\n    }\n    return Result;\n}\n\nvoid AAnomaliaChaosRoadVehicle::ApplyRoadRig()\n{\n    Movement->SetComponentTickEnabled(false); Movement->SetUpdatedComponent(nullptr);\n    TransportMovement->SetComponentTickEnabled(false);\n    Collision->SetCollisionEnabled(ECollisionEnabled::NoCollision);\n    Body->SetVisibility(false); Body->SetHiddenInGame(true);\n    Chassis->SetSkeletalMesh(RoadMesh);\n    Chassis->SetAnimInstanceClass(RoadAnimation);\n    const bool bAuthoredWheels=RoadWheelMeshes.Num()==4 && RoadWheelHubTargetsCm.Num()==4;\n    // Modular original art follows a real animated skeleton, with its vendor\n    // suspension geometry hidden. Hidden bones must continue to refresh.\n    Chassis->SetVisibility(!bAuthoredWheels,false);\n    Chassis->VisibilityBasedAnimTickOption=EVisibilityBasedAnimTickOption::AlwaysTickPoseAndRefreshBones;\n    Body->SetStaticMesh(RoadBodyMesh);Body->SetRelativeTransform(FTransform::Identity);\n    Body->SetVisibility(RoadBodyMesh!=nullptr);Body->SetHiddenInGame(RoadBodyMesh==nullptr);\n    RoadGlass->SetStaticMesh(RoadGlassMesh);RoadGlass->SetVisibility(RoadGlassMesh!=nullptr);\n    DriverDoor->SetStaticMesh(DriverDoorMesh);DriverDoor->SetRelativeLocation(DriverDoorPivotCm);\n    DriverDoor->SetVisibility(DriverDoorMesh!=nullptr);DriverDoor->SetHiddenInGame(DriverDoorMesh==nullptr);\n    // Kinematic leaves block character sweeps and interaction traces, but are\n    // not separate rigid solver bodies coupled to the simulated chassis.\n    DriverDoor->SetCollisionEnabled(DriverDoorMesh?ECollisionEnabled::QueryOnly:ECollisionEnabled::NoCollision);\n    TSet<FName> PanelIds;PanelIds.Add(DriverDoor->PanelId);\n    for(int32 Index=0;Index<AdditionalPanels.Num();++Index)\n    {\n        auto* Panel=AdditionalPanels[Index].Get();\n        const auto* Definition=AdditionalPanelDefinitions.IsValidIndex(Index)?&AdditionalPanelDefinitions[Index]:nullptr;\n        const bool bValid=Definition && Definition->Mesh && !Definition->PanelId.IsNone() &&\n            !PanelIds.Contains(Definition->PanelId) && !Definition->HingeAxis.ContainsNaN() &&\n            Definition->HingeAxis.SizeSquared()>SMALL_NUMBER && !Definition->PivotCm.ContainsNaN() &&\n            FMath::IsFinite(Definition->OpenAngleDegrees) && FMath::Abs(Definition->OpenAngleDegrees)<=170.f;\n        Panel->SetStaticMesh(bValid?Definition->Mesh:nullptr);\n        Panel->SetVisibility(bValid);Panel->SetHiddenInGame(!bValid);\n        Panel->SetCollisionEnabled(bValid?ECollisionEnabled::QueryOnly:ECollisionEnabled::NoCollision);\n        if(bValid)\n        {\n            PanelIds.Add(Definition->PanelId);Panel->PanelId=Definition->PanelId;\n            Panel->SetRelativeLocation(Definition->PivotCm);Panel->LocalHingeAxis=Definition->HingeAxis.GetSafeNormal();\n            Panel->OpenAngleDegrees=Definition->OpenAngleDegrees;\n        }\n    }\n    for(int32 Index=0;Index<RoadWheels.Num();++Index)\n    {\n        RoadWheels[Index]->SetStaticMesh(bAuthoredWheels?RoadWheelMeshes[Index]:RoadWheelMesh);\n        if(WheelBones.IsValidIndex(Index))\n        {\n            // Static wheel art has its own axle convention. Do not inherit the\n            // rig bone's bind rotation: that laid the reference tires on their sides.\n            RoadWheels[Index]->AttachToComponent(Chassis,FAttachmentTransformRules::SnapToTargetNotIncludingScale);\n        }\n    }\n    ChaosMovement->WheelSetups.Reset();\n    if(!HasValidRoadRig()) { Chassis->SetSimulatePhysics(false); return; }\n    for(int32 Index=0;Index<4;++Index)\n    {\n        FChaosWheelSetup Setup;\n        Setup.BoneName=WheelBones[Index];\n        if(bAuthoredWheels)\n            Setup.AdditionalOffset=RoadWheelHubTargetsCm[Index]-ReferenceBoneTransform(WheelBones[Index]).GetTranslation();\n        Setup.WheelClass=Index<2?UAnomaliaRoadFrontWheel::StaticClass():UAnomaliaRoadRearWheel::StaticClass();\n        ChaosMovement->WheelSetups.Add(Setup);\n    }\n    ChaosMovement->SetUpdatedComponent(Chassis);\n    if(GetWorld() && GetWorld()->IsGameWorld())\n    {\n        // A road chassis is one rigid body, not the template's articulated\n        // suspension ragdoll. Override this component only; keep shared art intact.\n        const FName RootBone=RoadMesh->GetRefSkeleton().GetBoneName(0);\n        RuntimeChassisPhysics=NewObject<UPhysicsAsset>(this,NAME_None,RF_Transient);\n        USkeletalBodySetup* ChassisBody=NewObject<USkeletalBodySetup>(RuntimeChassisPhysics);\n        ChassisBody->BoneName=RootBone;\n        ChassisBody->PhysicsType=PhysType_Simulated;\n        FBox ClosedArtBox=RoadBodyMesh->GetBounds().GetBox();\n        if(DriverDoorMesh)ClosedArtBox+=DriverDoorMesh->GetBounds().GetBox().ShiftBy(DriverDoorPivotCm);\n        for(const auto& Panel:AdditionalPanels)if(Panel && Panel->GetStaticMesh())\n            ClosedArtBox+=Panel->GetStaticMesh()->GetBounds().GetBox().ShiftBy(Panel->GetRelativeLocation());\n        const FBoxSphereBounds ArtBounds(ClosedArtBox);\n        FKBoxElem Shape;\n        Shape.X=FMath::Clamp(float(ArtBounds.BoxExtent.X)*1.5f,100.f,1000.f);\n        Shape.Y=FMath::Clamp(float(ArtBounds.BoxExtent.Y)*1.5f,60.f,400.f);\n        Shape.Z=FMath::Clamp(float(ArtBounds.BoxExtent.Z),20.f,60.f);\n        // Keep the underside above the contact patch; wheels carry the vehicle.\n        const FTransform RootBind=ReferenceBoneTransform(RootBone);\n        // Art bounds are component-space; a Physics Asset shape is bone-space.\n        // Cancel the actual root bind rotation instead of assuming identity.\n        Shape.Center=RootBind.InverseTransformPosition(FVector(ArtBounds.Origin.X,ArtBounds.Origin.Y,WheelRadiusCm*.5f+Shape.Z*.5f));\n        Shape.Rotation=RootBind.InverseTransformRotation(FQuat::Identity).Rotator();\n        ChassisBody->AggGeom.BoxElems.Add(Shape);\n        RuntimeChassisPhysics->SkeletalBodySetups.Add(ChassisBody);\n        RuntimeChassisPhysics->BoundsBodies.Add(0);\n        RuntimeChassisPhysics->BodySetupIndexMap.Add(RootBone,0);\n        // Chaos re-applies its Mass property whenever body mass is recalculated.\n        // Keep that source of truth in sync, preserving the authored dry mass\n        // across physics-state recreation and repeated inventory notifications.\n        if (UnladenMassKg < 0.f) UnladenMassKg = ChaosMovement->Mass;\n        const float InitialCargo = CargoInventory->GetCurrentWeightKg();\n        ChaosMovement->Mass = UnladenMassKg +\n            (FMath::IsFinite(InitialCargo) && InitialCargo >= 0.f ? InitialCargo : 0.f);\n        LastCargoMassKg = -1.f;\n        Chassis->SetPhysicsAsset(RuntimeChassisPhysics,true);\n        Chassis->SetSimulatePhysics(HasAuthority());\n        Chassis->SetMassOverrideInKg(RootBone,ChaosMovement->Mass,true);\n        ChaosMovement->SetComponentTickEnabled(HasAuthority());\n        ChaosMovement->RecreatePhysicsState();\n        for(int32 Index=0;Index<ChaosMovement->Wheels.Num();++Index)\n            ChaosMovement->SetWheelRadius(Index,WheelRadiusCm);\n        // This pawn deliberately preserves ANOMALIA's existing crew/fuel base.\n        // Bind the vehicle animation interface explicitly instead of relying on a template pawn cast.\n        if(auto* Animation=Cast<UVehicleAnimationInstance>(Chassis->GetAnimInstance()))\n            Animation->SetWheeledVehicleComponent(ChaosMovement);\n    }\n    UpdateWheelVisuals();\n    UpdateRoadLights();\n}\n\nnamespace\n{\n    FVector TireAxle(const UStaticMesh* Mesh)\n    {\n        const FVector Extent=Mesh->GetBounds().BoxExtent;\n        if(Extent.X<Extent.Y && Extent.X<Extent.Z)return FVector::ForwardVector;\n        if(Extent.Z<Extent.Y && Extent.Z<Extent.X)return FVector::UpVector;\n        return FVector::RightVector;\n    }\n}\n\nvoid AAnomaliaChaosRoadVehicle::UpdateWheelVisuals()\n{\n    if(!HasValidRoadRig())return;\n    const bool bAuthored=RoadWheelHubTargetsCm.Num()==4;\n    for(int32 Index=0;Index<RoadWheels.Num();++Index)\n    {\n        UStaticMeshComponent* Visual=RoadWheels[Index];\n        if(!Visual || !Visual->GetStaticMesh())continue;\n        auto* Wheel=ChaosMovement->Wheels.IsValidIndex(Index)?ChaosMovement->Wheels[Index].Get():nullptr;\n        FVector Hub=bAuthored?RoadWheelHubTargetsCm[Index]:ReferenceBoneTransform(WheelBones[Index]).GetTranslation();\n        if(Wheel)Hub.Z+=Wheel->GetSuspensionOffset();\n        const FQuat ArtToAxle=FQuat::FindBetweenNormals(TireAxle(Visual->GetStaticMesh()),FVector::RightVector);\n        // Native Chaos values drive the actual steering, spin and suspension.\n        // No extra bind-pose rotation or duplicated authored hub offset is applied.\n        const FRotator Motion(Wheel?Wheel->GetRotationAngle():0.f,Wheel?Wheel->GetSteerAngle():0.f,0.f);\n        Visual->SetRelativeLocation(Hub);\n        Visual->SetRelativeRotation(Motion.Quaternion()*ArtToAxle);\n    }\n}\n\nbool AAnomaliaChaosRoadVehicle::AreWheelVisualsUpright() const\n{\n    if(RoadWheels.Num()!=4)return false;\n    const FVector Up=Chassis->GetUpVector();\n    for(int32 Index=0;Index<RoadWheels.Num();++Index)\n    {\n        const auto& Visual=RoadWheels[Index];\n        if(!Visual || !Visual->GetStaticMesh())return false;\n        const FVector Axle=Visual->GetComponentQuat().RotateVector(TireAxle(Visual->GetStaticMesh()));\n        if(FMath::Abs(FVector::DotProduct(Axle,Up))>.1f)return false;\n        auto* Wheel=ChaosMovement->Wheels.IsValidIndex(Index)?ChaosMovement->Wheels[Index].Get():nullptr;\n        const FQuat Steer=FRotator(0,Wheel?Wheel->GetSteerAngle():0.f,0).Quaternion();\n        const FVector Expected=Chassis->GetComponentQuat().RotateVector(Steer.RotateVector(FVector::RightVector));\n        // Allow one frame of steering interpolation; reject a 90-degree\n        // sideways mounting even when the tire itself is standing upright.\n        if(FMath::Abs(FVector::DotProduct(Axle,Expected))<.95f)return false;\n    }\n    return true;\n}\n\nvoid AAnomaliaChaosRoadVehicle::Tick(float DeltaSeconds)\n{\n    Super::Tick(DeltaSeconds);\n    UpdateWheelVisuals();\n    UpdateRoadLights();\n    if(HasAuthority() && IsDriveReady())\n    {\n        SurvivalSystems->SimulateEngine(DeltaSeconds,ChaosMovement->GetThrottleInput());\n        UpdateCargoPhysicalMass();\n    }\n}\n\nvoid AAnomaliaChaosRoadVehicle::OnConstruction(const FTransform& Transform)\n{\n    Super::OnConstruction(Transform); ApplyRoadRig();\n}\nvoid AAnomaliaChaosRoadVehicle::BeginPlay()\n{\n    Super::BeginPlay(); ApplyRoadRig();\n    CargoInventory->OnInventoryUpdated.AddDynamic(this,&AAnomaliaChaosRoadVehicle::UpdateCargoPhysicalMass);\n    UpdateCargoPhysicalMass();\n}\nUPawnMovementComponent* AAnomaliaChaosRoadVehicle::GetMovementComponent() const { return ChaosMovement; }\nbool AAnomaliaChaosRoadVehicle::ConfigureVehicle(FName NewVehicleId)\n{\n    FAnomaliaVehicleDefinition Definition;\n    if(!UAnomaliaVehicleCatalog::FindVehicleDefinition(NewVehicleId,Definition) || Definition.Domain!=EAnomaliaVehicleDomain::Ground) return false;\n    if(!Super::ConfigureVehicle(NewVehicleId))return false;\n    ApplyRoadRig();return true;\n}\nbool AAnomaliaChaosRoadVehicle::IsChaosDriveReady() const { return IsDriveReady(); }\nbool AAnomaliaChaosRoadVehicle::IsDriveReady() const\n{\n    return HasValidRoadRig() && ChaosMovement->HasValidPhysicsState() &&\n        ChaosMovement->Wheels.Num()==4 && Chassis->IsSimulatingPhysics();\n}\nbool AAnomaliaChaosRoadVehicle::CanDriverExitNow() const\n{\n    return true; // Requested gameplay: exiting is allowed at any speed.\n}\nFVector AAnomaliaChaosRoadVehicle::GetDriverExitVelocity() const { return Chassis->GetPhysicsLinearVelocity(); }\nfloat AAnomaliaChaosRoadVehicle::GetExpectedSupportFloorZ() const\n{\n    // A suspension rig's render bounds can extend well below the support plane.\n    // Use the actual floor instead of rejecting every safe exit from that rig.\n    if(GetWorld())\n    {\n        FHitResult Floor;FCollisionQueryParams Query(SCENE_QUERY_STAT(AnomaliaRoadSupport),true);\n        Query.AddIgnoredActor(this);\n        const FVector Origin=GetActorLocation();\n        if(GetWorld()->LineTraceSingleByChannel(Floor,Origin+FVector(0,0,50),Origin-FVector(0,0,600),ECC_Pawn,Query) && Floor.ImpactNormal.Z>.5f)\n            return Floor.ImpactPoint.Z;\n    }\n    return GetActorLocation().Z-WheelRadiusCm;\n}\nvoid AAnomaliaChaosRoadVehicle::SimulateRoadDrive(float DeltaSeconds,float Throttle,float Steering,float Brake,\n    bool bPowered,bool bDriverMissing)\n{\n    if(!HasAuthority() || !IsDriveReady()) return;\n    // A stalled or switched-off engine needs an explicit driver restart.\n    // Replenishing fuel alone must never restart a parked vehicle.\n    if(bDriverMissing || !HasFuel()) SetEngineState(false);\n    float Demand=bPowered && bEngineRunning?(bManualGears?FMath::Max(0.f,Throttle):FMath::Abs(Throttle)):0.f;\n    if(bManualGears && Throttle<0.f)Brake=FMath::Max(Brake,-Throttle);\n    const float Speed=ChaosMovement->GetForwardSpeed();\n    const int32 DesiredGear=bManualGears?ChaosMovement->GetTargetGear():(Throttle<-.05f?-1:1);\n    if(Demand>.05f && ((DesiredGear<0 && Speed>30.f)||(DesiredGear>0 && Speed<-30.f)))\n    { Demand=0.f; Brake=1.f; }\n    else if(!bManualGears && Demand>.05f && FMath::Abs(Speed)<30.f &&\n       ((DesiredGear<0 && ChaosMovement->GetCurrentGear()>=0)||(DesiredGear>0 && ChaosMovement->GetCurrentGear()<=0)))\n        ChaosMovement->SetTargetGear(DesiredGear,true);\n    ChaosMovement->SetThrottleInput(Demand);\n    ChaosMovement->SetSteeringInput(Steering);\n    const bool bPark=bDriverMissing && Chassis->GetPhysicsLinearVelocity().Size()<100.f;\n    ChaosMovement->SetBrakeInput(bPark?1.f:Brake);\n    ChaosMovement->SetHandbrakeInput(bPark || bHandbrakeHeld);\n}\n\nvoid AAnomaliaChaosRoadVehicle::SetEngineState(bool bRunning)\n{\n    if(!HasAuthority() || bEngineRunning==bRunning)return;\n    bEngineRunning=bRunning;if(!bRunning)ChaosMovement->SetThrottleInput(0.f);OnRep_EngineRunning(); ForceNetUpdate();\n}\nbool AAnomaliaChaosRoadVehicle::SetEngineRunningOnServer(AController* Driver,bool bRunning)\n{\n    if(!HasAuthority() || !IsValid(Driver) || Driver!=GetController() || Driver->GetPawn()!=this ||\n       !Driver->IsPlayerController() || (bRunning && (!IsDriveReady() || !HasFuel() || !SurvivalSystems->CanStart(GetStoredDriverSurvivor()))))return false;\n    if(bRunning&&!bEngineRunning&&SurvivalSystems->bEnabled)SurvivalSystems->State.BatteryCharge=FMath::Max(0.f,SurvivalSystems->State.BatteryCharge-.002f);\n    SetEngineState(bRunning);return bEngineRunning==bRunning;\n}\nvoid AAnomaliaChaosRoadVehicle::OnRep_EngineRunning(){OnEngineRunningChanged(bEngineRunning);}\nvoid AAnomaliaChaosRoadVehicle::InputIgnition()\n{\n    if(!IsLocallyControlled())return;\n    if(HasAuthority())ServerToggleIgnition_Implementation();else ServerToggleIgnition();\n}\nvoid AAnomaliaChaosRoadVehicle::ServerToggleIgnition_Implementation()\n{\n    SetEngineRunningOnServer(GetController(),!bEngineRunning);\n}\nvoid AAnomaliaChaosRoadVehicle::SetupPlayerInputComponent(UInputComponent* PlayerInputComponent)\n{\n    Super::SetupPlayerInputComponent(PlayerInputComponent);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleIgnition\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputIgnition);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleGearUp\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputGearUp);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleGearDown\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputGearDown);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleGearMode\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputGearMode);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleHandbrake\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputHandbrakeOn);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleHandbrake\"),IE_Released,this,&AAnomaliaChaosRoadVehicle::InputHandbrakeOff);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleHeadlights\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputHeadlights);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleIndicatorLeft\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputIndicatorLeft);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleIndicatorRight\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputIndicatorRight);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleHazards\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputHazardLights);\n    PlayerInputComponent->BindAction(TEXT(\"VehicleDoor\"),IE_Pressed,this,&AAnomaliaChaosRoadVehicle::InputDriverDoor);\n}\nvoid AAnomaliaChaosRoadVehicle::GetLifetimeReplicatedProps(TArray<FLifetimeProperty>& OutLifetimeProps) const\n{\n    Super::GetLifetimeReplicatedProps(OutLifetimeProps);\n    DOREPLIFETIME(AAnomaliaChaosRoadVehicle,bEngineRunning);\n    DOREPLIFETIME(AAnomaliaChaosRoadVehicle,bManualGears);\n    DOREPLIFETIME(AAnomaliaChaosRoadVehicle,bHandbrakeHeld);\n    DOREPLIFETIME(AAnomaliaChaosRoadVehicle,bHeadlightsOn);\n    DOREPLIFETIME(AAnomaliaChaosRoadVehicle,IndicatorMode);\n}\n\nbool AAnomaliaChaosRoadVehicle::ExecuteRoadActionOnServer(AController* Driver,EAnomaliaRoadAction Action)\n{\n    if(!HasAuthority() || !IsValid(Driver) || Driver!=GetController() || Driver->GetPawn()!=this || !Driver->IsPlayerController())return false;\n    switch(Action)\n    {\n    case EAnomaliaRoadAction::GearUp:\n    case EAnomaliaRoadAction::GearDown:\n    {\n        if(!IsDriveReady())return false;\n        const int32 Gear=ChaosMovement->GetTargetGear()+(Action==EAnomaliaRoadAction::GearUp?1:-1);\n        if(Gear< -1 || Gear>ChaosMovement->TransmissionSetup.ForwardGearRatios.Num())return false;\n        const float Speed=ChaosMovement->GetForwardSpeed();\n        if((Gear<0 && Speed>100.f)||(Gear>0 && Speed< -100.f))return false;\n        bManualGears=true;ChaosMovement->SetUseAutomaticGears(false);ChaosMovement->SetTargetGear(Gear,false);break;\n    }\n    case EAnomaliaRoadAction::ToggleGearMode:\n        bManualGears=!bManualGears;ChaosMovement->SetUseAutomaticGears(!bManualGears);break;\n    case EAnomaliaRoadAction::HandbrakeOn:bHandbrakeHeld=true;break;\n    case EAnomaliaRoadAction::HandbrakeOff:bHandbrakeHeld=false;break;\n    case EAnomaliaRoadAction::Headlights:bHeadlightsOn=!bHeadlightsOn;break;\n    case EAnomaliaRoadAction::IndicatorLeft:IndicatorMode=IndicatorMode==1?0:1;break;\n    case EAnomaliaRoadAction::IndicatorRight:IndicatorMode=IndicatorMode==2?0:2;break;\n    case EAnomaliaRoadAction::HazardLights:IndicatorMode=IndicatorMode==3?0:3;break;\n    case EAnomaliaRoadAction::DriverDoor:return DriverDoor->TryToggleFromDriver(Driver);\n    default:return false;\n    }\n    OnRep_RoadControls();ForceNetUpdate();return true;\n}\nvoid AAnomaliaChaosRoadVehicle::SendRoadAction(EAnomaliaRoadAction Action)\n{\n    if(!IsLocallyControlled())return;\n    if(HasAuthority())ExecuteRoadActionOnServer(GetController(),Action);else ServerRoadAction(Action);\n}\nvoid AAnomaliaChaosRoadVehicle::ServerRoadAction_Implementation(EAnomaliaRoadAction Action){ExecuteRoadActionOnServer(GetController(),Action);}\nvoid AAnomaliaChaosRoadVehicle::InputGearUp(){SendRoadAction(EAnomaliaRoadAction::GearUp);}\nvoid AAnomaliaChaosRoadVehicle::InputGearDown(){SendRoadAction(EAnomaliaRoadAction::GearDown);}\nvoid AAnomaliaChaosRoadVehicle::InputGearMode(){SendRoadAction(EAnomaliaRoadAction::ToggleGearMode);}\nvoid AAnomaliaChaosRoadVehicle::InputHandbrakeOn(){SendRoadAction(EAnomaliaRoadAction::HandbrakeOn);}\nvoid AAnomaliaChaosRoadVehicle::InputHandbrakeOff(){SendRoadAction(EAnomaliaRoadAction::HandbrakeOff);}\nvoid AAnomaliaChaosRoadVehicle::InputHeadlights(){SendRoadAction(EAnomaliaRoadAction::Headlights);}\nvoid AAnomaliaChaosRoadVehicle::InputIndicatorLeft(){SendRoadAction(EAnomaliaRoadAction::IndicatorLeft);}\nvoid AAnomaliaChaosRoadVehicle::InputIndicatorRight(){SendRoadAction(EAnomaliaRoadAction::IndicatorRight);}\nvoid AAnomaliaChaosRoadVehicle::InputHazardLights(){SendRoadAction(EAnomaliaRoadAction::HazardLights);}\nvoid AAnomaliaChaosRoadVehicle::InputDriverDoor(){SendRoadAction(EAnomaliaRoadAction::DriverDoor);}\nvoid AAnomaliaChaosRoadVehicle::OnRep_RoadControls(){UpdateRoadLights();}\nvoid AAnomaliaChaosRoadVehicle::UpdateRoadLights()\n{\n    for(const auto& Light:Headlights)if(Light)Light->SetVisibility(bHeadlightsOn);\n    const auto* State=GetWorld()?GetWorld()->GetGameState():nullptr;\n    const double Time=State?State->GetServerWorldTimeSeconds():(GetWorld()?GetWorld()->GetTimeSeconds():0);\n    const bool bFlash=FMath::Fmod(Time,.8)<.4;\n    for(int32 Index=0;Index<IndicatorLights.Num();++Index)\n        if(IndicatorLights[Index])IndicatorLights[Index]->SetVisibility(bFlash && (IndicatorMode==3 || IndicatorMode==(Index%2==0?1:2)));\n}\n\nfloat AAnomaliaChaosRoadVehicle::GetUnladenMassKg() const\n{\n    return UnladenMassKg >= 0.f ? UnladenMassKg : ChaosMovement->Mass;\n}\n\nvoid AAnomaliaChaosRoadVehicle::UpdateCargoPhysicalMass()\n{\n    if(!HasAuthority()||!IsDriveReady())return;\n    const float CargoMass=CargoInventory->GetCurrentWeightKg();\n    if(!FMath::IsFinite(CargoMass)||CargoMass<0)return;\n    const float TotalMass=GetUnladenMassKg()+CargoMass;\n    if(FMath::IsNearlyEqual(CargoMass,LastCargoMassKg,.001f) &&\n       FMath::IsNearlyEqual(ChaosMovement->Mass,TotalMass,.001f) &&\n       FMath::IsNearlyEqual(Chassis->GetMass(),TotalMass,.01f))return;\n    // SetupVehicleMass binds UpdateMassProperties to the body's recalculation.\n    // Updating only the body override would immediately restore the dry Mass.\n    ChaosMovement->Mass=TotalMass;\n    const FName RootBone=RoadMesh->GetRefSkeleton().GetBoneName(0);\n    Chassis->SetMassOverrideInKg(RootBone,TotalMass,true);\n    LastCargoMassKg=CargoMass;\n}\n","before":"e8c1e74b02403ae293c11a76beeb67462438a2d8"},{"path":"unreal/Source/AnomaliaPrimeval/Vehicles/AnomaliaChaosRoadProbe.cpp","content":"#include \"AnomaliaVehicleSurvival.h\"\n#include \"../AnomaliaInventoryComponent.h\"\n#include \"AnomaliaChaosRoadProbe.h\"\n#include \"AnomaliaChaosRoadVehicle.h\"\n#include \"AnomaliaVehiclePanelComponent.h\"\n#include \"Engine/StaticMesh.h\"\n#include \"../AnomaliaGameMode.h\"\n#include \"../AnomaliaSurvivor.h\"\n#include \"ChaosWheeledVehicleMovementComponent.h\"\n#include \"Components/SkeletalMeshComponent.h\"\n#include \"GameFramework/FloatingPawnMovement.h\"\n#include \"GameFramework/PlayerController.h\"\n#include \"GameFramework/SpringArmComponent.h\"\n#include \"GameFramework/CharacterMovementComponent.h\"\n#include \"Components/SpotLightComponent.h\"\n#include \"Components/PointLightComponent.h\"\n#include \"Components/StaticMeshComponent.h\"\n#include \"Engine/StaticMeshActor.h\"\n#include \"PhysicalMaterials/PhysicalMaterial.h\"\n#include \"PhysicsEngine/BodyInstance.h\"\n#include \"PhysicsEngine/PhysicsSettings.h\"\n#include \"Engine/SkeletalMesh.h\"\n#include \"Engine/World.h\"\n#include \"CollisionQueryParams.h\"\n#include \"EngineUtils.h\"\n#include \"UnrealClient.h\"\n#include \"Misc/CommandLine.h\"\n#include \"Misc/Parse.h\"\n#include \"Misc/FileHelper.h\"\n#include \"Misc/Paths.h\"\n#include \"HAL/FileManager.h\"\n#include \"HAL/PlatformMisc.h\"\n#include \"HAL/IConsoleManager.h\"\n#include \"Dom/JsonObject.h\"\n#include \"Serialization/JsonSerializer.h\"\n#include \"Serialization/JsonWriter.h\"\n\nnamespace\n{\nbool ReadPanelFixtureVector(const TSharedPtr<FJsonObject>& Object,const TCHAR* Key,FVector& Out)\n{\n    const TArray<TSharedPtr<FJsonValue>>* Values=nullptr;\n    if(!Object.IsValid() || !Object->TryGetArrayField(Key,Values) || !Values || Values->Num()!=3)return false;\n    Out=FVector((*Values)[0]->AsNumber(),(*Values)[1]->AsNumber(),(*Values)[2]->AsNumber());\n    return !Out.ContainsNaN() && Out.GetAbsMax()<1000;\n}\n\nbool PlaceReviewSurvivor(AAnomaliaSurvivor* Survivor,const FVector& Destination)\n{\n    if(!Survivor || !Survivor->GetActorEnableCollision())return false;\n    // Fixture relocation only, never a gameplay move. Recreate the character's\n    // collision at the destination rather than moving its kinematic body across\n    // the car between successive sides. The vehicle is never moved or reset.\n    Survivor->SetActorEnableCollision(false);\n    Survivor->GetCharacterMovement()->StopMovementImmediately();\n    Survivor->SetBase(static_cast<UPrimitiveComponent*>(nullptr));\n    const bool Placed=Survivor->SetActorLocationAndRotation(Destination,FRotator::ZeroRotator,\n        false,nullptr,ETeleportType::TeleportPhysics);\n    Survivor->SetActorEnableCollision(true);\n    return Placed;\n}\n\n}\n\nAAnomaliaChaosRoadProbe::AAnomaliaChaosRoadProbe() { PrimaryActorTick.bCanEverTick=true; }\nvoid AAnomaliaChaosRoadProbe::ObserveExitedMovement(float DeltaSeconds,FVector InitialLocation,FVector InitialVelocity)\n{\n    if(!bEnabled || Phase!=14 || !Survivor.IsValid() || DeltaSeconds<=0)return;\n    // Observe the actual movement update that consumes LaunchCharacter, before\n    // later ground friction naturally slows the character. Do not inject motion.\n    ObservedExitSpeed=FMath::Max(ObservedExitSpeed,float(InitialVelocity.Size2D()));\n    ObservedExitSpeed=FMath::Max(ObservedExitSpeed,float(Survivor->GetCharacterMovement()->Velocity.Size2D()));\n    ObservedExitSpeed=FMath::Max(ObservedExitSpeed,float(FVector::Dist2D(InitialLocation,Survivor->GetActorLocation())/DeltaSeconds));\n}\nvoid AAnomaliaChaosRoadProbe::BeginPlay()\n{\n    Super::BeginPlay();\n#if !UE_BUILD_SHIPPING\n    const auto* Mode=GetWorld()->GetAuthGameMode<AAnomaliaGameMode>();\n    bEnabled=Mode && GetNetMode()==NM_Standalone && Mode->ServerId.StartsWith(TEXT(\"chaos-smoke-\")) &&\n        (GetWorld()->GetMapName().EndsWith(TEXT(\"ANOMALIA_ChaosRoadReview_v2\")) ||\n         GetWorld()->GetMapName().EndsWith(TEXT(\"ANOMALIA_SedanDriveReview_v1\")) ||\n         GetWorld()->GetMapName().EndsWith(TEXT(\"ANOMALIA_E39DriveReview_v1\"))) &&\n        FParse::Value(FCommandLine::Get(),TEXT(\"AnomaliaChaosProbe=\"),ReportFile) && !ReportFile.IsEmpty();\n#endif\n    SetActorTickEnabled(bEnabled);\n    if(bEnabled)\n    {\n        // Observe a process-local startup override; never modify the shared\n        // project/engine configuration or disable suspension forces themselves.\n        if(FParse::Param(FCommandLine::Get(),TEXT(\"AnomaliaForceSuspensionReview\")))\n        {\n            const auto* Setting=IConsoleManager::Get().FindConsoleVariable(TEXT(\"p.Vehicle.DisableConstraintSuspension\"));\n            if(!Setting || Setting->GetInt()!=1)\n            {Finish(TEXT(\"Requested force-suspension comparison is not active\"));return;}\n        }\n        DrySurface=NewObject<UPhysicalMaterial>(this);DrySurface->Friction=.9f;DrySurface->StaticFriction=.9f;DrySurface->Restitution=0;\n        LowGripSurface=NewObject<UPhysicalMaterial>(this);LowGripSurface->Friction=.45f;LowGripSurface->StaticFriction=.45f;LowGripSurface->Restitution=0;\n        for(TActorIterator<AStaticMeshActor> It(GetWorld());It;++It)\n            if(It->Tags.Contains(FName(TEXT(\"ANOMALIA_ChaosRoadReview_v2\"))) || It->Tags.Contains(FName(TEXT(\"ANOMALIA_SedanDriveReview_v1\"))) ||\n               It->Tags.Contains(FName(TEXT(\"ANOMALIA_E39DriveReview_v1\"))))\n            {\n                if(ProvingSurface){Finish(TEXT(\"Review ground is not unique\"));return;}\n                ProvingSurface=It->GetStaticMeshComponent();ProvingSurface->SetPhysMaterialOverride(DrySurface);\n            }\n        if(!ProvingSurface){Finish(TEXT(\"Owned physics proving surface missing\"));return;}\n    }\n    Started=PhaseStarted=GetWorld()->GetTimeSeconds();\n    WallStarted=FPlatformTime::Seconds();\n    bRecordFrames=FParse::Param(FCommandLine::Get(),TEXT(\"AnomaliaRecordDriving\"));\n    if(bEnabled && bRecordFrames)IFileManager::Get().MakeDirectory(*FPaths::Combine(FPaths::GetPath(ReportFile),TEXT(\"frames\")),true);\n}\nvoid AAnomaliaChaosRoadProbe::Finish(const FString& Error)\n{\n    if(!bFinishing)\n    {\n        bFinishing=true;PendingError=Error;FinishAt=FPlatformTime::Seconds()+2;\n        FScreenshotRequest::RequestScreenshot(FPaths::Combine(FPaths::GetPath(ReportFile),TEXT(\"actual-final-viewport.png\")),false,false);\n        return;\n    }\n    if(FPlatformTime::Seconds()<FinishAt)return;\n    auto Report=MakeShared<FJsonObject>();\n    Report->SetStringField(TEXT(\"state\"),Error.IsEmpty()?TEXT(\"CHAOS_ROAD_PHYSICS_DRIVE_PASSED\"):TEXT(\"FAILED\"));\n    Report->SetStringField(TEXT(\"error\"),Error);\n    Report->SetStringField(TEXT(\"map\"),GetWorld()->GetMapName());\n    Report->SetStringField(TEXT(\"buildCommit\"),TEXT(ANOMALIA_BUILD_COMMIT));\n    Report->SetNumberField(TEXT(\"recordedViewportFrames\"),FrameCount);\n    Report->SetNumberField(TEXT(\"captureFramesPerSecond\"),5);\n    Report->SetStringField(TEXT(\"physicsPhaseClock\"),TEXT(\"world_simulation_seconds\"));\n    Report->SetNumberField(TEXT(\"wallElapsedSeconds\"),FPlatformTime::Seconds()-WallStarted);\n    Report->SetBoolField(TEXT(\"packagedGameTested\"),false);\n    Report->SetBoolField(TEXT(\"multiplayerTested\"),false);\n    Report->SetBoolField(TEXT(\"entryAnimationTested\"),false);\n    Report->SetNumberField(TEXT(\"phase\"),Phase);\n    Report->SetNumberField(TEXT(\"exitVehicleSpeedCmPerSecond\"),ExitVehicleSpeed);\n    Report->SetNumberField(TEXT(\"observedExitCharacterSpeedCmPerSecond\"),ObservedExitSpeed);\n    Report->SetArrayField(TEXT(\"brakingMeasurements\"),BrakingMeasurements);\n    Report->SetBoolField(TEXT(\"driverDoorReviewed\"),bDriverDoorReviewed);\n    TArray<TSharedPtr<FJsonValue>> PanelIds;\n    for(const auto& Id:ValidatedAdditionalPanelIds)PanelIds.Add(MakeShared<FJsonValueString>(Id));\n    Report->SetArrayField(TEXT(\"validatedAdditionalPanelIds\"),PanelIds);\n    Report->SetNumberField(TEXT(\"panelMaxChassisDriftCm\"),PanelMaxDriftCm);\n    Report->SetNumberField(TEXT(\"panelMaxChassisSpeedCmPerSecond\"),PanelMaxSpeedCmPerSecond);\n    if(const auto* Setting=IConsoleManager::Get().FindConsoleVariable(TEXT(\"p.Vehicle.DisableConstraintSuspension\")))\n        Report->SetNumberField(TEXT(\"constraintSuspensionDisabled\"),Setting->GetInt());\n    if(Car.IsValid())\n    {\n        Report->SetBoolField(TEXT(\"reviewFixtureInitializedClosed\"),IdleStarted>0);\n        Report->SetBoolField(TEXT(\"reviewKeyboardInputIsolated\"),true);\n        TArray<TSharedPtr<FJsonValue>> LeafStates;\n        TArray<UAnomaliaVehiclePanelComponent*> Leaves={Car->DriverDoor.Get()};\n        for(const auto& Leaf:Car->AdditionalPanels)Leaves.Add(Leaf.Get());\n        for(const auto* Leaf:Leaves)if(Leaf)\n        {\n            auto State=MakeShared<FJsonObject>();State->SetStringField(TEXT(\"id\"),Leaf->PanelId.ToString());\n            State->SetBoolField(TEXT(\"open\"),Leaf->bOpen);State->SetBoolField(TEXT(\"obstructed\"),Leaf->bObstructed);\n            State->SetNumberField(TEXT(\"angleDegrees\"),Leaf->AngleDegrees);\n            State->SetStringField(TEXT(\"relativeRotation\"),Leaf->GetRelativeRotation().ToString());\n            LeafStates.Add(MakeShared<FJsonValueObject>(State));\n        }\n        Report->SetArrayField(TEXT(\"finalPanelStates\"),LeafStates);\n        auto Profile=MakeShared<FJsonObject>();\n        Profile->SetNumberField(TEXT(\"massKg\"),Car->Chassis->GetMass());\n        Profile->SetNumberField(TEXT(\"peakTorqueNm\"),Car->ChaosMovement->EngineSetup.MaxTorque);\n        Profile->SetNumberField(TEXT(\"dragCoefficient\"),Car->ChaosMovement->DragCoefficient);\n        Profile->SetBoolField(TEXT(\"rearWheelDriveObserved\"),bRearDriveObserved);\n        Profile->SetNumberField(TEXT(\"linearDamping\"),Car->Chassis->GetLinearDamping());\n        Profile->SetNumberField(TEXT(\"angularDamping\"),Car->Chassis->GetAngularDamping());\n        Profile->SetStringField(TEXT(\"rootBindTransform\"),Car->RoadMesh->GetRefSkeleton().GetRefBonePose()[0].ToString());\n        TArray<TSharedPtr<FJsonValue>> SuspensionConfig;\n        for(auto& Wheel:Car->ChaosMovement->Wheels)\n        {\n            if(!Wheel)continue;\n            const auto& Config=Wheel->GetPhysicsSuspensionConfig();\n            auto Row=MakeShared<FJsonObject>();\n            Row->SetNumberField(TEXT(\"wheelSpringRateProperty\"),Wheel->SpringRate);\n            Row->SetNumberField(TEXT(\"convertedSpringRate\"),Config.SpringRate);\n            Row->SetNumberField(TEXT(\"convertedSpringPreload\"),Config.SpringPreload);\n            Row->SetNumberField(TEXT(\"dampingRatio\"),Config.DampingRatio);\n            Row->SetNumberField(TEXT(\"expectedEvenStaticLoadEngineUnits\"),Car->Chassis->GetMass()*FMath::Abs(GetWorld()->GetGravityZ())/4.f);\n            SuspensionConfig.Add(MakeShared<FJsonValueObject>(Row));\n        }\n        Profile->SetArrayField(TEXT(\"suspensionConfiguration\"),SuspensionConfig);\n        Report->SetObjectField(TEXT(\"vehicleProfile\"),Profile);\n    }\n    TArray<TSharedPtr<FJsonValue>> Rows;\n    for(const auto& Check:Checks) Rows.Add(MakeShared<FJsonValueString>(Check));\n    Report->SetArrayField(TEXT(\"checks\"),Rows); Report->SetArrayField(TEXT(\"physicsSamples\"),Samples);\n    Report->SetArrayField(TEXT(\"stationarySamples\"),IdleSamples);\n    Report->SetArrayField(TEXT(\"panelSamples\"),PanelSamples);\n    Report->SetBoolField(TEXT(\"stationaryReviewed\"),bIdleReviewed);\n    Report->SetBoolField(TEXT(\"asyncPhysics\"),UPhysicsSettings::Get()->bTickPhysicsAsync);\n    Report->SetNumberField(TEXT(\"asyncFixedTimeStepSize\"),UPhysicsSettings::Get()->AsyncFixedTimeStepSize);\n    FString Raw; FJsonSerializer::Serialize(Report,TJsonWriterFactory<>::Create(&Raw));\n    IFileManager::Get().MakeDirectory(*FPaths::GetPath(ReportFile),true);\n    FFileHelper::SaveStringToFile(Raw,*ReportFile);\n    bEnabled=false; SetActorTickEnabled(false); FPlatformMisc::RequestExit(false);\n}\nvoid AAnomaliaChaosRoadProbe::Tick(float DeltaSeconds)\n{\n    Super::Tick(DeltaSeconds);\n    if(!bEnabled) return;\n    const double Now=GetWorld()->GetTimeSeconds();\n    if(bFinishing){Finish(PendingError);return;}\n    // Capture only the actual Unreal viewport, after physical acceleration passed.\n    // Never capture the user's desktop, and never synthesize a demonstration.\n    if(bRecordFrames && Phase>=2 && Now-LastFrame>=.2)\n    {\n        FScreenshotRequest::RequestScreenshot(FPaths::Combine(FPaths::GetPath(ReportFile),TEXT(\"frames\"),FString::Printf(TEXT(\"frame-%05d.png\"),FrameCount++)),false,false);\n        LastFrame=Now;\n    }\n    if(Now-Started>150 || FPlatformTime::Seconds()-WallStarted>360)\n    { Finish(TEXT(\"Actual Chaos driving timed out\")); return; }\n    auto* PC=GetWorld()->GetFirstPlayerController();\n    if(!PC) return;\n    // This actor is enabled only on the explicit isolated standalone test map.\n    // Native server actions below supply the test commands. Live host keyboard\n    // input must not change a leaf while its closed state is being measured.\n    if(PC->GetPawn())PC->GetPawn()->DisableInput(PC);\n    if(!PC->IsLookInputIgnored())PC->SetIgnoreLookInput(true);\n    if(Phase==14)\n    {\n        if(Now-PhaseStarted<.25)return;\n        if(PC->GetPawn()!=Survivor.Get() || ObservedExitSpeed<1000.f)\n        { Finish(TEXT(\"High speed exit did not retain the original character and vehicle momentum\")); return; }\n        Checks.Add(TEXT(\"high_speed_exit_restores_original_survivor_with_vehicle_momentum\"));\n        Finish();return;\n    }\n    if(Phase==42)\n    {\n        auto* V=Car.Get();auto* S=Cast<AAnomaliaSurvivor>(PC->GetPawn());\n        if(!V || !S){Finish(TEXT(\"Closed-trunk walking review lost its actors\"));return;}\n        const float Drift=FVector::Dist(V->GetActorLocation(),PanelReviewStart);\n        if(Drift>50.f || V->Chassis->GetPhysicsLinearVelocity().Size()>100.f)\n        {Finish(TEXT(\"Walking into the closed trunk destabilized the chassis\"));return;}\n        if(Now-PhaseStarted<1.5)\n        {S->AddMovementInput(-PanelTraceOutward.GetSafeNormal());return;}\n        const float Walked=FVector::Dist2D(S->GetActorLocation(),PanelAimInMeshCm);\n        const FVector Local=V->Chassis->GetComponentTransform().InverseTransformPosition(S->GetActorLocation());\n        if(Walked<25.f || Walked>180.f || Local.X>PanelApertureLocalCm.X-5.f ||\n            S->GetCharacterMovement()->Velocity.Size2D()>10.f)\n        {Finish(FString::Printf(TEXT(\"Character did not actually walk and stop at the closed trunk: moved=%.2f local=%s velocity=%s\"),\n            Walked,*Local.ToString(),*S->GetCharacterMovement()->Velocity.ToString()));return;}\n        S->GetCharacterMovement()->StopMovementImmediately();\n        Checks.Add(TEXT(\"survivor_walks_into_closed_trunk_without_launching_chassis\"));\n        bAdditionalPanelsReviewed=true;Phase=0;PhaseStarted=Now-4;\n    }\n    if(Phase==40 || Phase==41)\n    {\n        auto* V=Car.Get();auto* S=Cast<AAnomaliaSurvivor>(PC->GetPawn());auto* Panel=PanelUnderReview.Get();\n        if(!V || !S || !Panel){Finish(TEXT(\"Additional E39 panel review lost its real actor\"));return;}\n        PanelMaxDriftCm=FMath::Max(PanelMaxDriftCm,float(FVector::Dist(V->GetActorLocation(),PanelReviewStart)));\n        PanelMaxSpeedCmPerSecond=FMath::Max(PanelMaxSpeedCmPerSecond,float(V->Chassis->GetPhysicsLinearVelocity().Size()));\n        // Retain the actual contact/force output before the stability gate,\n        // including the failing frame. Never reset velocity or relax limits.\n        auto PanelSample=MakeShared<FJsonObject>();\n        PanelSample->SetStringField(TEXT(\"panel\"),Panel->PanelId.ToString());\n        PanelSample->SetNumberField(TEXT(\"phase\"),Phase);\n        PanelSample->SetNumberField(TEXT(\"seconds\"),Now-PhaseStarted);\n        PanelSample->SetNumberField(TEXT(\"frameDeltaSeconds\"),DeltaSeconds);\n        PanelSample->SetNumberField(TEXT(\"angleDegrees\"),Panel->AngleDegrees);\n        const FBodyInstance* RawPanelBody=Panel->GetBodyInstance(NAME_None,false);\n        const FBodyInstance* EffectivePanelBody=Panel->GetBodyInstance();\n        PanelSample->SetBoolField(TEXT(\"nativePanelBodyWelded\"),RawPanelBody && RawPanelBody->WeldParent!=nullptr);\n        PanelSample->SetStringField(TEXT(\"nativePanelBodyOwner\"),RawPanelBody?GetNameSafe(RawPanelBody->OwnerComponent.Get()):TEXT(\"None\"));\n        PanelSample->SetStringField(TEXT(\"effectivePanelBodyOwner\"),EffectivePanelBody?GetNameSafe(EffectivePanelBody->OwnerComponent.Get()):TEXT(\"None\"));\n        PanelSample->SetStringField(TEXT(\"location\"),V->GetActorLocation().ToString());\n        PanelSample->SetStringField(TEXT(\"velocity\"),V->Chassis->GetPhysicsLinearVelocity().ToString());\n        PanelSample->SetNumberField(TEXT(\"driftCm\"),FVector::Dist(V->GetActorLocation(),PanelReviewStart));\n        PanelSample->SetStringField(TEXT(\"survivorLocation\"),S->GetActorLocation().ToString());\n        PanelSample->SetStringField(TEXT(\"survivorVelocity\"),S->GetCharacterMovement()->Velocity.ToString());\n        PanelSample->SetStringField(TEXT(\"survivorMovementBase\"),GetNameSafe(S->GetMovementBase()));\n        PanelSample->SetBoolField(TEXT(\"characterAutoPhysicsPushEnabled\"),S->GetCharacterMovement()->bEnablePhysicsInteraction);\n        TArray<TSharedPtr<FJsonValue>> WheelSamples;\n        for(int32 Index=0;Index<V->ChaosMovement->Wheels.Num();++Index)\n        {\n            const FWheelStatus& Status=V->ChaosMovement->GetWheelState(Index);\n            auto WheelSample=MakeShared<FJsonObject>();\n            WheelSample->SetNumberField(TEXT(\"wheel\"),Index);\n            WheelSample->SetBoolField(TEXT(\"contact\"),Status.bInContact);\n            WheelSample->SetNumberField(TEXT(\"springForce\"),Status.SpringForce);\n            WheelSample->SetNumberField(TEXT(\"suspensionLengthNormalized\"),Status.NormalizedSuspensionLength);\n            WheelSamples.Add(MakeShared<FJsonValueObject>(WheelSample));\n        }\n        PanelSample->SetArrayField(TEXT(\"wheels\"),WheelSamples);\n        PanelSamples.Add(MakeShared<FJsonValueObject>(PanelSample));\n        if(PanelMaxDriftCm>50.f || PanelMaxSpeedCmPerSecond>100.f)\n        {Finish(FString::Printf(TEXT(\"Panel review destabilized chassis: %s drift=%.2f cm speed=%.2f cm/s vehicle=%s survivor=%s\"),\n            *Panel->PanelId.ToString(),PanelMaxDriftCm,PanelMaxSpeedCmPerSecond,*V->GetActorLocation().ToString(),*S->GetActorLocation().ToString()));return;}\n        if(Now-PhaseStarted<1.5)return;\n        const FVector Point=V->Chassis->GetComponentTransform().TransformPosition(PanelApertureLocalCm);\n        const FVector Outward=V->Chassis->GetComponentTransform().TransformVectorNoScale(PanelTraceOutward).GetSafeNormal();\n        FCollisionQueryParams Query(SCENE_QUERY_STAT(AnomaliaAdditionalPanelReview),false);Query.AddIgnoredActor(S);FHitResult Hit;\n        const bool bHit=GetWorld()->LineTraceSingleByChannel(Hit,Point+Outward*180,Point-Outward*50,ECC_Visibility,Query);\n        FHitResult PawnHit;\n        const bool bPawnHit=GetWorld()->SweepSingleByChannel(PawnHit,Point+Outward*180,Point-Outward*50,FQuat::Identity,\n            ECC_Pawn,FCollisionShape::MakeCapsule(5.f,10.f),Query);\n        const FString Id=Panel->PanelId.ToString();\n        if(Phase==40)\n        {\n            const FQuat Expected(Panel->LocalHingeAxis.GetSafeNormal(),FMath::DegreesToRadians(Panel->OpenAngleDegrees));\n            if(!Panel->bOpen || Panel->bObstructed || FMath::Abs(Panel->AngleDegrees-Panel->OpenAngleDegrees)>1.f ||\n               !Panel->GetRelativeTransform().GetRotation().Equals(Expected,.01f) || !Panel->IsVisible() || (bHit && Hit.GetComponent()==Panel) || (bPawnHit && PawnHit.GetComponent()==Panel))\n            {Finish(TEXT(\"Additional panel failed real axis/open-aperture check: \")+Id);return;}\n            if(V->SurvivalSystems->bEnabled && (Id==TEXT(\"hood\") || Id==TEXT(\"trunk\")))\n            {\n                auto* Systems=V->SurvivalSystems.Get();FString ServiceError;\n                if(!Systems->State.bKeyIssued && !Systems->Execute(S,EAnomaliaVehicleServiceAction::TakeInitialKey,0,0,ServiceError))\n                {Finish(TEXT(\"Physical vehicle key claim failed: \")+ServiceError);return;}\n                if(!Systems->HasPhysicalKey(S) || !Systems->CanStart(S))\n                {Finish(TEXT(\"Matching carried key and complete parts must permit ignition\"));return;}\n                if(Id==TEXT(\"hood\"))\n                {\n                    for(const auto Pair:{TPair<EAnomaliaVehicleServiceAction,EAnomaliaVehicleServiceAction>(EAnomaliaVehicleServiceAction::RemoveRadiator,EAnomaliaVehicleServiceAction::InstallRadiator),\n                        TPair<EAnomaliaVehicleServiceAction,EAnomaliaVehicleServiceAction>(EAnomaliaVehicleServiceAction::RemoveSparkPlug,EAnomaliaVehicleServiceAction::InstallSparkPlug)})\n                    {\n                        if(!Systems->Execute(S,Pair.Key,0,0,ServiceError) || Systems->CanStart(S) ||\n                           !Systems->Execute(S,Pair.Value,0,0,ServiceError) || !Systems->CanStart(S))\n                        {Finish(TEXT(\"Real inventory removal/reinstallation did not gate ignition: \")+ServiceError);return;}\n                    }\n                    if(!S->InventoryComponent->TryAddItem(TEXT(\"water\"),4)){Finish(TEXT(\"Coolant review water does not fit\"));return;}\n                    for(int32 Fill=0;Fill<4;++Fill)if(!Systems->Execute(S,EAnomaliaVehicleServiceAction::FillCoolant,0,0,ServiceError))\n                    {Finish(TEXT(\"Radiator refill inventory exchange failed: \")+ServiceError);return;}\n                    Checks.Add(TEXT(\"hood_open_inventory_radiator_and_spark_plug_removal_blocks_real_ignition\"));\n                }\n                else\n                {\n                    if(!Systems->Execute(S,EAnomaliaVehicleServiceAction::RemoveBattery,0,0,ServiceError) || Systems->CanStart(S) ||\n                       !Systems->Execute(S,EAnomaliaVehicleServiceAction::InstallBattery,0,0,ServiceError) || !Systems->CanStart(S))\n                    {Finish(TEXT(\"Boot battery removal/reinstallation did not gate ignition: \")+ServiceError);return;}\n                    if(!S->InventoryComponent->TryAddItem(TEXT(\"wood\"),1)){Finish(TEXT(\"Cargo review item does not fit\"));return;}\n                    const auto* Item=S->InventoryComponent->Stacks.FindByPredicate([](const auto& Stack){return Stack.ItemId==TEXT(\"wood\");});\n                    if(!Item || !Systems->Execute(S,EAnomaliaVehicleServiceAction::Deposit,Item->StackId,Item->Count,ServiceError))\n                    {Finish(TEXT(\"Open boot deposit failed: \")+ServiceError);return;}\n                    const float CargoMass=V->CargoIn