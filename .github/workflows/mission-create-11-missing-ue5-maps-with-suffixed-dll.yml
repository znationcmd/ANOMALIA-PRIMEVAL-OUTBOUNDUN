name: ANOMALIA - create all 11 missing real UE maps using successful suffixed UE5.8 DLL
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-create-11-missing-ue5-maps-with-suffixed-dll.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-30-map-real-native-authoring-after-suffix
  cancel-in-progress: false
jobs:
  create-all-absent-only:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
        with:
          path: eleven-world-import-${{ github.run_id }}
          sparse-checkout: |
            unreal/Scripts/create_anomalia_missing_native_world_20261118.py
            public/config/anomalia-11-missing-native-world-batch.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Verify original game, successful suffixed DLL, all existing maps and editor safety
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ANOMALIA\unreal'
          $out=Join-Path $root ('Saved\AllThirtyMapGeneration\SuffixImport\'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          "ANOMALIA_NATIVE_IMPORT_OUT=$out"|Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append
          $env:ANOMALIA_NATIVE_IMPORT_OUT=$out
          $map=Join-Path $root 'Content\Maps\ANOMALIA_Archipelago_v2.umap'
          $project=Join-Path $root 'AnomaliaPrimeval.uproject'
          if(!(Test-Path -LiteralPath $project -PathType Leaf) -or !(Test-Path -LiteralPath $map -PathType Leaf)){throw 'Original UE project / main map unavailable'}
          $suffixSource=Join-Path $root 'Saved\AllThirtyMapGeneration\ModuleSuffixBuild\44389702292\suffix-build-result.json'
          if(!(Test-Path -LiteralPath $suffixSource -PathType Leaf)){throw 'Successful suffix build receipt unavailable'}
          $receipt=Get-Content -LiteralPath $suffixSource -Raw -Encoding UTF8|ConvertFrom-Json
          if(!$receipt.originalDllHashUnchanged -or !$receipt.suffixDllExists -or !$receipt.mappingReferencesSuffix -or $receipt.originalMapModifiedCount -ne 0){throw 'Suffix build not validated'}
          if(!(Test-Path -LiteralPath $receipt.suffixDllPath -PathType Leaf)){throw 'New native DLL unavailable'}
          $modules=Join-Path $root 'Binaries\Win64\UnrealEditor.modules'
          if(!(Test-Path -LiteralPath $modules -PathType Leaf)){throw 'Unreal module manifest unavailable'}
          $entry=(Get-Content -LiteralPath $modules -Raw -Encoding UTF8|ConvertFrom-Json).Modules.AnomaliaPrimeval
          if($entry -ne 'UnrealEditor-AnomaliaPrimeval-32292.dll'){throw 'Native module no longer points to successfully compiled DLL'}
          $editor='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          if(!(Test-Path -LiteralPath $editor -PathType Leaf)){throw 'UE5.8 original editor missing'}
          $interactive=@(Get-Process -Name UnrealEditor,UnrealBuildTool,ShaderCompileWorker,AnomaliaPrimeval -ErrorAction SilentlyContinue)
          if($interactive.Count){throw 'Interactive editor or ongoing compile present; protect user work'}
          $headless=@(Get-CimInstance Win32_Process -Filter "Name='UnrealEditor-Cmd.exe'" -ErrorAction SilentlyContinue)
          if($headless.Count -gt 1){throw 'Other editor commandlets are already active'}
          if($headless.Count -eq 1){
            $p=$headless[0]
            $parent=Get-CimInstance Win32_Process -Filter ("ProcessId="+$p.ParentProcessId) -ErrorAction SilentlyContinue
            $old=((Get-Date).ToUniversalTime()-$p.CreationDate.ToUniversalTime()).TotalHours
            $cmd=[string]$p.CommandLine
            if($p.ProcessId -ne 26284 -or $parent -or $old -lt 6 -or !$cmd.Contains('audit.py') -or !$cmd.Contains('AnomaliaPrimeval.uproject') -or !$cmd.Contains('-unattended')){
              throw 'Unexpected UE commandlet active, refuse concurrent authoring'
            }
            Write-Host 'ANOMALIA_EXISTING_IDLE_ORPHAN_AUDIT_UNTOUCHED=TRUE'
          }
          if(([IO.DriveInfo]::new('C')).AvailableFreeSpace -lt 6GB -or ([IO.DriveInfo]::new('D')).AvailableFreeSpace -lt 12GB){throw 'Not enough disk reserve'}
          $existing=@(Get-ChildItem -LiteralPath (Join-Path $root 'Content\Maps') -File -Filter '*.umap'|ForEach-Object {[pscustomobject]@{path=$_.FullName;sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash}})
          $existing|Export-Csv -LiteralPath (Join-Path $out 'original-umaps-sha256.csv') -NoTypeInformation -Encoding UTF8
          $repo=Join-Path $env:GITHUB_WORKSPACE ('eleven-world-import-'+$env:GITHUB_RUN_ID)
          $manifest=Join-Path $repo 'public\config\anomalia-11-missing-native-world-batch.json'
          $script=Join-Path $repo 'unreal\Scripts\create_anomalia_missing_native_world_20261118.py'
          if(!(Test-Path -LiteralPath $manifest -PathType Leaf) -or !(Test-Path -LiteralPath $script -PathType Leaf)){throw 'Authoring script or manifest unavailable'}
          $spec=Get-Content -LiteralPath $manifest -Raw -Encoding UTF8|ConvertFrom-Json
          if(@($spec.missingMaps).Count -ne 11){throw 'Expected exactly 11 missing native maps'}
          "ANOMALIA_ELEVEN_MAP_MANIFEST=$manifest"|Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append
          "ANOMALIA_NEW_WORLD_SCRIPT=$script"|Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append
          $py='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          if(Test-Path -LiteralPath $py){& $py -B -m py_compile $script;if($LASTEXITCODE -ne 0){throw 'World creation Python script has syntax errors'}}
          Write-Host ('ANOMALIA_SUFFIX_NATIVE_IMPORT_READY '+([ordered]@{compiledSuffix=$entry;originalUmapsProtected=$existing.Count;plannedMissing=11;freeDBytes=([IO.DriveInfo]::new('D')).AvailableFreeSpace}|ConvertTo-Json -Compress))
      - name: Create 11 missing UE5 World Partition landscapes, stop safely at first failure
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $editor='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $manifest=Get-Content -LiteralPath $env:ANOMALIA_ELEVEN_MAP_MANIFEST -Raw -Encoding UTF8|ConvertFrom-Json
          $created=@();$already=@();$failed=@()
          foreach($m in @($manifest.missingMaps)){
            $id=$m.nativeId
            $map=Join-Path 'D:\ANOMALIA\unreal\Content\Maps' ('PRIGIMALIA_'+$id+'.umap')
            $actors=Join-Path 'D:\ANOMALIA\unreal\Content\__ExternalActors__\Maps' ('PRIGIMALIA_'+$id)
            $objects=Join-Path 'D:\ANOMALIA\unreal\Content\__ExternalObjects__\Maps' ('PRIGIMALIA_'+$id)
            if(Test-Path -LiteralPath $map -PathType Leaf){$already+=$id;Write-Host ('ANOMALIA_UMAP_EXISTS_PRESERVED='+$id);continue}
            if((Test-Path -LiteralPath $actors) -or (Test-Path -LiteralPath $objects)){
              $failed+=($id+':PARTIAL_EXISTING_WORLD_DATA_PRESERVED');break
            }
            if(([IO.DriveInfo]::new('C')).AvailableFreeSpace -lt 4GB -or ([IO.DriveInfo]::new('D')).AvailableFreeSpace -lt 8GB){$failed+=($id+':DISK_RESERVE');break}
            $other=@(Get-Process -Name UnrealEditor,UnrealBuildTool,ShaderCompileWorker,AnomaliaPrimeval -ErrorAction SilentlyContinue)
            $headless=@(Get-CimInstance Win32_Process -Filter "Name='UnrealEditor-Cmd.exe'" -ErrorAction SilentlyContinue|Where-Object {$_.ProcessId -ne 26284})
            if($other.Count -or $headless.Count){$failed+=($id+':CONCURRENT_EDITOR');break}
            $env:ANOMALIA_NEW_NATIVE_MAP_ID=$id
            $env:ANOMALIA_NATIVE_MAP_REPORT=Join-Path $env:ANOMALIA_NATIVE_IMPORT_OUT ('map-'+$id+'.json')
            $log=Join-Path $env:ANOMALIA_NATIVE_IMPORT_OUT ('map-'+$id+'.log')
            Write-Host "ANOMALIA_CREATE_NATIVE_UMAP_BEGIN=$id"
            & $editor 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject' "-ExecutePythonScript=$env:ANOMALIA_NEW_WORLD_SCRIPT" -unattended -nopause -nosound -nullrhi "-abslog=$log"
            $rc=$LASTEXITCODE
            $r=$null
            if(Test-Path -LiteralPath $env:ANOMALIA_NATIVE_MAP_REPORT -PathType Leaf){
              $r=Get-Content -LiteralPath $env:ANOMALIA_NATIVE_MAP_REPORT -Raw -Encoding UTF8|ConvertFrom-Json
              if($r.actualLandscapeSaved -and (Test-Path -LiteralPath $map -PathType Leaf) -and $r.landscapeComponents -eq $r.collisionComponents){
                $created+=$id;Write-Host "ANOMALIA_NATIVE_UMAP_CREATED=$id COMPONENTS=$($r.landscapeComponents)";continue
              }
              Write-Host "ANOMALIA_NATIVE_UMAP_FAILURE=$id STATE=$($r.state) ERROR=$($r.error)"
            }
            $tail=@(Get-Content -LiteralPath $log -Tail 140 -ErrorAction SilentlyContinue|Where-Object {$_ -match 'Error:|Exception|Traceback|Failed|not found|Editor startup failure'}|Select-Object -First 22)
            $tail|ForEach-Object {Write-Host ('ANOMALIA_UNREAL_MAP_DIAGNOSTIC '+$_)}
            $failed+=($id+':UE_EXIT_'+$rc)
            break
          }
          $out=[ordered]@{requested=11;created=$created;alreadyPresentPreserved=$already;failed=$failed;createdCount=$created.Count;all11Available=($created.Count+$already.Count -eq 11);actualCitiesBuilt=$false;completeBuildingInteriorsBuilt=$false;gameplayPlaytested=$false;originalUmapsOverwritten=0}
          $out|ConvertTo-Json -Depth 5|Set-Content -LiteralPath (Join-Path $env:ANOMALIA_NATIVE_IMPORT_OUT 'native-umap-creation-summary.json') -Encoding UTF8
          Write-Host ('ANOMALIA_11_MISSING_UMAP_RESULT '+($out|ConvertTo-Json -Depth 5 -Compress))
          if($failed.Count){throw ('Unreal level creation encountered a first failure: '+($failed -join ','))}
      - name: Verify all pre-existing original maps unchanged by SHA256
        if: always() && env.ANOMALIA_NATIVE_IMPORT_OUT != ''
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $csv=Join-Path $env:ANOMALIA_NATIVE_IMPORT_OUT 'original-umaps-sha256.csv'
          if(!(Test-Path -LiteralPath $csv -PathType Leaf)){exit 0}
          $old=@(Import-Csv -LiteralPath $csv -Encoding UTF8)
          $bad=@()
          foreach($m in $old){
            if(!(Test-Path -LiteralPath $m.path -PathType Leaf) -or (Get-FileHash -LiteralPath $m.path -Algorithm SHA256).Hash -ne $m.sha256){$bad+=$m.path}
          }
          Write-Host ('ANOMALIA_NATIVE_IMPORT_ORIGINAL_MAP_INTEGRITY '+([ordered]@{originalMaps=$old.Count;changedOriginalMaps=$bad.Count;changedPaths=$bad}|ConvertTo-Json -Depth 4 -Compress))
          if($bad.Count){throw 'An original user world changed unexpectedly'}
      - uses: actions/upload-artifact@v4
        if: always() && env.ANOMALIA_NATIVE_IMPORT_OUT != ''
        with:
          name: anomalia-11-new-real-ue5-umap-native-receipts
          path: ${{ env.ANOMALIA_NATIVE_IMPORT_OUT }}/*.json
          if-no-files-found: warn
