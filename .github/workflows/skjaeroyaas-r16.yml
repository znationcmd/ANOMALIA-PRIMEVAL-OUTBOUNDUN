name: SKJAEROYAAS Nordic Terrain R16
on:
  push:
    paths:
      - 'scripts/ue5/worldgen/generate_skjaeroyaas.py'
      - 'config/worldgen/expansion-worlds.json'
      - 'config/worldgen/starter-worlds.json'
      - 'tests/test_skjaeroyaas_nordic_terrain.py'
      - '.github/workflows/skjaeroyaas-r16.yml'
  pull_request:
    paths:
      - 'scripts/ue5/worldgen/generate_skjaeroyaas.py'
      - 'config/worldgen/expansion-worlds.json'
      - 'config/worldgen/starter-worlds.json'
      - 'tests/test_skjaeroyaas_nordic_terrain.py'
      - '.github/workflows/skjaeroyaas-r16.yml'

jobs:
  build-nordic-terrain-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run seams / source-isolation / catalog tests
        run: |
          python -m unittest discover -s tests -p 'test_skjaeroyaas_nordic_terrain.py' -v
          python -m unittest discover -s tests -p 'test_worldgen_preview.py' -v
      - name: Generate full 15x15 km Nordic R16 source (9 tiles)
        run: |
          python scripts/ue5/worldgen/generate_skjaeroyaas.py --output /tmp/SKJAEROYAAS_R16_SOURCE --samples 505 --preview-size 512
          python scripts/ue5/worldgen/preview_world.py --world skjaeroyaas --write --output /tmp/SKJAEROYAAS_PCG_PREVIEW
      - name: Upload real RAW16 heightmap source and overview
        uses: actions/upload-artifact@v4
        with:
          name: ANOMALIA-SKJAEROYAAS-15KM-R16-RAW-SOURCE
          path: |
            /tmp/SKJAEROYAAS_R16_SOURCE/
            /tmp/SKJAEROYAAS_PCG_PREVIEW/
          if-no-files-found: error
          retention-days: 30
