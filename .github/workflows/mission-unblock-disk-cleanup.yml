name: ANOMALIA mission - unblock large disk cleanup
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-unblock-disk-cleanup.yml']
permissions:
  actions: write
  contents: read
jobs:
  release_old_transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only obsolete checkpointed transfer holding the Windows runner
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          run=42377380936
          status=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .status)
          if [ "$status" = completed ]; then
            echo "Old transfer already stopped"
            exit 0
          fi
          gh api --method POST "repos/$GH_REPO/actions/runs/$run/cancel" || true
          sleep 15
          status=$(gh api "repos/$GH_REPO/actions/runs/$run" --jq .status)
          if [ "$status" != completed ]; then
            gh api --method POST "repos/$GH_REPO/actions/runs/$run/force-cancel"
          fi
          echo "Stopped obsolete transfer so pending cache cleanup can execute; all source files retained."
