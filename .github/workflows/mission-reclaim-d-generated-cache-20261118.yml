name: ANOMALIA - reclaim cold generated D Unreal caches without harming game
on:
  push:
    branches: [mission/finalisation-20261104]
    paths:
      - '.github/workflows/mission-reclaim-d-generated-cache-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reclaim:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: d-generated-cache-${{ github.run_id }}
          sparse-checkout: scripts/ue5/reclaim_only_regenerable_d_unreal_cache_20261118.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Remove only cold D derived data and asset registry caches and stale City Sample VS project files
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('d-generated-cache-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          "D_CACHE_RECOVERY_OUT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:D_CACHE_RECOVERY_OUT=$dir
          $python='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE ('d-generated-cache-'+$env:GITHUB_RUN_ID+'\scripts\ue5\reclaim_only_regenerable_d_unreal_cache_20261118.py')
          if (!(Test-Path -LiteralPath $python -PathType Leaf) -or !(Test-Path -LiteralPath $script -PathType Leaf)) {throw 'Required UE Python or safe cleanup script not found'}
          & $python -B $script
          if ($LASTEXITCODE -ne 0) {throw 'D safe cache cleanup failed; game originals preserved'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d-cache-safe-recovery-receipts
          path: ${{ runner.temp }}/d-generated-cache-${{ github.run_id }}/
          if-no-files-found: warn
