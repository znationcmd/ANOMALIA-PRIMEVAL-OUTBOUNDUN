name: CITY SAMPLE - copy complete 69GB source into connected Google Drive
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/citysample-copy-cloud-20261111.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: true
jobs:
  copy-citysample-source-to-cloud:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 360
    steps:
      - name: Free verified archive duplicate and regenerable Unreal caches
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $stage='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $marker=Join-Path $stage '.skarvik-ci-stage-marker'
          if(!(Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw).Trim() -ne '41188816555'){throw 'Untrusted native stage'}
          $receiptPath=Join-Path $env:GITHUB_WORKSPACE 'CITY_SAMPLE_SPACE_FREED_20261111.json'
          $receipt=[ordered]@{
            utc=[DateTime]::UtcNow.ToString('o')
            beforeC=([IO.DriveInfo]::new('C')).AvailableFreeSpace
            beforeD=([IO.DriveInfo]::new('D')).AvailableFreeSpace
            removedVerifiedArchives=@()
            removedRegenerableCaches=@()
            mapsDeleted=0
          }
          $sourceZip='D:\ANOMALIA\FabImports\CitySample\CitySample_HoudiniFiles.zip'
          $cloudZip='H:\Mon Drive\ANOMALIAZ_CITYSAMPLE_SOURCE_20261111\CitySample_HoudiniFiles.zip'
          $drive=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='H:'"
          if(!$drive -or !$drive.VolumeName.StartsWith('znation.cmd@gmail.com')){throw 'Cloud account mismatch'}
          # Authenticated Drive API already confirms this exact committed cloud
          # object in this unique folder, size 585442560 bytes, one revision.
          if(Test-Path -LiteralPath $sourceZip){
            if(!(Test-Path -LiteralPath $cloudZip)){throw 'Verified archive missing from cloud mount'}
            foreach($file in @($sourceZip,$cloudZip)){
              $item=Get-Item -LiteralPath $file
              if($item.Length -ne 585442560){throw 'Archive byte length changed'}
            }
            $originalHash=(Get-FileHash -LiteralPath $sourceZip -Algorithm SHA256).Hash
            $cloudHash=(Get-FileHash -LiteralPath $cloudZip -Algorithm SHA256).Hash
            if($originalHash -ne $cloudHash){throw 'Archive content differs; keep original'}
            $record=[ordered]@{
              source=$sourceZip
              cloudFileId='1Iyxh1u_YAPypNCJbq4Ie5gEPwrRUHDmF'
              cloudFolderId='1dTKVmD1glLXWql4qt0i9Qe0BllCuQqfZ'
              bytes=585442560
              sha256=$originalHash
              cloudServerObjectPresencePreviouslyVerified=$true
              sourceAndCloudMountContentIdentical=$true
            }
            # Keep a receipt before removing only the verified standalone ZIP.
            $auditFolder='D:\ANOMALIA\StorageReceipts'
            if(!(Test-Path -LiteralPath $auditFolder)){New-Item -ItemType Directory -Path $auditFolder|Out-Null}
            $record|ConvertTo-Json -Depth 4|Set-Content -LiteralPath (Join-Path $auditFolder 'CitySample_HoudiniFiles_VERIFIED_CLOUD_20261111.json') -Encoding UTF8
            Remove-Item -LiteralPath $sourceZip -Force
            if(Test-Path -LiteralPath $sourceZip){throw 'Verified duplicate could not be removed'}
            $receipt.removedVerifiedArchives+=,$record
            Write-Host 'CITY_SAMPLE_VERIFIED_ARCHIVE_REMOVED_BYTES=585442560'
          }
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count -eq 0){
            foreach($cache in @(
              'C:\Users\utilisateur\AppData\Local\UnrealEngine\Common\DerivedDataCache',
              (Join-Path $stage 'DerivedDataCache')
            )){
              if(!(Test-Path -LiteralPath $cache)){continue}
              $root=Get-Item -LiteralPath $cache -Force
              if(!$root.PSIsContainer -or ($root.Attributes -band [IO.FileAttributes]::ReparsePoint)){throw 'Unsafe cache root'}
              if(@(Get-ChildItem -LiteralPath $cache -Recurse -Force -Attributes ReparsePoint -ErrorAction Stop).Count){throw 'Reparse point found inside cache'}
              $removed=[int64]0
              foreach($file in @(Get-ChildItem -LiteralPath $cache -File -Recurse -Force -ErrorAction Stop)){
                $length=$file.Length
                try{Remove-Item -LiteralPath $file.FullName -Force -ErrorAction Stop;$removed+=[int64]$length}catch{Write-Host 'CACHE_FILE_IN_USE_SKIPPED=true'}
              }
              $receipt.removedRegenerableCaches+=,[ordered]@{path=$cache;removedBytes=$removed}
              Write-Host ('REGENERABLE_CACHE_REMOVED_BYTES='+$removed)
            }
          } else {Write-Host 'CACHE_CLEAN_SKIPPED_EDITOR_ACTIVE=true'}
          $receipt.afterC=([IO.DriveInfo]::new('C')).AvailableFreeSpace
          $receipt.afterD=([IO.DriveInfo]::new('D')).AvailableFreeSpace
          $receipt.recoveredCBytes=$receipt.afterC-$receipt.beforeC
          $receipt.recoveredDBytes=$receipt.afterD-$receipt.beforeD
          $receipt|ConvertTo-Json -Depth 6|Set-Content -LiteralPath $receiptPath -Encoding UTF8
          Write-Host ('ACTUAL_RECOVERED_C_GIB='+[math]::Round($receipt.recoveredCBytes/1GB,3))
          Write-Host ('ACTUAL_RECOVERED_D_GIB='+[math]::Round($receipt.recoveredDBytes/1GB,3))
          Write-Host ('CURRENT_FREE_C_GIB='+[math]::Round($receipt.afterC/1GB,3))
          Write-Host ('CURRENT_FREE_D_GIB='+[math]::Round($receipt.afterD/1GB,3))
      - uses: actions/upload-artifact@v4
        with:
          name: CITY-SAMPLE-SPACE-FREED-20261111
          path: CITY_SAMPLE_SPACE_FREED_20261111.json
          if-no-files-found: error
      - name: Copy complete original source without deleting source or existing maps
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $source='D:\ANOMALIA\FabImports\CitySample'
          $dest='H:\Mon Drive\ANOMALIAZ_CITYSAMPLE_SOURCE_20261111'
          $reportPath=Join-Path $env:GITHUB_WORKSPACE 'CITY_SAMPLE_CLOUD_COPY_20261111.json'
          $log=Join-Path $env:GITHUB_WORKSPACE 'CITY_SAMPLE_CLOUD_COPY_20261111.log'
          $report=[ordered]@{state='PREFLIGHT';source=$source;destination=$dest;cloudFolderId='1dTKVmD1glLXWql4qt0i9Qe0BllCuQqfZ';sourceDeleted=$false;mapsModified=$false;cloudServerUploadVerified=$false}
          try {
            if(!(Test-Path -LiteralPath (Join-Path $source 'CitySample.uproject'))){throw 'Original standalone City Sample project not found'}
            $volume=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='H:'"
            if(!$volume -or !$volume.VolumeName.StartsWith('znation.cmd@gmail.com')){throw 'H is not the confirmed connected Google Drive account'}
            # This folder was created through the authenticated Drive connector.
            # Wait for that same folder; never create a duplicate in a guessed path.
            $deadline=[DateTime]::UtcNow.AddMinutes(3)
            while(!(Test-Path -LiteralPath $dest) -and [DateTime]::UtcNow -lt $deadline){Start-Sleep -Seconds 5}
            if(!(Test-Path -LiteralPath $dest)){throw 'Cloud-created destination has not appeared on this Google Drive mount'}
            $files=@(Get-ChildItem -LiteralPath $source -File -Recurse -Force -ErrorAction Stop)
            $total=[int64]0;$largest=[int64]0
            foreach($f in $files){$total+=[int64]$f.Length;if($f.Length -gt $largest){$largest=[int64]$f.Length}}
            if($files.Count -lt 120000 -or $total -lt 60GB -or $total -gt 80GB){throw 'Original source count or size changed unexpectedly'}
            $freeC=([IO.DriveInfo]::new('C')).AvailableFreeSpace
            function Wait-CopyHeadroom([int64]$requiredBytes){
              $waitLimit=[DateTime]::UtcNow.AddMinutes(45)
              while(([IO.DriveInfo]::new('C')).AvailableFreeSpace -lt $requiredBytes){
                if(!(Get-Process GoogleDriveFS -ErrorAction SilentlyContinue)){throw 'Google Drive desktop is not running'}
                Write-Host ('CITY_SAMPLE_WAITING_FOR_CLOUD_UPLOAD_CACHE_FREE_GIB='+[math]::Round(([IO.DriveInfo]::new('C')).AvailableFreeSpace/1GB,3))
                if([DateTime]::UtcNow -gt $waitLimit){throw 'Cache headroom did not recover in 45 minutes; originals and resumable destination retained'}
                Start-Sleep -Seconds 30
              }
            }
            Wait-CopyHeadroom (8GB+$largest+256MB)
            $report.sourceFiles=$files.Count;$report.sourceBytes=$total
            $report.largestFileBytes=$largest
            $report.state='COPYING_TO_GOOGLE_DRIVE_DESKTOP_SERVER_SYNC_PENDING'
            $report|ConvertTo-Json -Depth 5|Set-Content -LiteralPath $reportPath -Encoding UTF8
            Write-Host ('CITY_SAMPLE_CLOUD_COPY_STARTED=true')
            Write-Host ('CITY_SAMPLE_CLOUD_SOURCE_FILES='+$files.Count)
            Write-Host ('CITY_SAMPLE_CLOUD_SOURCE_BYTES='+$total)
            Write-Host ('CITY_SAMPLE_CLOUD_SOURCE_GIB='+[math]::Round($total/1GB,3))
            Write-Host ('CITY_SAMPLE_CLOUD_TARGET='+$dest)
            Write-Host 'CITY_SAMPLE_CLOUD_COPY_NO_SOURCE_DELETION=true'
            # Whole directory, resumable; no MOVE, MIR or PURGE. Single-threaded
            # Google Drive cannot answer LFSM volume queries. Independently monitor
            # physical C: cache space every second and retain an 8 GiB reserve.
            $copyFinished=$false
            $copyPass=0
            while(!$copyFinished){
              Wait-CopyHeadroom (8GB+$largest+256MB)
              $copyPass++
              Write-Host ('CITY_SAMPLE_COPY_PASS='+$copyPass)
              $copyArgs=@(('"'+$source+'"'),('"'+$dest+'"'),'/E','/COPY:DAT','/DCOPY:DAT','/Z','/XJ','/R:2','/W:5','/NFL','/NDL','/NP',('/LOG+:"'+$log+'"'))
              $process=Start-Process -FilePath robocopy.exe -ArgumentList $copyArgs -PassThru -NoNewWindow
              $null=$process.Handle
              $lastWrite=[uint64]0;$lastChange=[DateTime]::UtcNow
              $copyTick=0;$pausedForCache=$false
              while(!$process.HasExited){
                Start-Sleep -Seconds 1
                $copyTick++
                $process.Refresh()
                $io=Get-CimInstance Win32_Process -Filter ("ProcessId="+$process.Id) -ErrorAction SilentlyContinue
                if($io){
                  $written=[uint64]$io.WriteTransferCount
                  if($written -ne $lastWrite){$lastChange=[DateTime]::UtcNow;$lastWrite=$written}
                  if($copyTick % 30 -eq 0){Write-Host ('CITY_SAMPLE_COPY_IO_BYTES='+$written+';CACHE_FREE_GIB='+[math]::Round(([IO.DriveInfo]::new('C')).AvailableFreeSpace/1GB,3))}
                }
                if(([IO.DriveInfo]::new('C')).AvailableFreeSpace -lt 8GB){
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                  $pausedForCache=$true
                  Write-Host 'CITY_SAMPLE_COPY_PAUSED_FOR_CLOUD_CACHE_WILL_RESUME=true'
                  break
                }
                if(([DateTime]::UtcNow-$lastChange).TotalMinutes -gt 20){
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                  throw 'Copy made no I/O progress for 20 minutes; destination may be full or awaiting cloud upload'
                }
              }
              $process.WaitForExit()
              if($pausedForCache){continue}
              Write-Host ('CITY_SAMPLE_ROBOCOPY_EXIT_CODE='+$process.ExitCode)
              if($null -eq $process.ExitCode){throw 'Robocopy exit status unavailable; inspect transfer log'}
              $report.robocopyExitCode=$process.ExitCode
              if($process.ExitCode -ge 8){throw ('Robocopy copy failure '+$process.ExitCode)}
              $copyFinished=$true
            }
            $destFiles=@(Get-ChildItem -LiteralPath $dest -File -Recurse -Force -ErrorAction Stop)
            $lookup=@{}
            foreach($f in $destFiles){$lookup[$f.FullName.Substring($dest.Length).TrimStart('\')]=[int64]$f.Length}
            foreach($f in $files){
              $rel=$f.FullName.Substring($source.Length).TrimStart('\')
              if(!$lookup.ContainsKey($rel) -or $lookup[$rel] -ne $f.Length){throw ('Incomplete desktop copy: '+$rel)}
            }
            $report.state='ALL_SOURCE_FILES_COPIED_TO_DRIVE_DESKTOP_SERVER_UPLOAD_NOT_YET_VERIFIED'
            $report.desktopCopiedFiles=$files.Count
            $report.desktopCopiedBytes=$total
            Write-Host ('CITY_SAMPLE_CLOUD_DESKTOP_COPY_COMPLETE_FILES='+$files.Count)
            Write-Host 'CITY_SAMPLE_SERVER_UPLOAD_VERIFIED=false'
            Write-Host 'CITY_SAMPLE_ORIGINAL_SOURCE_RETAINED=true'
          } catch {
            if(Test-Path -LiteralPath $log){Get-Content -LiteralPath $log -Tail 45 | Write-Host}
            $report.state='STOPPED_NO_SOURCE_DELETION'
            $report.error=$_.Exception.Message
            Write-Host ('CITY_SAMPLE_CLOUD_COPY_BLOCKED='+$report.error)
            throw
          } finally {
            $report|ConvertTo-Json -Depth 5|Set-Content -LiteralPath $reportPath -Encoding UTF8
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CITY-SAMPLE-CLOUD-COPY-STATUS-20261111
          path: |
            CITY_SAMPLE_CLOUD_COPY_20261111.json
            CITY_SAMPLE_CLOUD_COPY_20261111.log
          if-no-files-found: warn
          retention-days: 30
