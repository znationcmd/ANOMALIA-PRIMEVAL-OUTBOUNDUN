name: ANOMALIA mission - existing Survival character PIE regression
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-survival-pie.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  survival:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 25
    steps:
      - name: Stage existing real character assets into the validated copy with strict preservation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIA_MISSION_41801391717\unreal'
          $out=Join-Path $env:RUNNER_TEMP ('survival-regression-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out | Out-Null
          "MISSION_SURVIVAL_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if(!(Test-Path -LiteralPath (Join-Path $root 'Binaries\Win64\UnrealEditor-AnomaliaZPrigimalia.dll'))){throw 'Previously compiled real Editor binary missing'}
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Another Unreal process is active'}
          $source='D:\ANOMALIA\unreal\Content'
          $files=@(Get-ChildItem -LiteralPath (Join-Path $source 'Survival_Character') -File -Recurse -ErrorAction Stop)
          $bp=Join-Path $source 'Anomalia\Characters\BP_Anomalia_Survival.uasset'
          if(!(Test-Path -LiteralPath $bp)){throw 'Existing real Survival Blueprint missing; do not fabricate one'}
          $files+=Get-Item -LiteralPath $bp
          $bytes=($files | Measure-Object Length -Sum).Sum
          $newBytes=0
          foreach($file in $files){
            $relative=$file.FullName.Substring($source.Length+1)
            if(!(Test-Path -LiteralPath (Join-Path (Join-Path $root 'Content') $relative))){$newBytes+=$file.Length}
          }
          $disk=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          $os=Get-CimInstance Win32_OperatingSystem
          [ordered]@{assetBytes=$bytes;newCopyBytes=$newBytes;physicalCFreeBytes=$disk.FreeSpace;freeMemoryKiB=$os.FreePhysicalMemory;freeVirtualMemoryKiB=$os.FreeVirtualMemory;minimumDiskReserveBytes=(4GB+3*$newBytes)} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $out 'preflight.json') -Encoding UTF8
          if($disk.FreeSpace -lt (4GB+3*$newBytes) -or $os.FreePhysicalMemory*1KB -lt 4GB -or $os.FreeVirtualMemory*1KB -lt 8GB){throw 'Insufficient measured reserve for real character PIE; preserve all files'}
          $receipt=@()
          foreach($file in $files){
            $relative=$file.FullName.Substring($source.Length+1)
            $target=Join-Path (Join-Path $root 'Content') $relative
            $hash=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            if(Test-Path -LiteralPath $target){
              if((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash -ne $hash){throw "Different existing validation asset; refusing overwrite: $relative"}
            }else{
              New-Item -ItemType Directory -Path (Split-Path $target -Parent) -Force | Out-Null
              Copy-Item -LiteralPath $file.FullName -Destination $target
            }
            if((Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash -ne $hash -or (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash -ne $hash){throw 'Source/copy asset hash mismatch'}
            $receipt+=[ordered]@{relative=$relative;sha256=$hash;originalUnchanged=$true}
          }
          $receipt | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $out 'asset-copy-receipt.json') -Encoding UTF8
          $script=Join-Path $out 'verify_anomalia_survival_pie.py'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN/d611f43978c561707c5cf52e2ad886eef2f06d5a/unreal/Content/Python/verify_anomalia_survival_pie.py' -OutFile $script
          if((& git hash-object -- $script).Trim() -ne 'f3d7d48abe7f55a20ccde0a14b4a386bdb2c2f29'){throw 'Existing PIE regression script blob differs'}
          "MISSION_SURVIVAL_SCRIPT=$script" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise existing animated Survival pawn in actual PIE without saving any map
        timeout-minutes: 15
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $env:ANOMALIA_PIE_REPORT=Join-Path $env:MISSION_SURVIVAL_OUT 'pie'
          $editor='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor.exe'
          $project='C:\ANOMALIA_MISSION_41801391717\unreal\AnomaliaZPrigimalia.uproject'
          $ErrorActionPreference='Continue'
          $arguments=@($project,'-d3d11','-unattended','-nosplash','-nopause','-nosound',"-ExecutePythonScript=$env:MISSION_SURVIVAL_SCRIPT","-abslog=$env:MISSION_SURVIVAL_OUT\editor.log")
          $process=Start-Process -FilePath $editor -ArgumentList $arguments -PassThru -Wait -RedirectStandardOutput (Join-Path $env:MISSION_SURVIVAL_OUT 'process.log') -RedirectStandardError (Join-Path $env:MISSION_SURVIVAL_OUT 'stderr.log')
          $code=$process.ExitCode
          $ErrorActionPreference='Stop'
          $result=Get-Content -LiteralPath (Join-Path $env:ANOMALIA_PIE_REPORT 'report.json') -Raw | ConvertFrom-Json
          if($code -ne 0 -or $result.state -ne 'SINGLE_PLAYER_PIE_API_CHECKS_PASSED_NOT_FULL_GAMEPLAY_ACCEPTANCE'){throw 'Actual character PIE regression failed'}
      - uses: actions/upload-artifact@v4
        if: always() && env.MISSION_SURVIVAL_OUT != ''
        with:
          name: mission-survival-pie
          path: ${{ env.MISSION_SURVIVAL_OUT }}/
          if-no-files-found: error
