                          report["pawnLocation"]=[pos.x,pos.y,pos.z]
                      report["directionalLights"]=len(unreal.GameplayStatics.get_all_actors_of_class(world,unreal.DirectionalLight))
                      state["phase"]="capture"
                  path=out/("native_%04d.png"%state["frame"])
                  if state.get("pending"):
                      if not path.exists():return
                      report["frames"].append({"file":path.name,"timeSeconds":now-state["begin"]})
                      state["frame"]+=1
                      state["pending"]=False
                      write()
                      if state["frame"]>=60:
                          report["state"]="ACTUAL_RUNTIME_VIEWPORT_FRAMES_CAPTURED"
                          write()
                          unreal.unregister_slate_post_tick_callback(state["handler"])
                          unreal.SystemLibrary.execute_console_command(world,"quit")
                          return
                      state["next"]=now+0.125
                      return
                  command='HighResShot 960x540 filename="'+str(path).replace("\\","/")+'"'
                  unreal.SystemLibrary.execute_console_command(world,command)
                  state["pending"]=True
              except Exception:
                  report["state"]="FAILED"
                  report["error"]=traceback.format_exc()
                  write()
                  try:unreal.unregister_slate_post_tick_callback(state["handler"])
                  except:pass
                  try:unreal.SystemLibrary.execute_console_command(world,"quit")
                  except:pass
          state["handler"]=unreal.register_slate_post_tick_callback(tick)
          write()
          '@|Set-Content $script -Encoding utf8
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor.exe'
          $project='D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject'
          $log=Join-Path $out 'game.log'
          $commands='t.IdleWhenNotForeground 0,r.ScreenPercentage 60,r.ShadowQuality 0,r.DynamicGlobalIlluminationMethod 0,r.ReflectionMethod 0,py '+$script.Replace('\','/')
          $args=@(('"'+$project+'"'),'/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1?AnomaliaServerId=native-video','-game','-RenderOffscreen','-windowed','-ResX=960','-ResY=540','-d3d11','-sm5','-unattended','-nosound','-nosplash',('-abslog="'+$log+'"'),('-ExecCmds="'+$commands+'"'))
          $p=Start-Process $editor -ArgumentList $args -PassThru
          if(!$p.WaitForExit(240000)){$p.CloseMainWindow()|Out-Null;if(!$p.WaitForExit(10000)){$p.Kill()}}
          $receipt=Join-Path $out 'receipt.json'
          if(Test-Path $receipt){Get-Content $receipt -Raw|Write-Host}
          Get-Content $log -Tail 80|Write-Host
          $frames=@(Get-ChildItem $out -Filter 'native_*.png')
          Write-Host ('NATIVE_FRAME_COUNT='+$frames.Count)
