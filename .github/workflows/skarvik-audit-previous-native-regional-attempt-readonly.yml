name: SKARVIK - read-only audit of previous native regional road attempt
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-audit-previous-native-regional-attempt-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  audit-previous-attempt:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Read-only inventory and hashes of prior road attempt, maps and Unreal logs
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $marker=Join-Path $root '.skarvik-ci-stage-marker'
          if(!(Test-Path -LiteralPath $marker) -or (Get-Content $marker -Raw).Trim() -ne '41188816555'){throw 'Untrusted native stage marker'}
          $protected=@(
            'D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap',
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_FINAL_v1.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_GRADED_v2.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_ISLANDS_v1.umap'),
            (Join-Path $root 'Content\Map\Big_City_LVL.umap'))
          foreach($p in $protected){if(!(Test-Path -LiteralPath $p)){throw "Protected map missing: $p"}}
          $pilot=Join-Path $root 'Saved\SkarvikCity\FinalNativeOriginalCoastRegionalRoadPilot20261101'
          $logs=Join-Path $root 'Saved\Logs'
          $saved=Join-Path $root 'Saved\SkarvikCity'
          $out=Join-Path $env:GITHUB_WORKSPACE 'skarvik-previous-regional-attempt-readonly-audit.json'
          function FileInfo($p){
            $f=Get-Item -LiteralPath $p
            $h=(Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash
            [pscustomobject]@{path=$p;length=$f.Length;lastWriteUtc=$f.LastWriteTimeUtc.ToString('o');sha256=$h}
          }
          $files=@()
          if(Test-Path -LiteralPath $pilot){$files+=Get-ChildItem -LiteralPath $pilot -File -Recurse -Force | ForEach-Object {FileInfo $_.FullName}}
          $backup=Join-Path $pilot 'final-before-native-regional-pilot.umap'
          $backupInfo=$null
          if(Test-Path -LiteralPath $backup){$backupInfo=FileInfo $backup}
          $reports=@()
          if(Test-Path -LiteralPath $saved){
            $reports+=Get-ChildItem -LiteralPath $saved -File -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object {$_.Name -match 'regional|road|skarvik|pilot|build|reopen|audit'} |
              ForEach-Object {FileInfo $_.FullName}
          }
          $logFiles=@()
          if(Test-Path -LiteralPath $logs){
            $logFiles+=Get-ChildItem -LiteralPath $logs -File -Force -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTimeUtc -Descending | Select-Object -First 30 |
              ForEach-Object {FileInfo $_.FullName}
          }
          $mapInfo=@($protected | ForEach-Object {FileInfo $_})
          $result=[pscustomobject]@{
            state='READ_ONLY_PREVIOUS_NATIVE_REGIONAL_ATTEMPT_AUDIT'
            readOnly=$true
            stageMarker=(Get-Content $marker -Raw).Trim()
            pilotDirectoryExists=(Test-Path -LiteralPath $pilot)
            backupExists=(Test-Path -LiteralPath $backup)
            backup=$backupInfo
            pilotFiles=@($files)
            matchingSavedReports=@($reports)
            recentUnrealLogs=@($logFiles)
            protectedMaps=@($mapInfo)
            interpretation='Inventory and hashes only; no Unreal Editor launch, no map write, no deletion, no overwrite.'
          }
          $result | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $out -Encoding UTF8
          Write-Host ('PILOT_BACKUP_EXISTS='+$result.backupExists)
          Write-Host ('PILOT_FILES='+$files.Count)
          Write-Host ('SAVED_REPORTS='+$reports.Count)
          Write-Host ('RECENT_UNREAL_LOGS='+$logFiles.Count)
          Write-Host 'READ_ONLY_AUDIT_COMPLETE=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarvik-previous-native-regional-attempt-readonly-audit
          path: skarvik-previous-regional-attempt-readonly-audit.json
          if-no-files-found: warn
