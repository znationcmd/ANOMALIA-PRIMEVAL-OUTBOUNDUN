name: ANOMALIA - smoke test the installed SKARVIK final-map game
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-skarvik-installed-game-smoke.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  installed-game-smoke:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Launch the already installed standalone game against the final SKARVIK map
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected Windows PC runner'}
          $busy=@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue)
          if($busy.Count){throw 'An Unreal or game session is already open; preserve it and do not launch a second copy'}
          $desktop=[Environment]::GetFolderPath('Desktop')
          $link=Join-Path $desktop 'ANOMALIA''Z PRIGIMALIA - VRAI JEU SKARVIK.lnk'
          if(!(Test-Path -LiteralPath $link)){throw 'The installed SKARVIK game shortcut is missing'}
          $shell=New-Object -ComObject WScript.Shell
          $shortcut=$shell.CreateShortcut($link)
          $exe=[string]$shortcut.TargetPath
          $expected='/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1'
          if(!(Test-Path -LiteralPath $exe)){throw 'The existing standalone game executable is missing'}
          if(!$shortcut.Arguments.Contains($expected)){throw 'The installed shortcut does not request the final SKARVIK map'}
          $paks=Join-Path (Split-Path $exe -Parent) 'AnomaliaPrimeval\Content\Paks'
          $containers=@()
          if(Test-Path $paks){$containers=@(Get-ChildItem -LiteralPath $paks -File -ErrorAction SilentlyContinue|Where-Object{$_.Extension -in '.pak','.utoc','.ucas'}|ForEach-Object{$_.Name.ToString()})}
          if($containers.Count -eq 0){throw 'No cooked PAK or IoStore containers found beside the installed game'}
          $out=Join-Path $env:GITHUB_WORKSPACE ('installed-final-map-smoke-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $stdout=Join-Path $out 'game-stdout.log';$stderr=Join-Path $out 'game-stderr.log'
          $launchArgs=@($shortcut.Arguments,'-windowed','-ResX=1280','-ResY=720','-log','-stdout','-FullStdOutLogOutput')
          $proc=$null;$alive=$false;$exitCode=$null;$mapLoadLine=$null
          try{
            $proc=Start-Process -FilePath $exe -ArgumentList $launchArgs -WorkingDirectory (Split-Path $exe -Parent) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            for($i=0;$i -lt 50;$i++){Start-Sleep -Seconds 1;$proc.Refresh();if($proc.HasExited){$exitCode=$proc.ExitCode;break}}
            $proc.Refresh();$alive=!$proc.HasExited
            if(!$alive -and $null -eq $exitCode){$exitCode=$proc.ExitCode}
            $logs=@()
            if(Test-Path $stdout){$logs+=@(Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue|ForEach-Object{$_.ToString()})}
            if(Test-Path $stderr){$logs+=@(Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue|ForEach-Object{$_.ToString()})}
            $savedLogs=Join-Path (Split-Path $exe -Parent) 'AnomaliaPrimeval\Saved\Logs'
            if(Test-Path $savedLogs){$latest=Get-ChildItem -LiteralPath $savedLogs -Filter '*.log' -File|Sort-Object LastWriteTime -Descending|Select-Object -First 1;if($latest){$logs+=@(Get-Content -LiteralPath $latest.FullName -Tail 3000 -ErrorAction SilentlyContinue|ForEach-Object{$_.ToString()})}}
            $mapMatch=$logs|Where-Object{$_ -match '(?i)(LoadMap|Browse|Bringing World).*(PRIGIMALIA_SKARVIK_FINAL_v1)'}|Select-Object -First 1
            if($mapMatch){$mapLoadLine=$mapMatch.ToString()}
            if($logs.Count){$logs|Select-String -Pattern 'PRIGIMALIA_SKARVIK_FINAL_v1|LoadMap|Browse|Bringing World|Error:|Fatal'|Select-Object -Last 40|ForEach-Object{Write-Host ('GAME_LOG '+$_.Line.ToString())}}
          }finally{
            if($proc){$proc.Refresh();if(!$proc.HasExited){$null=$proc.CloseMainWindow();if(!$proc.WaitForExit(8000)){Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue};Write-Host 'TEST_CLOSED_ONLY_ITS_OWN_GAME_PROCESS=true'}}
          }
          $report=[ordered]@{state='INSTALLED_FINAL_MAP_SMOKE';executableExists=$true;finalMapArgumentPresent=$true;cookedContainers=@($containers).Count;processStayedOpen50Seconds=$alive;gameExitCode=$exitCode;mapLoadObservedInRuntimeLog=[bool]$mapLoadLine;mapLoadLogLine=$mapLoadLine}
          $report|ConvertTo-Json -Depth 3|Set-Content -LiteralPath (Join-Path $out 'result.json') -Encoding utf8
          Write-Host ('INSTALLED_FINAL_MAP_SMOKE='+($report|ConvertTo-Json -Depth 3 -Compress))
          if(!$alive){throw 'Installed game exited before the 50-second smoke check completed'}
          if(!$mapLoadLine){throw 'The game stayed open, but its runtime log did not confirm the final map load'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-skarvik-final-map-smoke
          path: installed-final-map-smoke-*\result.json
          if-no-files-found: warn
