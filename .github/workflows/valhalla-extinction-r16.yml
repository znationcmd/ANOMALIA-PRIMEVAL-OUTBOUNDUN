name: VALHALLA EXTINCTION 24km original R16 source
on:
  push:
    paths:
      - 'scripts/ue5/worldgen/generate_valhalla_extinction.py'
      - 'unreal/EditorPython/stage_valhalla_extinction_world.py'
      - 'config/worldgen/valhalla-*'
      - 'tests/test_valhalla_extinction.py'
      - '.github/workflows/valhalla-extinction-r16.yml'
  pull_request:
    paths:
      - 'scripts/ue5/worldgen/generate_valhalla_extinction.py'
      - 'unreal/EditorPython/stage_valhalla_extinction_world.py'
      - 'config/worldgen/valhalla-*'
      - 'tests/test_valhalla_extinction.py'
      - '.github/workflows/valhalla-extinction-r16.yml'
jobs:
  validate-original-viking-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric generator dependency
        run: python -m pip install numpy
      - name: Verify dimensions, Viking era encounters, and safety
        run: python -m unittest discover -s tests -p 'test_valhalla_extinction.py' -v
      - name: Generate real RAW16 24km tiles and verify 16 shared edges
        run: |
          python scripts/ue5/worldgen/generate_valhalla_extinction.py --output /tmp/VALHALLA_EXTINCTION_24x24_SOURCE
          python - <<'PY'
          import importlib.util, pathlib
          p=pathlib.Path('scripts/ue5/worldgen/generate_valhalla_extinction.py')
          s=importlib.util.spec_from_file_location('valhalla',p)
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          report=m.verify(pathlib.Path('/tmp/VALHALLA_EXTINCTION_24x24_SOURCE'))
          print(report)
          assert report['allTileSeamsMatch'] and report['villages']==12 and report['draugrSpawns']>=120
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: VALHALLA-EXTINCTION-24x24-R16-SOURCE-ONLY
          path: /tmp/VALHALLA_EXTINCTION_24x24_SOURCE/
          if-no-files-found: error
          retention-days: 14
