name: ANOMALIA mission - import all extracted models plus packs 68 and 69
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-import-all-extracted-models.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 105
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pack: [68, 69]
    steps:
      - uses: actions/checkout@v4
        with:
          path: all-models-${{ github.run_id }}-${{ matrix.pack }}
          sparse-checkout: |
            scripts/ue5
            unreal/Content/Python
            unreal/SourceAssets/ContainerSecurity68
            unreal/SourceAssets/Camping69
          persist-credentials: false
      - name: Prepare verified original pack without replacing content
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Existing Unreal session preserved'}
          $os=Get-CimInstance Win32_OperatingSystem
          if($os.FreePhysicalMemory*1KB -lt 4GB -or $os.FreeVirtualMemory*1KB -lt 8GB){throw 'Insufficient measured memory'}
          if((Get-PSDrive D).Free -lt 6GB){throw 'Insufficient measured D reserve'}
          $pack='${{ matrix.pack }}'
          $name=if($pack -eq '68'){'ContainerSecurity68'}else{'Camping69'}
          $hash=if($pack -eq '68'){'d5ff88601c149ceddbda1495da7c139468de297611ccde256a0f5659e428350b'}else{'8f4662275751fe418489e362341a4a88ca2d2b86118175f0267c024b15d92b6c'}
          $repo=Join-Path $env:GITHUB_WORKSPACE ('all-models-'+$env:GITHUB_RUN_ID+'-'+$pack)
          $original=Join-Path $repo ('unreal\SourceAssets\'+$name+'\Original.zip')
          if((Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash.ToLower() -ne $hash){throw 'Original checksum differs'}
          $source='D:\ANOMALIA\unreal\SourceAssets\'+$name
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          $retained=Join-Path $source 'Original.zip'
          if(Test-Path -LiteralPath $retained){
            if((Get-FileHash -LiteralPath $retained -Algorithm SHA256).Hash.ToLower() -ne $hash){throw 'Existing source differs; preserved'}
          }else{Copy-Item -LiteralPath $original -Destination $retained}
          $out='D:\ANOMALIA\unreal\Saved\ImportReceipts\'+$name+'\'+$env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "MODEL_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $script=if($pack -eq '68'){'prepare-container-security-68.py'}else{'prepare-camping-69.py'}
          & 'C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe' -B (Join-Path $repo ('scripts\ue5\'+$script)) $retained (Join-Path $out 'Prepared')
          if($LASTEXITCODE -ne 0){throw 'Model preparation failed'}
          exit 0
      - name: Import actual meshes and verify saved packages in a fresh editor
        timeout-minutes: 95
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $pack='${{ matrix.pack }}'
          $count=if($pack -eq '68'){12}else{7}
          $scriptName=if($pack -eq '68'){'import_container_security_68.py'}else{'import_camping_69.py'}
          $repo=Join-Path $env:GITHUB_WORKSPACE ('all-models-'+$env:GITHUB_RUN_ID+'-'+$pack)
          $script=Join-Path $repo ('unreal\Content\Python\'+$scriptName)
          [Environment]::SetEnvironmentVariable(('AZ'+$pack+'_OUT'),$env:MODEL_OUT,'Process')
          [Environment]::SetEnvironmentVariable(('AZ'+$pack+'_MANIFEST'),(Join-Path $env:MODEL_OUT 'Prepared\manifest.json'),'Process')
          foreach($phase in @('import','verify')){
            [Environment]::SetEnvironmentVariable(('AZ'+$pack+'_VERIFY_ONLY'),$(if($phase -eq 'verify'){'1'}else{'0'}),'Process')
            $ErrorActionPreference='Continue'
            & 'C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe' 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject' -run=pythonscript "-script=$script" -unattended -nopause -nosound -NullRHI "-abslog=$env:MODEL_OUT\$phase-engine.log" *> (Join-Path $env:MODEL_OUT ($phase+'-process.log'))
            $code=$LASTEXITCODE
            $ErrorActionPreference='Stop'
            $receipt=if($phase -eq 'import'){'import-report.json'}else{'fresh-verification.json'}
            $r=Get-Content -LiteralPath (Join-Path $env:MODEL_OUT $receipt) -Raw | ConvertFrom-Json
            Write-Output ("Pack "+$pack+" "+$phase+": "+@($r.models).Count+" checked meshes; "+@($r.errors).Count+" errors")
            if($code -ne 0 -or @($r.errors).Count -or @($r.models).Count -ne $count){throw 'Actual model verification failed; originals and reports preserved'}
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always() && env.MODEL_OUT != ''
        with:
          name: verified-real-project-model-pack-${{ matrix.pack }}
          path: ${{ env.MODEL_OUT }}/
          if-no-files-found: error
  remaining:
    needs: targeted
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          path: resume-all-${{ github.run_id }}-${{ matrix.batch }}
          sparse-checkout: unreal/Content/Python/resume_owned_model_imports.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resume durable all-category source manifest in the actual project
        timeout-minutes: 65
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Existing Unreal session preserved'}
          $state='D:\ANOMALIA\unreal\Saved\ImportReceipts\RawResume20261107'
          foreach($name in @('raw-preparation-manifest.json','raw-import-report.json')){
            if(!(Test-Path -LiteralPath (Join-Path $state $name))){throw 'Durable import ledger missing; do not repeat accepted sources'}
          }
          $os=Get-CimInstance Win32_OperatingSystem
          if($os.FreePhysicalMemory*1KB -lt 4GB -or $os.FreeVirtualMemory*1KB -lt 8GB){throw 'Insufficient measured memory'}
          $out=Join-Path $state ('AllModels-'+$env:GITHUB_RUN_ID+'-${{ matrix.batch }}')
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "MODEL_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:MISSION_RAW_OUT=$out
          $env:IMPORT_MAX_SOURCES='250'
          $env:IMPORT_BATCH='${{ matrix.batch }}'
          $script=Join-Path $env:GITHUB_WORKSPACE ('resume-all-'+$env:GITHUB_RUN_ID+'-${{ matrix.batch }}\unreal\Content\Python\resume_owned_model_imports.py')
          $ErrorActionPreference='Continue'
          & 'C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe' 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject' -run=pythonscript "-script=$script" -unattended -nopause -nosound -NullRHI "-abslog=$out\engine.log" *> (Join-Path $out 'process.log')
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          $r=Get-Content -LiteralPath (Join-Path $out 'import-batch-summary.json') -Raw | ConvertFrom-Json
          Write-Output ("NATIVE_EXIT="+$code)
          Write-Output ($r | ConvertTo-Json -Depth 8 -Compress)
          if($code -ne 0 -and $r.newSources -eq 0){throw 'No new accepted source before editor failure; retain receipts'}
          # Independent source failures remain in the durable error list, not falsely accepted.
          exit 0
      - uses: actions/upload-artifact@v4
        if: always() && env.MODEL_OUT != ''
        with:
          name: all-model-import-batch-${{ matrix.batch }}
          path: |
            ${{ env.MODEL_OUT }}/import-batch-summary.json
            ${{ env.MODEL_OUT }}/engine.log
            ${{ env.MODEL_OUT }}/process.log
          if-no-files-found: warn
