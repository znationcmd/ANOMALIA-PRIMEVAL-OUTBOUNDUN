name: ANOMALIA saved map recovery check
on:
  push:
    branches: ['ue5/character-audit-20261027']
    paths: ['.github/workflows/ue5-saved-map-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 5
    steps:
      - name: Read saved maps and exact sector bounds
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $folder='D:/ANOMALIA/StorageRecovery/loot-pie-40887675201'
          if(Test-Path "$folder/index.json"){Get-Content "$folder/index.json" -Raw}
          Select-String "$folder/editor.log" -Pattern 'Error:|Fatal|Test Completed|Test Started|PIE timeout|Automation Test|Failed to load|failed|Assertion' -Context 1,2 | Select-Object -Last 60 | ForEach-Object {Write-Output $_}
