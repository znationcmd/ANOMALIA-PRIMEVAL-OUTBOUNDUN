name: ANOMALIA storage locations
on:
  push:
    branches: ['ue5/character-audit-20261027']
    paths: ['.github/workflows/ue5-storage-locations.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 5
    steps:
      - name: Inspect drive capacity and Epic cache configuration
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('C:\ProgramData\Epic\EpicGamesLauncher\VaultCache\CitySample_5.8\data','C:\ProgramData\Epic\EpicGamesLauncher\VaultCache\Derelict31b645c4b988V1\data')){
            Write-Output "DATA_ROOT $p"
            Get-ChildItem -LiteralPath $p -Force | Select-Object -First 20 Name,Attributes,Length | ConvertTo-Json -Compress | Write-Output
          }
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object DeviceID,FreeSpace,Size | ConvertTo-Json -Compress | Write-Output
