name: ANOMALIA storage locations
on:
  push:
    branches: ['ue5/character-audit-20261027']
    paths: ['.github/workflows/ue5-storage-locations.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 5
    steps:
      - name: Inspect drive capacity and Epic cache configuration
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('C:\ProgramData\Epic\EpicGamesLauncher\VaultCache','C:\ANOMALIA-Validation',"$env:LOCALAPPDATA\UnrealEngine\Common\DerivedDataCache","$env:LOCALAPPDATA\UnrealEngine\Common\Zen")){
            if(Test-Path -LiteralPath $p){
              Write-Output "SIZE_LOCATION $p"
              & robocopy $p 'D:\ANOMALIA\StorageAuditDryRunOnly' /L /E /XJ /BYTES /NFL /NDL /NJH /R:0 /W:0
            }
          }
          Get-Process EpicGamesLauncher,EpicWebHelper,UnrealEditor,zenserver -ErrorAction SilentlyContinue | Select-Object ProcessName,Id | ConvertTo-Json -Compress | Write-Output
          Get-Item 'C:\ProgramData\Epic\EpicGamesLauncher\VaultCache' | Select-Object FullName,Attributes,LinkType,Target | ConvertTo-Json -Compress | Write-Output
          exit 0
