name: ANOMALIA storage locations
on:
  push:
    branches: ['ue5/character-audit-20261027']
    paths: ['.github/workflows/ue5-storage-locations.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 5
    steps:
      - name: Inspect drive capacity and Epic cache configuration
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $active=@(Get-Process EpicGamesLauncher,EpicWebHelper,UnrealEditor -ErrorAction SilentlyContinue)
          if($active.Count){throw 'Epic or Unreal is still running'}
          $root='C:\ProgramData\Epic\EpicGamesLauncher\VaultCache'
          foreach($d in Get-ChildItem -LiteralPath $root -Directory){
            Write-Output "CACHE $($d.FullName)"
            Get-ChildItem -LiteralPath $d.FullName -Force | Select-Object -First 8 Name,Attributes,Length | ConvertTo-Json -Compress | Write-Output
            & robocopy $d.FullName 'D:\ANOMALIA\StorageAuditDryRunOnly' /L /E /XJ /BYTES /NFL /NDL /NJH /R:0 /W:0
          }
          foreach($p in @('D:\ANOMALIA\FabImports\CitySample','D:\ANOMALIA\FabImports\DerelictCorridorMegascans')){
            Write-Output "DEST $p"
            Get-ChildItem -LiteralPath $p -Force | Select-Object -First 15 Name,Attributes,Length | ConvertTo-Json -Compress | Write-Output
          }
          exit 0
