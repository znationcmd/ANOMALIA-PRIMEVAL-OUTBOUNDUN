name: Verify Windows auto-update feeds
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/anomalia-update-feed-smoke.yml
  schedule:
    - cron: "33 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public-updater:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: editor
            tag: anomalia-editor-latest
            minimum: 0.5.0
          - app: tools
            tag: anomalia-tools-latest
            minimum: 0.2.3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify remote latest.yml and installer from Github Releases
        env:
          TAG: ${{ matrix.tag }}
          MIN_VERSION: ${{ matrix.minimum }}
          REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const repo=process.env.REPO,tag=process.env.TAG;
          (async()=>{
            const url='https://github.com/'+repo+'/releases/download/'+tag+'/latest.yml';
            const response=await fetch(url,{redirect:'follow',headers:{'User-Agent':'ANOMALIA-UpdateFeed-Test'}});
            assert.equal(response.status,200,'latest.yml feed must respond HTTP 200');
            const manifest=await response.text();
            assert.ok(manifest.length<10000,'manifest must be small');
            const version=manifest.match(/^version:\s*['"]?(\d+\.\d+\.\d+)/m)?.[1];
            assert.ok(version,'manifest must specify a valid version');
            const cmp=(a,b)=>{
              const A=a.split('.').map(Number),B=b.split('.').map(Number);
              for(let i=0;i<3;i++)if(A[i]!==B[i])return A[i]-B[i];
              return 0;
            };
            assert.ok(cmp(version,process.env.MIN_VERSION)>=0,'release must not downgrade application');
            assert.match(manifest,/sha512:\s*[A-Za-z0-9+/=]{80,}/);
            const file=manifest.match(/^path:\s*(.+\.exe)\s*$/m)?.[1];
            assert.ok(file,'manifest must reference a Windows installer');
            assert.ok(!/\s/.test(file),'Github release assets must use filenames without whitespace');
            const exeUrl='https://github.com/'+repo+'/releases/download/'+tag+'/'+encodeURIComponent(file);
            const download=await fetch(exeUrl,{method:'HEAD',redirect:'follow',headers:{'User-Agent':'ANOMALIA-UpdateFeed-Test'}});
            assert.equal(download.status,200,'installer download must respond HTTP 200');
            console.log(tag,version,'latest.yml OK',file,'EXE HEAD OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
