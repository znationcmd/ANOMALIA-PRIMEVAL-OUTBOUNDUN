name: ANOMALIA Windows - validate native SKARVIK editor bridge (no public release)
on:
  push:
    branches: [feature/skarvik-native-windows-bridge-20261101]
    paths:
      - "desktop/**"
      - "src/start-menu.js"
      - "tests/skarvik-native-launcher.test.mjs"
      - "package.json"
      - ".github/workflows/skarvik-native-windows-bridge-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-preview-bridge:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund
      - name: Test Electron native bridge and existing game
        run: npm test
      - name: Build existing web game without replacing Unreal assets
        run: npm run build
      - name: Package private Windows installer (do not publish/update existing players)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install Pillow
          python scripts/prepare-windows-icon.py
          npm run package:windows
          if($LASTEXITCODE -ne 0){throw 'Windows local build failed'}
          $files=@(Get-ChildItem release/windows -Filter '*-Setup-*-x64.exe' -File)
          if($files.Count -ne 1 -or $files[0].Length -lt 10000000){throw 'No real Windows setup created'}
          Write-Host ('SKARVIK_LAUNCHER_WINDOWS_TEST_INSTALLER='+$files[0].Name)
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: anomalia-skarvik-editor-bridge-private-windows-installer
          path: release/windows/*-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
