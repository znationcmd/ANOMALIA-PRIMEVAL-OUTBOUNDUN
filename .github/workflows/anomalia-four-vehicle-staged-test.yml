name: ANOMALIA - inspect staged IoStore and launch vehicle build
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-four-vehicle-staged-test.yml]
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  verify-launch:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate vehicle assets and smoke-launch the newest staged IoStore package
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected runner'}
          $busy=@(Get-Process UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue|Where-Object{-not $_.HasExited})
          if($busy.Count){throw 'Existing Unreal/game session preserved'}
          $root='D:\ANOMALIA\unreal'
          $project=Join-Path $root 'AnomaliaPrimeval.uproject'
          $stageRoot=Join-Path $root 'Saved\StagedBuilds'
          foreach($p in @($project,$stageRoot)){if(!(Test-Path -LiteralPath $p)){throw "Required project path missing: $p"}}
          $candidates=@(Get-ChildItem -LiteralPath $stageRoot -Directory -Filter 'CitySample-Vehicles-Included-*'|Where-Object{Test-Path -LiteralPath (Join-Path $_.FullName 'Windows\AnomaliaPrimeval.exe')}|Sort-Object LastWriteTime -Descending)
          if(!$candidates.Count){throw 'No completed corrected vehicle package was found'}
          $stage=$candidates[0].FullName
          $win=Join-Path $stage 'Windows'
          $exe=Join-Path $win 'AnomaliaPrimeval.exe'
          $paks=Join-Path $win 'AnomaliaPrimeval\Content\Paks'
          $utoc=Join-Path $paks 'AnomaliaPrimeval-Windows.utoc'
          $ucas=Join-Path $paks 'AnomaliaPrimeval-Windows.ucas'
          foreach($p in @($exe,$utoc,$ucas)){if(!(Test-Path -LiteralPath $p)){throw "Expected staged package file missing: $p"}}
          Write-Output ('ANOMALIA_VEHICLE_STAGE='+$stage)
          Write-Output ('STAGED_UCAS_GB='+[math]::Round((Get-Item $ucas).Length/1GB,2))
          $review=Join-Path $root ('Saved\VehicleReview\staged-runtime-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $review -Force|Out-Null
          $env:ANOMALIA_VEHICLE_CHECK_OUT=$review
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $checker=Join-Path $env:GITHUB_WORKSPACE 'scripts\vehicle-assets\check_four_vehicles.py'
          foreach($p in @($editor,$checker)){if(!(Test-Path -LiteralPath $p)){throw "Vehicle runtime checker input missing: $p"}}
          & $editor $project '-run=pythonscript' "-script=$checker" -nullrhi -unattended -NoAssetRegistryCache -SkipAssetScan "-abslog=$review\vehicle-check.log"
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath (Join-Path $review 'vehicle-runtime-check.json'))){throw "Vehicle asset validation failed: $LASTEXITCODE"}
          Get-Content -LiteralPath (Join-Path $review 'vehicle-runtime-check.json')
          $log=Join-Path $win 'ANOMALIA_vehicle_launch.log'
          $err=Join-Path $win 'ANOMALIA_vehicle_launch.err'
          $proc=Start-Process -FilePath $exe -ArgumentList @('-windowed','-ResX=1280','-ResY=720','-log','-stdout','-FullStdOutLogOutput') -WorkingDirectory $win -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 25
          $proc.Refresh()
          if($proc.HasExited){
            Write-Output ('ANOMALIA_LAUNCH_EXIT_CODE='+$proc.ExitCode)
            if(Test-Path $log){Get-Content -LiteralPath $log -Tail 100}
            if(Test-Path $err){Get-Content -LiteralPath $err -Tail 60}
            throw 'Staged game exited during the launch smoke test'
          }
          Write-Output ('ANOMALIA_GAME_RUNNING_PID='+$proc.Id)
          Write-Output 'ANOMALIA_PACKAGE_LAUNCH=alive_after_25_seconds'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anomalia-staged-vehicle-runtime-check
          path: D:\ANOMALIA\unreal\Saved\VehicleReview\staged-runtime-*\*
          if-no-files-found: warn
