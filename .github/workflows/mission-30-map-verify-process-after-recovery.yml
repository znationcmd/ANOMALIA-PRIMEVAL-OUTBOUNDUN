name: ANOMALIA - verify UE audit process state after guarded recovery
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-30-map-verify-process-after-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 5
    steps:
      - name: Read-only enumerate Unreal processes and original map status
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $ps=@(Get-CimInstance Win32_Process -Filter "Name='UnrealEditor-Cmd.exe'" -ErrorAction SilentlyContinue)
          $rows=@()
          foreach($p in $ps){
            $gp=Get-Process -Id $p.ProcessId -ErrorAction SilentlyContinue
            $rows+=[ordered]@{pid=$p.ProcessId;alive=[bool]$gp;name=$p.Name;
              parentId=$p.ParentProcessId;aliveParent=([bool](Get-Process -Id $p.ParentProcessId -ErrorAction SilentlyContinue));
              ageMin=[math]::Round(((Get-Date).ToUniversalTime()-$p.CreationDate.ToUniversalTime()).TotalMinutes,1);
              cpuSec=if($gp){[double]$gp.CPU}else{$null};memoryBytes=$p.WorkingSetSize;
              isAudit=([string]$p.CommandLine).Contains('audit.py') }
          }
          $main='D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap'
          Write-Host ('ANOMALIA_POST_RECOVERY_PROCESS_STATUS '+([ordered]@{current=$rows;mainMapExists=(Test-Path -LiteralPath $main -PathType Leaf);editorCount=$ps.Count;
          blocked=($ps.Count -gt 0);newMapFileCount=@(Get-ChildItem -LiteralPath 'D:\ANOMALIA\unreal\Content\Maps' -File -Filter 'PRIGIMALIA_*.umap' -ErrorAction SilentlyContinue).Count}|ConvertTo-Json -Depth 5 -Compress))
