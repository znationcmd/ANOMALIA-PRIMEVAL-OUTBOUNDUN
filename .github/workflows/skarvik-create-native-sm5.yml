name: SKARVIK - author native 48km UE5 SM5 terrain on isolated C stage
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-create-native-sm5.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  create-skarvik:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Verify storage, isolated target and original map safely
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $original='D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap'
          $city='D:\ANOMALIA\FabImports\CitySample'
          $stage="C:\ANOMALIAZ_SKARVIK_STAGE_$env:GITHUB_RUN_ID"
          if(!(Test-Path -LiteralPath $original)){throw 'Original SKARVIK missing'}
          if(!(Test-Path -LiteralPath (Join-Path $city 'CitySample.uproject'))){throw 'City Sample source missing'}
          if(!(Test-Path -LiteralPath (Join-Path $city 'Content\Map\Big_City_LVL.umap'))){throw 'City Sample Big City absent'}
          if(!(Test-Path -LiteralPath (Join-Path $city 'Content\__ExternalActors__'))){throw 'City Sample external actors absent'}
          if(Test-Path -LiteralPath $stage){throw 'Refuse overwriting existing stage'}
          if(-not $env:UE_ROOT){throw 'UE_ROOT unavailable'}
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          if(!(Test-Path -LiteralPath $build) -or !(Test-Path -LiteralPath $editor)){throw 'Native UE5 toolchain unavailable'}
          if(@(Get-Process UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'UE is already active'}
          $free=([System.IO.DriveInfo]::new('C')).AvailableFreeSpace/1GB
          Write-Host ("SKARVIK_C_FREE_GIB="+[math]::Round($free,2))
          if($free -lt 45){throw 'Need minimum 45 GiB free on C before native build'}
          Write-Host 'SKARVIK_PREFLIGHT_PASSED=true'
      - name: Create a separate minimal UE5 game project on C only
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $stage="C:\ANOMALIAZ_SKARVIK_STAGE_$env:GITHUB_RUN_ID\unreal"
          if(Test-Path -LiteralPath $stage){throw 'Refusing existing stage'}
          New-Item -Path $stage -ItemType Directory -Force|Out-Null
          foreach($item in @('AnomaliaZPrigimalia.uproject','Source','Config','Scripts')){
            $source=Join-Path $env:GITHUB_WORKSPACE ('unreal\'+$item)
            if(!(Test-Path -LiteralPath $source)){throw ('Project source absent: '+$item)}
            Copy-Item -LiteralPath $source -Destination (Join-Path $stage $item) -Recurse -Force
          }
          [System.IO.File]::WriteAllText((Join-Path $stage '.skarvik-ci-stage-marker'),$env:GITHUB_RUN_ID,(New-Object System.Text.UTF8Encoding($false)))
          Add-Content -LiteralPath (Join-Path $stage 'Config\DefaultEngine.ini') -Value @'
          
          [/Script/Engine.RendererSettings]
          r.DynamicGlobalIlluminationMethod=0
          r.ReflectionMethod=0
          r.Nanite.ProjectEnabled=False
          r.Shadow.Virtual.Enable=0
          [/Script/WindowsTargetPlatform.WindowsTargetSettings]
          DefaultGraphicsRHI=DefaultGraphicsRHI_DX11
          +D3D11TargetedShaderFormats=PCD3D_SM5
          '@
          Write-Host ("SKARVIK_STAGED_PROJECT="+$stage)
      - name: Compile UE5 editor in staging, not in D original project
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $project="C:\ANOMALIAZ_SKARVIK_STAGE_$env:GITHUB_RUN_ID\unreal\AnomaliaZPrigimalia.uproject"
          $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
          & $build AnomaliaZPrigimaliaEditor Win64 Development $project -WaitMutex -NoHotReloadFromIDE
          if($LASTEXITCODE -ne 0){throw "UE5 compilation failed exit=$LASTEXITCODE"}
          Write-Host 'SKARVIK_UE5_NATIVE_COMPILE_PASSED=true'
      - name: Create actual 48km partitioned UE5 map on DX11 SM5
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root="C:\ANOMALIAZ_SKARVIK_STAGE_$env:GITHUB_RUN_ID\unreal"
          $project=Join-Path $root 'AnomaliaZPrigimalia.uproject'
          $script=Join-Path $root 'Scripts\create_skarvik_city_world.py'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $env:PRIGIMALIA_SKARVIK_CI_RUN_ID=$env:GITHUB_RUN_ID
          $env:PRIGIMALIA_SKARVIK_CITY_REPORT=Join-Path $root 'Saved\SkarvikCity\native-report.json'
          $log=Join-Path $root 'Saved\SkarvikCity\unreal-editor.log'
          New-Item -Path (Split-Path $log -Parent) -ItemType Directory -Force|Out-Null
          & $editor $project "-ExecutePythonScript=$script" -d3d11 -unattended -nopause -nosound "-abslog=$log"
          if($LASTEXITCODE -ne 0){throw "UE5 Editor map creation failed exit=$LASTEXITCODE"}
          $r=Get-Content -LiteralPath $env:PRIGIMALIA_SKARVIK_CITY_REPORT -Raw|ConvertFrom-Json
          if($r.state -ne 'NEW_48KM_TERRAIN_SAVED_CITY_NOT_IMPORTED' -or $r.sideMeters -ne 48000 -or $r.landscapeComponents -ne 576 -or $r.collisionComponents -ne 576){throw 'Native report did not prove terrain creation'}
          $map=Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_CITY_v1.umap'
          if(!(Test-Path -LiteralPath $map)){throw 'New native map was not saved'}
          Write-Host 'SKARVIK_NATIVE_48KM_TERRAIN_CREATED=true'
          Write-Host 'SKARVIK_CITY_SAMPLE_IMPORT_PENDING=true'
      - name: Attach native evidence, if generated
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skarvik-native-terrain-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            C:/ANOMALIAZ_SKARVIK_STAGE_${{ github.run_id }}/unreal/Saved/SkarvikCity/native-report.json
            C:/ANOMALIAZ_SKARVIK_STAGE_${{ github.run_id }}/unreal/Saved/SkarvikCity/unreal-editor.log
            C:/ANOMALIAZ_SKARVIK_STAGE_${{ github.run_id }}/unreal/Content/Maps/PRIGIMALIA_SKARVIK_CITY_v1.umap
            C:/ANOMALIAZ_SKARVIK_STAGE_${{ github.run_id }}/unreal/Content/__ExternalActors__/Maps/PRIGIMALIA_SKARVIK_CITY_v1/
