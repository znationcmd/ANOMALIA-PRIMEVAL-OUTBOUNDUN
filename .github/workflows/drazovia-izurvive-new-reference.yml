name: DRAZOVIA - new iZurvive source metadata and isolated importer checks
on:
  push:
    branches: [feature/drazovia-izurvive-new-photo-48km-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-new-drazovia-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python source syntax
        run: python -m py_compile unreal/Scripts/create_drazovia_izurvive_candidate.py
      - name: Validate new map reference, C++ guard and preservation
        run: python -m unittest discover -s tests -p 'test_drazovia_izurvive_new_reference.py' -v
      - name: Report native import is not claimed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("public/config/drazovia-izurvive-new-reference-audit.json").read_text())
          assert not p["candidateNativeUmapProduced"]
          assert not p["unrealNativeCompileVerified"]
          assert not p["gameplayTested"]
          print("DRAZOVIA_IZURVIVE_OFFLINE_SOURCE_ONLY; WINDOWS_NATIVE_TEST_PENDING")
          PY
