name: Install ANOMALIA real-city title menu and credits
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-launch-menu-install.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  install-launch-experience:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 50
    steps:
      - name: Configure City Sample map and install native menu
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected runner'}
          if(@(Get-Process UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Existing Unreal/game session preserved'}
          $root='D:\ANOMALIA\unreal'
          $source=Join-Path $root 'Source\AnomaliaPrimeval'
          $config=Join-Path $root 'Config\DefaultEngine.ini'
          $survivorH=Join-Path $source 'AnomaliaSurvivor.h'
          $survivorCpp=Join-Path $source 'AnomaliaSurvivor.cpp'
          $menuH=Join-Path $source 'AnomaliaMainMenuWidget.h'
          $menuCpp=Join-Path $source 'AnomaliaMainMenuWidget.cpp'
          $project=Join-Path $root 'AnomaliaPrimeval.uproject'
          foreach($p in @($survivorH,$survivorCpp,$config,$project)){if(!(Test-Path $p)){throw "Required file missing: $p"}}
          if(Test-Path $menuH){throw 'Menu source already exists; refusing to overwrite'}
          $h0=[IO.File]::ReadAllText($survivorH); $c0=[IO.File]::ReadAllText($survivorCpp); $cfg0=[IO.File]::ReadAllText($config)
          if($h0.Contains('bStartupMenuShown')){throw 'Startup menu hook already exists'}
          if(!$h0.Contains('CurrentInhabitedSettlementIndex')){throw 'Expected prior ANOMALIA survivor source state not found'}
          if(!$cfg0.Contains('GameDefaultMap=/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1')){throw 'Default game map changed; refusing to overwrite'}
          $backup='D:\ANOMALIA\Backups\LaunchExperience'
          New-Item -ItemType Directory -Path $backup -Force|Out-Null
          Copy-Item $survivorH (Join-Path $backup 'AnomaliaSurvivor.h.pre-launch-menu.bak') -Force
          Copy-Item $survivorCpp (Join-Path $backup 'AnomaliaSurvivor.cpp.pre-launch-menu.bak') -Force
          Copy-Item $config (Join-Path $backup 'DefaultEngine.ini.pre-launch-menu.bak') -Force
          $exe=Join-Path $root 'Binaries\Win64\AnomaliaPrimeval.exe'
          if(Test-Path $exe){Copy-Item $exe (Join-Path $backup 'AnomaliaPrimeval.exe.pre-launch-menu.bak') -Force}
          try{
            $menuHeader=@'
          #pragma once
          #include "CoreMinimal.h"
          #include "Blueprint/UserWidget.h"
          #include "AnomaliaMainMenuWidget.generated.h"

          class UButton;
          class UTextBlock;
          class UVerticalBox;

          UCLASS()
          class ANOMALIAPRIMEVAL_API UAnomaliaMainMenuWidget : public UUserWidget
          {
              GENERATED_BODY()
          protected:
              virtual void NativeConstruct() override;
          private:
              void BuildPage(bool bShowCredits);
              UTextBlock* AddText(const FText& Text, int32 Size, const FLinearColor& Color);
              UButton* AddButton(const FText& Text);
              UPROPERTY(Transient) TObjectPtr<UVerticalBox> MenuContent;
              UPROPERTY(Transient) TObjectPtr<UTextBlock> PageTitle;
              UPROPERTY(Transient) TObjectPtr<UTextBlock> PageBody;
              UFUNCTION() void HandlePlay();
              UFUNCTION() void HandleCredits();
              UFUNCTION() void HandleBack();
              UFUNCTION() void HandleQuit();
          };
          '@
            $menuSource=@'
          #include "AnomaliaMainMenuWidget.h"
          #include "Blueprint/WidgetTree.h"
          #include "Components/Border.h"
          #include "Components/Button.h"
          #include "Components/CanvasPanel.h"
          #include "Components/CanvasPanelSlot.h"
          #include "Components/Image.h"
          #include "Components/ScrollBox.h"
          #include "Components/ScrollBoxSlot.h"
          #include "Components/TextBlock.h"
          #include "Components/VerticalBox.h"
          #include "Components/VerticalBoxSlot.h"
          #include "Engine/Texture2D.h"
          #include "GameFramework/PlayerController.h"
          #include "Kismet/GameplayStatics.h"

          void UAnomaliaMainMenuWidget::NativeConstruct()
          {
              Super::NativeConstruct();
              if (!WidgetTree) return;
              UCanvasPanel* Root = WidgetTree->ConstructWidget<UCanvasPanel>(UCanvasPanel::StaticClass(), TEXT("ANOMALIA_Root"));
              WidgetTree->RootWidget = Root;
              UImage* Backdrop = WidgetTree->ConstructWidget<UImage>(UImage::StaticClass(), TEXT("ANOMALIA_Backdrop"));
              if (UTexture2D* Texture = LoadObject<UTexture2D>(nullptr, TEXT("/Game/Anomalia/Branding/T_MenuBackdrop.T_MenuBackdrop")))
              {
                  Backdrop->SetBrushFromTexture(Texture, true);
              }
              Backdrop->SetColorAndOpacity(FLinearColor(1.f, 1.f, 1.f, 0.48f));
              UCanvasPanelSlot* BackdropSlot = Root->AddChildToCanvas(Backdrop);
              BackdropSlot->SetAnchors(FAnchors(0.f, 0.f, 1.f, 1.f));
              BackdropSlot->SetOffsets(FMargin(0.f));
              UBorder* Shade = WidgetTree->ConstructWidget<UBorder>(UBorder::StaticClass(), TEXT("ANOMALIA_Shade"));
              Shade->SetBrushColor(FLinearColor(0.005f, 0.012f, 0.018f, 0.72f));
              UCanvasPanelSlot* ShadeSlot = Root->AddChildToCanvas(Shade);
              ShadeSlot->SetAnchors(FAnchors(0.f, 0.f, 1.f, 1.f));
              ShadeSlot->SetOffsets(FMargin(0.f));
              MenuContent = WidgetTree->ConstructWidget<UVerticalBox>(UVerticalBox::StaticClass(), TEXT("ANOMALIA_MenuContent"));
              Shade->SetContent(MenuContent);
              UCanvasPanelSlot* PanelSlot = Root->AddChildToCanvas(MenuContent);
              PanelSlot->SetAnchors(FAnchors(0.07f, 0.18f, 0.47f, 0.82f));
              PanelSlot->SetOffsets(FMargin(24.f));
              BuildPage(false);
              if (APlayerController* PC = GetOwningPlayer())
              {
                  PC->SetShowMouseCursor(true);
                  PC->SetIgnoreMoveInput(true);
                  PC->SetIgnoreLookInput(true);
                  FInputModeUIOnly InputMode;
                  InputMode.SetWidgetToFocus(TakeWidget());
                  InputMode.SetLockMouseToViewportBehavior(EMouseLockMode::DoNotLock);
                  PC->SetInputMode(InputMode);
              }
          }
          UTextBlock* UAnomaliaMainMenuWidget::AddText(const FText& Text, int32 Size, const FLinearColor& Color)
          {
              UTextBlock* Block = WidgetTree->ConstructWidget<UTextBlock>(UTextBlock::StaticClass());
              Block->SetText(Text);
              Block->SetColorAndOpacity(Color);
              FSlateFontInfo Font = Block->GetFont();
              Font.Size = Size;
              Block->SetFont(Font);
              Block->SetAutoWrapText(true);
              UVerticalBoxSlot* Slot = MenuContent->AddChildToVerticalBox(Block);
              Slot->SetPadding(FMargin(4.f, 8.f));
              return Block;
          }
          UButton* UAnomaliaMainMenuWidget::AddButton(const FText& Text)
          {
              UButton* Button = WidgetTree->ConstructWidget<UButton>(UButton::StaticClass());
              Button->SetBackgroundColor(FLinearColor(0.05f, 0.16f, 0.19f, 0.92f));
              UTextBlock* Label = WidgetTree->ConstructWidget<UTextBlock>(UTextBlock::StaticClass());
              Label->SetText(Text);
              Label->SetColorAndOpacity(FLinearColor(0.96f, 0.78f, 0.38f, 1.f));
              FSlateFontInfo Font = Label->GetFont();
              Font.Size = 22;
              Label->SetFont(Font);
              Button->SetContent(Label);
              UVerticalBoxSlot* Slot = MenuContent->AddChildToVerticalBox(Button);
              Slot->SetPadding(FMargin(4.f, 6.f));
              Slot->SetSize(FSlateChildSize(ESlateSizeRule::Automatic));
              return Button;
          }
          void UAnomaliaMainMenuWidget::BuildPage(bool bShowCredits)
          {
              if (!MenuContent) return;
              MenuContent->ClearChildren();
              if (bShowCredits)
              {
                  PageTitle = AddText(FText::FromString(TEXT("GÉNÉRIQUE")), 34, FLinearColor(0.96f, 0.78f, 0.38f, 1.f));
                  PageBody = AddText(FText::FromString(TEXT("ANOMALIA'Z\nPRIMEVAL OUTBOUNDUN\n\nUn monde de survie, d'exploration et de communautés.\n\nDirection créative : ANOMALIA'Z\nEnvironnements : City Sample et ressources intégrées au projet\nTechnologie : Unreal Engine 5\n\nÀ tous ceux qui tiennent jusqu'à l'aube.")), 17, FLinearColor::White);
                  UButton* Back = AddButton(FText::FromString(TEXT("RETOUR")));
                  Back->OnClicked.AddDynamic(this, &UAnomaliaMainMenuWidget::HandleBack);
              }
              else
              {
                  PageTitle = AddText(FText::FromString(TEXT("ANOMALIA'Z")), 42, FLinearColor(0.96f, 0.78f, 0.38f, 1.f));
                  AddText(FText::FromString(TEXT("PRIMEVAL OUTBOUNDUN  •  SURVIVE THE UNKNOWN")), 17, FLinearColor(0.85f, 0.9f, 0.9f, 1.f));
                  PageBody = AddText(FText::FromString(TEXT("Le monde est tombé. Votre histoire commence ici.")), 18, FLinearColor::White);
                  UButton* Play = AddButton(FText::FromString(TEXT("JOUER")));
                  Play->OnClicked.AddDynamic(this, &UAnomaliaMainMenuWidget::HandlePlay);
                  UButton* Credits = AddButton(FText::FromString(TEXT("GÉNÉRIQUE")));
                  Credits->OnClicked.AddDynamic(this, &UAnomaliaMainMenuWidget::HandleCredits);
                  UButton* Quit = AddButton(FText::FromString(TEXT("QUITTER")));
                  Quit->OnClicked.AddDynamic(this, &UAnomaliaMainMenuWidget::HandleQuit);
              }
          }
          void UAnomaliaMainMenuWidget::HandlePlay()
          {
              if (APlayerController* PC = GetOwningPlayer())
              {
                  PC->SetIgnoreMoveInput(false);
                  PC->SetIgnoreLookInput(false);
                  PC->SetShowMouseCursor(false);
                  PC->SetInputMode(FInputModeGameOnly());
              }
              RemoveFromParent();
          }
          void UAnomaliaMainMenuWidget::HandleCredits() { BuildPage(true); }
          void UAnomaliaMainMenuWidget::HandleBack() { BuildPage(false); }
          void UAnomaliaMainMenuWidget::HandleQuit()
          {
              if (APlayerController* PC = GetOwningPlayer())
                  UGameplayStatics::QuitGame(this, PC, EQuitPreference::Quit, false);
          }
          '@
            $tickInsert=@'
              if (!bStartupMenuShown && IsLocallyControlled() && GetWorld() &&
                  GetWorld()->GetMapName().EndsWith(TEXT("PRIGIMALIA_SKARVIK_CITY_v1")) &&
                  GetNetMode() != NM_DedicatedServer)
              {
                  if (APlayerController* PC = Cast<APlayerController>(Controller))
                  {
                      if (UAnomaliaMainMenuWidget* Menu = CreateWidget<UAnomaliaMainMenuWidget>(PC, UAnomaliaMainMenuWidget::StaticClass()))
                      {
                          Menu->AddToViewport(1000);
                          bStartupMenuShown = true;
                      }
                  }
              }
          '@
            if(!$h0.Contains('void CurrentInhabitedSettlementIndex = INDEX_NONE;') -and !$h0.Contains('int32 CurrentInhabitedSettlementIndex = INDEX_NONE;')){throw 'Could not find survivor state insertion anchor'}
            if(!$c0.Contains('void AAnomaliaSurvivor::Tick(float DeltaSeconds)')){throw 'Survivor Tick not found'}
            $eol=[Environment]::NewLine
            if($c0 -notmatch '(?m)^#include "AnomaliaMainMenuWidget\.h"'){
              $first=$c0.IndexOf($eol); if($first -lt 0){throw 'Survivor source include block missing'}
              $c0=$c0.Insert($first+$eol.Length,'#include "AnomaliaMainMenuWidget.h"'+$eol)
            }
            $memberAt=$h0.LastIndexOf('};')
            if($memberAt -lt 0){throw 'Survivor class end missing'}
            $h0=$h0.Insert($memberAt,'    bool bStartupMenuShown = false;'+$eol)
            $tick=$c0.IndexOf('void AAnomaliaSurvivor::Tick(float DeltaSeconds)',[StringComparison]::Ordinal)
            $auth=$c0.IndexOf('    if (!HasAuthority()) return;',$tick,[StringComparison]::Ordinal)
            if($auth -lt 0){throw 'Tick authority guard missing'}
            $insert=$c0.IndexOf($eol,$auth,[StringComparison]::Ordinal)
            if($insert -lt 0){throw 'Tick guard line end missing'}
            $c0=$c0.Insert($insert+$eol.Length,$tickInsert)
            [IO.File]::WriteAllText($menuH,$menuHeader.TrimStart(),[Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($menuCpp,$menuSource.TrimStart(),[Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($survivorH,$h0,[Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($survivorCpp,$c0,[Text.UTF8Encoding]::new($false))
            $newConfig=$cfg0.Replace('GameDefaultMap=/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1','GameDefaultMap=/Game/Maps/PRIGIMALIA_SKARVIK_CITY_v1').Replace('EditorStartupMap=/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1','EditorStartupMap=/Game/Maps/PRIGIMALIA_SKARVIK_CITY_v1')
            if($newConfig -eq $cfg0){throw 'Startup map replacement did not apply'}
            [IO.File]::WriteAllText($config,$newConfig,[Text.UTF8Encoding]::new($false))
            $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
            if(!(Test-Path $build)){throw 'Unreal Build.bat missing'}
            & $build 'AnomaliaPrimeval' 'Win64' 'Development' "-Project=$project" '-WaitMutex'
            if($LASTEXITCODE -ne 0){throw "Game target build failed: $LASTEXITCODE"}
            Write-Output 'ANOMALIA_LAUNCH_MAP=/Game/Maps/PRIGIMALIA_SKARVIK_CITY_v1'
            Write-Output 'ANOMALIA_MAIN_MENU=installed'
            Write-Output 'ANOMALIA_CREDITS_PAGE=installed'
            Write-Output ('ANOMALIA_GAME_EXE='+$exe)
            Write-Output 'ANOMALIA_GAME_TARGET_BUILD=success'
          } catch {
            [IO.File]::WriteAllText($survivorH,$h0,[Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($survivorCpp,$c0,[Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($config,$cfg0,[Text.UTF8Encoding]::new($false))
            Remove-Item $menuH,$menuCpp -Force -ErrorAction SilentlyContinue
            throw
          }
