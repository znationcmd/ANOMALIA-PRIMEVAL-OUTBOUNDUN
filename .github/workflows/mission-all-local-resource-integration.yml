name: ANOMALIA mission - integrate all existing local resource packages into D
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-all-local-resource-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: resource-import-${{ github.run_id }}
          sparse-checkout: scripts/ue5/integrate-existing-local-packages.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare actual-project import receipts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ('actual-resource-import-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out | Out-Null
          "MISSION_BULK_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $os=Get-CimInstance Win32_OperatingSystem
          $disks=@(Get-CimInstance Win32_LogicalDisk | Where-Object {$_.DeviceID -in @('C:','D:')} | Select-Object DeviceID,FileSystem,FreeSpace)
          [ordered]@{actualProject='D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject';planRun=41842801517;disks=$disks;freeRAMBytes=$os.FreePhysicalMemory*1KB;noOverwrite=$true;originalLevelsProtected=$true} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $out 'preflight.json') -Encoding UTF8
          if($os.FreePhysicalMemory*1KB -lt 2GB){throw 'Insufficient reserve for resource reconciliation'}
      - uses: actions/download-artifact@v4
        with:
          name: mission-all-existing-local-resource-plan
          run-id: 41842801517
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ env.MISSION_BULK_OUT }}/input/
      - name: Integrate native resource packages, preserving all existing assets, maps and source projects
        timeout-minutes: 82
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $env:GITHUB_WORKSPACE ('resource-import-'+$env:GITHUB_RUN_ID+'\scripts\ue5\integrate-existing-local-packages.py')
          & 'C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe' -B $script
          if($LASTEXITCODE -ne 0){throw 'Import paused with preserved originals; review the persistent receipt before resuming'}
      - uses: actions/upload-artifact@v4
        if: always() && env.MISSION_BULK_OUT != ''
        with:
          name: mission-actual-D-resource-integration
          path: ${{ env.MISSION_BULK_OUT }}/
          if-no-files-found: error
