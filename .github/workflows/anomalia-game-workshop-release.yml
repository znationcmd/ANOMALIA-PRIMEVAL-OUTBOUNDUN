name: ANOMALIA Game Windows — verified automatic release
on:
  push:
    branches: [main]
    paths:
      - "src/workshop-ui.js"
      - "src/start-menu.js"
      - "src/style.css"
      - "public/workshop-landscape.svg"
      - "desktop/**"
      - "index.html"
      - "package.json"
      - ".github/workflows/anomalia-game-workshop-release.yml"
permissions:
  contents: write
concurrency:
  group: anomalia-game-windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
      TAG: anomalia-game-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate game and embedded Workshop
        run: npm test
      - name: Build the game assets
        run: npm run build
      - name: Generate official game icon
        run: |
          python -m pip install Pillow
          python scripts/prepare-windows-icon.py
      - name: Package Windows game without premature publication
        run: npm run package:windows
      - name: Verify setup, version and automatic updater
        id: metadata
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content package.json -Raw | ConvertFrom-Json).version
          $dir='release/windows'
          $latest=Join-Path $dir 'latest.yml'
          if(-not (Test-Path $latest)){throw 'Missing latest.yml'}
          $manifest=Get-Content $latest -Raw
          if($manifest -notmatch ('(?m)^version:\s*'+[regex]::Escape($version)+'\s*$')){throw 'Manifest version mismatch'}
          if($manifest -notmatch '(?m)^\s*sha512:\s*[A-Za-z0-9+/=]{80,}\s*$'){throw 'Missing manifest SHA512'}
          $exe=@(Get-ChildItem $dir -Filter '*-Setup-*-x64.exe' -File)
          $block=@(Get-ChildItem $dir -Filter '*.blockmap' -File)
          if($exe.Count -ne 1 -or $exe[0].Length -lt 10000000){throw 'Missing Windows installer'}
          if($block.Count -lt 1){throw 'Missing update blockmap'}
          $name=[regex]::Match($manifest,'(?m)^path:\s*(.+?\.exe)\s*$')
          if(-not $name.Success -or $name.Groups[1].Value.Trim() -cne $exe[0].Name){throw 'Wrong setup name'}
          if($exe[0].Name -match '\s'){throw 'Unsafe installer filename'}
          "version=$version" >> $env:GITHUB_OUTPUT
          $older=Join-Path $env:RUNNER_TEMP 'prior-game-version'
          New-Item -ItemType Directory -Force -Path $older | Out-Null
          gh release view $env:TAG -R $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          $publish='true'
          if($LASTEXITCODE -eq 0){
            gh release download $env:TAG -R $env:GITHUB_REPOSITORY --pattern latest.yml --dir $older | Out-Null
            $old=Join-Path $older 'latest.yml'
            if(Test-Path $old){
              $match=[regex]::Match((Get-Content $old -Raw),'(?m)^version:\s*[''"]?(\d+\.\d+\.\d+)')
              if($match.Success -and [version]$match.Groups[1].Value -ge [version]$version){$publish='false'}
            }
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
      - name: Publish game installer and updater manifest
        if: steps.metadata.outputs.publish == 'true'
        run: |
          $ErrorActionPreference='Stop'
          $version="${{ steps.metadata.outputs.version }}"
          $tag=$env:TAG
          $dir='release/windows'
          gh release view $tag -R $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if($LASTEXITCODE -ne 0){
            gh release create $tag -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ("ANOMALIA Game "+$version) --notes 'Version Windows du jeu avec Workshop intégré au menu.' --latest=false
            if($LASTEXITCODE -ne 0){throw 'Cannot create game release'}
          }
          $exe=@(Get-ChildItem $dir -Filter '*.exe' -File | ForEach-Object {$_.FullName})
          $block=@(Get-ChildItem $dir -Filter '*.blockmap' -File | ForEach-Object {$_.FullName})
          & gh release upload $tag @exe @block -R $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw 'Cannot upload Windows game installer'}
          gh release upload $tag (Join-Path $dir 'latest.yml') -R $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw 'Cannot upload latest.yml'}
          gh release edit $tag -R $env:GITHUB_REPOSITORY --title ("ANOMALIA Game "+$version) --notes ("Workshop intégré. Version "+$version+". Commit "+$env:GITHUB_SHA) --latest=false
          if($LASTEXITCODE -ne 0){throw 'Cannot update release notes'}
