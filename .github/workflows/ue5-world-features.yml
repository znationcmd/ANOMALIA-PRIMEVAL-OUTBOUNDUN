name: UE5 licensed world features import
on:
  workflow_dispatch:
  push:
    branches: ['ue5/driveable-roster-city-20261023']
    paths:
      - 'docs/art/world-features-sources.json'
      - 'scripts/world-features/prepare-sources.py'
      - 'scripts/vehicle-assets/prepare-world-features.mjs'
      - 'scripts/world-features/import-review.py'
      - 'scripts/world-features/run-editor-task.py'
      - 'scripts/world-features/prepare-marine-sources.py'
      - 'scripts/world-features/apply-marine-terrain.py'
      - 'scripts/world-features/place-exterior-bunkers.py'
      - 'scripts/world-features/settlement_roads.py'
      - 'scripts/world-features/build-settlement-roads.py'
      - 'scripts/world-features/run-visual-review.py'
      - 'scripts/world-features/configure-detailed-rendering.py'
      - 'docs/art/marine-terrain-sources.json'
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  import-world-features:
    if: github.repository == 'znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN'
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify credited sources and import isolated review
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:UE_ROOT) { throw 'Installed UE5.8 is required.' }
          $enginePython = Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          & $enginePython scripts/world-features/prepare-sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix scripts/vehicle-assets --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/vehicle-assets/prepare-world-features.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Join-Path $env:GITHUB_WORKSPACE "unreal/Saved/WorldFeatures/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ANOMALIA_WORLD_FEATURES_REPORT = Join-Path $evidence 'import.json'
          $editor = Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal/AnomaliaPrimeval.uproject'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/import-review.py'
          $wrapper = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/run-editor-task.py'
          $env:ANOMALIA_EDITOR_TASK = $script
          & $editor $project "-ExecutePythonScript=$wrapper" -NullRHI -unattended -nopause -nosound "-abslog=$evidence/import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content $env:ANOMALIA_WORLD_FEATURES_REPORT -Raw | ConvertFrom-Json
          if ($report.state -ne 'IMPORTED_REVIEW_SAVED_SCALE_AND_ACCESS_UNVALIDATED' -or $report.sourceCommit -ne $env:GITHUB_SHA -or @($report.models).Count -ne 8) { throw 'Fresh full import report required.' }
      - name: Apply 4K shore and seabed material to the saved populated world
        if: ${{ !cancelled() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $enginePython = Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          & $enginePython scripts/world-features/prepare-marine-sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Join-Path $env:GITHUB_WORKSPACE "unreal/Saved/WorldFeatures/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ANOMALIA_MARINE_TERRAIN_REPORT = Join-Path $evidence 'marine-terrain.json'
          $env:ANOMALIA_EDITOR_TASK = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/apply-marine-terrain.py'
          $wrapper = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/run-editor-task.py'
          $editor = Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal/AnomaliaPrimeval.uproject'
          & $editor $project "-ExecutePythonScript=$wrapper" -NullRHI -unattended -nopause -nosound "-abslog=$evidence/marine-terrain.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content $env:ANOMALIA_MARINE_TERRAIN_REPORT -Raw | ConvertFrom-Json
          if ($report.state -ne 'MARINE_TERRAIN_MATERIAL_SAVED_NOT_RENDERED' -or $report.sourceCommit -ne $env:GITHUB_SHA -or $report.terrainComponents -ne 576) { throw 'Fresh complete marine material receipt required.' }
      - name: Place imported exterior bunkers on the populated map
        if: ${{ !cancelled() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE "unreal/Saved/WorldFeatures/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ANOMALIA_BUNKER_REPORT = Join-Path $evidence 'exterior-bunkers.json'
          $env:ANOMALIA_EDITOR_TASK = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/place-exterior-bunkers.py'
          $wrapper = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/run-editor-task.py'
          $editor = Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal/AnomaliaPrimeval.uproject'
          & $editor $project "-ExecutePythonScript=$wrapper" -NullRHI -unattended -nopause -nosound "-abslog=$evidence/exterior-bunkers.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content $env:ANOMALIA_BUNKER_REPORT -Raw | ConvertFrom-Json
          if ($report.state -ne 'EXTERIOR_BUNKERS_SAVED_NOT_PLAYTESTED' -or $report.sourceCommit -ne $env:GITHUB_SHA -or $report.count -lt 1) { throw 'Fresh bunker placement receipt required.' }
      - name: Build local 3D streets in the saved towns
        if: ${{ !cancelled() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE "unreal/Saved/WorldFeatures/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ANOMALIA_STREETS_REPORT = Join-Path $evidence 'town-streets.json'
          $env:ANOMALIA_EDITOR_TASK = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/build-settlement-roads.py'
          $wrapper = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/run-editor-task.py'
          $editor = Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal/AnomaliaPrimeval.uproject'
          & $editor $project "-ExecutePythonScript=$wrapper" -NullRHI -unattended -nopause -nosound "-abslog=$evidence/town-streets.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content $env:ANOMALIA_STREETS_REPORT -Raw | ConvertFrom-Json
          if ($report.state -ne 'TOWN_STREETS_SAVED_NOT_PLAYTESTED' -or $report.sourceCommit -ne $env:GITHUB_SHA -or $report.townsWithStreets -lt 20) { throw 'Fresh town street build receipt required.' }
      - name: Preserve foliage and street detail on the compatibility renderer
        if: ${{ !cancelled() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE "unreal/Saved/WorldFeatures/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ANOMALIA_RENDER_SETTINGS_REPORT = Join-Path $evidence 'detailed-render-settings.json'
          $env:ANOMALIA_EDITOR_TASK = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/configure-detailed-rendering.py'
          $wrapper = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/run-editor-task.py'
          $editor = Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal/AnomaliaPrimeval.uproject'
          & $editor $project "-ExecutePythonScript=$wrapper" -NullRHI -unattended -nopause -nosound "-abslog=$evidence/detailed-render-settings.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content $env:ANOMALIA_RENDER_SETTINGS_REPORT -Raw | ConvertFrom-Json
          if ($report.state -ne 'DETAILED_COMPATIBILITY_SETTINGS_SAVED_NOT_RENDERED' -or $report.sourceCommit -ne $env:GITHUB_SHA -or @($report.meshes).Count -ne 29) { throw 'Fresh compatibility detail settings required.' }
      - name: Check all saved detailed meshes and reject primitive placeholders
        if: ${{ !cancelled() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:GITHUB_WORKSPACE "unreal/Saved/WorldFeatures/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ANOMALIA_DETAILED_WORLD_REPORT = Join-Path $evidence 'detailed-mesh-audit.json'
          $env:ANOMALIA_EDITOR_TASK = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/audit-detailed-world.py'
          $wrapper = Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/run-editor-task.py'
          $editor = Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe'
          $project = Join-Path $env:GITHUB_WORKSPACE 'unreal/AnomaliaPrimeval.uproject'
          & $editor $project "-ExecutePythonScript=$wrapper" -NullRHI -unattended -nopause -nosound "-abslog=$evidence/detailed-mesh-audit.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content $env:ANOMALIA_DETAILED_WORLD_REPORT -Raw | ConvertFrom-Json
          if ($report.state -ne 'DETAILED_MESH_AUDIT_PASSED_NOT_RENDERED' -or $report.sourceCommit -ne $env:GITHUB_SHA -or $report.savedHouseDescriptors -ne 4760 -or $report.enginePrimitivesFound -ne 0) { throw 'Fresh detailed geometry audit required.' }
      - name: Render the detailed imported models and capture day and night views
        if: ${{ !cancelled() }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $enginePython = Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          $evidence = Join-Path $env:GITHUB_WORKSPACE "unreal/Saved/WorldFeatures/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $enginePython scripts/world-features/run-visual-review.py --engine-root "$env:UE_ROOT" --output "$evidence/visual-render"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ue5-world-features-evidence
          path: unreal/Saved/WorldFeatures/run-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
