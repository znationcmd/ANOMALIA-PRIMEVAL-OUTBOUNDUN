name: Prepare real standalone SKARVIK game storage without an editor launcher
on:
  push:
    branches: [feature/real-skarvik-bmw-dog-gameplay-capture-20261111]
    paths:
      - .github/workflows/anomalia-authentic-install.yml
      - scripts/ue5/authentic-main/**
permissions: {contents: read}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: true
jobs:
  authentic-install:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Measure physical storage and obsolete reproducible build caches
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path 'D:\ANOMALIAZ\01_Projet_Principal\unreal\Saved\AuthenticInstall' $env:GITHUB_RUN_ID
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          ('AUTHENTIC_OUT='+$out)|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $volumes=@(foreach($drive in [IO.DriveInfo]::GetDrives()){
            if($drive.IsReady){[ordered]@{name=$drive.Name;type=$drive.DriveType.ToString();format=$drive.DriveFormat;label=$drive.VolumeLabel;bytes=$drive.TotalSize;free=$drive.AvailableFreeSpace}}
          })
          $projects=@('D:\ANOMALIAZ\02_Projet_Migration\unreal')
          $validation='C:\ANOMALIA-Validation'
          if(Test-Path -LiteralPath $validation){
            foreach($folder in Get-ChildItem -LiteralPath $validation -Directory -Force){
              if($folder.Name -match '^c[0-9]+$'){
                $p=Join-Path $folder.FullName 'unreal'
                if(Test-Path -LiteralPath $p){$projects+=$p}
              }
            }
          }
          $caches=@()
          foreach($project in $projects){
            foreach($sub in @('Intermediate','DerivedDataCache','Saved\Cooked','Saved\StagedBuilds')){
              $p=Join-Path $project $sub
              if(-not(Test-Path -LiteralPath $p -PathType Container)){continue}
              $item=Get-Item -LiteralPath $p -Force
              if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){continue}
              $size=0L;$count=0
              foreach($file in Get-ChildItem -LiteralPath $p -Recurse -File -Force -ErrorAction SilentlyContinue){$size+=$file.Length;$count++}
              $caches+=[ordered]@{path=$p;bytes=$size;files=$count;kind=$sub}
            }
          }
          @{volumes=$volumes;reproducibleCacheCandidates=$caches;authoritativeSourceNotDeleted=$true;editorLauncherWillNotBeInstalled=$true}|ConvertTo-Json -Depth 6|Set-Content -LiteralPath (Join-Path $out 'standalone-storage.json')
          Get-Content -LiteralPath (Join-Path $out 'standalone-storage.json')
          $params=Join-Path $env:UE_ROOT 'Engine\Source\Programs\AutomationTool\AutomationUtils\ProjectParams.cs'
          if(Test-Path -LiteralPath $params){Select-String -LiteralPath $params -Pattern 'CookOutputDir|CookOutputDirectory|StageDirectory|BaseStageDirectory' -Context 1,1|Out-String|Write-Host}
          $script=Join-Path $env:UE_ROOT 'Engine\Source\Programs\AutomationTool\Scripts\CookCommand.Automation.cs'
          if(Test-Path -LiteralPath $script){Select-String -LiteralPath $script -Pattern 'CookOutputDir|CookOutputDirectory|OutputDir' -Context 1,1|Out-String|Write-Host}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: REAL-STANDALONE-GAME-STORAGE
          path: D:/ANOMALIAZ/01_Projet_Principal/unreal/Saved/AuthenticInstall/*/standalone-storage.json
          if-no-files-found: warn
