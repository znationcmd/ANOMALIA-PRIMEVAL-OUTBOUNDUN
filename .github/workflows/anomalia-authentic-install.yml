name: Inspect authoritative real-game source interfaces and available storage
on:
  push:
    branches: [feature/real-skarvik-bmw-dog-gameplay-capture-20261111]
    paths: [.github/workflows/anomalia-authentic-install.yml]
permissions: {contents: read}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  authentic-install:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Retain actual native source interfaces and physical storage information
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ANOMALIAZ\01_Projet_Principal\unreal'
          $out=Join-Path $root ('Saved\AuthenticInstall\'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          ('AUTHENTIC_OUT='+$out)|Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $names=@('AnomaliaGameMode.cpp','AnomaliaGameMode.h','AnomaliaSessionWidget.cpp','AnomaliaSessionWidget.h','AnomaliaSurvivor.cpp','AnomaliaDogCompanion.h','AnomaliaVehiclePawn.h','Vehicles\AnomaliaChaosRoadVehicle.h','AnomaliaPrimeval.Build.cs')
          foreach($name in $names){
            $p=Join-Path $root ('Source\AnomaliaPrimeval\'+$name)
            if(Test-Path -LiteralPath $p){Copy-Item -LiteralPath $p -Destination (Join-Path $out ($name.Replace('\','_')))}
          }
          Get-PSDrive -PSProvider FileSystem|Select-Object Name,Root,Free,Used|ConvertTo-Json|Set-Content (Join-Path $out 'volumes.json')
          Get-Content (Join-Path $out 'volumes.json')
          foreach($p in @('Source\CitySample\CitySample.Build.cs','Source\CitySampleAnimGraphRuntime\CitySampleAnimGraphRuntime.Build.cs','Source\CitySampleEditor\CitySampleEditor.Build.cs')){
            if(Test-Path -LiteralPath (Join-Path $root $p)){Write-Host ('CITY_MODULE_PRESENT='+$p)}
          }
      - name: Inspect authoritative city spawn and true vehicle rig asset locations
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'User native session is active'}
          $script=Join-Path $env:AUTHENTIC_OUT 'inspect-real.py'
          @'
          import unreal,json,os,traceback
          from pathlib import Path
          r={"state":"FAILED","realAssets":{}}
          try:
              registry=unreal.AssetRegistryHelpers.get_asset_registry()
              registry.wait_for_completion()
              for p in ["/Game/Vehicles/OffroadCar/SKM_Offroad","/Game/Vehicles/OffroadCar/Offroad_AnimBP","/Game/Survival_Character/Meshes/SK_Survival_Character","/Game/German_Shepherd_3D_Model/Models/SK_GermanShepherd_01","/Game/Anomalia/BMWE39Review_v7/body/SM_body"]:
                  a=unreal.load_asset(p);r["realAssets"][p]={"loaded":bool(a),"class":a.get_class().get_name() if a else None}
              world=unreal.EditorAssetLibrary.load_asset("/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1")
              if not isinstance(world,unreal.World):raise RuntimeError("Authentic world package missing")
              if not unreal.get_editor_subsystem(unreal.LevelEditorSubsystem).load_level("/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1"):raise RuntimeError("Authentic world failed to open")
              ew=unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem).get_editor_world()
              r["worldPackage"]=ew.get_path_name()
              actors=unreal.get_editor_subsystem(unreal.EditorActorSubsystem)
              descs=unreal.WorldPartitionBlueprintLibrary.get_actor_descs() or []
              r["descriptors"]=len(descs)
              chosen=[d.guid for d in descs if "PLAYER_START" in str(d.label).upper() or str(d.label).startswith("SKARVIK_COMPLETE_REAL_BUILDING_")]
              if chosen:unreal.WorldPartitionBlueprintLibrary.load_actors(chosen)
              loaded=actors.get_all_level_actors()
              r["playerStarts"]=[{"label":a.get_actor_label(),"position":[a.get_actor_location().x,a.get_actor_location().y,a.get_actor_location().z]} for a in loaded if isinstance(a,unreal.PlayerStart)]
              r["cityActors"]=[{"label":a.get_actor_label(),"position":[a.get_actor_location().x,a.get_actor_location().y,a.get_actor_location().z],"meshes":[c.get_editor_property("static_mesh").get_path_name() for c in a.get_components_by_class(unreal.StaticMeshComponent) if c.get_editor_property("static_mesh")]} for a in loaded if "CITY" in a.get_actor_label().upper() or a.get_actor_label().startswith("SKARVIK_COMPLETE_REAL_BUILDING_")][:50]
              r["state"]="AUTHORITATIVE_REAL_GAME_ASSETS_READ"
          except Exception:r["error"]=traceback.format_exc()
          finally:
              Path(os.environ["AUTHENTIC_OUT"],"real-world-source.json").write_text(json.dumps(r,indent=2),encoding="utf-8")
              unreal.SystemLibrary.quit_editor()
          '@|Set-Content -LiteralPath $script -Encoding utf8
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          & $editor 'D:\ANOMALIAZ\01_Projet_Principal\unreal\AnomaliaPrimeval.uproject' /Engine/Maps/Entry "-ExecutePythonScript=$script" -NullRHI -unattended -nopause -nosound ("-abslog="+(Join-Path $env:AUTHENTIC_OUT 'inspect-real.log'))
          Get-Content -LiteralPath (Join-Path $env:AUTHENTIC_OUT 'real-world-source.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AUTHORITATIVE-AUTHENTIC-GAME-SOURCE
          path: D:/ANOMALIAZ/01_Projet_Principal/unreal/Saved/AuthenticInstall/*/
          if-no-files-found: warn
