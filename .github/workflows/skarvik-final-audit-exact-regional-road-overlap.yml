name: SKARVIK - verify exact duplicate regional asphalt meshes after real World Partition reload
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-final-audit-exact-regional-road-overlap.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  native-precise-duplicate-audit:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Gate independent native read-only audit with all road sources protected
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $marker=Join-Path $root '.skarvik-ci-stage-marker'
          if(!(Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw).Trim() -ne '41188816555'){throw 'Untrusted native staging marker'}
          foreach($f in @('D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap',
           (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_FINAL_v1.umap'),
           (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_GRADED_v2.umap'),
           (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_ISLANDS_v1.umap'),
           (Join-Path $root 'Content\Map\Big_City_LVL.umap'))){
            if(!(Test-Path -LiteralPath $f)){throw "Protected map absent $f"}
          }
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){
            throw 'Concurrent Unreal operation must finish before audit'}
          $py=Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $py -m py_compile (Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\audit_skarvik_final_exact_regional_asphalt_duplicates.py')
          if($LASTEXITCODE -ne 0){throw 'Native exact mesh overlap audit does not compile'}
      - name: Load candidate genuine StaticMesh actors to distinguish actual duplicates from harmless nearby road geometry
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $env:SKARVIK_FINAL_REGIONAL_EXACT_DUPLICATES_REPORT=Join-Path $env:GITHUB_WORKSPACE 'skarvik-final-native-confirmed-regional-asphalt-duplicates.json'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\audit_skarvik_final_exact_regional_asphalt_duplicates.py'
          & $editor (Join-Path $root 'AnomaliaZPrigimalia.uproject') "-ExecutePythonScript=$script" -nullrhi -unattended -nopause -nosound
          $exit=$LASTEXITCODE
          if(!(Test-Path -LiteralPath $env:SKARVIK_FINAL_REGIONAL_EXACT_DUPLICATES_REPORT)){throw 'Native read-only exact duplicate report missing'}
          $report=Get-Content -LiteralPath $env:SKARVIK_FINAL_REGIONAL_EXACT_DUPLICATES_REPORT -Raw|ConvertFrom-Json
          Write-Host ('SKARVIK_FINAL_ACTUAL_REGIONAL_DUPLICATE_AUDIT_STATE='+$report.state)
          Write-Host ('SKARVIK_FINAL_POSSIBLE_SAME_ROUTE_SUBMETRE_DESCRIPTOR_PAIRS='+$report.sameRouteDescriptorCandidates)
          Write-Host ('SKARVIK_FINAL_CONFIRMED_SAME_MESH_OVERLAID_ACTORS='+$report.exactSameMeshPathAndDirection)
          Write-Host ('SKARVIK_FINAL_OVERLAPPING_SOURCE_ROUTES='+(@($report.overlapRoutes) -join ','))
          if($report.state -ne 'SKARVIK_FINAL_TWO_REGIONAL_PILOTS_REAL_DUPLICATE_MESHES_VERIFIED_READ_ONLY' -or
             $report.protectedOriginalsUnchanged -ne $true -or $report.nativeWorldMutated -ne $false){
             throw ('Native same-source asphalt overlap validation not proven: '+$report.error)
          }
          if($exit -ne 0){Write-Host ('SKARVIK_NATIVE_READONLY_UNREAL_SHUTDOWN_NONZERO='+$exit)}
          Write-Host 'SKARVIK_FINAL_EXACT_3D_ROAD_OVERLAP_REVIEW_SAVED_NOT_DELETED=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarvik-final-real-regional-road-exact-duplicate-mesh-audit
          path: skarvik-final-native-confirmed-regional-asphalt-duplicates.json
          if-no-files-found: warn
