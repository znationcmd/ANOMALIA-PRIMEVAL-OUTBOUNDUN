name: ANOMALIA add downloaded Fab content
on:
  push:
    branches: ['ue5/character-audit-20261027']
    paths: ['.github/workflows/ue5-add-downloaded-content.yml']
permissions:
  contents: read
jobs:
  import:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 45
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Copy missing content only and verify copied bytes
        shell: node {0}
        run: |
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),cp=require('child_process');
          const project='D:/ANOMALIA/unreal',target=path.resolve(project,'Content');
          if(!fs.existsSync(path.join(project,'AnomaliaPrimeval.uproject')))throw Error('Project missing');
          const processes=cp.execFileSync('tasklist.exe',['/FI','IMAGENAME eq UnrealEditor.exe','/NH'],{encoding:'utf8'});
          if(/UnrealEditor\.exe/i.test(processes))throw Error('Editor is running; retry after closing it');
          const report={scope:'Content import only; plugin activation and gameplay wiring not performed',copied:0,bytes:0,existing:0,packs:[],skipped:[],errors:[]};
          const reportPath='D:/ANOMALIA/StorageRecovery/fab-missing-content-import.json';
          fs.mkdirSync(path.dirname(reportPath),{recursive:true});
          function save(){fs.writeFileSync(reportPath,JSON.stringify(report,null,2));}
          function hash(file){
            const h=crypto.createHash('sha256'),fd=fs.openSync(file,'r'),buf=Buffer.alloc(1024*1024);
            try {let n;while((n=fs.readSync(fd,buf,0,buf.length,null))>0)h.update(buf.subarray(0,n));return h.digest('hex');}
            finally{fs.closeSync(fd);}
          }
          function files(dir,out=[]){
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              if(e.isSymbolicLink())throw Error('Unexpected source link '+dir);
              const p=path.join(dir,e.name);
              if(e.isDirectory())files(p,out);else out.push(p);
            }return out;
          }
          try{
            const cache='D:/ANOMALIA/FabImports/VaultCache';
            for(const entry of fs.readdirSync(cache,{withFileTypes:true})){
              if(!entry.isDirectory()||entry.isSymbolicLink()||/CitySample_5\.8|RecoveredC|FabLibrary/i.test(entry.name))continue;
              const data=path.join(cache,entry.name,'data'),content=path.join(data,'Content');
              if(!fs.existsSync(content))continue;
              if(fs.existsSync(path.join(data,'Plugins'))||fs.existsSync(path.join(data,'Source'))){
                report.skipped.push({pack:entry.name,reason:'Native source or project plugins require separate compatibility review'});continue;
              }
              const plan=[];
              for(const source of files(content)){
                const dest=path.resolve(target,path.relative(content,source));
                if(!dest.startsWith(target+path.sep))throw Error('Invalid destination');
                if(fs.existsSync(dest)){report.existing++;continue;}
                plan.push({source,dest,bytes:fs.statSync(source).size});
              }
              const total=plan.reduce((n,f)=>n+f.bytes,0),disk=fs.statfsSync(target);
              if(disk.bavail*disk.bsize<total+20*1024**3){report.skipped.push({pack:entry.name,reason:'20 GiB free-space reserve',bytes:total});continue;}
              const pack={name:entry.name,missingFiles:plan.length,bytes:total,copied:0};report.packs.push(pack);save();
              for(const f of plan){
                fs.mkdirSync(path.dirname(f.dest),{recursive:true});
                fs.copyFileSync(f.source,f.dest,fs.constants.COPYFILE_EXCL);
                if(fs.statSync(f.dest).size!==f.bytes||hash(f.source)!==hash(f.dest))throw Error('Copied file verification failed: '+f.dest);
                report.copied++;pack.copied++;report.bytes+=f.bytes;
              }
              save();console.log('PACK '+JSON.stringify(pack));
            }
          }catch(e){report.errors.push(String(e));throw e;}
          finally{save();console.log('IMPORT_RESULT '+JSON.stringify(report));}
