name: ANOMALIA mission - inspect fleet and stage vehicle color variants
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-fleet-repair-and-colors.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  verify:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: registered-${{ github.run_id }}
          sparse-checkout: unreal/Content/Python/inspect_fleet_and_stage_paint_variants.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Prepare real-project verification without a validation project substitution
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ('registered-resources-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out | Out-Null
          "VEHICLE_REPAIR_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $os=Get-CimInstance Win32_OperatingSystem
          [ordered]@{project='D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject';integrationRun=41846216338;freeRAMBytes=$os.FreePhysicalMemory*1KB;freeVirtualBytes=$os.FreeVirtualMemory*1KB} | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $out 'preflight.json') -Encoding UTF8
          if($os.FreePhysicalMemory*1KB -lt 4GB -or $os.FreeVirtualMemory*1KB -lt 8GB){throw 'Insufficient measured reserve for actual editor registration verification'}
      - name: Inspect actual fleet and save new isolated paint variants without modifying source meshes or maps
        timeout-minutes: 35
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Another Unreal process is active'}
          $script=Join-Path $env:GITHUB_WORKSPACE ('registered-'+$env:GITHUB_RUN_ID+'\unreal\Content\Python\inspect_fleet_and_stage_paint_variants.py')
          $editor='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $ErrorActionPreference='Continue'
          & $editor 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject' -run=pythonscript "-script=$script" -unattended -nopause -nosound -NullRHI "-abslog=$env:VEHICLE_REPAIR_OUT\engine.log" *> (Join-Path $env:VEHICLE_REPAIR_OUT 'process.log')
          $code=$LASTEXITCODE
          $ErrorActionPreference='Stop'
          if($code -ne 0){throw 'Actual project reports native registration/load errors; keep the diagnostics and imported resources'}
          if(!(Test-Path -LiteralPath (Join-Path $env:VEHICLE_REPAIR_OUT 'vehicle-repair-report.json'))){throw 'No actual-project resource receipt was produced'}
      - uses: actions/upload-artifact@v4
        if: always() && env.VEHICLE_REPAIR_OUT != ''
        with:
          name: mission-actual-D-fleet-repair-and-colors
          path: ${{ env.VEHICLE_REPAIR_OUT }}/
          if-no-files-found: error
