name: ANOMALIA WorkForge Windows app build
on:
  push:
    branches:
      - feature/real-skarvik-bmw-dog-gameplay-capture-20261111
    paths:
      - scripts/workforge-runtime-smoke.mjs
      - src/workforge.js
      - src/start-menu.js
      - src/style.css
      - .github/workflows/workforge-windows-app.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-app:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install verified dependencies
        run: npm ci
      - name: Run project tests
        run: npm test
      - name: Build in-game browser and desktop UI
        run: npm run build
      - name: Prepare original app icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/prepare-windows-icon.py
      - name: Verify menu integration source
        run: |
          node --check src/workforge.js
          node --check src/start-menu.js
      - name: Package Windows application
        run: npm run package:windows
      - name: Install and test actual Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = @(Get-ChildItem release/windows/*Setup*.exe)
          if ($setup.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $destination = Join-Path $env:RUNNER_TEMP ('AnomaliaWorkForge-' + $env:GITHUB_RUN_ID)
          $process = Start-Process -FilePath $setup[0].FullName -ArgumentList @('/S', ('/D=' + $destination)) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          $exe = @(Get-ChildItem -LiteralPath $destination -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' })
          if ($exe.Count -ne 1) { throw 'Installed app executable missing or ambiguous' }
          $env:WORKFORGE_EXE = $exe[0].FullName
          node scripts/workforge-runtime-smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed WorkForge interaction failed' }
      - name: Upload installed application runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANOMALIAZ-WORKFORGE-INSTALLED-RUNTIME
          path: test-results/workforge/
          if-no-files-found: warn
      - name: Upload actual Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ANOMALIAZ-WORKFORGE-WINDOWS-TEST-BUILD
          path: release/windows/*.exe
          if-no-files-found: error
      - name: Upload tested standalone Windows application
        uses: actions/upload-artifact@v4
        with:
          name: ANOMALIAZ-WORKFORGE-STANDALONE
          path: release/windows/win-unpacked/
          if-no-files-found: error
