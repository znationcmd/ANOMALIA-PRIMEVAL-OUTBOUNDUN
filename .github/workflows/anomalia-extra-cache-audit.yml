name: Audit additional regenerable caches on ANOMALIA-PC
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-extra-cache-audit.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  audit:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 15
    steps:
      - name: Measure Windows temporary and graphics caches
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected runner'}
          if(@(Get-Process UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Existing Unreal/game session preserved'}
          $paths=@(
            (Join-Path $env:LOCALAPPDATA 'Temp'),
            (Join-Path $env:LOCALAPPDATA 'D3DSCache'),
            (Join-Path $env:LOCALAPPDATA 'NVIDIA\DXCache'),
            (Join-Path $env:LOCALAPPDATA 'NVIDIA\GLCache'),
            'C:\Windows\Temp',
            'D:\ANOMALIA\unreal\Intermediate',
            'D:\ANOMALIA\unreal\Content\City'
          )
          foreach($p in $paths){
            if(Test-Path -LiteralPath $p){
              $files=Get-ChildItem -LiteralPath $p -File -Recurse -Force -ErrorAction SilentlyContinue
              [int64]$bytes=($files|Measure-Object -Property Length -Sum).Sum
              $cutoff=(Get-Date).AddDays(-14)
              [int64]$old=($files|Where-Object LastWriteTime -lt $cutoff|Measure-Object -Property Length -Sum).Sum
              Write-Output ('PATH_SIZE='+$p+' SIZE_GB='+[math]::Round($bytes/1GB,2)+' OVER_14D_GB='+[math]::Round($old/1GB,2)+' FILES='+$files.Count)
            } else {Write-Output ('PATH_MISSING='+$p)}
          }
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | ForEach-Object {Write-Output ('VOLUME='+$_.DeviceID+' FREE_GB='+[math]::Round($_.FreeSpace/1GB,1))}
