name: ANOMALIA’Z PRIGIMALIA — resume native character validation with verified patches
on:
  push:
    branches: ['ue5/character-audit-20261027']
    paths: ['.github/workflows/ue5-character-resume-validation.yml']
permissions:
  contents: read
jobs:
  resume:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 50
    concurrency:
      group: anomalia-ue5-native-host
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Back up hash-verified isolated sources and compile actual fixes
        shell: node {0}
        run: |
          const fs=require('fs'),path=require('path'),cp=require('child_process'),crypto=require('crypto');
          const stage='C:\\ANOMALIA-Validation\\c40543166274',engine=process.env.UE_ROOT||'C:\\Program Files\\Epic Games\\UE_5.8';
          const output=path.join(stage,'unreal','Saved','CharacterValidation','resume-'+process.env.GITHUB_RUN_ID);
          fs.mkdirSync(output,{recursive:true});
          fs.appendFileSync(process.env.GITHUB_ENV,'ANOMALIA_RESUME_OUTPUT='+output+'\n');
          const blob=s=>crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+Buffer.byteLength(s)+'\0'),Buffer.from(s)])).digest('hex');
          const changes=[{"path":"unreal/Source/AnomaliaPrimeval/Tests/AnomaliaTacticalSpeedTests.cpp","before":"0bf878a58e47d1cd913e973a7b41efed8a7f4b76","after":"e02437c44f84230e717b61315c8b2048c2217583","replacements":[["Survivor->VitalsComponent);","Survivor->VitalsComponent.Get());"],["->CrouchedHalfHeight<","->GetCrouchedHalfHeight()<"]]},{"path":"unreal/Source/AnomaliaPrimeval/AnomaliaSurvivor.cpp","before":"e350acf2476cda5a291d8d70750e08d421f2e77b","after":"36c904672a5684372ade3ae0fdb099dfe470800b","replacements":[["GetCharacterMovement()->CrouchedHalfHeight = 60.f;","GetCharacterMovement()->SetCrouchedHalfHeight(60.f);"]]},{"path":"unreal/Source/AnomaliaPrimeval/Vehicles/AnomaliaVehicleSurvival.cpp","before":"28aeff38fb4e84285a5d6499bd40ccc9d7b2574f","after":"33e6cebf581324e5202c461950ea55d54960b055","replacements":[["GetLifetimeReplicatedProps(TArray<FLifetimeProperty>& Out) const\n{Super::GetLifetimeReplicatedProps(Out);","GetLifetimeReplicatedProps(TArray<FLifetimeProperty>& OutLifetimeProps) const\n{Super::GetLifetimeReplicatedProps(OutLifetimeProps);"]]}];
          const pending=changes.map(c=>{
           const file=path.join(stage,c.path),original=fs.readFileSync(file),text=original.toString('utf8').replace(/\r\n/g,'\n');
           if(blob(text)!==c.before)throw Error('Staged source changed; refusing patch: '+c.path);
           let fixed=text;for(const [before,after]of c.replacements){if(!fixed.includes(before))throw Error('Missing patch anchor');fixed=fixed.replace(before,after);}
           if(blob(fixed)!==c.after)throw Error('Patched source hash differs from GitHub commit: '+c.path);
           return {...c,file,original,fixed};
          });
          for(const c of pending){
           const backup=path.join(output,'before',c.path);
           fs.mkdirSync(path.dirname(backup),{recursive:true});fs.writeFileSync(backup,c.original,{flag:'wx'});
           if(!fs.readFileSync(backup).equals(c.original))throw Error('Backup mismatch');
           fs.writeFileSync(c.file,c.fixed);
          }
          const receipt={baseBuildCommit:'3d044d6de6108eb99dc15a597920828e6dab79f5',patchSourceCommit:'0a60cda9b31aaff1e38ba7a4caec0a1fae27d809',workflowCommit:process.env.GITHUB_SHA,embeddedBuildCommitRetainedForIncrementalCompilation:true,changes:changes.map(({path,before,after})=>({path,before,after})),installedProjectModified:false};
          fs.writeFileSync(path.join(output,'source-patch-receipt.json'),JSON.stringify(receipt,null,2));
          const python=path.join(engine,'Engine','Binaries','ThirdParty','Python3','Win64','python.exe');
          const result=cp.spawnSync(python,[path.join(stage,'scripts','ue5','validate-build.py'),'--engine-root',engine,'--output',output,'--run-tests'],{cwd:stage,encoding:'utf8',timeout:2100000,maxBuffer:8*1024*1024,env:{...process.env,GITHUB_SHA:receipt.baseBuildCommit}});
          console.log('NATIVE_RESUME_EXIT '+result.status+' '+String(result.error||''));
          for(const name of ['report.json','AnomaliaPrimevalEditor.log','AnomaliaPrimeval.log']){
           const f=path.join(output,name);if(fs.existsSync(f))console.log(name+'\n'+fs.readFileSync(f,'utf8').split(/\r?\n/).slice(-65).join('\n'));
          }
          if(result.status!==0)process.exit(1);
          const editor=path.join(engine,'Engine','Binaries','Win64','UnrealEditor-Cmd.exe');
          function runScript(script,env,log){
           const r=cp.spawnSync(editor,[path.join(stage,'unreal','AnomaliaPrimeval.uproject'),'-run=pythonscript','-script='+script,'-unattended','-nop4','-NullRHI','-stdout','-FullStdOutLogOutput','-abslog='+path.join(output,log)],{cwd:stage,encoding:'utf8',timeout:420000,maxBuffer:16*1024*1024,env:{...process.env,...env}});
           console.log(log+' EXIT '+r.status+' '+String(r.error||''));
           console.log((String(r.stdout||'')+String(r.stderr||'')).split(/\r?\n/).filter(l=>/error|warning|Traceback|ANOMALIA/.test(l)).slice(-35).join('\n'));
           if(r.status!==0)process.exit(1);
          }
          const missing=['Manny','Quinn','Survival'].filter(n=>!fs.existsSync(path.join(stage,'unreal','Content','Anomalia','Characters','BP_Anomalia_'+n+'.uasset')));
          if(missing.length)runScript(path.join(stage,'unreal','Content','Python','setup_anomalia_character.py'),{ANOMALIA_CHARACTER_MODE:'create',ANOMALIA_CHARACTER_PROFILES:missing.join(',')},'setup-resumed.log');
          const scene=path.join(output,'verify-scene.py');fs.writeFileSync(scene,"\"\"\"Spawn/reload test actors in a new map; no claim of PIE or rendered validation.\"\"\"\nimport json\nimport os\nfrom pathlib import Path\nimport uuid\nimport unreal\n\nROOT = \"/Game/Anomalia/Characters\"\nMAP = \"/Game/Anomalia/CharacterTests/L_Anomalia_Characters\"\nNAMES = (\"Manny\", \"Quinn\", \"Survival\")\nSURVIVAL = \"/Game/Survival_Character/Meshes/Modular_Parts/SK_Survival_Character_\"\nGARMENTS = {\"Jacket\": (\"jacket_mesh\", \"Jacket\"), \"Pants\": (\"pants_mesh\", \"Jeans\"),\n            \"Boots\": (\"boots_mesh\", \"Shoes\"), \"Gloves\": (\"gloves_mesh\", \"Gloves\"),\n            \"Backpack\": (\"backpack_mesh\", \"Backpack\")}\n\n\ndef require(condition, message):\n    if not condition:\n        raise RuntimeError(message)\n\n\ndef main():\n    report = {\"engine\": unreal.SystemLibrary.get_engine_version(), \"actors\": [],\n              \"clothing\": [], \"errors\": [], \"PIE\": \"not_run\", \"render\": \"not_run\",\n              \"multiplayer\": \"not_run\", \"player_profile_save\": \"not_run\"}\n    try:\n        require(os.environ.get(\"ANOMALIA_CREATE_TEST_SCENE\") == \"1\", \"Explicit scene creation mode required\")\n        require(not unreal.EditorAssetLibrary.does_asset_exist(MAP), \"Existing map preserved: \" + MAP)\n        gm_path = \"/Game/Anomalia/CharacterTests/GM_Anomalia_CharacterTests\"\n        require(not unreal.EditorAssetLibrary.does_asset_exist(gm_path), \"Existing test GameMode preserved\")\n        classes = {n: unreal.EditorAssetLibrary.load_blueprint_class(ROOT + \"/BP_Anomalia_\" + n) for n in NAMES}\n        require(all(classes.values()), \"All three test Blueprints must already exist\")\n        parent = unreal.load_class(None, \"/Script/AnomaliaPrimeval.AnomaliaSurvivor\")\n        for name in NAMES:\n            bp = unreal.load_asset(ROOT + \"/BP_Anomalia_\" + name)\n            require(unreal.BlueprintEditorLibrary.get_blueprint_parent_class(bp) == parent, \"Wrong native parent: \" + name)\n        world = unreal.EditorLoadingAndSavingUtils.new_blank_map(False)\n        require(world is not None, \"New test world failed\")\n        subsystem = unreal.get_editor_subsystem(unreal.EditorActorSubsystem)\n        floor = subsystem.spawn_actor_from_class(unreal.StaticMeshActor, unreal.Vector(0, 0, -10))\n        require(floor is not None, \"Test floor spawn failed\")\n        floor.static_mesh_component.set_static_mesh(unreal.load_asset(\"/Engine/BasicShapes/Cube\"))\n        floor.set_actor_scale3d(unreal.Vector(40, 40, .2))\n        floor.set_actor_label(\"ANOMALIA test floor\")\n        subsystem.spawn_actor_from_class(unreal.DirectionalLight, unreal.Vector(0, 0, 500), unreal.Rotator(pitch=-45, yaw=-30))\n        subsystem.spawn_actor_from_class(unreal.SkyLight, unreal.Vector(0, 0, 400))\n        subsystem.spawn_actor_from_class(unreal.PlayerStart, unreal.Vector(0, -500, 100))\n        actors = {}\n        for index, name in enumerate(NAMES):\n            actor = subsystem.spawn_actor_from_class(classes[name], unreal.Vector(index * 200 - 200, 0, 100))\n            require(actor is not None, \"Actor spawn failed: \" + name)\n            actor.set_actor_label(\"ANOMALIA_TEST_\" + name)\n            mesh = actor.get_editor_property(\"mesh\")\n            body = mesh.get_editor_property(\"skeletal_mesh_asset\")\n            anim = mesh.get_editor_property(\"anim_class\")\n            require(body is not None and anim is not None, \"Missing saved body/animation: \" + name)\n            require(actor.get_editor_property(\"inventory_component\") is not None, \"Missing actual inventory: \" + name)\n            require(actor.get_editor_property(\"vitals_component\") is not None, \"Missing actual vitals: \" + name)\n            require(actor.get_editor_property(\"follow_camera\") is not None, \"Missing actual camera: \" + name)\n            require(actor.get_capsule_component().get_scaled_capsule_half_height() > 0, \"Missing capsule: \" + name)\n            report[\"actors\"].append({\"name\": name, \"mesh\": body.get_path_name(), \"animation\": anim.get_path_name(),\n                                      \"inventory_component\": True, \"vitals_component\": True, \"camera\": True, \"capsule\": True})\n            actors[name] = actor\n        survivor = actors[\"Survival\"]\n        if hasattr(survivor, \"set_clothing_mesh\"):\n            for slot, (property_name, suffix) in GARMENTS.items():\n                garment = unreal.load_asset(SURVIVAL + suffix)\n                require(garment is not None, \"Missing garment \" + suffix)\n                require(survivor.set_clothing_mesh(slot, garment), \"Garment rejected: \" + slot)\n                component = survivor.get_editor_property(property_name)\n                require(component.get_editor_property(\"skeletal_mesh_asset\") == garment, \"Garment not applied: \" + slot)\n                require(survivor.set_clothing_mesh(slot, None), \"Removal rejected: \" + slot)\n                require(component.get_editor_property(\"skeletal_mesh_asset\") is None, \"Garment not removed: \" + slot)\n                require(survivor.set_clothing_mesh(slot, garment), \"Re-equip rejected: \" + slot)\n                report[\"clothing\"].append({\"slot\": slot, \"apply_remove_reapply\": \"passed\", \"visual\": \"not_verified\"})\n            wrong = unreal.load_asset(\"/Game/QuantumCharacter/Mesh/Modules/SKM_Jeans\")\n            require(not survivor.set_clothing_mesh(\"Pants\", wrong), \"Mismatched Quantum garment accepted\")\n            report[\"mismatched_skeleton_rejected\"] = True\n        else:\n            report[\"clothing_blocker\"] = \"Installed native Survivor has no clothing API; source migration required\"\n        gm = unreal.BlueprintEditorLibrary.create_blueprint_asset_with_parent(gm_path, unreal.GameModeBase)\n        require(gm is not None, \"Test GameMode creation failed\")\n        gm_class = unreal.BlueprintEditorLibrary.generated_class(gm)\n        unreal.get_default_object(gm_class).set_editor_property(\"default_pawn_class\", classes[\"Manny\"])\n        require(unreal.BlueprintEditorLibrary.compile_blueprint(gm) is True, \"Test GameMode compilation failed\")\n        require(unreal.get_default_object(unreal.BlueprintEditorLibrary.generated_class(gm)).get_editor_property(\"default_pawn_class\") == classes[\"Manny\"], \"Test pawn class did not persist\")\n        require(unreal.EditorAssetLibrary.save_loaded_asset(gm, only_if_is_dirty=False), \"Test GameMode save failed\")\n        world.get_world_settings().set_editor_property(\"default_game_mode\", unreal.BlueprintEditorLibrary.generated_class(gm))\n        require(unreal.EditorLoadingAndSavingUtils.save_map(world, MAP), \"New map save failed\")\n        report[\"map_saved\"] = MAP\n        loaded = unreal.EditorLoadingAndSavingUtils.load_map(MAP)\n        require(loaded is not None, \"New map reload failed\")\n        labels = {a.get_actor_label() for a in subsystem.get_all_level_actors()}\n        require(all(\"ANOMALIA_TEST_\" + n in labels for n in NAMES), \"Actors missing after map reload\")\n        report[\"map_reloaded\"] = True\n        report[\"test_game_mode\"] = gm_path\n    except Exception as exc:\n        report[\"errors\"].append(str(exc))\n        raise\n    finally:\n        folder = Path(unreal.Paths.project_saved_dir()) / \"CharacterAudit\"\n        folder.mkdir(parents=True, exist_ok=True)\n        with (folder / (\"scene-\" + uuid.uuid4().hex + \".json\")).open(\"x\", encoding=\"utf-8\") as output:\n            json.dump(report, output, indent=2)\n        unreal.log(\"ANOMALIA_SCENE_REPORT \" + json.dumps(report))\n\n\nif __name__ == \"__main__\":\n    main()\n",{flag:'wx'});
          runScript(scene,{ANOMALIA_CREATE_TEST_SCENE:'1'},'scene.log');
          const reports=path.join(stage,'unreal','Saved','CharacterAudit');
          if(fs.existsSync(reports))for(const name of fs.readdirSync(reports)){fs.copyFileSync(path.join(reports,name),path.join(output,name));if(name.startsWith('scene-'))console.log('SCENE_RESULT '+fs.readFileSync(path.join(reports,name),'utf8'));}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-resumed-native-evidence
          path: ${{ env.ANOMALIA_RESUME_OUTPUT }}
          if-no-files-found: warn
