name: Inspect City Sample content on ANOMALIA-PC
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/citysample-content-presence-audit.yml]
permissions: {}
concurrency:
  group: anomalia-citysample-content-presence
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 15
    steps:
      - name: Read-only City Sample source and disk inventory
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD') { throw 'Unexpected runner; no files inspected' }
          $project = 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject'
          if (!(Test-Path -LiteralPath $project -PathType Leaf)) { throw 'ANOMALIA uproject not found' }
          $json = Get-Content -LiteralPath $project -Raw -Encoding UTF8 | ConvertFrom-Json
          $plugins = @($json.Plugins | ForEach-Object { $_.Name })
          Write-Output ('UPROJECT_CITY_SAMPLE_PLUGIN=' + [bool]($plugins -match '(?i)city.?sample'))
          Write-Output ('UPROJECT_PLUGINS=' + ($plugins -join ','))
          $drive = Get-PSDrive -Name D -ErrorAction SilentlyContinue
          if ($drive) { Write-Output ('D_FREE_GB=' + [math]::Round($drive.Free / 1GB, 2)) }
          $roots = @(
            'D:\ANOMALIA\unreal\Content',
            'D:\ANOMALIA\unreal\Plugins',
            'D:\ANOMALIA\Samples',
            'D:\Epic Games',
            'D:\Unreal Projects',
            'C:\Program Files\Epic Games',
            'C:\Program Files (x86)\Epic Games',
            (Join-Path $env:ProgramData 'Epic\EpicGamesLauncher\Data\Manifests')
          )
          foreach ($root in $roots) {
            if (!(Test-Path -LiteralPath $root -PathType Container)) { continue }
            Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)city.?sample' } |
              ForEach-Object { Write-Output ('CITY_SAMPLE_DIR=' + $_.FullName) }
            if ($root -like '*Manifests') {
              Get-ChildItem -LiteralPath $root -Filter '*.item' -File -ErrorAction SilentlyContinue | ForEach-Object {
                try {
                  $manifest = Get-Content -LiteralPath $_.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
                  $label = "$($manifest.DisplayName) $($manifest.AppName) $($manifest.InstallLocation)"
                  if ($label -match '(?i)city.?sample') { Write-Output ('CITY_SAMPLE_MANIFEST=' + $label) }
                } catch {}
              }
            }
          }
          $contentRoot = 'D:\ANOMALIA\unreal\Content'
          if (Test-Path -LiteralPath $contentRoot -PathType Container) {
            Get-ChildItem -LiteralPath $contentRoot -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)city.?sample' } |
              Select-Object -First 80 -ExpandProperty FullName |
              ForEach-Object { Write-Output ('CITY_SAMPLE_ASSET=' + $_) }
          }
          Write-Output 'READ_ONLY=true'
