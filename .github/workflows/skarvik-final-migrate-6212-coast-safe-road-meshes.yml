name: SKARVIK - migrate proven dry original 3D road meshes onto final seven island relief
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-final-migrate-6212-coast-safe-road-meshes.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  migrate-real-dry-asphalt:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: skarvik-final-seven-island-old-3d-road-landmask-grade-audit
          run-id: 41302837710
          repository: znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN
          github-token: ${{ github.token }}
          path: receipts/road-audit
      - name: Ensure 6212 approved source roads are actually dry and original final 3D town/Big City are present
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          if((Get-Content -LiteralPath (Join-Path $root '.skarvik-ci-stage-marker') -Raw).Trim() -ne '41188816555'){throw 'Untrusted native stage'}
          foreach($f in @('D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap',
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_GRADED_v2.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_ISLANDS_v1.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_FINAL_v1.umap'),
            (Join-Path $root 'Content\Map\Big_City_LVL.umap'),
            (Join-Path $root 'Saved\SkarvikCity\FinalCitySampleSourceMeshMigration20261101\final-before-citysample.umap'))){
            if(!(Test-Path -LiteralPath $f)){throw "Protected original, new final or City migration evidence missing: $f"}
          }
          if(Test-Path (Join-Path $root 'Saved\SkarvikCity\FinalV1NativeDryAsphaltMigration20261101\final-before-safe-original-asphalt.umap')){
            throw 'Native real dry-road migration already attempted; refuse duplicate'
          }
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Concurrent Unreal process active'}
          $free=([IO.DriveInfo]::new('C')).AvailableFreeSpace/1GB
          if($free -lt 12){throw 'Insufficient free C stage space'}
          $audit=Join-Path $env:GITHUB_WORKSPACE 'receipts\road-audit\skarvik-final-old-asphalt-coast-safe-actor-ids.json'
          if(!(Test-Path -LiteralPath $audit)){throw 'No prior independent original coast road audit'}
          $report=Get-Content -LiteralPath $audit -Raw | ConvertFrom-Json
          if($report.nativeCoastSafeSourceRoadActorCount -ne 6212 -or $report.unsafeSourceRoadActorCount -ne 8586){
            throw 'Audit road counts inconsistent, refuse unverified original source roads'
          }
          $python=Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $python -m py_compile (Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\migrate_skarvik_6212_approved_dry_roads_into_final.py')
          if($LASTEXITCODE -ne 0){throw 'Native road source replay code syntax failed'}
          Write-Host 'SKARVIK_FINAL_6212_SAFE_ROAD_MIGRATION_PREFLIGHT_PASSED=true'
      - name: Recreate only actual previously verified safe native road meshes on seven-island coastal terrain
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $env:SKARVIK_FINAL_SAFE_ROAD_ACTOR_AUDIT=Join-Path $env:GITHUB_WORKSPACE 'receipts\road-audit\skarvik-final-old-asphalt-coast-safe-actor-ids.json'
          $env:SKARVIK_FINAL_REAL_ROADS_MIGRATION_REPORT=Join-Path $env:GITHUB_WORKSPACE 'skarvik-final-original-safe-asphalt-native-replay.json'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\migrate_skarvik_6212_approved_dry_roads_into_final.py'
          & $editor (Join-Path $root 'AnomaliaZPrigimalia.uproject') "-ExecutePythonScript=$script" -nullrhi -unattended -nopause -nosound
          $exit=$LASTEXITCODE
          if(!(Test-Path $env:SKARVIK_FINAL_REAL_ROADS_MIGRATION_REPORT)){throw 'No real asphalt actor replay receipt'}
          $r=Get-Content -LiteralPath $env:SKARVIK_FINAL_REAL_ROADS_MIGRATION_REPORT -Raw | ConvertFrom-Json
          Write-Host ('SKARVIK_FINAL_ORIGINAL_SAFE_ROAD_MIGRATION_STATE='+$r.state)
          Write-Host ('SKARVIK_FINAL_ORIGINAL_SAFE_REAL_ASPHALT_ACTORS='+$r.nativeDryAsphaltSaved)
          Write-Host ('SKARVIK_FINAL_ORIGINAL_SAFE_REAL_ASPHALT_METRES='+$r.nativeDryAsphaltMetresSaved)
          Write-Host ('SKARVIK_FINAL_ORIGINAL_ROAD_UNDERWATER_REJECTED='+$r.unmigratedUnsafeOriginalActorCount)
          Write-Host ('SKARVIK_FINAL_ORIGINAL_ROAD_ADDITIONAL_NATIVE_UNSAFE='+$r.additionalUnsafeRejectedCount)
          if($r.state -ne 'FINAL_SEVEN_ISLAND_NATIVE_ASPHALT_SAFE_SUBSET_SAVED_NOT_YET_CONTINUOUS_OR_DRIVEN'){
            throw ('Cannot verify any safe original asphalt copy: '+$r.error)
          }
          if($exit -ne 0){Write-Host ('SKARVIK_NATIVE_UNREAL_AFTER_SAVE_PROCESS_EXIT_NONZERO='+$exit)}
          Write-Host 'SKARVIK_FINAL_AUTHENTIC_DRY_NATIVE_ASPHALT_SAVED_SEA_GAPS_NOT_YET_REBUILT=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarvik-final-native-true-coast-safe-reused-asphalt-actor-receipt
          path: skarvik-final-original-safe-asphalt-native-replay.json
          if-no-files-found: warn
