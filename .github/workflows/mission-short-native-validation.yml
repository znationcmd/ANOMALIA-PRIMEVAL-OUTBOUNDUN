name: ANOMALIA mission - isolated short path native validation
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-short-native-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  native:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: mission-${{ github.run_id }}
          clean: false
          persist-credentials: false
      - name: Preserve installed projects and export this exact commit to a new short path
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE ('mission-'+$env:GITHUB_RUN_ID)
          $destination=Join-Path 'C:\ANOMALIA-Validation' ('m'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $destination){throw 'Unique validation destination already exists; preserve it'}
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Unreal process active: refusing concurrent native validation'}
          $disk=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          $os=Get-CimInstance Win32_OperatingSystem
          if($disk.FreeSpace -lt 12GB -or $os.FreePhysicalMemory*1KB -lt 4GB -or $os.FreeVirtualMemory*1KB -lt 8GB){throw 'Insufficient free disk/RAM/virtual memory for isolated validation'}
          $archive=Join-Path $env:RUNNER_TEMP ('mission-source-'+$env:GITHUB_RUN_ID+'.zip')
          & git -C $source archive --format=zip --output=$archive $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'Exact source export failed'}
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          "MISSION_NATIVE_ROOT=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host ('ISOLATED_EXACT_COMMIT='+$env:GITHUB_SHA)
          Write-Host ('ISOLATED_ROOT='+$destination)
      - name: Compile actual project Editor and Game and require native regressions
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          Set-Location -LiteralPath $env:MISSION_NATIVE_ROOT
          $engine=$env:UE_ROOT
          if(!$engine){$engine='C:\Program Files\Epic Games\UE_5.8'}
          $python=Join-Path $engine 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $python scripts\ue5\validate-build.py --engine-root $engine --output unreal\Saved\MissionValidation --run-tests --require-loot-tests
          if($LASTEXITCODE -ne 0){throw 'Actual native validation failed; inspect preserved report'}
      - uses: actions/upload-artifact@v4
        if: always() && env.MISSION_NATIVE_ROOT != ''
        with:
          name: mission-short-native-validation
          path: ${{ env.MISSION_NATIVE_ROOT }}/unreal/Saved/MissionValidation/
          if-no-files-found: error
