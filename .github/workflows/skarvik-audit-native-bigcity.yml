name: SKARVIK - native UE5 Big City World and LevelInstance viability
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-audit-native-bigcity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  inspect-unreal-city:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Check project and no Unreal editor already running
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          if(!(Test-Path -LiteralPath (Join-Path $root 'AnomaliaZPrigimalia.uproject'))){throw 'Staged project absent'}
          if(!(Test-Path -LiteralPath (Join-Path $root 'Content\Map\Big_City_LVL.umap'))){throw 'Big City native map absent'}
          if(!(Test-Path -LiteralPath (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_CITY_v1.umap'))){throw '48km SKARVIK terrain missing'}
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Unreal already running'}
          if(-not $env:UE_ROOT){throw 'UE_ROOT missing'}
          Write-Host 'SKARVIK_BIG_CITY_SOURCE_AND_STAGE_OK=true'
      - name: UE5.8 open Big City asset without changing project contents
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $project=Join-Path $root 'AnomaliaZPrigimalia.uproject'
          $script=Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\audit_skarvik_citysample_level_instance.py'
          $env:SKARVIK_CITY_AUDIT_REPORT=Join-Path $env:GITHUB_WORKSPACE 'skarvik-native-city-asset-preflight.json'
          $log=Join-Path $root 'Saved\SkarvikCity\big-city-asset-preflight.log'
          & $editor $project "-ExecutePythonScript=$script" -nullrhi -unattended -nopause -nosound "-abslog=$log"
          $exit=$LASTEXITCODE
          if(-not(Test-Path -LiteralPath $env:SKARVIK_CITY_AUDIT_REPORT)){throw "UE did not produce a native audit report (exit $exit)"}
          $result=Get-Content -LiteralPath $env:SKARVIK_CITY_AUDIT_REPORT -Raw|ConvertFrom-Json
          if($result.status -ne 'BIG_CITY_UWORLD_LOADABLE_LEVEL_INSTANCE_API_AVAILABLE_NOT_INTEGRATED'){throw "UE cannot load level or LevelInstance API. Status=$($result.status) Error=$($result.error) Exit=$exit"}
          if($exit -ne 0){throw "UE returned unexpected exit code=$exit"}
          Write-Host 'SKARVIK_CITY_SOURCE_NATIVE_UE5_LOADABLE=true'
          Write-Host 'SKARVIK_CITY_NOT_YET_INTEGRATED_OR_PLAYTESTED=true'
      - name: Save audit JSON only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skarvik-city-ue5-world-asset-check
          if-no-files-found: warn
          path: skarvik-native-city-asset-preflight.json
