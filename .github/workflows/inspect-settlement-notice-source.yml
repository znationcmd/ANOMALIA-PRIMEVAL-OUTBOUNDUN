name: Inspect live ANOMALIA settlement data
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/inspect-settlement-notice-source.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  inspect-live-source:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 5
    steps:
      - name: Read settlement data and installed notice implementation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected runner'}
          if(@(Get-Process UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Existing Unreal session preserved'}
          $s='D:\ANOMALIA\unreal\Source\AnomaliaPrimeval'
          Get-ChildItem $s -Recurse -File | Where-Object {$_.Name -match 'InhabitedHeight|WorldImportLibrary|SettlementNotice'} | ForEach-Object { Write-Output ('FILE='+$_.FullName) }
          Select-String -Path (Join-Path $s '*.h'),(Join-Path $s '*.cpp') -Pattern 'InhabitedSettlementSites|SettlementSites|SettlementNotice|ClientShowLocationNotice' -Context 2,8 | ForEach-Object { Write-Output ('===== '+$_.Path+':'+$_.LineNumber+' ====='); Write-Output $_.Context.PreContext; Write-Output $_.Line; Write-Output $_.Context.PostContext }
