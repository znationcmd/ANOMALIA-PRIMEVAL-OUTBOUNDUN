name: ANOMALIAZ - Installer intro et alerte rouge 5s dans vrai Unreal 5.8
on:
  push:
    branches: [feature/intro-cinematique-prigimalia-20261105]
    paths: [.github/workflows/prigimalia-install-final-intro-30s.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  install-intro:
    if: github.repository == 'znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN'
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: false
          # Only C++ intro sources are needed; full checkout fails on Windows MAX_PATH
          # because deeply nested 3D imported asset names exceed its path length.
          sparse-checkout: |
            unreal/Source/AnomaliaZPrigimalia
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          ref: 6dc5851676d1e511ab1094993e09cfa55614105a
          path: previous-intro-${{ github.run_id }}
          persist-credentials: false
          clean: false
          # Only C++ intro sources are needed; full checkout fails on Windows MAX_PATH
          # because deeply nested 3D imported asset names exceed its path length.
          sparse-checkout: |
            unreal/Source/AnomaliaZPrigimalia
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          ref: 31bfda79e43391b4c9ee1d23000e0621537a200a
          path: prior-emergency-${{ github.run_id }}
          persist-credentials: false
          clean: false
          # Only C++ intro sources are needed; full checkout fails on Windows MAX_PATH
          # because deeply nested 3D imported asset names exceed its path length.
          sparse-checkout: |
            unreal/Source/AnomaliaZPrigimalia
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v4
        with:
          ref: 7c7ae310486d20bead9e9b984143c4dce2885358
          path: failed-build-source-${{ github.run_id }}
          persist-credentials: false
          clean: false
          sparse-checkout: |
            unreal/Source/AnomaliaZPrigimalia
          sparse-checkout-cone-mode: true
      - name: Check correct game, synchronized Drive media, and safe Windows state
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $project='D:\ANOMALIAZ-PRIGIMALIA\unreal\AnomaliaZPrigimalia.uproject'
          $original='D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject'
          $marker='D:\ANOMALIAZ-PRIGIMALIA\unreal\Saved\BrandMigration\verified-source-backup.marker'
          $archive='H:\Mon Drive\ANOMALIAZ\04_Intro_Installation\ANOMALIAZ_PRIGIMALIA_INSTALLATION_VRAI_JEU_ALERTE_35s_v3.zip'
          if(!(Test-Path -LiteralPath $project -PathType Leaf)){throw 'INSTALL_BLOCKED: native game project missing'}
          if(!(Test-Path -LiteralPath $original -PathType Leaf)){throw 'INSTALL_BLOCKED: original source project missing'}
          if(!(Test-Path -LiteralPath $marker -PathType Leaf)){throw 'INSTALL_BLOCKED: source backup marker missing'}
          $metadata=Get-Content $project -Raw | ConvertFrom-Json
          if(@($metadata.Modules | ForEach-Object{$_.Name}) -notcontains 'AnomaliaZPrigimalia'){
            throw 'INSTALL_BLOCKED: wrong game module'
          }
          if(!(Test-Path -LiteralPath $archive -PathType Leaf)){throw 'INSTALL_BLOCKED: cloud ZIP not synced to Windows H: yet'}
          $hash=(Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash -ne 'fa8fcc4b32f0d8a33109b20b055826cea728c286af50f0ca3600213e96c136f7'){
            throw 'INSTALL_BLOCKED: cloud ZIP checksum differs from validated 35-second V3 pack'
          }
          $busy=@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia,robocopy -ErrorAction SilentlyContinue)
          if($busy.Count -gt 0){throw 'INSTALL_BLOCKED: game, Unreal or transfer still working'}
          $cloudTasks=@(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object {
            $_.CommandLine -match 'transfer-all-inventoried-resources-to-cloud|reference-server-verified-cloud-archives'
          })
          if($cloudTasks.Count -gt 0){throw 'INSTALL_BLOCKED: City Sample cloud transfer still running'}
          $target='D:\ANOMALIAZ-PRIGIMALIA\unreal\Source\AnomaliaZPrigimalia'
          $staged=Join-Path $env:GITHUB_WORKSPACE 'unreal\Source\AnomaliaZPrigimalia'
          $priorStage=Join-Path $env:GITHUB_WORKSPACE ('previous-intro-'+$env:GITHUB_RUN_ID+'\unreal\Source\AnomaliaZPrigimalia')
          $priorEmergency=Join-Path $env:GITHUB_WORKSPACE ('prior-emergency-'+$env:GITHUB_RUN_ID+'\unreal\Source\AnomaliaZPrigimalia')
          $failedStage=Join-Path $env:GITHUB_WORKSPACE ('failed-build-source-'+$env:GITHUB_RUN_ID+'\unreal\Source\AnomaliaZPrigimalia')
          foreach($name in @('AnomaliaZPrigimaliaIntroWidget.cpp','AnomaliaZPrigimaliaIntroWidget.h')){
            $existing=Join-Path $target $name
            $new=Join-Path $staged $name
            $old=Join-Path $priorStage $name
            $intermediate=Join-Path $priorEmergency $name
            $failed=Join-Path $failedStage $name
            if(!(Test-Path -LiteralPath $new) -or !(Test-Path -LiteralPath $old) -or !(Test-Path -LiteralPath $intermediate) -or !(Test-Path -LiteralPath $failed)){
              throw 'INSTALL_BLOCKED: GitHub intro sources missing'
            }
            if(Test-Path -LiteralPath $existing) {
              $hash=(Get-FileHash -LiteralPath $existing).Hash
              $knownOld=(Get-FileHash -LiteralPath $old).Hash
              $knownIntermediate=(Get-FileHash -LiteralPath $intermediate).Hash
              $knownFailed=(Get-FileHash -LiteralPath $failed).Hash
              $knownNew=(Get-FileHash -LiteralPath $new).Hash
              if($hash -ne $knownOld -and $hash -ne $knownIntermediate -and $hash -ne $knownFailed -and $hash -ne $knownNew) {
                throw 'INSTALL_BLOCKED: Work has modified the live intro. No overwrite permitted.'
              }
            }
          }
          $cpp=Get-Content -LiteralPath (Join-Path $staged 'AnomaliaZPrigimaliaIntroWidget.cpp') -Raw
          if($cpp -match '(?s)if \(!VideoPlayer->OpenFile\(ClickBloodMoviePath\(\)\)\)\s*UE_LOG\(.*?;\s*else'){
            throw 'INSTALL_BLOCKED: C2181 UE_LOG/else compiler regression still present'
          }
          if($cpp -notmatch 'BeginEmergencyScreen'){
            throw 'INSTALL_BLOCKED: missing emergency sequence'
          }
          Write-Host 'REAL_ANOMALIAZ_GAME_AND_CLOUD_MEDIA_PREFLIGHT_PASSED=true'
      - name: Install on actual Win64 project, compile native UE5 module, import original voice
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $source='H:\Mon Drive\ANOMALIAZ\04_Intro_Installation\ANOMALIAZ_PRIGIMALIA_INSTALLATION_VRAI_JEU_ALERTE_35s.zip'
          $temp=Join-Path $env:RUNNER_TEMP ('intro-30s-install-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $temp){throw 'Refuse existing extraction path'}
          Expand-Archive -LiteralPath $source -DestinationPath $temp
          $script=Join-Path $temp 'INSTALLER_DANS_LE_VRAI_JEU.ps1'
          if(!(Test-Path -LiteralPath $script -PathType Leaf)){throw 'INSTALL_BLOCKED: install script not in ZIP'}
          $engine=if($env:UE_ROOT){$env:UE_ROOT}else{'C:\Program Files\Epic Games\UE_5.8'}
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -ProjectFile 'D:\ANOMALIAZ-PRIGIMALIA\unreal\AnomaliaZPrigimalia.uproject' -UE_ROOT $engine
            if($LASTEXITCODE -ne 0){throw ('Native installer failed with code '+$LASTEXITCODE)}
          } finally {
            # Media originals remain safely in Google Drive and existing Saved/ backups are retained.
            Remove-Item -LiteralPath $temp -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'REAL_ANOMALIAZ_UE5_NATIVE_INSTALLER_FINISHED=true'
      - name: Verify installed blood scene, original voice asset and game-mode startup
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='D:\ANOMALIAZ-PRIGIMALIA\unreal'
          $movie=Join-Path $root 'Content\Movies\INTRO_JEU_24s_MUSIQUE.mp4'
          $blood=Join-Path $root 'Content\Movies\ANOMALIAZ_PRIGIMALIA_Clic_Sang_6s.mp4'
          $alert=Join-Path $root 'Content\Movies\ANOMALIAZ_Alerte_Rouge_5s.mp4'
          $voice=Join-Path $root 'Content\AnomaliaZPrigimalia\Branding\SW_IntroTitle_Original_v5.uasset'
          $mode=Join-Path $root 'Source\AnomaliaZPrigimalia\AnomaliaZPrigimaliaGameMode.cpp'
          foreach($path in @($movie,$blood,$alert,$voice,$mode)){
            if(!(Test-Path -LiteralPath $path -PathType Leaf)){throw 'INSTALL_INCOMPLETE: required actual Unreal file missing'}
          }
          if((Get-FileHash $movie -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f88c9016797361b3b5341afc23a3530df029a0c65815e36127efde6d618f3b5b'){
            throw 'INSTALL_INCOMPLETE: intro movie differs'
          }
          if((Get-FileHash $blood -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e9c7b9659babf09bae103b508a2982c528173c6b5a3c1ac34dcfb19cd3900a15'){
            throw 'INSTALL_INCOMPLETE: user blood clip differs'
          }
          if((Get-FileHash $alert -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c1d0f9731a9e716805daeb54c347223b9250f4e7b92d447bf7eff73ec326d729'){
            throw 'INSTALL_INCOMPLETE: alert video hash differs'
          }
          $widget=Join-Path $root 'Source\AnomaliaZPrigimalia\AnomaliaZPrigimaliaIntroWidget.cpp'
          if(!(Select-String $widget -Pattern 'BeginEmergencyScreen' -Quiet) -or
             !(Select-String $widget -Pattern 'EmergencyStartedAt >= 5.0' -Quiet)){
            throw 'INSTALL_INCOMPLETE: emergency transition missing in native Game widget'
          }
          if(!(Select-String $mode -Pattern 'UAnomaliaZPrigimaliaIntroWidget::Open' -Quiet)){
            throw 'INSTALL_INCOMPLETE: GameMode does not call intro widget'
          }
          Write-Host 'REAL_ANOMALIAZ_INTRO35_WITH_RED_EMERGENCY_NATIVE_ASSETS_INSTALLED=true'
          Write-Host 'PACKAGED_GAME_AND_INTERACTIVE_VISUAL_SMOKE_NOT_YET_VERIFIED=true'
