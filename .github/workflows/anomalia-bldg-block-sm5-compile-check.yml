name: ANOMALIA - compile-check the failing SM5 building material
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-bldg-block-sm5-compile-check.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  material-compile-check:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Load and compile only M_Bldg_Block source in the real project, without saving it
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected Windows PC runner'}
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Existing Unreal/game process preserved'}
          $root='D:\ANOMALIAZ\01_Projet_Principal\unreal'
          $project=Join-Path $root 'AnomaliaPrimeval.uproject'
          $asset=Join-Path $root 'Content\Building\Material\M_Bldg_Block.uasset'
          if(!(Test-Path $project) -or !(Test-Path $asset)){throw 'The installed game source project or M_Bldg_Block source asset is missing'}
          if((Get-PSDrive C).Free -lt 2GB -or (Get-PSDrive D).Free -lt 6GB){throw 'Insufficient disk reserve; source material compile not started'}
          $py=Join-Path $env:RUNNER_TEMP 'compile_check_m_bldg_block.py'
          $report=Join-Path $env:RUNNER_TEMP 'm_bldg_block_sm5_compile_report.json'
          $env:ANOMALIA_MATERIAL_REPORT=$report
          $env:ANOMALIA_MATERIAL_SOURCE=$asset
          $python=@'
          import hashlib,json,os,traceback
          from pathlib import Path
          import unreal
          asset_path="/Game/Building/Material/M_Bldg_Block"
          source=Path(os.environ["ANOMALIA_MATERIAL_SOURCE"])
          before=hashlib.sha256(source.read_bytes()).hexdigest()
          doc={"state":"FAILED","asset":asset_path,"sourceFileHashBefore":before,"sourceModified":False}
          try:
              registry=unreal.AssetRegistryHelpers.get_asset_registry()
              registry.wait_for_completion()
              material=unreal.EditorAssetLibrary.load_asset(asset_path)
              if not material:
                  raise RuntimeError("M_Bldg_Block did not load from the package source project")
              doc["class"]=material.get_class().get_name()
              api=[n for n in dir(unreal.MaterialEditingLibrary) if "compil" in n.lower() or "recompil" in n.lower()]
              doc["compileApi"]=api
              if not hasattr(unreal.MaterialEditingLibrary,"recompile_material"):
                  raise RuntimeError("Unreal Python MaterialEditingLibrary.recompile_material is unavailable")
              unreal.MaterialEditingLibrary.recompile_material(material)
              doc["recompileCallReturned"]=True
              doc["state"]="M_BLDG_BLOCK_RECOMPILE_REQUESTED"
          except Exception as exc:
              doc["error"]=str(exc)
              doc["traceback"]=traceback.format_exc()
              unreal.log_error("M_BLDG_BLOCK_COMPILE_CHECK_ERROR="+str(exc))
          finally:
              after=hashlib.sha256(source.read_bytes()).hexdigest()
              doc["sourceFileHashAfter"]=after
              doc["sourceModified"]=(before!=after)
              Path(os.environ["ANOMALIA_MATERIAL_REPORT"]).write_text(json.dumps(doc,indent=2),encoding="utf-8")
              unreal.log("M_BLDG_BLOCK_COMPILE_REPORT="+json.dumps(doc,ensure_ascii=False))
          '@
          [IO.File]::WriteAllText($py,$python,[Text.UTF8Encoding]::new($false))
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $log=Join-Path $env:RUNNER_TEMP 'm_bldg_block_sm5_compile.log'
          & $editor $project "-ExecutePythonScript=$py" -nullrhi -unattended -nopause -nosound -stdout -FullStdOutLogOutput "-abslog=$log"
          if(!(Test-Path -LiteralPath $report)){if(Test-Path $log){Get-Content $log -Tail 100};throw 'No source material compile report was written'}
          $r=Get-Content -LiteralPath $report -Raw|ConvertFrom-Json
          Write-Output ('M_BLDG_BLOCK_COMPILE_RESULT='+($r|ConvertTo-Json -Depth 4 -Compress))
          if($r.sourceModified){throw 'The source material asset changed during the compile-only check'}
          if($r.state -eq 'FAILED'){throw ('Source compile check failed: '+$r.error)}
          $logLines=Get-Content -LiteralPath $log -ErrorAction SilentlyContinue|ForEach-Object{$_.ToString()}
          $logLines|Where-Object{$_ -match 'M_Bldg_Block|LogMaterial: Error|ShaderCompiler|Failed to compile'}|Select-Object -Last 50|ForEach-Object{Write-Output ('M_BLDG_BLOCK_LOG='+$_.ToString())}
