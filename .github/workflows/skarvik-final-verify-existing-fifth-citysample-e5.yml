name: SKARVIK - independently verify existing fifth genuine City Sample sector on final coast
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-final-verify-existing-fifth-citysample-e5.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  independent-native-readonly-e5-audit:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Verify trusted Unreal C stage, source maps and no concurrent native editing
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $marker=Join-Path $root '.skarvik-ci-stage-marker'
          if(!(Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw).Trim() -ne '41188816555'){
            throw 'Untrusted or missing isolated SKARVIK native staging marker'
          }
          foreach($f in @(
            'D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap',
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_FINAL_v1.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_GRADED_v2.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_ISLANDS_v1.umap'),
            (Join-Path $root 'Content\Map\Big_City_LVL.umap')
          )){
            if(!(Test-Path -LiteralPath $f)){throw "Protected original native map missing: $f"}
          }
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){
            throw 'Existing Unreal process; refuse concurrent native project access'
          }
          $py=Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $py -m py_compile (Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\audit_existing_skarvik_final_fifth_citysample_e5_readonly.py')
          if($LASTEXITCODE -ne 0){throw 'Existing source CitySample fifth sector audit Python syntax failed'}
          Write-Host 'SKARVIK_FINAL_REAL_FIFTH_CITYSOURCE_READONLY_PREFLIGHT_OK=true'
      - name: Independently reload final true-coast World Partition and verify existing 121 CitySample E5 native mesh actors
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $env:SKARVIK_FINAL_EXISTING_E5_REPORT=Join-Path $env:GITHUB_WORKSPACE 'skarvik-final-existing-fifth-citysample-e5-native-audit.json'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\audit_existing_skarvik_final_fifth_citysample_e5_readonly.py'
          & $editor (Join-Path $root 'AnomaliaZPrigimalia.uproject') "-ExecutePythonScript=$script" -nullrhi -unattended -nopause -nosound
          $nativeExit=$LASTEXITCODE
          if(!(Test-Path -LiteralPath $env:SKARVIK_FINAL_EXISTING_E5_REPORT)){throw 'No independent native CitySample E5 proof was written'}
          $r=Get-Content -LiteralPath $env:SKARVIK_FINAL_EXISTING_E5_REPORT -Raw | ConvertFrom-Json
          Write-Host ('SKARVIK_FINAL_EXISTING_FIFTH_CITY_STATE='+$r.state)
          Write-Host ('SKARVIK_FINAL_EXISTING_REAL_E5_MESH_ACTORS='+$r.nativeOriginalActorCounts.fifthSourceCitySampleE5)
          Write-Host ('SKARVIK_FINAL_EXISTING_FOUR_PREVIOUS_CITY_SECTORS='+$r.nativeOriginalActorCounts.originalCitySampleFourSectors)
          Write-Host ('SKARVIK_FINAL_TOTAL_GENUINE_CITYSOURCE_ACTORS='+$r.trueNativeCitySourceMeshesSavedTotal)
          if($r.state -ne 'SKARVIK_FINAL_ALREADY_EXISTING_121_REAL_FIFTH_CITY_ACTORS_PERSIST_NOT_FULL_BIG_CITY' -or
             $r.nativeOriginalActorCounts.fifthSourceCitySampleE5 -ne 121 -or
             $r.nativeOriginalActorCounts.originalCitySampleFourSectors -ne 720 -or
             $r.trueNativeCitySourceMeshesSavedTotal -ne 841 -or
             $r.sourceOriginalsUnchanged -ne $true){
              throw ('Existing genuine fifth City Sample source meshes not verified: '+$r.error)
          }
          if($nativeExit -ne 0){Write-Host ('SKARVIK_NATIVE_READONLY_UNREAL_SHUTDOWN_NONZERO='+$nativeExit)}
          Write-Host 'SKARVIK_FINAL_841_ORIGINAL_REAL_CITY_SOURCE_MESHES_PERSISTED_NO_DUPLICATE_IMPORT=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarvik-final-existing-121-fifth-city-native-staticmesh-reopen
          path: skarvik-final-existing-fifth-citysample-e5-native-audit.json
          if-no-files-found: warn
