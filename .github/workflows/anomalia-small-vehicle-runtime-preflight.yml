name: ANOMALIA - preflight small vehicle runtime validation
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-small-vehicle-runtime-preflight.yml]
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 8
    steps:
      - name: Check safe runtime validation capacity without modifying the project
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected runner'}
          $busy=@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue|Where-Object{-not $_.HasExited})
          Write-Output ('ACTIVE_UNREAL_PROCESSES='+$busy.Count)
          foreach($d in @('C:','D:')){$v=Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$d'";Write-Output ('VOLUME='+$d+' FREE_GB='+[math]::Round($v.FreeSpace/1GB,1))}
          $root='D:\ANOMALIA\unreal'
          $project=Join-Path $root 'AnomaliaPrimeval.uproject'
          Write-Output ('PROJECT_EXISTS='+(Test-Path -LiteralPath $project -PathType Leaf))
          $stageRoot=Join-Path $root 'Saved\StagedBuilds'
          if(Test-Path -LiteralPath $stageRoot){
            Get-ChildItem -LiteralPath $stageRoot -Directory|Sort-Object LastWriteTime -Descending|Select-Object -First 4|ForEach-Object{
              $exe=Get-ChildItem -LiteralPath $_.FullName -Filter '*.exe' -Recurse -File -ErrorAction SilentlyContinue|Select-Object -First 1
              $exePath='NONE';if($exe){$exePath=$exe.FullName};Write-Output ('STAGED_BUILD='+$_.FullName+' EXE='+$exePath)
            }
          }
          $report=Join-Path $root 'Saved\VehicleReview'
          if(Test-Path -LiteralPath $report){Get-ChildItem -LiteralPath $report -Directory|Sort-Object LastWriteTime -Descending|Select-Object -First 3|ForEach-Object{Write-Output ('VEHICLE_REVIEW='+$_.FullName)}}
          $pakTool=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealPak.exe'
          $pak=Get-ChildItem -LiteralPath $stageRoot -Filter '*.pak' -File -Recurse -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          if($pak -and (Test-Path -LiteralPath $pakTool)){
            Write-Output ('STAGED_PAK='+$pak.FullName+' SIZE_GB='+[math]::Round($pak.Length/1GB,2))
            $pakListing=& $pakTool $pak.FullName -List 2>&1
            $vehicleAssets=@($pakListing|Select-String -Pattern '(?i)(SM_dirt_bike|SM_motorcycle|SM_scooter|SM_quad|sfx_Amb_VEH_CityMotorcycle_meta)')
            if($vehicleAssets.Count){$vehicleAssets|Select-Object -First 30|ForEach-Object{Write-Output ('PAK_VEHICLE_ASSET='+$_.Line.Trim())}}else{Write-Output 'PAK_VEHICLE_ASSET=NONE'}
          }else{Write-Output 'STAGED_PAK=NOT_FOUND'}
          $cooked=Join-Path $root 'Saved\Cooked\Windows\AnomaliaPrimeval'
          if(Test-Path -LiteralPath $cooked){
            Get-ChildItem -LiteralPath $cooked -Recurse -File -ErrorAction SilentlyContinue|Where-Object{$_.Name -match '(?i)(SM_dirt_bike|SM_motorcycle|SM_scooter|SM_quad|sfx_Amb_VEH_CityMotorcycle_meta)'}|Select-Object -First 40|ForEach-Object{Write-Output ('COOKED_VEHICLE_ASSET='+$_.FullName)}
          }
          Get-ChildItem -LiteralPath $env:UE_ROOT -Filter 'IoStoreUtilities.exe' -File -Recurse -ErrorAction SilentlyContinue|Select-Object -First 1|ForEach-Object{
            Write-Output ('IOSTORE_TOOL='+$_.FullName)
            & $_.FullName -Help 2>&1|Select-Object -First 35|ForEach-Object{Write-Output ('IOSTORE_HELP='+$_)}
          }
          $content=Join-Path $root 'Content'
          if(Test-Path -LiteralPath $content){
            Get-ChildItem -LiteralPath $content -Recurse -File -ErrorAction SilentlyContinue|Where-Object{$_.Name -match '(?i)(SM_dirt_bike|SM_motorcycle|SM_scooter|SM_quad|CityMotorcycle)'}|Select-Object -First 30|ForEach-Object{Write-Output ('SOURCE_VEHICLE_ASSET='+$_.FullName)}
          }
          Get-ChildItem -LiteralPath $stageRoot -Directory -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|ForEach-Object{
            [int64]$size=(Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Force -ErrorAction SilentlyContinue|Measure-Object Length -Sum).Sum
            Write-Output ('STAGE_SIZE='+$_.FullName+' GB='+[math]::Round($size/1GB,2))
            Get-ChildItem -LiteralPath $_.FullName -Recurse -File -Include '*.utoc','*.ucas' -ErrorAction SilentlyContinue|ForEach-Object{Write-Output ('IOSTORE_CONTAINER='+$_.Name+' GB='+[math]::Round($_.Length/1GB,2))}
          }
          Get-ChildItem -LiteralPath (Join-Path $root 'Saved') -Directory -ErrorAction SilentlyContinue|ForEach-Object{Write-Output ('SAVED_DIR='+$_.FullName)}
          Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue|Where-Object{$_.Name -match '(?i)(SM_dirt_bike|SM_motorcycle|SM_scooter|SM_quad|CityMotorcycle)' -and $_.FullName -match '(?i)(Cooked|Zen|StagedBuilds)'}|Select-Object -First 40|ForEach-Object{Write-Output ('COOK_OR_STAGE_HIT='+$_.FullName)}
          $config=Join-Path $root 'Config\DefaultEngine.ini'
          if(Test-Path -LiteralPath $config){
            Select-String -LiteralPath $config -Pattern 'DirectoriesToAlwaysCook|Anomalia\\Vehicles|Audio\\MetaSounds\\Ambient'|ForEach-Object{Write-Output ('COOK_CONFIG='+$_.Line.Trim())}
          }

