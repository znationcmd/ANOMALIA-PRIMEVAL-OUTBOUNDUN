name: ANOMALIA - repair real main playable character, grounded buildings and current
  map launchers
'on':
  push:
    branches:
    - feature/real-skarvik-bmw-dog-gameplay-capture-20261111
    paths:
    - .github/workflows/anomalia-repair-main-playable-launchers-20261111.yml
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  repair:
    runs-on:
    - self-hosted
    - Windows
    - X64
    - anomalia-ue5
    timeout-minutes: 25
    steps:
    - name: Back up and repair native body and complete building grounding, rebuild
        native module
      shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
      run: |+
        $ErrorActionPreference='Stop'
        $root='D:\ANOMALIA\unreal'
        $project=Join-Path $root 'AnomaliaPrimeval.uproject'
        if(!(Test-Path $project)){throw 'Main native project missing'}
        if(@(Get-CimInstance Win32_Process|Where-Object{$_.Name -match '^(UnrealEditor|UnrealEditor-Cmd|Anomalia).*\.exe$'}).Count){throw 'Another native session is active'}
        $out=Join-Path $root ('Saved\PlayableRepair\'+$env:GITHUB_RUN_ID)
        New-Item -ItemType Directory -Path $out -Force|Out-Null
        ('PLAY_REPAIR_OUT='+$out)|Out-File $env:GITHUB_ENV -Append -Encoding utf8
        $env:ANOMALIA_PLAY_REPAIR_OUT=$out
        $prebuild=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
        & $prebuild AnomaliaPrimevalEditor Win64 Development ("-Project="+$project) -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=2 2>&1 | Tee-Object -FilePath (Join-Path $out 'prebuild.log')
        if($LASTEXITCODE -ne 0){throw 'Existing native editor module did not build'}
        $prepare=Join-Path $out 'prepare.py'
        @'
        import unreal,json,os,traceback,shutil
        from pathlib import Path
        root=Path(unreal.Paths.project_dir());out=Path(os.environ["ANOMALIA_PLAY_REPAIR_OUT"])
        r={"state":"FAILED","buildingGroups":[],"playerMesh":"/Game/Survival_Character/Meshes/SK_Survival_Character.SK_Survival_Character","animationClass":None,"idleAnimation":None}
        try:
            mesh=unreal.load_asset(r["playerMesh"])
            if not isinstance(mesh,unreal.SkeletalMesh):raise RuntimeError("Real survivor mesh cannot load")
            skeleton=mesh.get_editor_property("skeleton")
            for path in unreal.EditorAssetLibrary.list_assets("/Game/Survival_Character",True,False):
                name=path.rsplit("/",1)[-1]
                if not any(x in name.lower() for x in ("abp","animbp","idle")):continue
                a=unreal.load_asset(path)
                if isinstance(a,unreal.AnimBlueprint) and a.get_editor_property("target_skeleton")==skeleton:
                    r["animationClass"]=a.generated_class().get_path_name()
                    break
                if isinstance(a,unreal.AnimSequence) and "idle" in name.lower() and a.get_editor_property("skeleton")==skeleton:
                    r["idleAnimation"]=a.get_path_name()
            editor=unreal.get_editor_subsystem(unreal.LevelEditorSubsystem)
            if not editor.load_level("/Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1"):raise RuntimeError("Current SKARVIK unavailable")
            actors=unreal.get_editor_subsystem(unreal.EditorActorSubsystem)
            wp=unreal.WorldPartitionBlueprintLibrary
            descriptors=wp.get_actor_descs() or []
            wp.load_actors([d.guid for d in descriptors if str(d.label).startswith("SKARVIK_COMPLETE_REAL_BUILDING_") or "BIG_CITY_PLAYER_START" in str(d.label)])
            loaded=actors.get_all_level_actors()
            playerstarts=[a for a in loaded if isinstance(a,unreal.PlayerStart)]
            start=min(playerstarts,key=lambda a:(a.get_actor_location().x-200000)**2+(a.get_actor_location().y-800000)**2)
            ground=start.get_actor_location().z-180.0
            r["terrainReferenceZ"]=ground
            groups={}
            for a in loaded:
                label=a.get_actor_label()
                if label.startswith("SKARVIK_COMPLETE_REAL_BUILDING_"):
                    groups.setdefault(label.rsplit("_",1)[0],[]).append(a)
            snapshots=[]
            for group,seq in groups.items():
                floor=min(a.get_actor_bounds(False)[0].z-a.get_actor_bounds(False)[1].z for a in seq)
                delta=ground-floor
                info={"group":group,"actors":len(seq),"lowestGeometryZ":floor,"terrainReferenceZ":ground,"shiftZ":0.0}
                if 10.0 < floor-ground < 30000.0:
                    for a in seq:
                        p=a.get_actor_location()
                        snapshots.append({"label":a.get_actor_label(),"location":[p.x,p.y,p.z]})
                    info["shiftZ"]=delta
                r["buildingGroups"].append(info)
            (out/"building-transform-backup.json").write_text(json.dumps(snapshots,indent=2),encoding="utf-8")
            shutil.copy2(root/"Content/Maps/PRIGIMALIA_SKARVIK_FINAL_v1.umap",out/"skarvik-before.umap")
            for info in r["buildingGroups"]:
                if not info["shiftZ"]:continue
                for a in groups[info["group"]]:
                    p=a.get_actor_location()
                    a.set_actor_location(unreal.Vector(x=p.x,y=p.y,z=p.z+info["shiftZ"]),False,True)
            if snapshots:
                if not editor.save_all_dirty_levels() or not unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True,True):
                    raise RuntimeError("Grounded building transforms did not save")
            r["state"]="MAIN_GAME_VISUAL_INPUT_REPAIR_PREPARED"
        except Exception:r["error"]=traceback.format_exc()
        finally:
            (out/"prepare.json").write_text(json.dumps(r,indent=2),encoding="utf-8")
            unreal.SystemLibrary.quit_editor()
        '@|Set-Content $prepare -Encoding utf8
        $editorCmd=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
        $editorArguments=@(('"'+$project+'"'),'/Engine/Maps/Entry',('-ExecutePythonScript="'+$prepare+'"'),'-nullrhi','-unattended','-nosplash','-nosound','-nop4','-d3d11','-sm5','-stdout','-FullStdOutLogOutput',('-abslog="'+(Join-Path $out 'prepare.log')+'"'))
        $p=Start-Process $editorCmd -ArgumentList $editorArguments -PassThru -RedirectStandardOutput (Join-Path $out 'editor-stdout.log') -RedirectStandardError (Join-Path $out 'editor-stderr.log')
        if(!$p.WaitForExit(300000)){$p.Kill();throw 'Native visual preparation timeout'}
        Write-Host ('PREPARE_NATIVE_EXIT='+$p.ExitCode)
        if(!(Test-Path (Join-Path $out 'prepare.json'))){foreach($n in @('editor-stdout.log','editor-stderr.log','prepare.log')){$f=Join-Path $out $n;if(Test-Path $f){Get-Content $f -Tail 100|Write-Host}};throw 'Native preparation produced no receipt'}
        $r=Get-Content (Join-Path $out 'prepare.json') -Raw|ConvertFrom-Json
        Get-Content (Join-Path $out 'prepare.json') -Raw|Write-Host
        if($r.state -ne 'MAIN_GAME_VISUAL_INPUT_REPAIR_PREPARED'){throw 'Native preparation did not pass'}
        $cpp=Join-Path $root 'Source\AnomaliaPrimeval\AnomaliaGameMode.cpp'
        Copy-Item $cpp (Join-Path $out 'AnomaliaGameMode.cpp.before')
        $text=[IO.File]::ReadAllText($cpp)
        if(!$text.Contains('ANOMALIA_MAIN_PLAYER_VISIBLE_FALLBACK')){
          $anchor='        LoadPersistentPlayer(NewPlayer);'
          if(!$text.Contains($anchor)){throw 'Unexpected GameMode source; no blind patch applied'}
          $mesh=[string]$r.playerMesh
          $body=@"
                // ANOMALIA_MAIN_PLAYER_VISIBLE_FALLBACK: native map pawns need the actual imported body.
                if (auto* MainSurvivor = Cast<AAnomaliaSurvivor>(NewPlayer->GetPawn()))
                {
                    auto* BodyComponent = MainSurvivor->GetMesh();
                    if (BodyComponent && !BodyComponent->GetSkeletalMeshAsset())
                    {
                        if (auto* ImportedBody = LoadObject<USkeletalMesh>(nullptr, TEXT("$mesh")))
                        {
                            BodyComponent->SetSkeletalMesh(ImportedBody);
                            BodyComponent->SetRelativeLocation(FVector(0.f, 0.f, -90.f));
                            BodyComponent->SetRelativeRotation(FRotator(0.f, -90.f, 0.f));
                            BodyComponent->SetOwnerNoSee(false);
                            BodyComponent->SetVisibility(true, true);
        "@
          if($r.animationClass){
            $body+=[Environment]::NewLine+('                    if (UClass* MainAnim = LoadClass<UAnimInstance>(nullptr, TEXT("{0}"))) BodyComponent->SetAnimInstanceClass(MainAnim);' -f $r.animationClass)
          }elseif($r.idleAnimation){
            $body+=[Environment]::NewLine+('                    if (auto* MainIdle = LoadObject<UAnimSequence>(nullptr, TEXT("{0}"))) BodyComponent->PlayAnimation(MainIdle, true);' -f $r.idleAnimation)
          }
          $body+=@"

                            UE_LOG(LogTemp, Log, TEXT("ANOMALIA main playable body loaded"));
                        }
                    }
                }
        "@
          $text=$text.Replace($anchor,$body+[Environment]::NewLine+$anchor)
          $incs=[string]::Join([Environment]::NewLine,@('#include "AnomaliaGameMode.h"','#include "Engine/SkeletalMesh.h"','#include "Animation/AnimInstance.h"','#include "Animation/AnimSequence.h"'))
          $text=$text.Replace('#include "AnomaliaGameMode.h"',$incs)
          $old='GetWorld()->GetMapName().EndsWith(TEXT("ANOMALIA_Inhabited_v2"))'
          $text=$text.Replace($old,'(GetWorld()->GetMapName().EndsWith(TEXT("ANOMALIA_Inhabited_v2")) || GetWorld()->GetMapName().Contains(TEXT("PRIGIMALIA_")))')
          [IO.File]::WriteAllText($cpp,$text,[Text.UTF8Encoding]::new($false))
        }
        $build=Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\Build.bat'
        & $build AnomaliaPrimevalEditor Win64 Development ("-Project="+$project) -WaitMutex -NoHotReloadFromIDE -MaxParallelActions=2
        if($LASTEXITCODE -ne 0){throw 'Native editor module rebuild failed; launcher was not switched'}
        Write-Host 'MAIN_PLAYABLE_BODY_EDITOR_MODULE_REBUILT=true'

    - name: Install direct main-project game and editor launchers with current map
        list
      shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
      run: |+
        $ErrorActionPreference='Stop'
        $root='D:\ANOMALIA\unreal'
        $out=$env:PLAY_REPAIR_OUT
        if(!$out -or !(Test-Path $out)){throw 'Native repair receipt missing'}
        $launcherDir=Join-Path $root 'Launcher'
        New-Item -ItemType Directory -Path $launcherDir -Force|Out-Null
        $launcher=Join-Path $launcherDir 'Launch-Current-Anomalia.ps1'
        $catalog=Join-Path $launcherDir 'MainProjectMaps.json'
        # Only the observed real package names are exposed as launch targets.
        $names=@(
         @('skarvik','SKARVIK','PRIGIMALIA_SKARVIK_FINAL_v1'),
         @('racconia','RACCONIA / VARKOVIA','PRIGIMALIA_RACCONIA_VARKOVIA_16KM_v1'),
         @('drazovia','DRAZOVIA','ANOMALIA_Inhabited_v2'),
         @('karskov','KARSKOV','PRIGIMALIA_KARSKOV'),
         @('vorgrad','VORGRAD','PRIGIMALIA_VORGRAD'),
         @('nemoris','NEMORIS','PRIGIMALIA_NEMORIS'),
         @('drakheim','DRAKHEIM','PRIGIMALIA_DRAKHEIM'),
         @('solynacalyra','SOLYNACALYRA','PRIGIMALIA_SOLYNACALYRA'),
         @('nexavarkhos','NEXAVARKHOS','PRIGIMALIA_NEXAVARKHOS'),
         @('chernaskaluxria','CHERNASKALUXRIA','PRIGIMALIA_CHERNASKALUXRIA'),
         @('falc','F.A.L.C','PRIGIMALIA_FALC'),
         @('kolchiem','KOLCHIEM ORIGINS','PRIGIMALIA_KOLCHIEM_ORIGINS_FULL'),
         @('roskatvia','ROSKATVIA-B1','PRIGIMALIA_ROSKATVIA_B1'),
         @('nogokv','NOGOKV-51','PRIGIMALIA_NOGOKV_51'),
         @('paradisiomania','PARADISIOMANIA','PRIGIMALIA_PARADISIOMANIA'),
         @('deadroot','DEADROOT','PRIGIMALIA_DEADROOT')
        )
        $maps=@()
        foreach($n in $names){
          $file=Join-Path $root ('Content\Maps\'+$n[2]+'.umap')
          $maps+=@{id=$n[0];name=$n[1];package='/Game/Maps/'+$n[2];available=(Test-Path $file);lastWriteUtc=if(Test-Path $file){(Get-Item $file).LastWriteTimeUtc.ToString('o')}else{$null};gameplayFullyVerified=$false}
        }
        @{project=(Join-Path $root 'AnomaliaPrimeval.uproject');engineRoot=$env:UE_ROOT;defaultMap='skarvik';maps=$maps}|ConvertTo-Json -Depth 8|Set-Content $catalog -Encoding utf8
        if(Test-Path $launcher){Copy-Item $launcher (Join-Path $out 'launcher-before.ps1')}
        @'
        param([string]$MapId='',[ValidateSet('Game','Editor')][string]$Mode='Game',[switch]$ValidateOnly)
        $ErrorActionPreference='Stop'
        try{
          $c=Get-Content (Join-Path $PSScriptRoot 'MainProjectMaps.json') -Raw|ConvertFrom-Json
          $project=[IO.Path]::GetFullPath([string]$c.project)
          if($project -ine 'D:\ANOMALIA\unreal\AnomaliaPrimeval.uproject' -or !(Test-Path $project)){throw 'Projet principal introuvable.'}
          $editor=Join-Path $c.engineRoot 'Engine\Binaries\Win64\UnrealEditor.exe'
          if(!(Test-Path $editor)){throw 'Unreal Engine 5.8 introuvable.'}
          function Start-CurrentNativeMap($map,$runMode){
            if(!$map -or $map.package -notmatch '^/Game/Maps/[A-Za-z0-9_]+$'){throw 'Carte inconnue.'}
            $file=Join-Path (Split-Path $project -Parent) ('Content\'+$map.package.Substring(6).Replace('/','\')+'.umap')
            if(!(Test-Path $file)){throw 'Cette carte est absente du projet principal.'}
            if(@(Get-Process UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Ferme la session Unreal deja ouverte avant de lancer une autre carte.'}
            $arguments=@(('"'+$project+'"'),($map.package+'?AnomaliaServerId=solo-current-'+$map.id),'-d3d11','-sm5','-nosplash')
            if($runMode -eq 'Game'){$arguments+=@('-game','-windowed','-ResX=1280','-ResY=720','-ExecCmds="t.IdleWhenNotForeground 0,r.ScreenPercentage 70,r.ShadowQuality 1,r.DynamicGlobalIlluminationMethod 0,r.ReflectionMethod 0,r.MotionBlurQuality 0"')}
            Start-Process -FilePath $editor -ArgumentList $arguments -WorkingDirectory (Split-Path $project -Parent)
          }
          if($ValidateOnly){
            $c.maps|ForEach-Object{
              $file=Join-Path (Split-Path $project -Parent) ('Content\'+$_.package.Substring(6).Replace('/','\')+'.umap')
              [pscustomobject]@{id=$_.id;package=$_.package;exists=(Test-Path $file)}
            }|ConvertTo-Json -Depth 5|Write-Output
            exit 0
          }
          if($MapId){Start-CurrentNativeMap ($c.maps|Where-Object{$_.id -eq $MapId}|Select-Object -First 1) $Mode;exit 0}
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          [Windows.Forms.Application]::EnableVisualStyles()
          $form=New-Object Windows.Forms.Form
          $form.Text="ANOMALIA'Z PRIGIMALIA";$form.ClientSize=New-Object Drawing.Size(650,490)
          $form.StartPosition='CenterScreen';$form.BackColor=[Drawing.Color]::FromArgb(20,24,30);$form.ForeColor=[Drawing.Color]::White
          $title=New-Object Windows.Forms.Label;$title.Text="ANOMALIA'Z PRIGIMALIA";$title.Font=New-Object Drawing.Font('Segoe UI',19,[Drawing.FontStyle]::Bold);$title.SetBounds(24,18,600,42);$form.Controls.Add($title)
          $subtitle=New-Object Windows.Forms.Label;$subtitle.Text='Cartes du projet principal - versions de travail';$subtitle.SetBounds(26,65,600,26);$form.Controls.Add($subtitle)
          $list=New-Object Windows.Forms.ListBox;$list.Font=New-Object Drawing.Font('Segoe UI',11);$list.SetBounds(26,104,595,290);$list.BackColor=[Drawing.Color]::FromArgb(30,36,44);$list.ForeColor=[Drawing.Color]::White;$list.BorderStyle='None'
          foreach($m in $c.maps){
            $file=Join-Path (Split-Path $project -Parent) ('Content\'+$m.package.Substring(6).Replace('/','\')+'.umap')
            $suffix=if(Test-Path $file){'  |  '+(Get-Item $file).LastWriteTime.ToString('dd/MM/yyyy HH:mm')}else{'  |  indisponible'}
            $null=$list.Items.Add($m.name+$suffix)
          }
          $list.SelectedIndex=0;$form.Controls.Add($list)
          $play=New-Object Windows.Forms.Button;$play.Text='Jouer';$play.SetBounds(26,415,285,44);$play.BackColor=[Drawing.Color]::FromArgb(70,120,80);$play.FlatStyle='Flat'
          $edit=New-Object Windows.Forms.Button;$edit.Text='Ouvrir dans Unreal';$edit.SetBounds(330,415,291,44);$edit.BackColor=[Drawing.Color]::FromArgb(50,62,80);$edit.FlatStyle='Flat'
          $play.Add_Click({try{Start-CurrentNativeMap $c.maps[$list.SelectedIndex] 'Game';$form.Close()}catch{[Windows.Forms.MessageBox]::Show($_.Exception.Message,"ANOMALIA'Z")|Out-Null}})
          $edit.Add_Click({try{Start-CurrentNativeMap $c.maps[$list.SelectedIndex] 'Editor';$form.Close()}catch{[Windows.Forms.MessageBox]::Show($_.Exception.Message,"ANOMALIA'Z")|Out-Null}})
          $form.Controls.Add($play);$form.Controls.Add($edit)
          $form.AcceptButton=$play
          $null=$form.ShowDialog()
        }catch{
          Add-Type -AssemblyName System.Windows.Forms
          [Windows.Forms.MessageBox]::Show($_.Exception.Message,"ANOMALIA'Z - lancement")|Out-Null
          exit 1
        }
        '@|Set-Content $launcher -Encoding utf8
        & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher -ValidateOnly
        if($LASTEXITCODE -ne 0){throw 'Stable launcher map validation failed'}
        $shell=New-Object -ComObject WScript.Shell
        $desktop=[Environment]::GetFolderPath('Desktop')
        $link=Join-Path $desktop 'ANOMALIAZ - JOUER.lnk'
        if(Test-Path $link){Copy-Item $link (Join-Path $out 'JOUER-before.lnk')}
        $s=$shell.CreateShortcut($link)
        $s.TargetPath=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
        $s.Arguments='-NoProfile -STA -ExecutionPolicy Bypass -WindowStyle Hidden -File "'+$launcher+'"'
        $s.WorkingDirectory=$root;$s.Description='Cartes actuelles du projet principal ANOMALIAZ';$s.Save()
        $editLink=Join-Path $desktop 'ANOMALIAZ - EDITER LES CARTES (UE5.8).lnk'
        if(Test-Path $editLink){Copy-Item $editLink (Join-Path $out 'EDITER-before.lnk')}
        $e=$shell.CreateShortcut($editLink)
        $e.TargetPath=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor.exe'
        $e.Arguments='"'+(Join-Path $root 'AnomaliaPrimeval.uproject')+'" /Game/Maps/PRIGIMALIA_SKARVIK_FINAL_v1 -d3d11 -sm5'
        $e.WorkingDirectory=$root;$e.Save()
        $archived=Join-Path $desktop 'ANOMALIAZ - JOUER - E non fiable - archive.lnk'
        if(Test-Path $archived){Move-Item $archived (Join-Path $out 'E-old-archive.lnk')}
        $available=@($maps|Where-Object{$_.available})
        @{state='MAIN_PROJECT_GAME_AND_EDITOR_SHORTCUTS_UPDATED';gameShortcut=$link;editorShortcut=$editLink;project=$project;availableMapCount=$available.Count;missingMaps=@($maps|Where-Object{!$_.available}|ForEach-Object{$_.name});packagedExeRebuilt=$false}|ConvertTo-Json -Depth 6|Set-Content (Join-Path $out 'launcher-result.json') -Encoding utf8
        Get-Content (Join-Path $out 'launcher-result.json') -Raw|Write-Host

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ANOMALIA-MAIN-PLAYABLE-REPAIR
        path: ${{ env.PLAY_REPAIR_OUT }}
        if-no-files-found: warn
