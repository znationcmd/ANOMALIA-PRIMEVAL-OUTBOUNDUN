name: SKARVIK - recover read only proof of 663 new genuine regional road actors
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-final-recover-regional-road-v1-reopen.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  independently-verify-saved-regional-roads:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: skarvik-final-native-real-regional-road-fragments-v1
          run-id: 41315798450
          repository: znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN
          github-token: ${{ github.token }}
          path: receipts/first-regional-attempt
      - name: Confirm native road build had saved 663 actors, reject any duplicate native write
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $marker=Join-Path $root '.skarvik-ci-stage-marker'
          if(!(Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw).Trim() -ne '41188816555'){throw 'Untrusted C stage'}
          foreach($f in @(
             'D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap',
             (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_FINAL_v1.umap'),
             (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_GRADED_v2.umap'),
             (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_ISLANDS_v1.umap'),
             (Join-Path $root 'Content\Map\Big_City_LVL.umap'),
             (Join-Path $root 'Saved\SkarvikCity\FinalRealRegionalCoastalPilot20261101\final-before-regional-pilot.umap'))){
             if(!(Test-Path -LiteralPath $f)){throw "Protected native world/backup absent $f"}
          }
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){
             throw 'Concurrent Unreal native project editing; no independent reopen possible'}
          $proof=Join-Path $env:GITHUB_WORKSPACE 'receipts\first-regional-attempt\skarvik-final-native-regional-fragment-build.json'
          if(!(Test-Path -LiteralPath $proof)){throw 'Saved original native build receipt missing'}
          $result=Get-Content -LiteralPath $proof -Raw | ConvertFrom-Json
          Write-Host ('SKARVIK_FINAL_RECOVER_PRIOR_NATIVE_STATE='+$result.state)
          Write-Host ('SKARVIK_FINAL_RECOVER_PRIOR_MESH_ACTORS='+$result.newRoadActors)
          Write-Host ('SKARVIK_FINAL_RECOVER_PRIOR_METRES='+$result.newPavedMetres)
          if($result.state -ne 'FINAL_NATIVE_COAST_AUTHENTIC_REGIONAL_SAFE_ROAD_FRAGMENTS_SAVED_NOT_DRIVEN_OR_CONNECTED' -or
             $result.newRoadActors -ne 663 -or $result.newPartialRoadFragments -ne 7 -or
             $result.sourceWorldsUnmodified -ne $true){throw 'Previous batch did not prove saved mesh work'}
          $py=Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $py -m py_compile (Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\verify_skarvik_final_safe_regional_road_fragments_v1.py')
          if($LASTEXITCODE -ne 0){throw 'Read-only native verification Python syntax invalid'}
          Write-Host 'SKARVIK_FINAL_REGIONAL_663_PREVIOUSLY_SAVED_ACTORS_READONLY_AUDIT_STARTED=true'
      - name: Reopen original seven-island World Partition without writing and verify all new actors persisted
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $env:SKARVIK_FINAL_REGIONAL_BUILD_RESULT=Join-Path $env:GITHUB_WORKSPACE 'receipts\first-regional-attempt\skarvik-final-native-regional-fragment-build.json'
          $env:SKARVIK_FINAL_REGIONAL_REOPEN_RESULT=Join-Path $env:GITHUB_WORKSPACE 'skarvik-final-real-regional-663-meshes-native-independent-reopen.json'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\verify_skarvik_final_safe_regional_road_fragments_v1.py'
          & $editor (Join-Path $root 'AnomaliaZPrigimalia.uproject') "-ExecutePythonScript=$script" -nullrhi -unattended -nopause -nosound
          $nativeExit=$LASTEXITCODE
          if(!(Test-Path -LiteralPath $env:SKARVIK_FINAL_REGIONAL_REOPEN_RESULT)){throw 'Native independent reopen report missing'}
          $p=Get-Content -LiteralPath $env:SKARVIK_FINAL_REGIONAL_REOPEN_RESULT -Raw | ConvertFrom-Json
          Write-Host ('SKARVIK_FINAL_NATIVE_REGIONAL_REAL_REOPEN_STATE='+$p.state)
          Write-Host ('SKARVIK_FINAL_NATIVE_NEW_REGIONAL_REAL_MESHES_REOPENED='+$p.nativePersistedActorCounts.newRegionalPilotAsphalt)
          Write-Host ('SKARVIK_FINAL_NATIVE_ORIGINAL_ROADS_REOPENED='+$p.nativePersistedActorCounts.previousOriginalDryRoads)
          Write-Host ('SKARVIK_FINAL_NATIVE_ORIGINAL_CITY_REOPENED='+$p.nativePersistedActorCounts.realBigCitySourceMeshes)
          if($p.state -ne 'FINAL_NATIVE_AUTHENTIC_REGIONAL_ROAD_FRAGMENTS_PERSISTED_NOT_DRIVEN' -or
             $p.nativePersistedActorCounts.newRegionalPilotAsphalt -ne 663 -or
             $p.nativePersistedActorCounts.previousOriginalDryRoads -ne 6130 -or
             $p.nativePersistedActorCounts.localBatch1 -ne 1674 -or
             $p.nativePersistedActorCounts.localBatch2 -ne 1298 -or
             $p.nativePersistedActorCounts.realBigCitySourceMeshes -ne 720 -or
             $p.sourcesUnchanged -ne $true){
               throw ('Saved original native regional roads failed independent verification: '+$p.error)
          }
          if($nativeExit -ne 0){Write-Host ('SKARVIK_NATIVE_UE_READONLY_SHUTDOWN_NONZERO='+$nativeExit)}
          Write-Host 'SKARVIK_FINAL_NATIVE_663_REGIONAL_REAL_3D_ROAD_MESHES_PERSISTED_VERIFIED=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarvik-final-regional-663-real-road-meshes-independent-reopen
          path: skarvik-final-real-regional-663-meshes-native-independent-reopen.json
          if-no-files-found: warn

# Re-run the read-only independent reopen after the previous saved native batch.
