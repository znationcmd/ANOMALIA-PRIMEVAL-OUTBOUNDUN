name: ANOMALIA import verified food wine and medical models
on:
  push:
    branches: ['ue5/character-audit-20261027']
    paths: ['.github/workflows/ue5-survival-item-import.yml']
permissions:
  contents: read
jobs:
  import:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 18
    concurrency:
      group: anomalia-ue5-native-host
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import exact verified survival source files into a fresh namespace
        shell: node {0}
        run: |
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),cp=require('child_process');
          const root='C:\\ANOMALIA\\FabImports\\OpenSurvivalItems_20261027',download=JSON.parse(fs.readFileSync(path.join(root,'download-receipt.json'),'utf8'));
          if(download.state!=='DOWNLOAD_FINISHED'||download.errors.length||download.models.length!==6)throw Error('Item source receipt not complete');
          const out=path.join(process.env.RUNNER_TEMP,'survival-import-'+process.env.GITHUB_RUN_ID);fs.mkdirSync(out);fs.appendFileSync(process.env.GITHUB_ENV,'SURVIVAL_IMPORT_OUTPUT='+out+'\n');
          const stat=fs.statfsSync('C:\\');if(stat.bavail*stat.bsize<8*1024**3)throw Error('Insufficient disk reserve');
          const manifest={imports:[]};for(const m of download.models){for(const f of m.files){const p=path.resolve(root,f.relative);if(!p.toLowerCase().startsWith(root.toLowerCase()+'\\'))throw Error('Unsafe source path');if(crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')!==f.sha256)throw Error('Source hash changed');}
           const f=m.files.find(f=>f.relative===m.entryPoint);if(!f)throw Error('Missing model entry receipt');manifest.imports.push({id:m.id,relative:m.entryPoint,staged:path.join(root,m.entryPoint),sha256:f.sha256});}
          const input=path.join(out,'manifest.json'),script=path.join(out,'import.py'),log=path.join(out,'editor.log'),report=path.join(out,'import-report.json');
          fs.writeFileSync(input,JSON.stringify(manifest,null,2),{flag:'wx'});fs.writeFileSync(script,"\"\"\"Import only hash-verified local Fab sources into a fresh validation namespace.\"\"\"\nimport gc, hashlib, json, os, traceback\nfrom pathlib import Path\nimport unreal\nmanifest=Path(os.environ[\"ANOMALIA_FAB_STAGE_MANIFEST\"])\ndata=json.loads(manifest.read_text(encoding=\"utf-8\"))\nout=Path(os.environ[\"ANOMALIA_FAB_IMPORT_REPORT\"])\nbase=\"/Game/Anomalia/ImportedFab/Batch_\"+os.environ[\"GITHUB_RUN_ID\"]\nreport={\"state\":\"IN_PROGRESS\",\"namespace\":base,\"project\":unreal.Paths.get_project_file_path(),\"sources\":[],\"errors\":[],\"gameplay\":\"not_implemented_or_tested\",\"multiplayer\":\"not_run\",\"oldAssetsReplaced\":False}\ndef checkpoint():\n    out.write_text(json.dumps(report,indent=2)+\"\\n\",encoding=\"utf-8\")\nif unreal.EditorAssetLibrary.does_directory_exist(base):\n    raise RuntimeError(\"Refusing existing namespace \"+base)\nunreal.SystemLibrary.execute_console_command(None,\"Interchange.FeatureFlags.Import.FBX 0\")\nfor index,row in enumerate(data[\"imports\"]):\n    entry={\"id\":row[\"id\"],\"source\":row[\"relative\"],\"sha256\":row[\"sha256\"],\"assets\":[]}\n    report[\"sources\"].append(entry)\n    try:\n        src=Path(row[\"staged\"])\n        if hashlib.sha256(src.read_bytes()).hexdigest()!=row[\"sha256\"]:\n            raise RuntimeError(\"Staged source checksum changed\")\n        dest=base+\"/\"+row[\"id\"].replace(\"-\",\"_\")+\"/Source_\"+str(index)\n        task=unreal.AssetImportTask()\n        for key,value in {\"filename\":str(src),\"destination_path\":dest,\"automated\":True,\"replace_existing\":False,\"replace_existing_settings\":False,\"save\":True,\"async_\":False}.items():\n            if key!=\"async_\":\n                task.set_editor_property(key,value)\n        if src.suffix.lower()==\".fbx\":\n            opts=unreal.FbxImportUI()\n            opts.set_editor_property(\"automated_import_should_detect_type\",True)\n            opts.set_editor_property(\"import_materials\",True)\n            opts.set_editor_property(\"import_textures\",True)\n            opts.set_editor_property(\"import_animations\",True)\n            opts.set_editor_property(\"import_mesh\",True)\n            opts.static_mesh_import_data.set_editor_property(\"combine_meshes\",False)\n            task.set_editor_property(\"options\",opts)\n            task.set_editor_property(\"factory\",unreal.FbxFactory())\n        unreal.AssetToolsHelpers.get_asset_tools().import_asset_tasks([task])\n        objects=list(task.get_objects())\n        if not objects:\n            paths=list(task.get_editor_property(\"imported_object_paths\"))\n            objects=[unreal.load_asset(p) for p in paths]\n        meshes=0\n        for obj in objects:\n            if not obj:\n                raise RuntimeError(\"Imported object could not be loaded\")\n            p=obj.get_path_name()\n            if not p.startswith(base+\"/\"):\n                raise RuntimeError(\"Importer returned object outside isolated namespace: \"+p)\n            entry[\"assets\"].append({\"path\":p,\"class\":obj.get_class().get_name()})\n        # Include dependent materials/textures which task results may omit.\n        for p in unreal.EditorAssetLibrary.list_assets(dest,recursive=True,include_folder=False):\n            obj=unreal.load_asset(p)\n            if not obj:\n                entry.setdefault(\"unloadable\",[]).append(p)\n                continue\n            record=next((r for r in entry[\"assets\"] if r[\"path\"]==obj.get_path_name()),None)\n            if record is None:\n                record={\"path\":obj.get_path_name(),\"class\":obj.get_class().get_name()}\n                entry[\"assets\"].append(record)\n            if isinstance(obj,(unreal.StaticMesh,unreal.SkeletalMesh)):\n                meshes+=1\n                if isinstance(obj,unreal.SkeletalMesh):\n                    sk=obj.get_editor_property(\"skeleton\")\n                    record[\"skeleton\"]=sk.get_path_name() if sk else None\n                    materials=obj.get_editor_property(\"materials\")\n                else:\n                    materials=obj.get_editor_property(\"static_materials\")\n                record[\"materialSlots\"]=len(materials)\n                record[\"emptyMaterialSlots\"]=sum(1 for m in materials if not m.material_interface)\n            if isinstance(obj,unreal.Blueprint):\n                record[\"compiled\"]=bool(unreal.BlueprintEditorLibrary.compile_blueprint(obj))\n        if meshes<1:\n            raise RuntimeError(\"No mesh imported from model source\")\n        if entry.get(\"unloadable\"):\n            raise RuntimeError(\"Some imported dependencies did not load\")\n        if not unreal.EditorAssetLibrary.save_directory(dest,only_if_is_dirty=False,recursive=True):\n            raise RuntimeError(\"Failed to save imported directory\")\n        entry[\"status\"]=\"IMPORTED_SAVED_LOADED_NOT_GAMEPLAY_ACCEPTED\"\n        entry[\"meshCount\"]=meshes\n    except Exception as exc:\n        entry[\"status\"]=\"FAILED\"\n        entry[\"error\"]=str(exc)\n        report[\"errors\"].append({\"source\":row[\"relative\"],\"error\":str(exc)})\n        unreal.log_error(traceback.format_exc())\n    checkpoint()\n    gc.collect()\nreport[\"state\"]=\"IMPORT_FINISHED_WITH_ERRORS\" if report[\"errors\"] else \"IMPORT_FINISHED\"\ncheckpoint()\n",{flag:'wx'});
          const engine=process.env.UE_ROOT||'C:\\Program Files\\Epic Games\\UE_5.8';
          const r=cp.spawnSync(path.join(engine,'Engine','Binaries','Win64','UnrealEditor-Cmd.exe'),['C:\\ANOMALIA-Validation\\c40543166274\\unreal\\AnomaliaPrimeval.uproject','-run=pythonscript','-script='+script,'-unattended','-nop4','-nosplash','-nosound','-NullRHI','-abslog='+log],{encoding:'utf8',timeout:900000,maxBuffer:4*1024*1024,env:{...process.env,ANOMALIA_FAB_STAGE_MANIFEST:input,ANOMALIA_FAB_IMPORT_REPORT:report}});
          console.log('SURVIVAL_IMPORT_EXIT '+r.status+' '+String(r.error||''));
          if(fs.existsSync(report)){const j=JSON.parse(fs.readFileSync(report,'utf8'));console.log(JSON.stringify({state:j.state,namespace:j.namespace,sources:j.sources.map(x=>({id:x.id,status:x.status,meshes:x.meshCount,error:x.error})),errors:j.errors},null,2));fs.copyFileSync(report,path.join(root,'import-report-'+process.env.GITHUB_RUN_ID+'.json'));}
          if(fs.existsSync(log))console.log(fs.readFileSync(log,'utf8').split(/\r?\n/).filter(l=>/Error:|Traceback/.test(l)).slice(-12).join('\n'));
          if(r.status!==0||!fs.existsSync(report)||JSON.parse(fs.readFileSync(report,'utf8')).errors.length)process.exit(1);
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-item-unreal-import-receipts
          path: ${{ env.SURVIVAL_IMPORT_OUTPUT }}
          if-no-files-found: warn
