name: RACCONIA - true UE5 Landscape and 29 real mesh source conversions
on:
  push:
    paths:
      - 'scripts/ue5/worldgen/prepare_racconia_ue5_v2.py'
      - 'tests/test_racconia_true_height_models.py'
      - '.github/workflows/racconia-ue5-model-height.yml'
  pull_request:
    paths:
      - 'scripts/ue5/worldgen/prepare_racconia_ue5_v2.py'
      - 'tests/test_racconia_true_height_models.py'
      - '.github/workflows/racconia-ue5-model-height.yml'
permissions:
  contents: read
jobs:
  verify-real-source-converter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare geometry and R16 test requirements
        run: python -m pip install --quiet numpy pillow trimesh
      - name: Verify exact 25x heightmap Z correction and GLB->OBJ model conversion
        run: |
          python -m unittest discover -s tests -p 'test_racconia_true_height_models.py' -v
          python -m py_compile scripts/ue5/worldgen/prepare_racconia_ue5_v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: RACCONIA-V2-TRUE-HEIGHT-UE5-IMPORT-TOOL
          path: scripts/ue5/worldgen/prepare_racconia_ue5_v2.py
          retention-days: 30
          if-no-files-found: error
