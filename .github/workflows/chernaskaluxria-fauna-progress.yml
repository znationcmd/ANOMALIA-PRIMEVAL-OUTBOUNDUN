name: CHERNASKALUXRIA - original fauna survival progression contract
on:
  push:
    branches: [feature/chernaskaluxria-fauna-progression-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-ecology-and-safe-population:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate deterministic isolated ninth-world rule sources
        run: |
          python -m py_compile scripts/ue5/chernaskaluxria_fauna_progression.py scripts/ue5/chernaskaluxria_gameplay_pcg.py scripts/ue5/export_chernaskaluxria_pcg_review.py
      - name: Test 20 islands, T-Rex isolation, 5-zombie groups, deep-sea predator safety and performance caps
        run: |
          python -m unittest discover -s tests -p test_chernaskaluxria_fauna_progression.py -v
          python -m unittest discover -s tests -p test_chernaskaluxria_gameplay_rules.py -v
          python -m unittest discover -s tests -p test_chernaskaluxria_5000_mainland.py -v
      - name: Produce fauna ecology proposals without invoking Unreal or modifying live server state
        run: |
          python scripts/ue5/export_chernaskaluxria_pcg_review.py --output unreal/Saved/CHERNASKALUXRIA/fauna-source-review
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('unreal/Saved/CHERNASKALUXRIA/fauna-source-review')
          fauna=json.loads((out/'fauna-encounters.review.json').read_text())
          assert fauna['mapId']=='chernaskaluxria-v1'
          assert len(fauna['smallIslandFauna'])==20
          assert not fauna['gameplayIntegrationEnabled']
          assert not fauna['nativePlaytestsPassed']
          assert fauna['protectedMarineRouteRules']['suppressionBufferMetres']>=500
          print('FAUNA_ECOLOGY_SOURCE_VERIFIED_NOT_DEPLOYED')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: chernaskaluxria-fauna-pcg-policy-NOT-LIVE
          path: unreal/Saved/CHERNASKALUXRIA/fauna-source-review/
