            if($entry.exists){
              foreach($project in @(Get-ChildItem -LiteralPath $root -File -Filter '*.uproject')){
                $descriptor=Get-Content -LiteralPath $project.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
                $entry.descriptors+=[ordered]@{name=$project.Name;sha256=(Get-FileHash -LiteralPath $project.FullName -Algorithm SHA256).Hash;engineAssociation=$descriptor.EngineAssociation;modules=@($descriptor.Modules | Select-Object Name,Type,LoadingPhase);enabledPlugins=@($descriptor.Plugins | Where-Object {$_.Enabled} | ForEach-Object {$_.Name})}
                foreach($module in @($descriptor.Modules)){
                  $dll=Join-Path $root ('Binaries\Win64\UnrealEditor-'+$module.Name+'.dll')
                  $entry.moduleBinaries+=[ordered]@{module=$module.Name;exists=(Test-Path -LiteralPath $dll);sha256=$(if(Test-Path -LiteralPath $dll){(Get-FileHash -LiteralPath $dll -Algorithm SHA256).Hash}else{$null})}
                }
              }
              $source=Join-Path $root 'Source'
              $present=@{}
              if(Test-Path -LiteralPath $source){
                foreach($file in @(Get-ChildItem -LiteralPath $source -Recurse -File | Where-Object {$_.Extension -in @('.cpp','.h','.cs')})){
                  $relative=$file.FullName.Substring($root.Length+1)
                  $blob=Get-CanonicalGitBlob $file.FullName
                  $match=$lookup.ContainsKey($relative) -and $blob -eq $lookup[$relative]
                  $entry.sourceFiles+=[ordered]@{path=$relative;bytes=$file.Length;sha256=(Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash;canonicalLFUTF8GitBlob=$blob;matchesExpectedCanonical=$match}
                  $present[$relative]=$true
                  if($match){$entry.matchedCanonicalSourceFiles++}
                }
              }
              $entry.missingExpectedSourcePaths=@($lookup.Keys | Where-Object {!$present.ContainsKey($_)} | Sort-Object)
              foreach($name in @('DefaultEngine.ini','DefaultGame.ini','DefaultEditor.ini')){
                $config=Join-Path $root ('Config\'+$name)
                if(Test-Path -LiteralPath $config){
                  $lines=@(Get-Content -LiteralPath $config -Encoding UTF8 | Where-Object {$_ -match '^\s*[+-]?(GameDefaultMap|EditorStartupMap|ServerDefaultMap|GlobalDefaultGameMode|GlobalDefaultServerGameMode|DefaultGraphicsRHI|D3D11TargetedShaderFormats|D3D12TargetedShaderFormats)\s*='})
                  $entry.selectedMapAndRHISettings+=[ordered]@{file=$name;lines=$lines}
                }
              }
            }
            $report.projects+=$entry
            Write-Host ($root+' sourceMatches='+$entry.matchedCanonicalSourceFiles+'/'+$expected.Count)
          }
          $out=Join-Path $env:RUNNER_TEMP ('source-reconciliation-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out | Out-Null
          $report | ConvertTo-Json -Depth 14 | Set-Content -LiteralPath (Join-Path $out 'source-reconciliation.json') -Encoding UTF8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-main-stage-source-reconciliation
          path: ${{ runner.temp }}/source-reconciliation-${{ github.run_id }}/
          if-no-files-found: error
