name: ANOMALIA - restore and export cross, motorcycle, scooter and quad
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-restore-export-four-small-vehicles.yml, scripts/vehicle-assets/restore_and_export_four_small_vehicles.ps1, scripts/vehicle-assets/export_four_vehicles.py]
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  vehicles:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore vehicle catalog and sound, build, export FBX
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected runner'}
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts\vehicle-assets\restore_and_export_four_small_vehicles.ps1')
          if($LASTEXITCODE -ne 0){throw "Vehicle restoration/export script failed: $LASTEXITCODE"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anomalia-cross-moto-scooter-quad-fbx
          path: D:\ANOMALIA\Exports\Vehicles-four-restored\*
          if-no-files-found: warn
