name: ANOMALIA - reclaim verified independent cache duplicates without changing game
on:
  push:
    branches: [mission/finalisation-20261104]
    paths:
      - '.github/workflows/mission-reclaim-space-safe-citysample-duplicates-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-safe-space-recovery-after-citysample
  cancel-in-progress: false
jobs:
  recover-only-cold-duplicates:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          path: cache-recovery-${{ github.run_id }}
          sparse-checkout: |
            scripts/ue5/remove-only-verified-independent-citysample-cache-duplicates.py
            scripts/ue5/release-inactive-legacy-ddc-for-cloud.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Identify protected game files and active Unreal processes, record disk space before cleanup
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ('safe-space-recovery-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "CITY_DUPLICATE_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CLOUD_TRANSFER_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $roots=@('D:\ANOMALIA\FabImports\CitySample\CitySample.uproject','D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap')
          foreach($p in $roots){if (!(Test-Path -LiteralPath $p -PathType Leaf)){throw "Protected original project asset missing: $p"}}
          $processes=@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,ShaderCompileWorker -ErrorAction SilentlyContinue)
          if($processes.Count -ne 0){throw 'Unreal is active. No cache cleanup will run.'}
          $volumes=@(Get-PSDrive C,D | ForEach-Object {[ordered]@{drive=$_.Name;freeBytes=[long]$_.Free}})
          Write-Host ('DISK_FREE_BEFORE '+($volumes|ConvertTo-Json -Compress))
      - name: Release only C VaultCache copies that exactly match independent D City Sample files and are not referenced by the game
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $env:CITY_DUPLICATE_OUT=$env:CITY_DUPLICATE_OUT
          $python='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE ('cache-recovery-'+$env:GITHUB_RUN_ID+'\scripts\ue5\remove-only-verified-independent-citysample-cache-duplicates.py')
          if (!(Test-Path -LiteralPath $python -PathType Leaf) -or !(Test-Path -LiteralPath $script -PathType Leaf)){throw 'Expected checksum cleanup tools unavailable'}
          & $python -B $script
          if ($LASTEXITCODE -ne 0){throw 'Verified duplicate cleanup stopped for safety'}
      - name: Release only old derived .udd files, never game content or Zen data
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:LOCALAPPDATA 'UnrealEngine\Common\DerivedDataCache'
          if (!(Test-Path -LiteralPath $root -PathType Container)) {
            Write-Host 'OLD_DDC_NOT_PRESENT_SKIP'
          } else {
            $python='C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
            $script=Join-Path $env:GITHUB_WORKSPACE ('cache-recovery-'+$env:GITHUB_RUN_ID+'\scripts\ue5\release-inactive-legacy-ddc-for-cloud.py')
            & $python -B $script
            if($LASTEXITCODE -ne 0){throw 'Legacy derived data cache cleanup stopped for safety'}
          }
      - name: Compare real free disk bytes after cache cleanup
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $volumes=@(Get-PSDrive C,D | ForEach-Object {[ordered]@{drive=$_.Name;freeBytes=[long]$_.Free}})
          Write-Host ('DISK_FREE_AFTER '+($volumes|ConvertTo-Json -Compress))
          Write-Host ('CITYSAMPLE_SOURCE_PRESERVED='+(Test-Path -LiteralPath 'D:\ANOMALIA\FabImports\CitySample\CitySample.uproject' -PathType Leaf))
          Write-Host ('ACTUAL_MAIN_MAP_PRESERVED='+(Test-Path -LiteralPath 'D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap' -PathType Leaf))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-citysample-duplicates-and-ddc-recovery-receipts
          path: ${{ runner.temp }}/safe-space-recovery-${{ github.run_id }}/
          if-no-files-found: warn
