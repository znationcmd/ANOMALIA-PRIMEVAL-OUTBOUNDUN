name: ANOMALIA - diagnose stalled OneDrive model sync
on:
  push:
    branches: [ops/native-map-availability-audit]
    paths: [.github/workflows/anomalia-onedrive-sync-diagnostic.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  onedrive-sync-diagnostic:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Read sync-client state and OneDrive file attributes only
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD'){throw 'Unexpected PC runner'}
          foreach($n in @('OneDrive','FileCoAuth','FileSyncHelper')){$p=@(Get-Process -Name $n -ErrorAction SilentlyContinue);Write-Host ('PROCESS '+$n+' count='+$p.Count+' ids='+(($p|ForEach-Object{$_.Id}) -join ','))}
          $root=$env:OneDriveConsumer
          Write-Host ('ROOT='+$root+' exists='+(Test-Path -LiteralPath $root -PathType Container))
          $exe=Join-Path $env:LOCALAPPDATA 'Microsoft\OneDrive\OneDrive.exe'
          Write-Host ('CLIENT_EXE='+$exe+' exists='+(Test-Path -LiteralPath $exe -PathType Leaf))
          if(Test-Path $exe){$v=(Get-Item $exe).VersionInfo;Write-Host ('CLIENT_VERSION='+$v.FileVersion)}
          $dest=Join-Path $root 'ANOMALIAZ_PRIGIMALIA\Modeles_3D\Sources\FabImports'
          if(Test-Path $dest){
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class WinAttr2 { [DllImport("kernel32.dll", CharSet=CharSet.Unicode, SetLastError=true)] public static extern uint GetFileAttributes(string lpFileName); }'
            Get-ChildItem -LiteralPath $dest -File -Recurse|ForEach-Object{$a=[WinAttr2]::GetFileAttributes($_.FullName);Write-Host ('FILESTATE name='+$_.Name+' bytes='+$_.Length+' offline='+(($a -band 0x1000) -ne 0)+' unpinned='+(($a -band 0x00100000) -ne 0)+' reparse='+(($a -band 0x400) -ne 0))}
          }
          $logs=Join-Path $env:LOCALAPPDATA 'Microsoft\OneDrive\logs\Personal'
          Write-Host ('LOG_ROOT='+$logs+' exists='+(Test-Path $logs))
          if(Test-Path $logs){
            Get-ChildItem -LiteralPath $logs -File -Recurse -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 8|ForEach-Object{
              Write-Host ('SYNC_LOG '+$_.FullName+' bytes='+$_.Length+' updated='+$_.LastWriteTime.ToString('o'))
              if($_.Length -lt 20MB){Get-Content -LiteralPath $_.FullName -Tail 200 -ErrorAction SilentlyContinue|Where-Object{$_ -match '(?i)error|fail|quota|upload|sync|paused|network'}|Select-Object -Last 15|ForEach-Object{Write-Host ('SYNC_ENTRY '+$_.ToString())}}
            }
          }
          Write-Host ('DISK_C_FREE_GIB='+[math]::Round((Get-PSDrive C).Free/1GB,2))
