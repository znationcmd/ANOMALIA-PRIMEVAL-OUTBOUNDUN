name: ANOMALIA Editor - Publication publique et mises a jour Windows
on:
  push:
    tags:
      - 'anomalia-editor/v*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  windows-release:
    name: Tests, compilation et publication Editor
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/anomalia-editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifier le numero de version du tag
        if: startsWith(github.ref, 'refs/tags/anomalia-editor/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("refs/tags/anomalia-editor/v$version" -ne "$env:GITHUB_REF") {
            throw "Le tag ne correspond pas a la version de ANOMALIA Editor"
          }
      - name: Installer les dependances
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Compiler le logiciel et les metadonnees d'auto-update
        run: npm run desktop:package
      - name: Verifier installateur et manifeste SHA512
        shell: pwsh
        run: |
          $folder = "release"
          $manifest = Join-Path $folder "latest.yml"
          if (!(Test-Path $manifest)) { throw "latest.yml absent" }
          $txt = Get-Content $manifest -Raw
          if ($txt -notmatch "(?m)^version:" -or $txt -notmatch "(?m)^\s*sha512:") { throw "Manifeste de mise a jour invalide" }
          $files = Get-ChildItem $folder -File | Where-Object { $_.Extension -eq '.exe' }
          if (!$files) { throw "EXE absent" }
          Write-Host "Manifest et installateur Windows verifies"
      - name: Creer ou retrouver la release publique propre a ANOMALIA Editor
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view anomalia-editor-latest --repo "$env:GITHUB_REPOSITORY" | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create anomalia-editor-latest --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "ANOMALIA Editor - Windows Updates" --notes "Canal de mises a jour public reserve a ANOMALIA Editor."
            if ($LASTEXITCODE -ne 0) { throw "Echec creation release" }
          }
      - name: Envoyer l'installateur et le fichier blockmap avant le manifeste
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Name -match '\.exe(\.blockmap)?$' }
          foreach ($file in $files) {
            gh release upload anomalia-editor-latest $file.FullName --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw "Upload rate : $($file.Name)" }
          }
          gh release upload anomalia-editor-latest (Resolve-Path release/latest.yml).Path --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Manifeste non publie" }
          Write-Host "Mise a jour d'ANOMALIA Editor publiee sur le canal public Editor."
