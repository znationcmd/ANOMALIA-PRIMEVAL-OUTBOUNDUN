name: ANOMALIA mission - inspect cloud archive readiness
on:
  push:
    branches: [mission/finalisation-20261104]
    paths: ['.github/workflows/mission-cloud-resource-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-cloud-resource-readiness
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 10
    steps:
      - name: Inspect Google Drive mount, existing model folder and local reserves
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP ('cloud-resource-preflight-'+$env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $out | Out-Null
          "CLOUD_PREFLIGHT_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $disks=@(Get-CimInstance Win32_LogicalDisk | Select-Object DeviceID,VolumeName,FileSystem,Size,FreeSpace,DriveType)
          $client=@(Get-Process -Name GoogleDriveFS -ErrorAction SilentlyContinue | Select-Object Id,ProcessName)
          $found=@()
          foreach($disk in $disks) {
            foreach($relative in @('Mon Drive\ANOMALIAZ\02_Modeles_3D','My Drive\ANOMALIAZ\02_Modeles_3D','ANOMALIAZ\02_Modeles_3D')) {
              $path=Join-Path ($disk.DeviceID+'\') $relative
              if(Test-Path -LiteralPath $path -PathType Container) {
                $items=@(Get-ChildItem -LiteralPath $path -ErrorAction SilentlyContinue | Select-Object Name,PSIsContainer,Length,Attributes)
                $found+=[ordered]@{path=$path;drive=$disk.DeviceID;items=$items}
              }
            }
          }
          $result=[ordered]@{readOnly=$true;driveClientProcesses=$client;disks=$disks;existingCloudModelFolders=$found;cloudFolderId='1KD66RKBTk9AFJMXhivhEHPcBqh1qiS9t';cloudQuotaVerifiedByApi=$false;sourceFilesDeleted=0}
          $result | ConvertTo-Json -Depth 7 | Set-Content -LiteralPath (Join-Path $out 'cloud-resource-preflight.json') -Encoding UTF8
          Write-Output ('CLOUD_PREFLIGHT '+($result | ConvertTo-Json -Depth 7 -Compress))
      - uses: actions/upload-artifact@v4
        if: always() && env.CLOUD_PREFLIGHT_OUT != ''
        with:
          name: cloud-resource-preflight
          path: ${{ env.CLOUD_PREFLIGHT_OUT }}/
          if-no-files-found: error
