name: Publication Windows - mise a jour automatique Editor et Tools
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/anomalia-windows-auto-release.yml"
  schedule:
    - cron: "16 */6 * * *"
  workflow_dispatch:
    inputs:
      application:
        description: Application a publier
        required: true
        default: both
        type: choice
        options: [both, editor, tools]
permissions:
  contents: write
concurrency:
  group: public-windows-auto-updates
  cancel-in-progress: false
jobs:
  publish:
    name: Publier mise a jour - ${{ matrix.application }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - application: editor
            branch: feature/anomalia-editor-actual-world-bridge-20261023
            folder: apps/anomalia-editor
            tag: anomalia-editor-latest
            min_version: 0.5.0
            command: desktop:package
          - application: tools
            branch: feature/anomalia-tools-premium-updates-20261023
            folder: apps/anomalia-tools
            tag: anomalia-tools-latest
            min_version: 0.2.0
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detecter nouvelle version (pas de downgrade)
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          APPLICATION: ${{ matrix.application }}
          INPUT_APP: ${{ inputs.application }}
          APP_DIR: ${{ matrix.folder }}
          TAG: ${{ matrix.tag }}
          MIN_VERSION: ${{ matrix.min_version }}
        run: |
          $ErrorActionPreference="Stop"
          $requested=$env:INPUT_APP
          if($requested -and $requested -ne "both" -and $requested -ne $env:APPLICATION){
            "publish=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $data=Get-Content (Join-Path $env:APP_DIR "package.json") -Raw | ConvertFrom-Json
          $version=[version]$data.version
          if($version -lt [version]$env:MIN_VERSION){throw "Version outdated; refusing public release"}
          $oldVersion=$null
          $oldDir=Join-Path $env:RUNNER_TEMP ("old-"+$env:APPLICATION)
          New-Item -ItemType Directory -Force -Path $oldDir | Out-Null
          $releaseUrl="https://api.github.com/repos/"+$env:GITHUB_REPOSITORY+"/releases/tags/"+$env:TAG
          $releaseStatus=0
          $null=Invoke-RestMethod -Uri $releaseUrl -Headers @{Authorization=("Bearer "+$env:GH_TOKEN);'User-Agent'='ANOMALIA-Updater'} -SkipHttpErrorCheck -StatusCodeVariable releaseStatus
          if($releaseStatus -eq 200){
            gh release download $env:TAG -R $env:GITHUB_REPOSITORY --pattern latest.yml --dir $oldDir 2>$null | Out-Null
            $oldManifest=Join-Path $oldDir "latest.yml"
            if(Test-Path $oldManifest){
              $match=[regex]::Match((Get-Content $oldManifest -Raw),'(?m)^version:\s*[''"]?(\d+\.\d+\.\d+)')
              if($match.Success){$oldVersion=[version]$match.Groups[1].Value}
            }
          }
          if($oldVersion -and $oldVersion -ge $version){
            Write-Host "Release already up to date: $oldVersion"
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          "version=$($data.version)" >> $env:GITHUB_OUTPUT
      - name: Installer dependances
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ matrix.folder }}
        run: npm install --no-audit --no-fund
      - name: Tests obligatoires
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ matrix.folder }}
        run: npm test
      - name: Compiler installation et latest.yml
        if: steps.version.outputs.publish == 'true'
        working-directory: ${{ matrix.folder }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          APPLICATION: ${{ matrix.application }}
        run: |
          if($env:APPLICATION -eq 'editor'){npm run desktop:package}
          else{npm run package:win}
          if($LASTEXITCODE -ne 0){throw 'NSIS packaging failed'}
      - name: Verifier manifestes et fichiers puis publier
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_DIR: ${{ matrix.folder }}
          TAG: ${{ matrix.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference="Stop"
          $dir=Join-Path $env:APP_DIR "release"
          $manifest=Join-Path $dir "latest.yml"
          if(-not(Test-Path $manifest)){throw "latest.yml absent"}
          $content=Get-Content $manifest -Raw
          if($content -notmatch ('(?m)^version:\s*'+[regex]::Escape($env:RELEASE_VERSION)+'\s*$')){throw "Version mismatch"}
          if($content -notmatch '(?m)^\s*sha512:\s*[A-Za-z0-9+/=]{80,}\s*$'){throw "Missing SHA512 metadata"}
          $exe=@(Get-ChildItem $dir -Filter "*.exe" -File)
          $blockmaps=@(Get-ChildItem $dir -Filter "*.blockmap" -File)
          if($exe.Count -ne 1 -or $exe[0].Length -lt 1000000){throw "Windows setup missing"}
          if($blockmaps.Count -lt 1){throw "NSIS blockmap missing"}
          $pathMatch=[regex]::Match($content,'(?m)^path:\s*(.+?\.exe)\s*$')
          if(-not $pathMatch.Success){throw "latest.yml must reference a Windows setup"}
          $manifestFile=$pathMatch.Groups[1].Value.Trim()
          if($exe[0].Name -cne $manifestFile){throw "Setup name does not match latest.yml path: "+$manifestFile}
          if($manifestFile -match '\s'){throw "Spaces in installer name would be renamed by GitHub Releases"}
          $releaseUrl="https://api.github.com/repos/"+$env:GITHUB_REPOSITORY+"/releases/tags/"+$env:TAG
          $releaseStatus=0
          $null=Invoke-RestMethod -Uri $releaseUrl -Headers @{Authorization=("Bearer "+$env:GH_TOKEN);'User-Agent'='ANOMALIA-Updater'} -SkipHttpErrorCheck -StatusCodeVariable releaseStatus
          if($releaseStatus -ne 200){
            gh release create $env:TAG -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title ($env:TAG+" "+$env:RELEASE_VERSION) --notes "Automatic Windows updates with SHA512 and blockmaps." --latest=false
            if($LASTEXITCODE -ne 0){throw "Cannot create GitHub Release"}
          }
          # Publish executable and blockmaps FIRST, latest.yml LAST.
          $files=@($exe | ForEach-Object { $_.FullName })
          $files+=@($blockmaps | ForEach-Object { $_.FullName })
          & gh release upload $env:TAG @files -R $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw "Executable publication failed"}
          gh release upload $env:TAG $manifest -R $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw "Manifest publication failed"}
          gh release edit $env:TAG -R $env:GITHUB_REPOSITORY --title ($env:TAG+" "+$env:RELEASE_VERSION) --notes ("Version "+$env:RELEASE_VERSION+". Sources "+$env:GITHUB_SHA) --latest=false
          if($LASTEXITCODE -ne 0){throw "Cannot update release notes"}
          Write-Host ("Published update URL: https://github.com/"+$env:GITHUB_REPOSITORY+"/releases/download/"+$env:TAG+"/latest.yml")
