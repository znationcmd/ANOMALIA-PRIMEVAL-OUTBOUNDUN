name: Place four verified City Sample districts into live SKARVIK
on:
  push:
    branches: [ops/skarvik-citysample-transfer]
    paths: [.github/workflows/skarvik-citysample-place.yml]
permissions: {}
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  place:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 30
    steps:
      - name: Load dependencies, fit districts to terrain and verify saved actors
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ine 'ANOMALIA-PC' -or $env:COMPUTERNAME -ine 'CMD') { throw 'Unexpected runner' }
          $root = 'D:\ANOMALIA\unreal'
          $project = Join-Path $root 'AnomaliaPrimeval.uproject'
          $editor = 'C:\Program Files\Epic Games\UE_5.8\Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $receipt = Join-Path $root 'Saved\SkarvikCity\TransferFromC\44896115982-1'
          if (!(Test-Path -LiteralPath (Join-Path $receipt 'dependencies.json'))) { throw 'Verified City Sample dependency transfer is required first' }
          if (@(Get-Process UnrealEditor,UnrealEditor-Cmd,UnrealBuildTool,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count) { throw 'Existing Unreal session preserved' }
          $work = Join-Path $root ('Saved\SkarvikCity\PlacementOnD\' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $work | Out-Null
          $env:SKARVIK_CITY_SOURCE = $receipt
          $env:SKARVIK_CITY_PLACEMENT = $work
          $code = @'
          import json
          import math
          import os
          import re
          import shutil
          from pathlib import Path
          import unreal

          work = Path(os.environ["SKARVIK_CITY_PLACEMENT"])
          source = Path(os.environ["SKARVIK_CITY_SOURCE"])
          catalog = json.loads((source / "manifest.json").read_text(encoding="utf-8"))
          package = "/Game/Maps/ANOMALIA_Archipelago_v2"
          prefix = "SKARVIK_CITYSAMPLE_LIVE_"
          root = Path(unreal.Paths.project_dir()).resolve()
          if root != Path(r"D:\ANOMALIA\unreal").resolve():
              raise RuntimeError("Unexpected target project")
          rows = catalog["actors"]
          if len(rows) != 720 or len({a["label"] for a in rows}) != len(rows):
              raise RuntimeError("Four validated districts are required")
          levels = unreal.get_editor_subsystem(unreal.LevelEditorSubsystem)
          actors = unreal.get_editor_subsystem(unreal.EditorActorSubsystem)
          worlds = unreal.get_editor_subsystem(unreal.UnrealEditorSubsystem)
          partition = unreal.WorldPartitionBlueprintLibrary
          library = unreal.EditorAssetLibrary
          meshes = {}
          materials = {}
          for row in rows:
              path = row["mesh"]
              if path not in meshes:
                  asset = library.load_asset(path)
                  if not isinstance(asset, unreal.StaticMesh):
                      raise RuntimeError("Failed to load genuine source mesh " + path)
                  meshes[path] = asset
              for path in row["materials"]:
                  if path and path not in materials:
                      material = library.load_asset(path)
                      if not isinstance(material, unreal.MaterialInterface):
                          raise RuntimeError("Required source material could not load " + path)
                      materials[path] = material

          if not levels.load_level(package):
              raise RuntimeError("Could not reopen live SKARVIK")
          world = worlds.get_editor_world()
          desc = partition.get_actor_descs() or []
          if any(str(d.label).startswith(prefix) for d in desc):
              raise RuntimeError("Transfer actors already exist in live SKARVIK")
          coords = [row["position"] for row in rows]
          x0, x1 = min(p[0] for p in coords), max(p[0] for p in coords)
          y0, y1 = min(p[1] for p in coords), max(p[1] for p in coords)
          z0 = min(p[2] for p in coords)
          center_x, center_y = (x0+x1)/2, (y0+y1)/2
          margin = 6000
          occupied = re.compile(r"house|building|settlement|city|village|bridge|road",re.I)

          def candidate(cx,cy):
              dx,dy = cx-center_x, cy-center_y
              box = unreal.Box(min=unreal.Vector(x0+dx-margin,y0+dy-margin,-500000),
                               max=unreal.Vector(x1+dx+margin,y1+dy+margin,900000))
              near = partition.get_intersecting_actor_descs(box) or []
              if any(occupied.search(str(d.label)) and "landscape" not in str(d.label).lower() for d in near):
                  return None
              terrain = [d.guid for d in near if "Landscape" in str(d.native_class.get_name())]
              if not terrain:
                  return None
              partition.load_actors(terrain)
              try:
                  loaded = actors.get_all_level_actors()
                  ignore = [a for a in loaded if not isinstance(a, unreal.LandscapeProxy)]
                  heights = []
                  for ix in range(5):
                      for iy in range(5):
                          x = x0+dx+(x1-x0)*ix/4
                          y = y0+dy+(y1-y0)*iy/4
                          hit = unreal.SystemLibrary.line_trace_single_by_profile(
                              world,unreal.Vector(x,y,900000),unreal.Vector(x,y,-500000),
                              "BlockAll",True,ignore,unreal.DrawDebugTrace.NONE)
                          if hit is None:
                              return None
                          impact = next((point for point in hit.to_tuple()
                                         if isinstance(point, unreal.Vector)
                                         and abs(point.x-x)<1 and abs(point.y-y)<1
                                         and 450 < point.z < 900000),None)
                          if impact is None:
                              return None
                          z = impact.z
                          if not math.isfinite(z) or z < 450:
                              return None
                          heights.append(z)
                  if max(heights)-min(heights)>500:
                      return None
                  return dx,dy,max(heights)-z0+10,heights
              finally:
                  partition.unload_actors(terrain)

          possible = [(center_x,center_y)]
          possible.extend((center_x+ix*150000, center_y+iy*150000)
                          for ix in range(-3,4) for iy in range(-3,4) if ix or iy)
          selected = next((fit for x,y in possible if (fit := candidate(x,y)) is not None),None)
          if selected is None:
              raise RuntimeError("No dry and unoccupied plateau for the complete City Sample layout")
          dx,dy,dz,heights = selected
          target = root/"Content/Maps/ANOMALIA_Archipelago_v2.umap"
          shutil.copy2(target,work/"archipelago-before-city.umap")
          for index,row in enumerate(rows):
              x,y,z = row["position"]
              actor = actors.spawn_actor_from_class(unreal.StaticMeshActor, unreal.Vector(x+dx,y+dy,z+dz))
              if not actor:
                  raise RuntimeError("Could not spawn " + row["label"])
              actor.set_actor_label(f"{prefix}{index:04d}")
              c = actor.static_mesh_component
              if not c.set_static_mesh(meshes[row["mesh"]]):
                  raise RuntimeError("Could not link " + row["mesh"])
              c.set_collision_profile_name("BlockAll")
              for slot,path in enumerate(row["materials"]):
                  if path:
                      c.set_material(slot,materials[path])
              p,yaw,r = row["rotation"]
              actor.set_actor_rotation(unreal.Rotator(pitch=p,yaw=yaw,roll=r),False)
              actor.set_actor_scale3d(unreal.Vector(*row["scale"]))
          if not levels.save_current_level() or not unreal.EditorLoadingAndSavingUtils.save_dirty_packages(True,False):
              raise RuntimeError("Could not persist the live city actor packages")
          if not levels.load_level(package):
              raise RuntimeError("Could not reopen patched live SKARVIK")
          persisted = sorted((d for d in partition.get_actor_descs() or [] if str(d.label).startswith(prefix)),key=lambda d:str(d.label))
          if len(persisted) != len(rows):
              raise RuntimeError(f"Expected 720 persisted actor descriptors, found {len(persisted)}")
          sample = list(range(0,len(rows),90))
          partition.load_actors([persisted[i].guid for i in sample])
          loaded = {a.get_actor_label(): a for a in actors.get_all_level_actors()}
          for i in sample:
              actor = loaded.get(f"{prefix}{i:04d}")
              if not actor or actor.static_mesh_component.get_editor_property("static_mesh").get_path_name()!=rows[i]["mesh"]:
                  raise RuntimeError(f"Reopened mesh mismatch at actor {i}")
          result = dict(map=package, actors=len(persisted), loadedReopenSamples=len(sample),
                        materials=len(materials), uniqueMeshes=len(meshes),
                        locationCm=[center_x+dx,center_y+dy,max(heights)])
          (work/"placed.json").write_text(json.dumps(result),encoding="utf-8")
          unreal.log("SKARVIK_LIVE_CITY_VERIFIED " + json.dumps(result))
          '@
          $script = Join-Path $work 'place.py'
          [IO.File]::WriteAllText($script,$code,[Text.UTF8Encoding]::new($false))
          & $editor $project '-run=pythonscript' "-script=$script" '-unattended' '-nopause' '-nosound' '-NullRHI' '-stdout' '-FullStdOutLogOutput'
          $report = Join-Path $work 'placed.json'
          if ($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $report)) { throw 'No verified district placement receipt' }
          Write-Output ('SKARVIK_LIVE_CITY_RECEIPT ' + (Get-Content -LiteralPath $report -Raw -Encoding UTF8))
