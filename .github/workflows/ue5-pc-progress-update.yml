name: UE5 validated progress automatic PC update
on:
  workflow_dispatch:
  push:
    branches: ['ue5/driveable-roster-city-20261023', 'ue5/reactive-world-expeditions-20261025']
    paths:
      - 'unreal/Source/**'
      - 'unreal/Config/**'
      - 'unreal/Build/Windows/Application.ico'
      - 'unreal/Content/Splash/**'
      - 'unreal/SourceAssets/Branding/**'
      - 'unreal/Scripts/import_game_branding.py'
      - 'unreal/Scripts/import_workshop_branding.py'
      - 'scripts/ue5/prepare-game-branding.ps1'
      - 'unreal/Scripts/capture_real_world.py'
      - 'unreal/Scripts/probe_installed_editor.py'
      - 'unreal/Scripts/apply_residential_replacements.py'
      - 'unreal/Scripts/residential_replacement.py'
      - 'scripts/ue5/run-residential-upgrade.py'
      - 'distribution/windows-editor/**'
      - 'scripts/ue5/install-pc-editor-update.ps1'
      - 'scripts/ue5/verify-installed-project.py'
      - 'scripts/ue5/run-visual-capture.py'
      - 'scripts/ue5/world_snapshot.py'
      - 'scripts/ue5/package-playable-windows.py'
      - 'scripts/ue5/run-playable-interactions.py'
      - 'scripts/ue5/install-playable-windows.ps1'
      - 'scripts/world-features/apply-playable-progress-art.py'
      - 'docs/art/realism-validation-sources.json'
      - 'docs/art/residential-photogrammetry-sources.json'
      - '.github/workflows/ue5-pc-progress-update.yml'
jobs:
  update-owned-installed-game:
    # Explicit Editor-map recovery is handled by ue5-map-progress.yml. Avoid
    # replacing its pending run in the shared native-host concurrency group.
    if: github.repository == 'znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN' && !startsWith(github.event.head_commit.message, '[map-recovery]') && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/ue5/driveable-roster-city-20261023' || startsWith(github.event.head_commit.message, '[pc-update]'))
    # Acquire the host only for an enabled job. A skipped workflow must not
    # replace the Editor validation waiting in GitHub's single pending slot.
    concurrency:
      group: anomalia-ue5-native-host
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare the user application logo and launch splash
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: ./scripts/ue5/prepare-game-branding.ps1
      - name: Compile Editor and Game and pass the native gameplay tests
        id: native_build
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $python=Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          $evidence="unreal/Saved/PCProgress/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $python scripts/ue5/validate-build.py --engine-root "$env:UE_ROOT" --output "$evidence/native" --run-tests --require-loot-tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: native-interaction-proof
          path: |
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/native/*.*
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/native/automation-*/index.json
      - name: Verify playable-map interaction geometry before preparing or cooking assets
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $python=Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          $evidence="unreal/Saved/PCProgress/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $python scripts/ue5/run-playable-interactions.py --engine-root "$env:UE_ROOT" --output "$evidence/interactions"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify pinned art and retain the imported realistic buildings
        id: art_import
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $python=Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          & $python scripts/ue5/prepare-realism-sources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python scripts/world-features/prepare-sources.py --residential
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix scripts/vehicle-assets --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/vehicle-assets/prepare-realism.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/vehicle-assets/prepare-world-features.mjs --residential
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence=Join-Path $env:GITHUB_WORKSPACE "unreal/Saved/PCProgress/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $env:ANOMALIA_WORLD_FEATURE_SET='residential-photogrammetry'
          $env:ANOMALIA_WORLD_FEATURES_REPORT=Join-Path $evidence 'residential-import.json'
          $env:ANOMALIA_EDITOR_TASK=Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/import-review.py'
          $editor=Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'unreal/AnomaliaPrimeval.uproject'
          $wrapper=Join-Path $env:GITHUB_WORKSPACE 'scripts/world-features/run-editor-task.py'
          & $editor $project "-ExecutePythonScript=$wrapper" -NullRHI -unattended -nopause -nosound "-abslog=$evidence/residential-import.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Import actual ANOMALIA Workshop emblem before cooking the native game
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $editor=Join-Path $env:UE_ROOT 'Engine/Binaries/Win64/UnrealEditor-Cmd.exe'
          $project=Join-Path $env:GITHUB_WORKSPACE 'unreal/AnomaliaPrimeval.uproject'
          $script=Join-Path $env:GITHUB_WORKSPACE 'unreal/Scripts/import_workshop_branding.py'
          if (-not (Test-Path -LiteralPath $editor)) {throw 'UE5 editor missing'}
          if (-not (Test-Path -LiteralPath 'unreal/SourceAssets/Branding/workshop-logo.jpg')) {throw 'Workshop logo source missing'}
          & $editor $project "-ExecutePythonScript=$script" -NullRHI -unattended -nopause -nosound
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Cook the actual game with the new houses trees and detailed vehicles and run GPU gameplay tests
        id: packaged_game
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $python=Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          $evidence="unreal/Saved/PCProgress/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $python scripts/ue5/package-playable-windows.py --engine-root "$env:UE_ROOT" --output "$evidence/package" --progress-art
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Update the existing owned PC installation only after the new executable passes
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $evidence="unreal/Saved/PCProgress/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & ./scripts/ue5/install-playable-windows.ps1 -ValidationDir "$evidence/package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report=Get-Content "$evidence/package/installed-package-report.json" -Raw | ConvertFrom-Json
          if ($report.state -ne 'PACKAGED_WINDOWS_INSTALLED_AND_SMOKE_TESTED' -or -not $report.activeVersionAndShortcutVerified -or $report.commit -ne $env:GITHUB_SHA) { throw 'PC update activation is not confirmed.' }
      - name: Back up and replace owned repeated houses with verified scanned exteriors
        id: residential_update
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && steps.art_import.outcome == 'success' }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $python=Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          $evidence="unreal/Saved/PCProgress/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $python scripts/ue5/run-residential-upgrade.py --engine-root "$env:UE_ROOT" --output "$evidence/editor/residential-upgrade"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Back up and verify the populated world with the actual GPU
        id: editor_visual
        if: ${{ !cancelled() && steps.residential_update.outcome == 'success' }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $python=Join-Path $env:UE_ROOT 'Engine/Binaries/ThirdParty/Python3/Win64/python.exe'
          $evidence="unreal/Saved/PCProgress/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & $python scripts/ue5/run-visual-capture.py --engine-root "$env:UE_ROOT" --output "$evidence/editor" --inhabited
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Synchronize the complete native project and open the installed populated map
        if: ${{ !cancelled() && steps.editor_visual.outcome == 'success' }}
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $evidence="unreal/Saved/PCProgress/run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          & ./scripts/ue5/install-pc-editor-update.ps1 -ValidationDir "$evidence/editor" -BuildValidationDir "$evidence/native" -MapPackage '/Game/Maps/ANOMALIA_Inhabited_v2'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report=Get-Content "$evidence/editor/pc-editor-update.json" -Raw | ConvertFrom-Json
          if ($report.state -ne 'EDITOR_PROJECT_UPDATE_INSTALLED' -or $report.commit -ne $env:GITHUB_SHA) { throw 'Installed Editor synchronization not confirmed.' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-progress-update-evidence
          path: |
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/native/*.*
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/native/automation-*/index.json
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/interactions/*.*
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/package/*.*
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/package/*-visual/*.*
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/editor/*.*
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/editor/real-graphics/*.json
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/editor/real-graphics/*/*.log
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/editor/residential-upgrade/*.*
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/editor/real-graphics/*/*.json
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/editor/real-graphics/*/*.png
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/editor/pc-installed-graphics/*.json
            unreal/Saved/PCProgress/run-${{ github.run_id }}-${{ github.run_attempt }}/editor/pc-installed-graphics/*.png
          if-no-files-found: warn

