      - 'tests/status-indicators.test.mjs'
      - 'tests/cryo-recruitment.test.mjs'
      - 'unreal/**'
      - 'tests/test_ue5_short_import_source.py'
      - 'public/config/rp*.json'
      - 'tests/test_ue5_rp_catalog.py'
      - 'tests/test_ue5_runtime_data.py'
      - 'tests/test_ue5_original_lot1.py'
      - 'tests/test_ue5_expansion_models.py'
      - 'tests/test_ue5_settlement_layout.py'
      - 'tests/native/**'
