name: Unreal Engine 5 source checks

on:
  push:
    paths:
      - 'unreal/**'
      - 'scripts/migrate-to-ue5.py'
      - 'tests/test_unreal_port.py'
      - 'tests/test_ue5_build_driver.py'
      - 'tests/test_ue5_config_catalog.py'
      - 'tests/test_ue5_inventory_source.py'
      - 'tests/test_ue5_player_lifecycle_source.py'
      - 'tests/test_ue5_vitals_source.py'
      - 'tests/test_ue5_homestead_editor.py'
      - 'tests/test_ue5_first_world_source.py'
      - 'tests/test_ue5_draft_bootstrap_source.py'
      - 'tests/test_ue5_playtest_terrain.py'
      - 'tests/test_ue5_integration_contract.py'
      - 'scripts/ue5/**'
      - '.github/workflows/ue5-source-checks.yml'
  pull_request:
    paths:
      - 'unreal/**'
      - 'scripts/migrate-to-ue5.py'
      - 'tests/test_unreal_port.py'
      - 'tests/test_ue5_build_driver.py'
      - 'tests/test_ue5_config_catalog.py'
      - 'tests/test_ue5_inventory_source.py'
      - 'tests/test_ue5_player_lifecycle_source.py'
      - 'tests/test_ue5_vitals_source.py'
      - 'tests/test_ue5_homestead_editor.py'
      - 'tests/test_ue5_first_world_source.py'
      - 'tests/test_ue5_draft_bootstrap_source.py'
      - 'tests/test_ue5_playtest_terrain.py'
      - 'tests/test_ue5_integration_contract.py'
      - 'scripts/ue5/**'
      - '.github/workflows/ue5-source-checks.yml'

jobs:
  validate-ue5-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check migration and vehicle catalog
        run: python -m unittest discover -s tests -p test_unreal_port.py -v
      - name: Test build driver failure reporting (not a native build)
        run: python -m unittest discover -s tests -p test_ue5_build_driver.py -v
      - name: Validate the UE5 configuration status catalog
        run: python -m unittest discover -s tests -p test_ue5_config_catalog.py -v
      - name: Check the server-authoritative UE5 inventory model
        run: python -m unittest discover -s tests -p test_ue5_inventory_source.py -v
      - name: Check server-authoritative stamina and temperature source
        run: python -m unittest discover -s tests -p test_ue5_vitals_source.py -v
      - name: Check server-owned player lifecycle persistence
        run: python -m unittest discover -s tests -p test_ue5_player_lifecycle_source.py -v
      - name: Test safe homestead, farm and offline editor operations
        run: python -m unittest discover -s tests -p test_ue5_homestead_editor.py -v
      - name: Verify World Partition bootstrap sources (Unreal Editor required for .umap)
        run: python -m unittest discover -s tests -p test_ue5_first_world_source.py -v
      - name: Verify draft landscape bootstrap safeguards
        run: python -m unittest discover -s tests -p test_ue5_draft_bootstrap_source.py -v
      - name: Verify integration keeps homestead and world scripts
        run: python -m unittest discover -s tests -p test_ue5_integration_contract.py -v
      - name: Install terrain source dependency
        run: python -m pip install numpy
      - name: Test deterministic terrain source
        run: python -m unittest discover -s tests -p test_ue5_terrain_source.py -v
      - name: Validate 48km draft terrain seams and non-destructive generation
        run: python -m unittest discover -s tests -p test_ue5_playtest_terrain.py -v
      - name: Verify config migration is non-destructive
        run: |
          python scripts/migrate-to-ue5.py
          python scripts/migrate-to-ue5.py
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('unreal/migration-report.json').read_text())
          assert not data['conflicts'], data['conflicts']
          assert not data['copied'], 'second run should not overwrite or recopy'
          print('Second migration pass is idempotent.')
          PY
