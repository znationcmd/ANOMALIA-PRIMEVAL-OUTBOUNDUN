name: SKARVIK - independently reopen final seven-island city and safe 3D asphalt
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-verify-final-safe-asphalt-reopen.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  independent-native-final-reopen:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: skarvik-final-native-true-coast-safe-reused-asphalt-actor-receipt
          run-id: 41303095469
          repository: znationcmd/ANOMALIA-PRIMEVAL-OUTBOUNDUN
          github-token: ${{ github.token }}
          path: receipts/approved-original-road-migration
      - name: Verify source isolation, published native receipt and absence of concurrent Unreal
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $marker=Join-Path $root '.skarvik-ci-stage-marker'
          if(!(Test-Path -LiteralPath $marker) -or (Get-Content -LiteralPath $marker -Raw).Trim() -ne '41188816555'){throw 'Invalid isolated native staging marker'}
          foreach($p in @(
            'D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap',
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_FINAL_v1.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_GRADED_v2.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_ISLANDS_v1.umap'),
            (Join-Path $root 'Content\Map\Big_City_LVL.umap'))){
            if(!(Test-Path -LiteralPath $p)){throw "Missing protected native world: $p"}
          }
          $receipt=Join-Path $env:GITHUB_WORKSPACE 'receipts\approved-original-road-migration\skarvik-final-original-safe-asphalt-native-replay.json'
          if(!(Test-Path -LiteralPath $receipt)){throw 'Saved prior road migration proof missing'}
          $r=Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          if($r.state -ne 'FINAL_SEVEN_ISLAND_NATIVE_ASPHALT_SAFE_SUBSET_SAVED_NOT_YET_CONTINUOUS_OR_DRIVEN' -or $r.nativeDryAsphaltSaved -lt 5000){throw 'Untrusted migration receipt'}
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Concurrent Unreal session; avoid overlapping native work'}
          $py=Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $py -m py_compile (Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\verify_skarvik_final_safe_asphalt_after_reopen.py')
          if($LASTEXITCODE -ne 0){throw 'Python verification syntax invalid'}
          Write-Host 'SKARVIK_FINAL_INDEPENDENT_REOPEN_READY=true'
      - name: Read-only native reload of real final coastal roads and buildings
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $env:SKARVIK_FINAL_SAFE_ASPHALT_RECEIPT=Join-Path $env:GITHUB_WORKSPACE 'receipts\approved-original-road-migration\skarvik-final-original-safe-asphalt-native-replay.json'
          $env:SKARVIK_FINAL_INDEPENDENT_REOPEN_REPORT=Join-Path $env:GITHUB_WORKSPACE 'skarvik-final-original-city-and-dry-asphalt-independent-reopen.json'
          $script=Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\verify_skarvik_final_safe_asphalt_after_reopen.py'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          & $editor (Join-Path $root 'AnomaliaZPrigimalia.uproject') "-ExecutePythonScript=$script" -nullrhi -unattended -nopause -nosound
          $code=$LASTEXITCODE
          if(!(Test-Path -LiteralPath $env:SKARVIK_FINAL_INDEPENDENT_REOPEN_REPORT)){throw 'Native read-only report absent'}
          $r=Get-Content -LiteralPath $env:SKARVIK_FINAL_INDEPENDENT_REOPEN_REPORT -Raw|ConvertFrom-Json
          Write-Host ('SKARVIK_FINAL_INDEPENDENT_NATIVE_REOPEN_STATE='+$r.state)
          Write-Host ('SKARVIK_FINAL_SAVED_REAL_DRY_ASPHALT_ACTORS='+$r.savedActorDescriptors.dryOriginalRoads)
          Write-Host ('SKARVIK_FINAL_SAVED_REAL_MAINLAND_HOUSES='+$r.savedActorDescriptors.originalMainlandBuildings)
          Write-Host ('SKARVIK_FINAL_SAVED_REAL_ISLAND_HOUSES='+$r.savedActorDescriptors.originalIslandBuildings)
          Write-Host ('SKARVIK_FINAL_SAVED_REAL_CITYSAMPLE_MESHES='+$r.savedActorDescriptors.citySampleBuildings)
          if($r.state -ne 'FINAL_SKARVIK_ORIGINAL_BUILDINGS_CITY_AND_SAFE_ASPHALT_PERSIST_AFTER_NATIVE_REOPEN_NOT_PLAYTESTED'){
            throw ('Independent native reload proof incomplete: '+$r.error)
          }
          if($code -ne 0){Write-Host ('SKARVIK_UNREAL_AFTER_READONLY_EXIT_NONZERO='+$code)}
          Write-Host 'SKARVIK_FINAL_7_ISLANDS_3D_ASPHALT_NATIVE_REOPEN_CONFIRMED=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarvik-final-independent-real-3d-road-and-city-native-reopen
          path: skarvik-final-original-city-and-dry-asphalt-independent-reopen.json
          if-no-files-found: warn
