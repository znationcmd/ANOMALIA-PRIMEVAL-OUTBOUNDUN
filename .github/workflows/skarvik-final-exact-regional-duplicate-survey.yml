name: SKARVIK - survey exact duplicated native regional 3D asphalt actors
on:
  push:
    branches: [feature/skarvik-citysample-sm5-20261031]
    paths: ['.github/workflows/skarvik-final-exact-regional-duplicate-survey.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: anomalia-ue5-native-host
  cancel-in-progress: false
jobs:
  find-precise-double-asphalt:
    runs-on: [self-hosted, Windows, X64, anomalia-ue5]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false
          persist-credentials: false
      - name: Verify isolated Unreal stage and protected native final world
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $mark=Join-Path $root '.skarvik-ci-stage-marker'
          if(!(Test-Path $mark) -or (Get-Content $mark -Raw).Trim() -ne '41188816555'){throw 'Bad native stage marker'}
          foreach($p in @('D:\ANOMALIA\unreal\Content\Maps\ANOMALIA_Archipelago_v2.umap',
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_FINAL_v1.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_GRADED_v2.umap'),
            (Join-Path $root 'Content\Maps\PRIGIMALIA_SKARVIK_ISLANDS_v1.umap'),
            (Join-Path $root 'Content\Map\Big_City_LVL.umap'))){
             if(!(Test-Path $p)){throw "Missing protected native map: $p"}
          }
          if(@(Get-Process -Name UnrealEditor,UnrealEditor-Cmd,AnomaliaPrimeval,AnomaliaZPrigimalia -ErrorAction SilentlyContinue).Count){throw 'Concurrent UE process detected'}
          $py=Join-Path $env:UE_ROOT 'Engine\Binaries\ThirdParty\Python3\Win64\python.exe'
          & $py -m py_compile (Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\audit_skarvik_final_exact_near_duplicate_regional_actors.py')
          if($LASTEXITCODE -ne 0){throw 'Invalid exact native overlap source'}
      - name: Reopen actual final World Partition and report precise same-route overlapping road pair labels
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference='Stop'
          $root='C:\ANOMALIAZ_SKARVIK_STAGE_41188816555\unreal'
          $env:SKARVIK_FINAL_DUPLICATE_ROAD_SURVEY=Join-Path $env:GITHUB_WORKSPACE 'skarvik-final-regional-exact-second-batch-duplicate-actors.json'
          $editor=Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $script=Join-Path $env:GITHUB_WORKSPACE 'unreal\Scripts\audit_skarvik_final_exact_near_duplicate_regional_actors.py'
          & $editor (Join-Path $root 'AnomaliaZPrigimalia.uproject') "-ExecutePythonScript=$script" -nullrhi -unattended -nopause -nosound
          $exit=$LASTEXITCODE
          if(!(Test-Path $env:SKARVIK_FINAL_DUPLICATE_ROAD_SURVEY)){throw 'No actual native duplicate source report'}
          $r=Get-Content $env:SKARVIK_FINAL_DUPLICATE_ROAD_SURVEY -Raw|ConvertFrom-Json
          Write-Host ('SKARVIK_FINAL_EXACT_ROAD_DUPLICATE_SURVEY_STATE='+$r.state)
          Write-Host ('SKARVIK_FINAL_EXACT_DUPLICATE_SECOND_BATCH_ACTORS='+$r.exactSameRouteXYNearDuplicateCount)
          if($r.state -ne 'EXACT_SAME_ROUTE_REGIONAL_DUPLICATE_SECOND_BATCH_SURVEY_ONLY'){
            throw ('Native exact duplicate survey not proved: '+$r.error)
          }
          if($exit -ne 0){Write-Host ('SKARVIK_UNREAL_AFTER_READONLY_SURVEY_EXIT_CODE='+$exit)}
          Write-Host 'SKARVIK_FINAL_NATIVE_EXACT_DUPLICATE_REPORT_SAVED_NO_ACTOR_MODIFICATION=true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarvik-final-native-exact-regional-second-batch-duplicate-report
          path: skarvik-final-regional-exact-second-batch-duplicate-actors.json
          if-no-files-found: warn
