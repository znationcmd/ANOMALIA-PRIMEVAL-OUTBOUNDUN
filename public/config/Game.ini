; ANOMALIA-specific portable settings, not an ARK server configuration.
[ANOMALIA]
LootMultiplier=1
CompanionFollowDistance=3
TamingSpeedMultiplier=1
AiDamageMultiplier=1

; Dinosaur and crafting settings for ANOMALIA (not native ARK syntax).
; Config values below require an ANOMALIA Unreal runtime reader before they take effect.
[ANOMALIA.Dinosaurs]
SpeciesCatalog=dinosaurs/catalog.json
TamingBreedingConfig=dino_taming_breeding_mounts.json
HybridBreedingConfig=dino_hybrid_breeding.json
AllowAllCreatureTaming=True
AllowAllCreatureBreeding=True
AllowAllCreatureRiding=True
SaddleRequired=True
EggHatchSpeedMultiplier=1
BabyMatureSpeedMultiplier=1
MatingIntervalMultiplier=1
AllowCrossVariantBreeding=True
AllowCrossSpeciesHybrids=True
HybridGeneticLabRequired=True

[ANOMALIA.Crafting]
KibbleRecipes=dinosaurs/kibble_recipes.json
CookingRecipes=dinosaurs/cooking_recipes.json
CraftingResources=dinosaurs/crafting_resources.json
AllowPlayerCraftedKibble=True
AllowPlayerCooking=True
CookingSpeedMultiplier=1
KibbleCraftSpeedMultiplier=1
