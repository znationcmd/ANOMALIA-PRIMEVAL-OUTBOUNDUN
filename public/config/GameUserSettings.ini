; Supported ANOMALIA settings only.
[ServerSettings]
ServerThirdPersonPlayer=True
PlayerCharacterFoodDrainMultiplier=1
PlayerCharacterWaterDrainMultiplier=1
[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ShadowQuality=2

; ANOMALIA server gameplay settings (custom; require Unreal runtime implementation).
; Detailed species, recipes and item definitions remain in the dinosaur catalogs.
[ANOMALIA.ServerDinosaurs]
DinoSpawnCountMultiplier=1.0
TamingSpeedMultiplier=1.0
AllowCreatureTaming=True
AllowCreatureBreeding=True
AllowCreatureRiding=True
RequireSaddleForRiding=True
AllowHybridGenetics=True

[ANOMALIA.ServerSurvival]
LootQuantityMultiplier=1.0
LootRestockMultiplier=1.0
FoodDrainMultiplier=1.0
WaterDrainMultiplier=1.0
RadiationEventsEnabled=True
RadiationEventDurationSeconds=900

[ANOMALIA.ServerCrafting]
KibbleCraftingEnabled=True
CookingEnabled=True
CraftingSpeedMultiplier=1.0
